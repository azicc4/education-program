# Exams the program prepares for by age 18. Rows reference these ids in their `exams:` field.
# typicalAge = the age at which a student on this program's pace would normally sit the exam.
# Facts (dates, fees, formats) were checked against the official pages in September 2026. Fees and
# deadlines change every year: re-check the official page each autumn before registering.
exams:
  # ---------- AP: math & science ----------
  # Every AP entry shares the homeschool registration text defined (as a YAML anchor) on the first entry.
  - id: ap-calculus-bc
    name: AP Calculus BC
    body: College Board
    category: ap-stem
    typicalAge: 15
    month: May
    url: "https://apstudents.collegeboard.org/courses/ap-calculus-bc/assessment"
    ced: "https://apcentral.collegeboard.org/media/pdf/ap-calculus-ab-and-bc-course-and-exam-description.pdf"
    format: >-
      3 hr 10 min, hybrid digital: multiple-choice questions are answered in the Bluebook app, and
      free-response questions are read in Bluebook but handwritten in a paper booklet. Section I is 42
      multiple-choice questions in 1 hr 40 min (50%): Part A, 29 questions, no calculator; Part B, 13
      questions, graphing calculator required for some. Section II is 6 free-response problems in 1 hr 30
      min (50%): Part A, 2 problems with a calculator; Part B, 4 problems without. Scored 1–5; the report
      also gives an AB subscore. 2027 exam: Monday, May 10.
    registration: &ap-registration >-
      Parents and students cannot order AP Exams directly; a homeschooler tests as an outside student at an
      authorized school. (1) Search the AP Course Ledger (apstudents "Find Schools That Offer Authorized
      AP Courses") for schools near you. (2) In September, phone each school and ask its AP coordinator
      whether it will test homeschooled students this year; schools set their own local deadlines. (3) The
      coordinator orders the exam, enrolls the student in an "exam only" section in My AP (which also
      unlocks AP Classroom practice), tells you when and where to report, and collects the fees. College
      Board's order deadline is November 13, 2026 for May 2027 exams. Orders placed November 14 to March 12
      add a $40 late fee; a school that adds an outside student late may ask College Board to waive it.
      2026–27 fees are $99 per exam in the U.S. ($129 outside the U.S.) and $40 for an unused or canceled
      exam. Ask whether the school adds an administration charge. No AP Course Audit is needed to sit an
      exam; the audit is needed only to label a homeschool course "AP" on the transcript.
    resources:
      - { label: "AP Central: past free-response questions and scoring guidelines", url: "https://apcentral.collegeboard.org/courses/ap-calculus-bc/exam/past-exam-questions" }
      - { label: "AP Classroom (topic questions and progress checks; join through the coordinator)", url: "https://apclassroom.collegeboard.org/" }
      - { label: "Khan Academy: AP/College Calculus BC", url: "https://www.khanacademy.org/math/ap-calculus-bc" }
    notes: >-
      Sits at the end of mathematics-18. Free-response scoring rewards written justification, so practice
      writing complete sentences of reasoning, not just answers.
