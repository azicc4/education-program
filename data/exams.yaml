  - id: ap-latin
    name: AP Latin
    body: College Board
    category: ap-language
    typicalAge: 15
    month: May
    url: "https://apstudents.collegeboard.org/courses/ap-latin/assessment"
    ced: "https://apcentral.collegeboard.org/media/pdf/ap-latin-course-and-exam-description-effective-fall-2025.pdf"
    format: >-
      3 hr, fully digital in Bluebook. Section I: 52 multiple-choice questions in 1 hr 5 min (50%), on
      sight passages and syllabus texts. Section II: 5 free-response questions in 1 hr 55 min (50%): one
      short answer, one translation and three essays drawing on syllabus and course-project passages. Two
      in-class course-project checkpoint tasks count for 2% of the free-response score. Scored 1–5. 2027
      exam: Friday, May 14.
    registration: *ap-registration
    resources:
      - { label: "AP Central: past free-response questions", url: "https://apcentral.collegeboard.org/courses/ap-latin/exam/past-exam-questions" }
      - { label: "College Board AP Latin sample syllabus #1 (lists the revised required readings)", url: "https://apcentral.collegeboard.org/media/pdf/ap-latin-sample-syllabus-1.pdf" }
      - { label: "Bolchazy-Carducci: texts for the revised AP Latin curriculum", url: "https://www.bolchazy.com/2025-new-ap-curriculum/" }
    notes: >-
      The course was revised for 2025–26; the first revised exam was May 2026. Caesar was dropped, and the
      required reading is now Vergil's Aeneid (selections from Books 1, 2, 4, 6, 7, 11 and 12) and Pliny
      the Younger's Letters. The College Board sample syllabus lists the required Latin letters as 2.6,
      6.4, 6.7, 6.16, 6.20, 7.27, 10.5–7, 10.33, 10.37–38 and 10.90, plus teacher's-choice passages. There
      is also a spring course project on four annually released non-syllabus passages, with in-class
      checkpoints. Exam-only homeschoolers should ask the AP coordinator how they will get the project
      passages and complete the checkpoints in AP Classroom. The CED is the authority on line numbers.
      latin-07 (Caesar) is still good preparation but is no longer exam content.
