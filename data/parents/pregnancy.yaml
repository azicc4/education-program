# Parent Curriculum: gestation and the baby's first year of feeding (part of the "first 1,000 days").
# Nutrition by stage for the baby's body and brain, and exercise for maternal fitness.
# Every recommendation names its source ids (see `sources`). `evidence` marks each item:
#   established = a current guideline or committee recommendation from the named body;
#   emerging    = supported by trials or reviews but not (yet) a standard recommendation, or evidence is mixed.
title: "Gestation and the first year: nutrition and exercise"
id: pregnancy
audience: parents
lastReviewed: "2026-10-01"
scope: >-
  Preconception, the three trimesters, the postpartum months and the baby's first year of feeding. The "first
  1,000 days" run from conception to the second birthday; this plan covers the first roughly 640 of them (the
  months before conception, about 280 days of pregnancy and 365 days of infancy). Feeding in the second year is
  outside this file.
disclaimer: >-
  General educational guidance for healthy adults with uncomplicated singleton pregnancies, drawn from the public
  guidelines listed under sources. It is not medical advice and does not replace care from an obstetrician,
  midwife, pediatrician or registered dietitian. Follow the obstetric and pediatric providers' instructions
  whenever they differ from this plan. Many conditions change the advice on food, supplements or exercise,
  including pre-eclampsia or gestational hypertension, gestational or pre-existing diabetes, placenta previa,
  cervical insufficiency or cerclage, preterm labor or ruptured membranes, unexplained bleeding, fetal growth
  restriction, twins or higher-order multiples, anemia, thyroid disease, heart or lung disease, an eating
  disorder, bariatric surgery, a prior neural-tube-defect pregnancy, anti-seizure or other folate-blocking
  medication, vegan diets, food allergy, and a cesarean or complicated birth. Before starting or changing an
  exercise program in pregnancy, a clinical evaluation by the obstetric provider is recommended (acog-804). In an
  emergency, call 911 or the local emergency number.

evidenceLevels:
  established: >-
    A recommendation published by ACOG, AAP, WHO, USPSTF, the National Academies (IOM), the US Dietary Guidelines,
    FDA/EPA, CDC, NIAID or the American Thyroid Association, current as of the lastReviewed date.
  emerging: >-
    Supported by randomized trials, systematic reviews or expert consensus statements, but not part of a standard
    US guideline, or the trial evidence is mixed. Worth discussing with the provider; not a requirement.

