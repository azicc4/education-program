  # ---------------------------------------------------------------------------
  # Adolescence
  # ---------------------------------------------------------------------------
  - id: steinberg-age-of-opportunity
    title: "Age of Opportunity: Lessons from the New Science of Adolescence"
    author: Laurence Steinberg
    year: 2014
    kind: book
    evidence: popular-science
    audience: [parents, teens]
    stages: [12-18]
    traits: [self-control, responsibility, resilience]
    summary: >-
      A leading adolescence researcher argues that the teenage brain's heightened plasticity makes adolescence a second
      window of opportunity, and that self-regulation is the most important capacity to build during it. Explains
      teenagers' reward sensitivity and peer influence, and recommends authoritative parenting (warm, firm and
      supportive of autonomy), challenging activities and gradual increases in independence.
    caveats: >-
      Popular accounts of adolescent brain development simplify a still-developing science; the dual-systems model the
      book relies on is debated.
    citation: "Steinberg, L. (2014). Age of opportunity: Lessons from the new science of adolescence. Houghton Mifflin Harcourt."
    links:
      - { label: Author page, url: "https://laurencesteinberg.com/books/age-of-opportunity" }

  - id: siegel-brainstorm
    title: "Brainstorm: The Power and Purpose of the Teenage Brain"
    author: Daniel J. Siegel
    year: 2013
    kind: book
    evidence: popular-science
    audience: [parents, teens]
    stages: [12-18]
    traits: [communication, empathy, self-control]
    summary: >-
      A psychiatrist reframes adolescence as a period of emotional intensity, social engagement, novelty-seeking and
      creative exploration that is essential for adult life rather than mere immaturity. Written for both teenagers and
      parents, it explains brain changes during adolescence and offers reflective and communication practices for
      staying connected while respecting a teen's growing independence.
    caveats: >-
      Siegel's interpersonal-neurobiology framework goes beyond what neuroscience research has directly established;
      the practices are not tested as a package.
    citation: "Siegel, D. J. (2013). Brainstorm: The power and purpose of the teenage brain. Jeremy P. Tarcher/Penguin."
    links:
      - { label: Publisher, url: "https://www.penguinrandomhouse.com/books/310868/brainstorm-by-daniel-j-siegel-md/" }

  # ---------------------------------------------------------------------------
  # Practical classics by clinicians
  # ---------------------------------------------------------------------------
  - id: ginott-between-parent-and-child
    title: "Between Parent and Child"
    author: Haim G. Ginott
    year: 1965
    kind: book
    evidence: clinical
    audience: [parents]
    stages: [3-6, 6-12, 12-18]
    traits: [communication, empathy, discipline]
    summary: >-
      A child psychologist's classic on respectful communication: acknowledge children's feelings instead of arguing
      with them, praise specific actions rather than character, set limits on behaviour (not feelings) without insults
      or threats, and express anger without attacking the child. It shaped later approaches, including Faber and
      Mazlish's work and emotion coaching. A revised edition (2003) was updated by Alice Ginott and H. Wallace Goddard.
    caveats: >-
      Based on clinical experience rather than controlled research, though its core practices fit later findings on
      emotion coaching and autonomy support.
    citation: "Ginott, H. G. (1965). Between parent and child: New solutions to old problems. Macmillan."
    links:
      - { label: Publisher (revised edition), url: "https://www.penguinrandomhouse.com/books/60402/between-parent-and-child-revised-and-updated-by-dr-haim-g-ginott-edited-by-dr-alice-ginott-and-dr-h-wallace-goddard/" }

  - id: faber-mazlish-how-to-talk
    title: "How to Talk So Kids Will Listen & Listen So Kids Will Talk"
    author: Adele Faber and Elaine Mazlish
    year: 1980
    kind: book
    evidence: popular
    audience: [parents]
    stages: [3-6, 6-12, 12-18]
    traits: [communication, cooperation, empathy, discipline]
    summary: >-
      A workbook-style guide, developed from the authors' parent workshops with Haim Ginott, with cartoons and exercises
      for everyday situations. Covers helping children deal with feelings, engaging cooperation without nagging (describe
      the problem, give information, say it in a word), alternatives to punishment, encouraging autonomy and
      descriptive praise. Widely used for its concrete phrasing that parents can practise.
    caveats: >-
      Not formally evaluated as written; its methods are consistent with, but not derived from, controlled research.
    citation: "Faber, A., & Mazlish, E. (1980). How to talk so kids will listen & listen so kids will talk. Rawson, Wade."
    links:
      - { label: Publisher, url: "https://www.simonandschuster.com/books/How-to-Talk-So-Kids-Will-Listen-Listen-So-Kids-Will-Talk/Adele-Faber/The-How-To-Talk-Series/9781451663884" }

  - id: siegel-bryson-whole-brain-child
    title: "The Whole-Brain Child: 12 Revolutionary Strategies to Nurture Your Child's Developing Mind"
    author: Daniel J. Siegel and Tina Payne Bryson
    year: 2011
    kind: book
    evidence: popular-science
    audience: [parents]
    stages: [1-3, 3-6, 6-12]
    traits: [empathy, self-control, communication, resilience]
    summary: >-
      A psychiatrist and a parenting specialist translate developmental neuroscience into twelve strategies for
      everyday moments, such as "connect and redirect" (soothe first, then reason), "name it to tame it" (help a child
      tell the story of an upsetting event), and engaging the reflective "upstairs brain" rather than triggering the
      reactive "downstairs brain." Includes age-by-age examples and a summary sheet.
    caveats: >-
      The brain metaphors (left/right, upstairs/downstairs) are simplifications, and the strategies have not been tested
      as a programme; they align with research on emotion coaching.
    citation: "Siegel, D. J., & Bryson, T. P. (2011). The whole-brain child: 12 revolutionary strategies to nurture your child's developing mind. Delacorte Press."
    links:
      - { label: Publisher, url: "https://www.penguinrandomhouse.com/books/200276/the-whole-brain-child-by-daniel-j-siegel-md-and-tina-payne-bryson-phd/" }
