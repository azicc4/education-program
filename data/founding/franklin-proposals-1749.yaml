id: franklin-proposals-1749
title: "Benjamin Franklin, Proposals Relating to the Education of Youth in Pensilvania (1749) and Idea of the English School (1751)"
category: treatise
people: [Benjamin Franklin]
date: "1749–1751"
summary: >-
  Franklin's pamphlet for the Philadelphia Academy (the future University of Pennsylvania) proposes that youth learn
  "those Things that are likely to be most useful and most ornamental": a fair hand, drawing, arithmetic and accounts,
  geometry and astronomy, English taught through the best English prose stylists, and a history course out of which
  geography, chronology, morality, oratory, politics, logic, natural history, and commerce are drawn. Its footnotes
  are a small anthology of the education writers the Founders read (Milton, Locke, "Hutcheson" (really Fordyce), Obadiah
  Walker, Rollin, Turnbull), and the 1751 Idea of the English School sets out a six-class English course. This program
  keeps Franklin's English-language spine (grammar, reading aloud, rhetoric, letters, essays), his history-centered
  integration, and his practical arts, but keeps Latin and Greek for everyone as the classical tradition did, which
  Franklin himself made optional.
