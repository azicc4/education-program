notes: >-
  Section summaries and quotations were checked against the Gutenberg text (Mott & Jorgenson, 1936) and the Penn
  Archives transcription. Franklin attributes the "Dialogues on Education" to Hutcheson; the work is generally
  credited to David Fordyce (Mott & Jorgenson list Fordyce among Franklin's sources). The "Dr. Johnson" of the English
  School is Samuel Johnson of King's College (New York), not the English lexicographer. The Founders Online page for
  the 1749 Proposals could not be fetched (the site blocked automated access), so its ID is not given; the Idea of the
  English School link was taken verbatim from search results.
