id: js-mill-autobiography
title: "John Stuart Mill's Education (Autobiography, 1873)"
category: 19th-century-school
people: [John Stuart Mill, James Mill]
date: "1809–1826"
summary: >-
  In the first two chapters of his Autobiography, Mill records how his father taught him at home in
  London. He began Greek at three and Latin at eight. Most of the Greek and Latin canon, Euclid and
  algebra, and a wide range of history came before twelve; Aristotle's logic, Hobbes and Ricardo's
  political economy came by thirteen or fourteen. His father also made him teach his younger sisters
  and brothers and give an account of his reading on their morning walks. Mill judged that this gave
  him "an advantage of a quarter of a century", but at twenty the training ended in a breakdown he
  blamed on analysis that had worn away his feelings, and Wordsworth's poems helped cure it. This
  program takes the pace and the spoken narration on walks. It also takes the warning, and
  forms the affections through poetry, music, worship and friendship alongside the intellect.
