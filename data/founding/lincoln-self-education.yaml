  - { label: "Address to the New Jersey Senate, Trenton, 21 Feb. 1861 (on Weems's Washington), Abraham Lincoln Online", url: "https://www.abrahamlincolnonline.org/lincoln/speeches/trenton1.htm" }
  - { label: "Herndon and Weik, Abraham Lincoln: The True Story of a Great Life, vol. 1 (Gutenberg #38483)", url: "https://www.gutenberg.org/ebooks/38483" }
