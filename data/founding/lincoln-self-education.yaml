notes: >-
  The school count, Kirkham (as "English grammar"), Flint and Gibson, and Euclid come from Lincoln's own
  1859–60 sketches. The Bible, Aesop, Bunyan, Crusoe, Weems, the United States history, Webster's
  speller, Pike and Murray, the Indiana statutes, Blackstone and the poets come from Herndon (vols. 1–2)
  and Tarbell. Dilworth's speller, Scott's Lessons in Elocution, Grimshaw's History, and Franklin's
  Autobiography are standard in Lincoln scholarship (from Herndon's informant interviews) but were not
  confirmed in the texts I could check, so treat them as traditional. The last clause of the Paine entry
  is an interpretive gloss. I could not reach the Collected Works at quod.lib.umich.edu (blocked by a bot
  check), and did not locate National Park Service or Library of Congress pages on his reading, so none
  are linked.
