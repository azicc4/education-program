id: lincoln-self-education
title: "Abraham Lincoln's Frontier Self-Education (c. 1816–1850s)"
category: 19th-century-school
people: [Abraham Lincoln, Mentor Graham, William H. Herndon]
date: "c. 1816–1850s"
summary: >-
  Lincoln reckoned that "the aggregate of all his schooling did not amount to one year." What he learned
  he "picked up" from a small shelf of books read over and over: the Bible, Aesop, Pilgrim's Progress,
  Robinson Crusoe and Weems's Life of Washington. To these he added a speller and an arithmetic, then
  Kirkham's grammar at twenty-three, surveying manuals, the Indiana statutes and Blackstone, and finally
  Euclid, which he mastered as a congressman and circuit lawyer. His case shows that a few great books,
  deeply absorbed, can form a statesman's mind and prose. This program adopts his method of rereading,
  copying and reciting, of self-directed study, and of law and geometry as adult disciplines of reasoning.
primarySources:
