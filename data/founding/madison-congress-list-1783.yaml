notes: >-
  The 1783 list is quoted from the Journals of the Continental Congress, vol. 24 (1922),
  whose editors print it from Madison's manuscript (PCC No. 19). Madison's own Notes of
  Debates record that the report and a narrower fallback motion were both voted down on
  cost. The Founders Online edition of the report, in The Papers of James Madison vol. 6,
  has not been verified, so it is left out until its URL is confirmed. Hunt prints the
  Confederacies notes under 1787. Modern editors date them to spring 1786. Not verified
  and left out: Madison's Commonplace Book; direct evidence of Witherspoon's lectures or
  his post-graduate Hebrew study with Witherspoon (1771–72); and the full list of
  Princeton texts. Hunt's volume 1 chronology confirms only his schooling under Donald
  Robertson, then Rev. Thomas Martin, then Princeton 1769–72.
