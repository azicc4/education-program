id: madison-congress-list-1783
title: "James Madison's Books for Congress (1783) and His Course of Study (1769–1786)"
category: founder-letter
people: [James Madison, John Witherspoon, Thomas Martin, William Bradford, Thomas Jefferson]
date: "1769–1786"
summary: >-
  On 23 January 1783 a committee chaired by James Madison (with Hugh Williamson and Thomas
  Mifflin) gave Congress a list of books "proper for the use of Congress". It runs from the
  law of nature and nations (Grotius, Pufendorf, Vattel, Burlamaqui, Wolff) through
  diplomacy, history of every nation, and politics (Plato, Aristotle, Hooker, Sidney, Locke,
  Montesquieu, Hume, Smith) to a large collection on America. Congress rejected it as too
  costly. Madison's letters show where this learning came from: Horace and prosody on
  entering Princeton, history and moral science with "a little divinity", then his requests
  to Jefferson in Paris for books on "ancient or modern federal republics". Those books fed
  his 1786 notes on ancient and modern confederacies, used in preparing for the 1787
  Convention. This program uses the 1783 list as the model reading shelf for its civics-law
  and history tracks at the college level.
primarySources:
  - { label: "Report on a list of books proper for the use of Congress, 23–24 Jan 1783, printed in Journals of the Continental Congress, vol. 24, pp. 83–92 (Archive.org)", url: "https://archive.org/details/journalsofcontin24unit" }
  - { label: "The Writings of James Madison, ed. Gaillard Hunt, vol. 1, 1769–1783 (Archive.org): Princeton letters, Bradford letters, Notes of Debates 23 Jan 1783", url: "https://archive.org/details/writingsjames01madirich" }
  - { label: "The Writings of James Madison, ed. Gaillard Hunt, vol. 2, 1783–1787 (Archive.org): letters to Jefferson; Of Ancient & Modern Confederacies", url: "https://archive.org/details/writingsjames02madirich" }
