id: washington-education
title: "George Washington's Education, Library, and Plan for a National University (c. 1745–1799)"
category: founder-letter
people: [George Washington, George Washington Parke Custis, Samuel Stanhope Smith]
date: "c. 1745–1799"
summary: >-
  Washington had no Latin, no Greek and no college. He was formed by a copybook of
  practical forms and the 110 Rules of Civility, and by practical reading: Seneca's Morals
  (signed at about seventeen), agriculture, military science and history. As president and
  in his will he pressed for a national university that would train young Americans at
  home in "the science of government". His letters to his step-grandson at Princeton
  (1796–97) are a founder's own advice on study habits and character. This program takes
  the Rules of Civility for early character formation, pairs practical arts (surveying,
  business forms, agriculture) with classical study, and follows Washington in treating
  civic education as a national duty.
