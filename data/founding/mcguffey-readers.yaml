notes: >-
  Lesson numbers and reader placements come from the tables of contents of the Gutenberg texts, which
  reproduce the 1879 revision (Van Antwerp, Bragg & Co.; later copyrights 1896, 1907, 1920/21). The
  1836–1857 editions had a stronger Calvinist and devotional content and a different selection, and no
  digitized original first edition has been verified, so these placements should not be read back
  onto the 1830s–40s readers. Gutenberg also has The New McGuffey First and Fourth Readers (#1489,
  #1490), a different, later series not used here.
