id: mcguffey-readers
title: "McGuffey's Eclectic Readers (1836–1879)"
category: 19th-century-school
people: [William Holmes McGuffey, Alexander Hamilton McGuffey]
date: "1836–1879"
summary: >-
  The McGuffey Readers were the common reading course of nineteenth-century American schoolchildren.
  They moved from the Primer's phonics and moral tales up to the Fifth and Sixth Readers, which work as
  an anthology of English and American literature, oratory and Scripture, each piece set up with lessons
  in articulation, inflection and gesture. The selections below are taken from the 1879 revised
  edition, the one digitized on Project Gutenberg. They show what the series expected a young citizen
  to recite and admire: Shakespeare and Milton, Gray and Bryant, Webster and Patrick Henry, and the Bible.
  This program uses the Fourth to Sixth Readers as a graded source of memory work, elocution practice
  and short moral essays in the middle years, before the pupil reads the authors whole.
