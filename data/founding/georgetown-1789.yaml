id: georgetown-1789
title: "Georgetown: John Carroll's Academy and the Jesuit Plan of Studies (1787–1820)"
category: colonial-college
people: [John Carroll, Charles Carroll of Carrollton, William Louis Dubourg, William Gaston]
date: "1787–1820"
summary: >-
  John Carroll, a St. Omer and Liège Jesuit and later the first Catholic bishop in the United States, issued his
  Proposals in 1787 and bought the Georgetown site in 1789. Classes opened in 1791–92 on the model of the Jesuit
  colleges he had studied and taught in. The Proposals promised to "unite the means of communicating Science" with
  guarding "the Morals of Youth": the three Rs, mathematics, and English grammar alongside the learned languages,
  "open to Students of Every religious Profession". The college later grew into the Ratio's ladder of rudiments,
  grammar classes, humanities or poetry, rhetoric, and philosophy, with French, Spanish, declamations, and public
  exhibitions. Georgetown is the program's main Catholic founding-era precedent: classical Latin and Greek with
  moral formation, the vernacular, and modern languages for a republic, a model already proven in the St. Omer
  education of Charles Carroll of Carrollton, the only Catholic signer of the Declaration.
