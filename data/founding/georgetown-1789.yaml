notes: >-
  The brief refers to "1789 proposals", but Carroll's broadside Proposals are dated 1787; 1789 is the year the land
  was bought and is the traditional founding date. The Georgetown Library timeline puts the start of classes in 1792,
  while Shea says the doors opened in September 1791, with William Gaston as the first pupil. Quotations from the Proposals follow Shea's 1891
  transcription, and the 1798 and 1820 prospectus phrases come from the Georgetown Library exhibit. The Proposals do
  not name specific classical authors, and no surviving 1790s Georgetown list of set texts (for example, which works
  of Cicero or Virgil were read) was found, so the class ladder is attested through Shea and the later prospectuses.
  The phrase "Graeca Minora" is from an early diary Shea quotes. No detailed reading list for Charles Carroll at St.
  Omer, such as his father's letters directing his studies, was verified; his curriculum is assumed to be the Ratio's.
