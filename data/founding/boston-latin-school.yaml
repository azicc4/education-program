id: boston-latin-school
title: "Boston Public Latin School: Course of Study (c. 1770–1860)"
category: 19th-century-school
people: [Ezekiel Cheever, John Lovell, Samuel Hunt, Benjamin Apthorp Gould, Charles Knapp Dillaway, Epes Sargent Dixwell]
date: "1770s–1860"
summary: >-
  America's oldest school (1635) prepared Boston boys for Harvard with a ladder of Latin and Greek:
  Cheever's Accidence and Corderius, then Aesop, Eutropius and Nepos, Ovid and Caesar, and finally
  Virgil, Cicero's orations, Horace, the Greek Testament and Homer, with "making Latin", memorization
  and Saturday declamation throughout. The town's 1789 "System of Public Education" and Master Gould's
  own account of the 1820s course (both printed in Jenks's 1886 catalogue) show the same sequence
  surviving the Revolution. Its alumni included Franklin (briefly), Hancock, Samuel Adams,
  Robert Treat Paine and Emerson. This program adopts its graded Latin ladder, its daily memorization
  of poetry, and its public declamation as the core of the grammar-school years.
primarySources:
