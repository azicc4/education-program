notes: >-
  Sequence drawn from three documents reprinted in Jenks (1886): Harrison Gray Otis's memory of the
  school up to April 1775 (seven forms), the town's "System of Public Education" of 15 October 1789
  (four classes), and Master B. A. Gould's own description of the five-year course (1820s), plus the
  1860 regulations. Jenks writes that alumni signed about one-ninth of the Declaration. Adam's Latin Grammar
  was by Alexander Adam of Edinburgh; the name is sometimes written "Adams's". Jacobs' Greek Reader (Everett's
  Boston edition) is often said to have been used, but this is not confirmed in the texts checked.
  Graeca Minora (Gould) and Felton's Greek Reader (1860) are attested. Holmes (1935) is listed from its
  HathiTrust catalogue record only, and its access status has not been checked. Scans of Barnard's
  American Journal of Education and of the Boston School Committee reports have not been verified, so
  they are not linked.
