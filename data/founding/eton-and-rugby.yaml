  - { label: "H. C. Maxwell Lyte, A History of Eton College, 1440–1875 (Archive.org)", url: "https://archive.org/details/historyetoncolle00lyteiala" }
  - { label: "A. P. Stanley, Life and Correspondence of Thomas Arnold, vol. 1 (1882 ed., Archive.org)", url: "https://archive.org/details/thomasarnoldddla01stan" }
  - { label: "Thomas Hughes, Tom Brown's School Days (Gutenberg #1480)", url: "https://www.gutenberg.org/ebooks/1480" }
