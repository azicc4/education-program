notes: >-
  The Eton reading by form for the year ending at Midsummer 1861 comes from the Clarendon Report, vol. I.
  The weekly construing and repetition routine and the replacement of the Eton Latin Grammar come from
  Lyte's History, which is also the source for dating the replacement to the 1860s; the exact year was
  not checked. Arnold material is from Stanley's Life, vol. 1, chs. I and III. The Sixth Form "officers"
  simile paraphrases a quotation there. Stanley does not give a fixed Sixth Form syllabus, so the
  Thucydides and Aristotle entries show Arnold's own emphases and teaching rather than a timetable.
  I did not find or verify an online edition of Arnold's Sermons or his collected letters beyond Stanley.
