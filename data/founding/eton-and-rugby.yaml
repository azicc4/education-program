id: eton-and-rugby
title: "Eton and Arnold's Rugby: The English Public-School Classics"
category: 19th-century-school
people: [John Keate, Thomas Arnold, Arthur Penrhyn Stanley, Thomas Hughes]
date: "c. 1760–1864"
summary: >-
  Eton trained English statesmen almost entirely through construing, repetition and verse composition,
  using its own Eton Latin Grammar and the house anthologies (Poetae Graeci, Scriptores Graeci,
  Scriptores Romani) together with Homer, Virgil and Horace. The Clarendon Commission (1864) recorded
  exactly what each division read. At Rugby from 1828 to 1842, Thomas Arnold kept the classics but made
  them serve moral and political understanding: Thucydides, Herodotus and Aristotle, modern history,
  divinity lessons and chapel sermons. He gave the Sixth Form real responsibility for the school,
  aiming to form "Christian gentlemen." This program adopts Eton's memorization and verse writing
  together with Arnold's ordering of goals: religious and moral principle first, gentlemanly conduct
  second, intellectual ability third.
primarySources:
