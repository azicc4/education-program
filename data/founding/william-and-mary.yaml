notes: >-
  The 1758 printing gives the statutes as amended by the Visitors between 1753 and 1756, with
  rules from 1742 added. Its preface says they keep the title and preface of the statutes first
  published, which are those of 1727. So the text here is the 1727 framework with mid-century
  amendments, not a clean 1727 text. The text of Jefferson's Bill for
  Amending the Constitution of the College of William and Mary has not been verified, so it is
  described only from Jefferson's Autobiography and there is no link. The six
  professorships come from Query XV of Notes on Virginia. The Brafferton kept its own place as
  the sixth. The modern-languages chair is tagged `spanish` only because the program's modern
  language tracks are Spanish and Chinese. The historical chair taught French, Italian and other
  modern languages. The `search` terms Blackstone, Vattel and Newton are cross-link hints, not
  texts named in the 1779 documents. Adams (1887) records Blackstone and Vattel as W&M texts only
  for 1830.
