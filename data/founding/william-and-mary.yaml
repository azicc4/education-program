id: william-and-mary
title: "College of William & Mary: Charter, Statutes, and Jefferson's Reorganization (1693–1780s)"
category: colonial-college
people: [James Blair, William Small, George Wythe, Thomas Jefferson]
date: "1693–1782"
summary: >-
  The 1693 charter founded William & Mary so that Virginia might have "a Seminary of Ministers of
  the Gospel". It was also meant to educate the colony's youth "in good Manners and Learning" and
  to carry the faith to the Indians. The statutes (first framed in 1727; printed in Latin and
  English in 1758) set up four schools. The grammar school taught Latin and Greek from the books
  used in English schools, plus the Church catechism. Two philosophy masters taught rhetoric,
  logic and ethics, and physics, metaphysics and mathematics. Two divinity professors taught
  Hebrew, exegesis, and commonplaces and controversy. An Indian school taught reading, writing
  and arithmetic. Jefferson studied there from 1760 to 1762. William Small gave the college's
  first regular lectures in ethics, rhetoric and belles lettres, and Small introduced him to
  George Wythe for the study of law. As a Visitor in 1779, Jefferson abolished the grammar school
  and the divinity and oriental-language chairs. In their place he set up professorships of law
  and police, of anatomy and medicine, and of modern languages. He added the law of nature and
  nations and the fine arts to moral philosophy. This program takes two things from William &
  Mary: grammar-school Latin and Greek finished before college, and the Founders' upper course
  in law, natural law, political economy, science and modern languages.
