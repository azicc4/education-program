id: jefferson-reading-lists
title: "Thomas Jefferson's Reading Lists (1771–1814)"
category: founder-letter
people: [Thomas Jefferson, Robert Skipwith, Peter Carr, Bernard Moore, John Minor, Martha Jefferson]
date: "1771–1814"
summary: >-
  Jefferson wrote reading lists all his life. There is the 1771 catalogue for a gentleman's
  private library (Skipwith), the graded course in Greek and Latin originals for his nephew
  Peter Carr (1785), the 1787 advice to Carr on conscience, Spanish and religion, the law
  student's day planned hour by hour (Bernard Moore, c. 1773, recopied for John Minor in
  1814), and the daily timetable for his eleven-year-old daughter Patsy (1783). Taken
  together they show one pattern: ancient historians, poets and moralists read in the
  original, then English law and political theory, all built on daily discipline and
  exercise. This program adopts the order of the Carr course (history, then poetry, then
  moral philosophy) for the Latin and Greek tracks. It uses the Moore schedule as a model
  for the college-level day. The Patsy timetable serves as a precedent for a daily rotation
  of music, drawing, a modern language and letter-writing.
