    search: Cicero
    tracks: [latin, rhetoric]
  - text: "Admission (1643): decline perfectly the paradigms of Greek nouns and verbs"
    use: [reference]
    units: [greek-03, greek-04]
    search: Greek grammar
    tracks: [greek]
  - text: "Admission (1655 laws): read and understand Tully, Virgil, or any such ordinary classical authors, with skill in making Latin verse"
