notes: >-
  The 1643 admission rule names only "Tully, or such like classicall Latine Author". Virgil is first
  named in the 1655 laws. The Greek New Testament and Xenophon appear in the 1767 laws. The
  1726 Flynt course and 1728 visitation come to us through Hall (1894), who quotes Quincy's History
  of Harvard, so they are second-hand. The Revolutionary-era textbook list comes from a modern
  secondary article that summarizes Morison. The text of the 1734 laws (some
  sources say they required parsing Tully and Virgil and knowing prosody) and the 1790 laws' course
  by class have not been verified, so neither is used here. Ramus appears as the 1726 freshman logic text. Cotton Mather
  says Ramist method was preferred to Aristotle's at Harvard.
