id: harvard
title: "Harvard College: Admission and Course of Study (1642–1790)"
category: colonial-college
people: [Henry Dunster, Charles Chauncy, Henry Flynt, Edward Holyoke]
date: "1642–1790"
summary: >-
  Harvard's first printed rules, in New England's First Fruits (1643), admitted only a boy who could
  read Cicero "or such like classical Latine Author extempore", speak and write Latin in prose and
  verse, and decline Greek nouns and verbs. After that came a three-year weekly round of logic,
  physics, ethics and politics, arithmetic, geometry and astronomy, Greek, Hebrew, Chaldee and
  Syriac, rhetoric and declamation, catechetical divinity, history and botany, with disputations
  every week. The degree test was reading the Old and New Testaments in their original languages
  into Latin and "resolving them logically". By the 1767 laws Virgil and the Greek New Testament
  had joined Cicero at entrance, each tutor taught one subject, and Locke, Watts, 's Gravesande and
  Burlamaqui had come into the course. This program keeps that order. Cicero, Virgil and the Greek
  New Testament are the bar a student must clear before the college years. Hebrew is read in the
  Psalms and the Hebrew Bible. Weekly disputation and monthly declamation are standing exercises.
primarySources:
