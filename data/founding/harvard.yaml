    search: Euclid
    tracks: [mathematics, natural-science]
  - text: "Greek: etymology and syntax, then prosody and dialects; practice poetry in Nonnus, Duport 'or the like'; then style, composition, imitation and epitome in prose and verse"
    use: [reference]
    units: [greek-06, greek-11]
    search: Homer
    tracks: [greek, poetry, grammar-composition]
  - text: "Hebrew and the Eastern tongues: Hebrew grammar and practice in the Bible (year 1), Chaldee in Ezra and Daniel (year 2), Syriac in Tremellius's New Testament (year 3)"
