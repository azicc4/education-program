    use: [reference]
    units: [logic-03, rhetoric-09, physics-01]
    search: Ramus
    tracks: [logic, natural-science]
  - text: "Second year: ethics and politics"
    use: [reference, student]
    units: [philosophy-07, character-virtue-12]
    search: Ethics
    tracks: [philosophy, civics-law]
  - text: "Third year: arithmetic and geometry for three quarters, then astronomy"
    use: [reference, student]
