  - { label: "The Lawes of the Colledge (Chauncy code, 1655), Colonial Society of Massachusetts", url: "https://www.colonialsociety.org/node/429" }
  - { label: "The Laws of Harvard College (1767), Colonial Society of Massachusetts", url: "https://www.colonialsociety.org/node/432" }
  - { label: "College Laws and Customs: introduction to the 1655, 1692 and 1767 codes and 1734/5 customs (Colonial Society of Massachusetts)", url: "https://www.colonialsociety.org/node/418" }
  - { label: "Secondary: G. Stanley Hall, 'On the History of American College Text-Books' (Proc. American Antiquarian Society, 1894), quoting Tutor Flynt's 1726 course", url: "https://www.americanantiquarian.org/proceedings/44769406.pdf" }
  - { label: "Secondary: 'Harvard College on the Eve of the American Revolution' (Colonial Society of Massachusetts)", url: "https://www.colonialsociety.org/node/1239" }
  - { label: "Harvard University Archives research guide: Early Curriculum at Harvard", url: "https://guides.library.harvard.edu/hua/earlycurriculum" }
entries:
  - text: "Admission (1643): understand Tully (Cicero) or a similar classical Latin author extempore, and make and speak true Latin in verse and prose"
