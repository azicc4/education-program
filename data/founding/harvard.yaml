    units: [hebrew-04, hebrew-06, hebrew-10]
    search: Hebrew Psalter
    tracks: [hebrew, theology]
  - text: "Rhetoric lectures for all classes on Fridays, and each scholar declaims once a month"
    use: [reference]
    units: [rhetoric-05, rhetoric-07]
    search: Cicero
