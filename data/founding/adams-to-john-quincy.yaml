id: adams-to-john-quincy
title: "John and Abigail Adams on Educating John Quincy Adams (1758–1786)"
category: founder-letter
people: [John Adams, Abigail Adams, John Quincy Adams, John Shaw, Francis Dana]
date: "1758–1786"
summary: >-
  From Philadelphia, Paris, Amsterdam and Braintree, John and Abigail Adams directed their
  son's education by letter. His father set the books: Thucydides in Greek, Sallust,
  Cicero, Tacitus and Livy for "Wisdom and Virtue", and Demosthenes and Homer rather than
  easy school authors. His mother set the moral frame: hardship forms "the Hero and the
  Statesman". John Quincy's own letters record what he actually covered at Haverhill
  (1785–86): Greek grammar by heart, the Greek Testament, Homer, Xenophon, Horace, Terence,
  logic and Locke, ending in an oral Harvard examination and a translation into Latin.
  This program takes from the Adamses the pairing of hard classical texts with explicit
  moral and civic purpose, parents who keep writing to direct study, and a real
  examination as the gate to college-level work.
