notes: >-
  The 1570 lectures and course are translated from the Latin statutes in Documents relating to
  the University and Colleges of Cambridge, vol. 1. Waterland's four-year table comes through
  Wordsworth's reprint, Appendix III. Wordsworth prints its months in four yearly blocks, and he
  notes that later editions put in substitutes such as Wallis's logic for Burgersdicius. The 1730
  printing has not been checked against it. The account of the Schools, the 1772–92 questions, and
  the 1747–48 printed lists come from Ball, who draws on Wordsworth and Mullinger. The
  Previous Examination and Classical Tripos come from the Victoria County History. They have not
  been checked against the 1852 Cambridge Commission report on HathiTrust. The Emmanuel link is
  from Cambridge in America. John Harvard and Thomas Shepard were Emmanuel men, and Henry Dunster,
  Harvard's first president, came from Magdalene. Founding-era Americans at Cambridge include the
  Declaration signers Thomas Lynch Jr. (Caius) and Arthur Middleton. Pitt the Younger (Pembroke,
  1773) is the model English statesman formed by this course.
