id: cambridge
title: "University of Cambridge: From the Elizabethan Statutes to the Triposes (1570–1850)"
category: british-university
people: [John Whitgift, Isaac Newton, Daniel Waterland, William Paley]
date: "1570–1850"
summary: >-
  Cambridge and Oxford were the models the colonial colleges copied, and Cambridge was the closer
  model. Harvard's founding generation were Cambridge men. John Harvard was an Emmanuel man,
  Emmanuel sent more graduates to New England than any other college, and Newtowne took the name
  Cambridge. The Elizabethan statutes of 1570 set a four-year B.A.: "the first year shall teach
  rhetoric, the second and third dialectic, the fourth shall add philosophy". Public professors read
  Quintilian and Cicero, Aristotle's logic, ethics and politics, Euclid and Ptolemy, Homer and
  Demosthenes, and Hebrew from the Scriptures. Harvard's weekly round of logic, rhetoric, ethics, mathematics, Greek, Hebrew and disputation was built on this plan. In
  practice the college tutor directed the reading, as Waterland's Advice to a Young Student (1730)
  shows: Burgersdicius and Euclid, then Locke and Rohault, then Pufendorf and Grotius, then Newton,
  with the classics and divinity running alongside. After Newton's Principia (1687) Cambridge became
  a mathematical university. From 1747–48 the Senate House examination printed an order of merit
  (wranglers and optimes), which became the Mathematical Tripos. Beside the mathematics every
  candidate faced "Locke, Paley, Clarke, Butler". Paley's Moral Philosophy (1785) and Evidences
  (1794) became the university's ethics and apologetics, and the Classical Tripos followed in 1824.
  This program takes from Cambridge the rhetoric → logic → philosophy order, a tutor-set monthly
  reading plan, and a hard mathematical core joined to moral philosophy.
