id: noah-webster
title: "Noah Webster: Speller, Reader, Dictionary, and the Education of Youth (1783–1828)"
category: treatise
people: [Noah Webster]
date: "1783–1828"
summary: >-
  Noah Webster set out to give the new republic its own schoolbooks. His Grammatical Institute had
  three parts: the speller (later the "Blue-backed" American Spelling Book), a grammar, and a reader,
  An American Selection. Beside these stand his 1788 essay "On the Education of Youth in America" and
  the 1828 American Dictionary. All of them joined literacy to morality and patriotism: fables and a
  moral catechism in the speller, Revolutionary orations in the reader, and Scripture-laden definitions
  in the dictionary. Webster argued that a child should "rehearse the history of his own country" from
  his first words. This program takes his idea that learning to read is learning to be a citizen. It
  does not follow him in shrinking the classics, and it keeps Latin and Greek for every pupil.
