notes: >-
  The speller fables and the Moral Catechism were checked in the 1809 Hartford American Spelling Book.
  The "Federal Catechism" found in some early editions was not seen in that OCR, so it is not listed. The
  American Selection contents were checked in an Archive.org scan dated 1787 in its metadata, which
  includes material later than 1787, so it may be a later printing. The linked 1787 ECCO-derived scan was
  not checked page by page. I found no digitized 1783 first edition of Part I (the speller). The essay was
  first printed in 1788 and is reprinted in the 1790 Collection of Essays used here.
