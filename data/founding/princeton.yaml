notes: >-
  The 1764 course is from the Account of the College published under President Finley, as quoted by
  Maclean. It is the course Witherspoon inherited in 1768. The 1772 course is Witherspoon's own
  description in the Jamaica address. The Lectures on Moral Philosophy and Eloquence were student
  lecture notes, published after his death. Their 1810 preface says he never meant them for the
  press. The claim that Madison stayed on specifically to study Hebrew with Witherspoon comes from
  Madison's later autobiographical sketch as reported in secondary works. I could not verify it
  from a source I could fetch. Rives and the Miller Center confirm only the extra year of study,
  and the Founders Online documents could not be retrieved (automated access blocked). The 1772
  Hebrew resolution shows the subject was voluntary but urged. French is tagged `spanish` only as
  the program's nearest modern-language track.
