id: princeton
title: "College of New Jersey (Princeton) under John Witherspoon (1764–1794)"
category: colonial-college
people: [John Witherspoon, James Madison, Samuel Stanhope Smith]
date: "1764–1794"
summary: >-
  In 1764 a freshman at the College of New Jersey had to compose grammatical Latin, translate
  Virgil, Cicero's Orations and the four Gospels in Greek, and know vulgar arithmetic. He then read
  Horace, Cicero, Lucian, Xenophon, Homer and Longinus, and future ministers began Hebrew. John
  Witherspoon, president from 1768, described the course in 1772. First came Latin, Greek,
  antiquities and rhetoric. Next came geography with the globes, the first principles of
  philosophy, and mathematics. The third year was chiefly mathematics and natural philosophy.
  In the senior year students read the higher classics and took moral philosophy. Every junior
  and senior heard the President's lectures on chronology and history and on composition and
  criticism. The lower classes gave orations each evening. Witherspoon's Lectures on Moral
  Philosophy close with a reading list that runs from Leibniz, Clarke, Hutcheson and Butler to
  Grotius, Pufendorf, Burlamaqui, Harrington, Locke, Sidney and Montesquieu. His Lectures on
  Eloquence hold up Demosthenes, Cicero, Livy, Sallust, Tacitus, Xenophon, Addison and Swift as
  models of style. James Madison took this course from 1769 to 1771 and stayed a further year to
  study under Witherspoon. This program adopts Witherspoon's capstone: moral philosophy that
  moves into natural law and politics, joined to daily practice in public speaking.
