id: kings-college
title: "King's College (Columbia): Johnson's Advertisement and the 1763 Plan of Education (1754–1785)"
category: colonial-college
people: [Samuel Johnson, Myles Cooper, Alexander Hamilton, John Jay]
date: "1754–1785"
summary: >-
  In 1754 President Samuel Johnson set out the lowest qualifications for entering King's College.
  A boy had to read and write well and know arithmetic through division and reduction. He also had
  to parse the first select orations of Cicero, the first books of Virgil's Aeneid, and the
  opening of St. John's Gospel in Greek. Johnson promised a course in "the Arts of reasoning
  exactly, of writing correctly, and speaking eloquently". It would also cover surveying and
  navigation, geography and history, husbandry, commerce and government, and natural history,
  leading "from the Study of Nature" to God. Under Myles Cooper, the Governors adopted a four-year
  Plan of Education in 1763. It is one of the richest classical reading lists of the colonial era:
  Sallust, Caesar, Ovid and Aesop; then Cicero's Offices, Terence and Xenophon; then Cicero's
  orations and De Oratore, Quintilian, Horace, Aristotle's Ethics and Poetics, Plato and the
  Iliad; and finally Livy, Tacitus, the Odyssey, the Greek tragedians, Thucydides, Herodotus,
  Longinus, Demosthenes, Isocrates, Hebrew, and Grotius or Pufendorf. John Jay (class of 1764)
  and Alexander Hamilton (c. 1773–76) studied under this regime. This program uses the 1763
  plan as a model for the order of Latin and Greek reading in grades 9–12 and college.
primarySources:
  - { label: "A History of Columbia University 1754–1904 (1904), Appendix A: Johnson's Advertisement (1754); Appendix B: Laws of 1755 and the 1763 Plan of Education (Internet Archive)", url: "https://archive.org/details/historyofcolumbi00coluuoft" }
