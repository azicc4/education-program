notes: >-
  Johnson's 1754 advertisement names Tully, Virgil's Aeneid and the Gospel of St. John. It does not
  name Caesar. Caesar and Sallust enter the admission rules in the 1763 laws ("Sallust, Caesar's
  Commentaries or some part of Cicero's Works", and "the Gospels at least" from Greek into Latin).
  The 1763 plan came late in the course of John Jay (class of 1764), so Jay would have met it only partly.
  Hamilton, who entered around 1773–74, would have followed it or its successor. There is no
  surviving record of what either man read. All quotations come from the appendices and text of
  the 1904 History of Columbia University, which prints the advertisement (dated New York, May 31,
  1754) and the laws and plan from the Governors' minutes. I did not separately verify Moore's
  Historical Sketch (1846) as a source.
