  - { label: "Orders and Appointments of the Collegiate School, as copied by Jonathan Ashley, 1726 (National Humanities Center excerpt of Dexter vol. 1)", url: "https://nationalhumanitiescenter.org/pds/becomingamer/ideas/text4/yaleregulations.pdf" }
  - { label: "The Literary Diary of Ezra Stiles, vol. 2 (1776–1781), incl. books recited by each class, Nov. 1779 (Internet Archive)", url: "https://archive.org/details/literarydiaryofe02stil" }
  - { label: "The Literary Diary of Ezra Stiles, vol. 3 (1782–1795): Stiles's Hebrew classes (Internet Archive)", url: "https://archive.org/details/literarydiaryofe03stil" }
  - { label: "Secondary: G. Stanley Hall, 'On the History of American College Text-Books' (Proc. American Antiquarian Society, 1894), on the Yale MS laws of 1720/1726 and Clap's Ethics", url: "https://www.americanantiquarian.org/proceedings/44769406.pdf" }
