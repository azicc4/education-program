id: yale
title: "Yale College: Admission and Course of Study (1726–1790)"
category: colonial-college
people: [Thomas Clap, Ezra Stiles, Jonathan Edwards]
date: "1726–1790"
summary: >-
  President Clap's laws of 1745 set Yale's entrance bar: read, construe and parse Cicero, Virgil and
  the Greek New Testament extempore, write true Latin prose, know the rules of prosody, and know
  common arithmetic. Arithmetic was a new entrance requirement. Inside the college, the tongues and
  logic came first, then rhetoric, geometry and geography, then natural philosophy and astronomy,
  and last metaphysics and ethics. Saturdays were for divinity: the Westminster Confession, Wollebius
  and Ames. Students declaimed in Latin, Greek or Hebrew. When Ezra Stiles became president in 1778,
  he recorded the books each class recited: Virgil, Cicero, Horace, the Greek Testament, Ward's
  mathematics, Watts's Logic, Locke's Essay and Clap's Ethics. He also taught Hebrew to whole
  freshman classes himself. This program keeps Yale's order: languages and logic, then mathematics
  and natural philosophy, then moral philosophy. It makes Hebrew a Psalter-first discipline, as
  Stiles did.
primarySources:
