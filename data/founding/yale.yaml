notes: >-
  The 1745 laws are quoted from Stiles's manuscript copy as printed by Dexter. The 1726 orders come
  from the National Humanities Center's modernized excerpt of Dexter vol. 1. The claim that Stiles
  "made Hebrew required" comes from secondary sources, which also say he made it voluntary around
  1790. His diary does show him teaching Hebrew to entire freshman classes, and no formal
  Corporation vote appears in the sources checked. Stiles's 1779 book list describes the course "at my
  Accession", so it records the late Clap/Daggett course he inherited. The Hall (1894) summary of
  the 1720/1726 MS laws says "Wollaston's theology", which is probably a misreading of Wollebius,
  since the 1726 orders read "Wolebius".
