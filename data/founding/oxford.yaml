notes: >-
  The 1636 course, the lectures and the disputations come from the Latin text of the Laudian
  Statutes (Griffiths, 1888). The English wording here is my translation. The account from 1800 to
  1850, the Greats and pass-degree lists, and the Eldon and Knox anecdotes come from the 1852
  Royal Commission Report (pp. 58–67). The Greats books are the Commission's description of what
  "the most distinguished Students" usually read. Oxford printed no official set-book list, and the
  list changed with the examiners. The 1850 school of Law and Modern History had not yet been
  examined when the report was written, so its text-books are the Commissioners' forecast. The
  18th-century logic evidence is from Wordsworth. Wordsworth dates Aldrich to 1692, but the
  Internet Archive has a 1691 printing. Locke matriculated at Christ Church in 1652 and was a Student
  there until the Crown expelled him in 1684. Gibbon (Magdalen) and Adam Smith (Balliol) are the
  standard hostile witnesses to the idle professors. The Commission quotes Smith's line that most
  Oxford professors had "given up even the pretence of teaching".
