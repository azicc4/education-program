id: oxford
title: "University of Oxford: The Laudian Course and the Reformed Examinations (1636–1850)"
category: british-university
people: [William Laud, Henry Aldrich, John Eveleigh, William Blackstone]
date: "1636–1850"
summary: >-
  Oxford and Cambridge were the models the colonial colleges copied, and Oxford's rule for most of
  this period was Archbishop Laud's code of 1636. A student spent four years before the B.A. His
  first year went to the public lectures in grammar and rhetoric. His second went to logic and
  moral philosophy. His third and fourth added geometry and Greek. From the end of his first year he
  disputed "in parviso" on questions of logic, grammar, rhetoric and morals, and he defended them
  "according to Aristotle, whose authority is to be supreme". The M.A. took three more years of
  geometry, metaphysics, history, Greek, Hebrew, astronomy and natural philosophy. By the 18th
  century the professors had mostly stopped lecturing. Aldrich's little logic and the college tutor
  carried the teaching, and the degree examination had become a farce. John Locke (Christ Church,
  1652), Blackstone, Johnson, Bentham, Adam Smith and Gibbon all came up under this system, and
  C. C. Pinckney heard Blackstone's law lectures while at Christ Church. The Examination Statute of 1800
  brought back real, public, ranked examinations. From 1807 the classical school, Literae
  Humaniores ("Greats"), became the course of English statesmen. By c. 1830–50 its set books were
  Aristotle's Ethics with his Rhetoric or Politics, some Plato, Butler, Herodotus, Thucydides, Livy,
  Tacitus and the Greek and Latin poets. This program takes from Oxford the pairing of logic with
  the Ethics, disputation as a standing exercise, and the Greats canon of history, philosophy and
  poetry as the capstone.
