    units: [logic-03, rhetoric-09]
    search: Disputation
    tracks: [logic, rhetoric, civics-law]
  - text: "Before the B.A.: dispute as opponent and respondent in parviso for three terms and become a 'General Sophister'; answer twice under a determining Bachelor in Lent"
