    units: [philosophy-07, character-virtue-12, civics-law-09]
    search: Ethics
    tracks: [philosophy, civics-law, character-virtue]
  - text: "Years 3–4: geometry under the Savilian professor, whose statute charges him with Euclid's thirteen books of the Elements, Apollonius's Conics and all of Archimedes, plus arithmetic, surveying, music and mechanics"
