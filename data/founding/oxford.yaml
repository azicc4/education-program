    search: Homer
    tracks: [greek, poetry, rhetoric]
  - text: "Disputations in parviso (1636): from the end of the first year, three logical or grammatical questions argued 1–3 p.m.; Monday–Thursday logic 'according to Aristotle, whose authority is to be supreme'; Fridays grammar, rhetoric, politics and ethics"
