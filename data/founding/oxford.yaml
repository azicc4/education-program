    units: [mathematics-10, mathematics-12]
    search: Euclid
    tracks: [mathematics]
  - text: "Years 3–4 and through the M.A.: the Regius Professor of Greek expounds Homer, Demosthenes, Isocrates, Euripides or another ancient classic, with the grammar and idiom of the language"
