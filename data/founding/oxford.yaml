    units: [latin-06]
    search: Latin grammar
    tracks: [latin, grammar-composition]
  - text: "Year 1: attend the rhetoric lecturer, who expounds the Rhetoric of Aristotle, Cicero, Quintilian or Hermogenes and gathers their precepts 'into one body'"
    use: [reference, student]
    units: [rhetoric-07, rhetoric-10]
    search: Quintilian
    tracks: [rhetoric, latin, greek]
  - text: "Years 2–4: the logic (dialectic) lecturer reads Porphyry's Isagoge or any part of Aristotle's logic, keeping to the text and not to questions of method"
    use: [reference, student]
    units: [logic-08, logic-03]
    search: Aristotle
    tracks: [logic]
  - text: "Years 2–4: the moral philosophy lecturer reads Aristotle's Nicomachean Ethics, Politics and Economics, explaining the text and discussing the questions that arise from it"
