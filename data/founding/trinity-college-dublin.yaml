notes: >-
  Nearly everything here comes from Stubbs (1889), who prints the College's own lists of 1736,
  1759 and 1793. Stubbs's text reads "Singlerius" (probably Smiglecius), "Clerk's Logic" (probably
  Jean Le Clerc), "Eustathius' Ethics" (probably Eustachius a Sancto Paulo), "Saunderson's
  Prelections" (probably Robert Sanderson) and "Wall's Astronomy". The identifications are mine,
  and I left the astronomy text unnamed. Burke's entrance, first reading list and Tully's Offices
  come from his own letters to Shackleton in the Leadbeater Papers. The furor letter is in Laski's
  selection. Burke entered on 14 April 1744 and took the B.A. in 1748. Goldsmith entered as a sizar
  in 1744 and took the B.A. in 1750. Swift entered in 1682 and took the B.A. in 1686. Berkeley entered in 1700.
  Berkeley's small private philosophical society anticipated Burke's Club. Berkeley later gave books
  to Yale and Harvard and endowed Yale's Berkeley scholarship, which is the direct Dublin–colonial
  link. The Club's minutes survive in Burke's hand, but I have not seen them. The quotations come
  through Stubbs, who took them from Walsh's 1864 address. Sullivan's 1761 plan is the programme
  of Dublin's first professor of feudal and English law, and I have not read it closely. I found
  no evidence that "Trinity College" meant Trinity College, Hartford (1823). The Burke, Swift,
  Berkeley and Goldsmith framing points to Dublin.
