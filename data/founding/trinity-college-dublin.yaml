id: trinity-college-dublin
title: "Trinity College Dublin: The Undergraduate Course of Swift, Berkeley, Burke and Goldsmith (1637–1793)"
category: british-university
people: [William Laud, Narcissus Marsh, St George Ashe, Edmund Burke]
date: "1637–1793"
summary: >-
  Trinity College Dublin, with Oxford and Cambridge, was one of the models the colonial colleges
  copied. Its early provosts were all Cambridge graduates, and Laud's statutes (1637) gave it the
  same four classes an American college used: Junior and Senior Freshmen, Junior and Senior
  Sophisters. The science course ran logic (Porphyry, then Aristotle's Organon), physics,
  metaphysics and Aristotle's Ethics. Beside it ran daily Greek and Latin, a weekly Latin theme,
  declamations, syllogistic disputations in Hall, and an examination every term. Swift (1682–86)
  and Berkeley (from 1700) came through this course. Under Provost Ashe (1692–95) Locke's Essay became
  a Dublin text-book. The 1736 lists show
  what Burke (1744–48) and Goldsmith (1744–50) read: Burgersdicius's logic, then Le Clerc's logic and
  the Port-Royal Art of Thinking, then physics and geography, then Eustachius's Ethics, Pufendorf
  and metaphysics. In classics they went from Lucian and Sallust through the whole Iliad and Aeneid,
  Horace and Juvenal, Epictetus, Cicero's Offices and Livy, to Sophocles, Demosthenes On the Crown,
  Longinus and Tacitus. Burke's own debating club of 1747, the root of the College Historical
  Society, added what the course lacked: oratory, history and politics. The 1793 revision set
  Locke on Government and Burlamaqui's Natural Law in the final year, the same books as
  Revolutionary Harvard. This program takes from Dublin a term-by-term set-book list, examined every
  term, and a student-run society for declamation and debate.
