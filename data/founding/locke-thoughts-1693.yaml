notes: >-
  Section numbers follow the Standard Ebooks edition (based on the standard numbered text); other editions number
  some sections differently. The Founder link was verified through Franklin's 1749 Proposals, which cite Locke on
  accounts, English grammar, letter-writing, drawing, and swimming. No Project Gutenberg
  edition in English could be confirmed (search found only a Finnish translation), so none is linked. Jefferson's and
  Adams's ownership of the book was not verified in this pass.
