id: locke-thoughts-1693
title: "John Locke, Some Thoughts Concerning Education (1693)"
category: treatise
people: [John Locke]
date: "1693"
summary: >-
  Locke's letters to Edward Clarke on raising a gentleman's son became the most-read English book on education in the
  eighteenth century and a direct source for the Founders' generation; Franklin cites it repeatedly in his 1749
  Proposals. Locke ranks the aims as virtue, wisdom, breeding, and learning, in that order: a hardy body, habits formed
  early, reasoning with children, reading taught by play, modern language then Latin by conversation, a practical
  sequence of geography, arithmetic, geometry, chronology, and history, then ethics and natural law (Cicero's Offices,
  Pufendorf, Grotius), plus a manual trade, accounts, and travel. This program adopts his order of virtue before
  learning, his early-years regimen, his conversational method for modern languages, and his natural-law reading for
  civics, but not his low view of grammar drills, verse-making, and formal logic. Newman argues against that view in
  the Idea of a University (Discourse 7).
