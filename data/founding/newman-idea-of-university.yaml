notes: >-
  Quotations were checked against the Newman Reader text (1873 and later edition, Part 1 University Teaching and
  Part 2 University Subjects). The Xenophon and Virgil entrance-examination list comes from Newman's humorous dialogue
  between a tutor and "Mr. Brown", so it shows typical set books rather than a statutory syllabus. The
  reading list in the Latin Writing section is given in a letter from a fictional father to his son (a character in
  the essay, not explicitly Newman himself), though it reads like autobiography. The Hebrew tag on the last entry reflects this program's use
  of the entry: Newman mentions the languages of Scripture, but does not prescribe Hebrew. No Project Gutenberg
  edition number was verified, so none is linked.
