  - { label: "Discourse 8, Knowledge and Religious Duty (Newman Reader)", url: "https://www.newmanreader.org/works/idea/discourse8.html" }
  - { label: "University Subjects 4, Elementary Studies (Newman Reader)", url: "https://www.newmanreader.org/works/idea/article4.html" }
