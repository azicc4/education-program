id: newman-idea-of-university
title: "John Henry Newman, The Idea of a University (1852/1873)"
category: 19th-century-school
people: [John Henry Newman]
date: "1852–1873"
summary: >-
  Newman's Dublin discourses, given for the founding of the Catholic University of Ireland, with his later lectures
  on "University Subjects", are the classic 19th-century English case for liberal education. Knowledge is its own
  end; a university forms a "philosophical habit" of mind; theology is a true branch of knowledge that no university
  may leave out; literature is the voice of human nature and cannot be purged of sin. Classical grammar, composition,
  and Latin writing are the elementary discipline behind all of it. This program adopts Newman as the theological
  and philosophical capstone of its liberal-arts design: exact grammar and Latin composition in the early years,
  Homer, Aristotle, Cicero, and Virgil as the "schoolmasters of all generations", the English classics (Protestant
  ones included), and a clear line between the gentleman that liberal knowledge produces and the saint that only
  grace makes.
primarySources:
