track: chemistry
title: Chemistry
trackGroup: Math & Science
description: >-
  From Lavoisier's balance to the modern atom. Honors chemistry with real laboratory work and the founding papers of the science, then AP Chemistry. The goal is fluency in stoichiometry, equilibrium, thermodynamics and bonding, and a strong AP Chemistry exam by about 15.
rows:
  - id: chemistry-01
    title: "Chemistry: Lavoisier, Dalton & the Laboratory"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13.5
    ageEnd: 15
    order: 1
    prerequisites: []
    related: [natural-science-07, physics-01]
    summary: >-
      A full lab chemistry course covering measurement, atomic structure, the periodic table, bonding,
      stoichiometry, gases, solutions, acids and bases, thermochemistry, kinetics and equilibrium.
      Students read the founding documents: Lavoisier's Elementary Treatise (1789), which overthrew
      phlogiston and established conservation of mass, and Dalton's New System (1808), with its atomic
      theory and weights. A lab notebook is kept to professional standards.
    objectives:
      - Perform quantitative labs (titration, gas laws, calorimetry) with error analysis
      - Solve stoichiometry, gas-law and equilibrium problems
      - Reconstruct Lavoisier's argument against phlogiston and Dalton's case for atoms
    coreTexts:
      - title: Elements of Chemistry
        author: Antoine Lavoisier, trans. Robert Kerr
        date: "1789 (trans. 1790)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/30775" }
      - title: A New System of Chemical Philosophy, vol. 1
        author: John Dalton
        date: "1808"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/newsystemofchemi01daltuoft" }
    curriculumOptions:
      - name: General Chemistry, 3rd ed. / Chemistry for Accelerated Students (Novare)
        publisher: Classical Academic Press / Novare
        tradition: classical
        url: "https://classicalacademicpress.com/products/general-chemistry-3rd-edition"
        notes: Classical Christian. The accelerated version suits this program (https://classicalacademicpress.com/products/chemistry-for-accelerated-students-3rd-edition).
      - name: "A New Foundation for Chemistry: Lavoisier's Elementary Treatise"
        publisher: Green Lion Press
        tradition: classical
        url: "https://www.greenlion.com/books/LavNewFound.html"
        notes: St. John's-style guided reading of Lavoisier.
      - name: Chemistry with Lab / Honors Chemistry (online)
        publisher: Kolbe Academy
        tradition: catholic
        url: "https://courses.kolbe.org/"
