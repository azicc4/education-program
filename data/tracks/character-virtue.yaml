        publisher: University of Notre Dame Press
        tradition: catholic
        url: "https://undpress.nd.edu/9780268001032/the-four-cardinal-virtues/"
        notes: Thomist, short and readable. The core text for the course.
      - name: Mere Christianity (Lewis)
        publisher: HarperOne
        tradition: protestant
        url: "https://www.harpercollins.com/products/mere-christianity-c-s-lewis"
        notes: Anglican. Book III, "Christian Behaviour," treats the cardinal and theological virtues.
    notes: >-
      Catholic and Protestant note: Catholic teaching (Aquinas, the Catechism) holds that charity, infused by
      grace, perfects and "forms" the moral virtues, and that virtue grows through the sacraments. Reformed
      traditions stress that no virtue merits justification, and that sanctification follows justification by
      faith. Lewis's account is broadly acceptable to both.

  - id: character-virtue-10
    title: "Service, Leadership and the Education of a Leader"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13
    ageEnd: 16
    order: 10
    prerequisites: [character-virtue-07, character-virtue-08]
    related: [civics-law-08, greek-08]
    summary: >-
      Leadership is service. Xenophon's Education of Cyrus, the first "mirror for princes," read with
      Washington's example and Christ's washing of the disciples' feet, sets the ideal. The student
      practices it in real responsibility: leading a patrol or troop, serving the parish (altar service,
      choir, works of mercy), organizing a service project, and mentoring younger children.
    objectives:
      - Read Xenophon's Cyropaedia (selections) and discuss what makes men willingly obey a leader
      - Hold a real leadership position for a year or more (patrol leader, team captain, altar-server head, project organizer)
      - Complete 100 or more hours of direct service (the corporal works of mercy) over the course
      - Plan and lead a service project from proposal to report
