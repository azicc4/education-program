  - id: character-virtue-02
    title: "Treasuries of Virtue: Moral Stories and Golden Deeds"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 9
    order: 2
    prerequisites: [character-virtue-01]
    related: [literature-07, poetry-03]
    summary: >-
      Anthologies of stories, poems and deeds arranged by virtue (self-discipline, compassion, responsibility,
      friendship, work, courage, perseverance, honesty, loyalty, faith) give children vivid pictures of
      good conduct. Use William Bennett's Book of Virtues as the spine, add Charlotte Yonge's Book of Golden
      Deeds and the moral lessons of the McGuffey Readers, and read Vigen Guroian on why fairy tales form
      the moral imagination.
    objectives:
      - Read or hear one virtue story a day, then discuss who acted well and why
      - Memorize short virtue poems and proverbs (Proverbs, "If," Longfellow, and others)
      - Keep a "golden deeds" notebook of brave, honest or generous acts, both historical and observed
      - Practice one named virtue each month in household duties
