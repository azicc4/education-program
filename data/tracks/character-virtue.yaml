  - id: character-virtue-12
    title: "Aristotle's Nicomachean Ethics: Virtue as a Way of Life"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 12
    prerequisites: [character-virtue-09]
    related: [philosophy-07]
    summary: >-
      This is the foundational treatise on virtue: happiness as activity of the soul in accordance with
      virtue, virtue as a habit that lies in a mean, the role of practical wisdom, justice, friendship, and
      contemplation. The philosophy track treats the argument. Here the emphasis is on use: the student
      audits his own habits against Aristotle's catalogue of virtues and designs a practice for each.
    objectives:
      - Read Books I–IV, VI, VIII–X in full
      - Explain the doctrine of the mean and why the mean is "relative to us"
      - Apply Aristotle's account of courage, temperance, liberality, magnanimity and friendship to his own life in a reflective journal
      - Explain what Aristotle's ethics lacks that Christian teaching supplies (humility, charity, grace)
    coreTexts:
      - title: The Nicomachean Ethics (trans. D. P. Chase)
        kind: primary
        reader: student
        pages: 280
        role: selections
        portion: "Books I–IV, VI, VIII–X"
        pace: long
        author: Aristotle
        date: "c. 340 BC (trans. 1847)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/8438" }
    curriculumOptions:
      - name: "Introduction to Aristotle's Ethics: How to Lead a Good Life (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/aristotles-ethics"
        notes: Ten lectures led by Larry Arnn. Free.
      - name: The Nicomachean Ethics (student edition)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/mcp/the-nicomachean-ethics/"
        notes: Classical Christian edition for MP's upper school.
    historicalPrecedent: >-
      Aristotle's Ethics (often through Latin compendia) was the core of the moral-philosophy course taught
      to seniors at Harvard, Yale and William & Mary. Jefferson's list of moral authors for his nephew Peter
      Carr (1785) begins with the Socratic writers and Cicero.

  - id: character-virtue-13
    title: "Cicero's De Officiis: Duties of a Statesman and Citizen"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 17
    order: 13
    prerequisites: [character-virtue-12]
    related: [latin-11, civics-law-09, rhetoric-10]
    summary: >-
      Cicero's last philosophical work, written to his son in 44 BC, sets out the honestum (the morally good)
      under the four cardinal virtues, the useful, and the resolution of their apparent conflicts. It was the
      most read moral book of the Latin West after the Bible for a millennium and a half, and a fixture of
      founding-era schooling. Read it in English, and where the Latin track allows, in Latin (Book I).
    objectives:
      - Read all three books in English, and Book I chapters 4–17 in Latin if Latin progress allows
      - Explain Cicero's four sources of the honestum and their relation to the cardinal virtues
      - Analyze Cicero's cases of conflict between the honorable and the expedient (Regulus, the grain merchant of Rhodes)
      - Write a letter to a younger sibling on duty, in imitation of Cicero's letter to his son
    coreTexts:
      - title: De Officiis (Walter Miller translation, 1913)
        kind: primary
        reader: student
        pages: 210
        pace: long
        author: Marcus Tullius Cicero
        date: "44 BC"
        publicDomain: true
        links:
          - { label: LacusCurtius (Latin and English), url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Cicero/de_Officiis/home.html" }
          - { label: Project Gutenberg (Latin), url: "https://www.gutenberg.org/ebooks/47001" }
          - { label: "Archive.org: Cicero's Three Books of Offices (Edmonds trans.)", url: "https://archive.org/details/cicerosthreebook00ciceuoft" }
    curriculumOptions:
      - name: "Cicero, On Duties (Loeb Classical Library 30)"
        publisher: Harvard University Press
        tradition: classical
        url: "https://www.hup.harvard.edu/books/9780674990333"
        notes: Facing-page Latin and English (Miller). The standard student edition for reading alongside the Latin track.
    historicalPrecedent: >-
      Jefferson to Peter Carr (19 August 1785): "In morality, read Epictetus, Xenophontis memorabilia, Plato's
      Socratic dialogues, Cicero's philosophies, Antoninus, and Seneca." "Tully's Offices" was standard reading
      in colonial grammar schools and colleges, and in English translation for those without Latin.
    sources:
      - { label: "Jefferson to Peter Carr, 19 Aug. 1785 (Founders Online)", url: "https://founders.archives.gov/documents/Jefferson/01-08-02-0319" }
      - { label: "Jefferson to Peter Carr, 19 Aug. 1785 (Wikisource)", url: "https://en.wikisource.org/wiki/Letter_to_Peter_Carr_-_August_19,_1785" }

  - id: character-virtue-14
    title: "College: Aquinas on Virtue and the Moral Philosophy of the Founders"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 14
    prerequisites: [character-virtue-12, character-virtue-13]
    related: [philosophy-13, theology-22, economics-06, rhetoric-11]
    summary: >-
      A capstone seminar with two parts. The first is Aquinas's treatise on the virtues (Summa Theologiae
      I-II qq. 55–67, with selected questions of II-II on prudence, justice, fortitude and temperance) as
      the synthesis of Aristotle, Cicero, Augustine and Scripture. The second is the moral-philosophy course
      actually taught to the founders, John Witherspoon's Princeton Lectures on Moral Philosophy, heard by
      James Madison. Close with MacIntyre's After Virtue on why the tradition of the virtues was lost and how
      it might be recovered.
    objectives:
      - "Read ST I-II qq. 55–67 and II-II qq. 47, 58, 123, 141, and outline Aquinas's definition, division and connection of the virtues"
      - Read Witherspoon's Lectures and identify its Scottish common-sense sources and its account of duties to God, self and others
      - Read After Virtue and assess its diagnosis of modern moral disagreement
      - "Write a 3,000-word paper: Is a republic possible without virtue? Draw on Aristotle, Cicero, Aquinas, Witherspoon and the founders"
    coreTexts:
      - title: "Summa Theologiae I-II q. 55 (The virtues, as to their essence)"
