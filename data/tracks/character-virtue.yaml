  - id: character-virtue-08
    title: "Stewardship of Time and Money"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 14
    order: 8
    prerequisites: [character-virtue-05]
    related: [economics-01, economics-02, economics-05]
    summary: >-
      Frugality and industry were founding-era virtues with practical rules. The student reads Franklin's
      The Way to Wealth, Jefferson's "Decalogue of Canons for Observation in Practical Life" ("Never put off
      till to-morrow what you can do to-day. Never spend your money before you have it."), Seneca on the
      shortness of life, and the parable of the talents. The student then practices: earning, budgeting,
      saving and giving (tithing), keeping a time log, and planning a week.
    objectives:
      - Memorize Jefferson's ten canons and Franklin's key maxims
      - Keep a written budget with income from chores or work, savings, giving and spending for a full year
      - Keep a one-week time log, then design and follow a weekly schedule
      - Discuss the parable of the talents (Matthew 25) and the Christian idea of stewardship
    coreTexts:
      - title: "Franklin's Way to Wealth; or, Poor Richard Improved"
        kind: primary
        reader: student
        pages: 20
        author: Benjamin Franklin
        date: "1758"
        publicDomain: true
