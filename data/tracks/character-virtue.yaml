track: character-virtue
title: Character & Virtue
trackGroup: Arts & Body
description: >-
  The formation of a good man and citizen, the first aim of classical education. The track moves from
  story to habit to reasoned understanding. It begins with fables and virtue stories that train the moral
  imagination (4–9). It continues with manners and self-examination on the founders' model: Washington's
  Rules of Civility and Franklin's thirteen virtues, alongside the Ignatian Examen (8–11). Plutarch's
  heroes and the saints then serve as exemplars, and chivalry, stewardship of time and money, and service
  and leadership are practiced (10–16). Finally the student studies the virtues philosophically in the
  Catechism and Pieper, Aristotle's Nicomachean Ethics, Cicero's De Officiis, Newman's gentleman, and at
  college level Aquinas and the moral philosophy taught to the founders (13–18). Reading is always
  joined to practice: chores, service, a kept rule of life, and a weekly self-examination. The end state
  is a young man or woman who knows the cardinal and theological virtues, can argue for them from Aristotle,
  Cicero and Aquinas, and has the habits to act on them.
rows:
  - id: character-virtue-01
    title: "Fables and First Virtue Stories"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 4
    ageEnd: 7
    order: 1
    prerequisites: []
    related: [early-development-12, early-development-17, literature-01]
    summary: >-
      Aesop's fables are the oldest moral curriculum in the West: short, memorable, and each ends with a clear
      moral. Read them aloud, have the child narrate them back, and name the virtue or vice shown, using the
      fable's vocabulary ("sour grapes," "slow and steady") as family shorthand in daily correction and praise.
    objectives:
      - Hear and retell 50 or more of Aesop's fables and state the moral of each in a sentence
      - Name the basic virtues and vices shown (honesty, diligence, prudence, gratitude, pride, greed, sloth)
      - Connect fables to the child's own conduct in daily life, gently and without preaching
    coreTexts:
      - title: Aesop's Fables (V. S. Vernon Jones translation, Rackham illus.)
        kind: primary
        reader: together
        pages: 224
        role: choice
        group: A
        author: Aesop
        date: "1912"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/11339" }
      - title: The Fables of Aesop (Jacobs)
        kind: primary
        reader: together
        pages: 216
        role: choice
        group: A
