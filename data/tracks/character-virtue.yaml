  - id: character-virtue-04
    title: "Manners and Civility: Washington's Rules of Civility"
    type: unit
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 10
    order: 4
    prerequisites: [character-virtue-02]
    related: [grammar-composition-01, fine-arts-03]
    summary: >-
      Before sixteen George Washington copied out the 110 Rules of Civility and Decent Behaviour, maxims that
      go back to a 1595 Jesuit collection. Copy them as penmanship, discuss what each means today, and practice
      them at table, in conversation and with elders. Add the medieval Babees' Book for comparison.
      Manners are treated as small daily acts of respect for others, which is the outward side of justice
      and charity.
    objectives:
      - Copy all 110 rules over a year and memorize 20 or more key rules
      - Explain the principle behind each rule (respect, modesty, self-command) and adapt it to modern situations
      - Practice introductions, table manners, letter-writing, phone etiquette, and conversation with adults
      - Write thank-you letters by hand after every gift
    coreTexts:
      - title: "George Washington's Rules of Civility (Conway ed.)"
        kind: primary
        reader: student
        pages: 63
        author: George Washington; Moncure D. Conway (ed.)
        date: "c. 1747 (ed. 1890)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/12029" }
      - title: "The Babees' Book: Medieval Manners for the Young"
        kind: secondary
        reader: together
        pages: 260
        author: Edith Rickert (ed.)
        date: "1908"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/58985" }
    curriculumOptions:
      - name: "George Washington's Rules of Civility and Decent Behavior"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/mcp/george-washingtons-rules-of-civility/"
        notes: Inexpensive edition for copywork and memorization.
    historicalPrecedent: >-
      Mount Vernon notes that Washington copied the Rules, derived from maxims compiled by French Jesuits in
      the 1590s and translated by Francis Hawkins around 1640, probably as penmanship practice, and that his
      famous poise grew in part from them.
    sources:
      - { label: "Mount Vernon: The Rules of Civility and Decent Behaviour", url: "https://www.mountvernon.org/library/digitalhistory/digital-encyclopedia/article/the-rules-of-civility-and-decent-behaviour" }
      - { label: "Locke, Thoughts §67: manners learnt by example (Archive.org)", url: "https://archive.org/details/somethoughtsconc00lockuoft" }

  - id: character-virtue-05
    title: "Franklin's Thirteen Virtues and the Daily Examen"
    type: unit
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 11
    order: 5
    prerequisites: [character-virtue-04]
    related: [grammar-composition-09, economics-02]
    summary: >-
      In his Autobiography Franklin describes his "bold and arduous project of arriving at moral perfection":
      thirteen virtues (Temperance, Silence, Order, Resolution, Frugality, Industry, Sincerity, Justice,
      Moderation, Cleanliness, Tranquillity, Chastity, Humility), one practiced each week, with a chart
      to record faults. Pair his method with the Ignatian Examen, the daily prayerful review of conscience
      from the Spiritual Exercises. The student learns to set a rule of life and to examine it honestly
      every evening.
    objectives:
      - Read Franklin's account of the thirteen virtues and his daily schedule, and discuss what the method gets right and what it lacks
      - Keep a weekly virtue chart for a full 13-week cycle
      - Pray or practice a five-step evening Examen (gratitude, light, review, sorrow, resolve)
      - Write a personal daily schedule and rule of life, in imitation of Franklin's "order"
    coreTexts:
      - title: Autobiography of Benjamin Franklin (Part II, on the virtues)
        kind: primary
        reader: student
        pages: 25
        role: selections
        portion: "Part II, on the virtues"
        readPages: 25
        author: Benjamin Franklin
        date: "1791"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/20203" }
    curriculumOptions:
      - name: "Ben Franklin's Book of Virtues"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/mcp/ben-franklins-book-of-virtues/"
        notes: Franklin's virtue chart and related writings in a student edition.
      - name: The Daily Examen (Loyola Press)
        publisher: Loyola Press
        tradition: catholic
        url: "https://www.loyolapress.com/catholic-resources/ignatian-spirituality/examen-and-ignatian-prayer/how-can-i-pray-try-the-daily-examen/"
        notes: Free guide to St. Ignatius's evening review, adaptable for children.
    notes: >-
      Catholic and Protestant note: Franklin's scheme is Enlightenment self-improvement by effort. Catholic
      teaching (and most Protestant teaching) adds that virtue is perfected by grace, and the Examen
      places self-review within prayer. The Catholic sacrament of confession and the Protestant practice of
      daily confession both complete the habit.

  - id: character-virtue-06
    title: "Plutarch's Lives as Moral Exemplars"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 13
    order: 6
    prerequisites: [character-virtue-03]
    related: [civics-law-08, history-08]
    summary: >-
      Plutarch wrote the Parallel Lives to show character in action: "a slight thing like a phrase or a jest"
      often reveals more than battles. Read one Life per term, beginning with retellings and moving to
      North's or Dryden's translation, and discuss each hero's virtues, vices, choices and ends. Plutarch was
      the favorite book of Franklin's boyhood and the moral reference book of the founding generation.
    objectives:
      - Read 8–10 Lives (Solon, Aristides, Themistocles, Pericles, Alexander, Fabius, Cato the Elder, Cicero, Caesar, Brutus) across three years
      - Narrate each reading, then discuss, "Was this well done? What should he have done?"
      - Compare paired Greek and Roman lives as Plutarch does
      - Write short character sketches that explain actions by their motives
    coreTexts:
      - title: "The Boys' and Girls' Plutarch"
        kind: secondary
        reader: student
        pages: 468
        order: 1
        role: selections
        author: Plutarch; John S. White (ed.)
        date: "1883"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/2484" }
      - title: "Plutarch's Lives (Dryden trans., rev. Clough)"
        kind: primary
        reader: student
        pages: 1300
        order: 2
