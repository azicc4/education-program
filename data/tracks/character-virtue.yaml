    ageEnd: 10
    order: 3
    prerequisites: [character-virtue-02]
    related: [theology-04, theology-09]
    summary: >-
      Children imitate persons, not principles. Read the lives of the saints and of the heroes of Church and
      national history as models of courage, charity, fidelity and sacrifice. Read the saint of the day,
      keep patron saints' feasts, and discuss what each hero did and why.
    objectives:
      - Know the lives of 50 or more saints and Christian heroes and 20 or more national heroes, and narrate their decisive acts
      - Identify the virtue each exemplifies (Thomas More for integrity, Francis for poverty, Joan for courage, Washington for self-command)
      - Choose a patron and write a short life of him or her
