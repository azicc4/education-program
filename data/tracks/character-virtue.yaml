        publisher: Ramsey Solutions
        tradition: protestant
        url: "https://www.ramseysolutions.com/education/homeschool"
        notes: Video-based budgeting and debt-avoidance course with optional devotionals. Best at 13–15.
    notes: >-
      This row covers the habits. The theory of money, markets and prices belongs to the economics track.
      Newcomb's How to Be a Man (Boston, 1847) is a 19th-century conduct book for boys of about 11–14, with
      short chapters on habits, useful labor, indolence, doing one thing at a time, finishing what is begun,
      company, amusements, the tongue and conversation. Read a chapter a week and turn each into a resolution.
      Newcomb was a New England Congregationalist, so his chapters on family worship and a strict Sabbath
      reflect Protestant practice; Catholic families read them alongside Sunday Mass and the family rosary.

  - id: character-virtue-09
    title: "The Cardinal and Theological Virtues"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 14
    order: 9
    prerequisites: [character-virtue-06]
    related: [theology-14, theology-20, philosophy-04]
    summary: >-
      This course brings the stories and habits of the earlier years together into a systematic account.
      There are four cardinal virtues (prudence, justice, fortitude, temperance), on which all the moral
      virtues "hinge," and three theological virtues (faith, hope, charity), infused by grace. Read the
      Catechism's article on the virtues, Josef Pieper's The Four Cardinal Virtues, and C.S. Lewis's chapters
      on the cardinal and theological virtues in Mere Christianity.
    objectives:
      - Define each of the seven virtues and the vices opposed to it (by excess and defect where applicable)
      - Explain the difference between acquired (human) and infused (theological) virtue
      - Explain Pieper's thesis that prudence is the "mother" of the virtues and that fortitude presupposes justice
      - Write an essay applying the virtues to a character from Plutarch or history
    coreTexts:
      - title: "Catechism of the Catholic Church, Part III, Art. 7: The Virtues (§§1803–1845)"
        kind: primary
        reader: student
        pages: 10
        role: selections
        portion: "Part III, Art. 7: The Virtues (§§1803–1845)"
        readPages: 10
        author: Catholic Church
        date: "1992"
        publicDomain: false
        links:
          - { label: Vatican.va, url: "https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_one/article_7.html" }
      - title: The Four Cardinal Virtues
        kind: primary
        reader: student
        pages: 206
        author: Josef Pieper
        date: "1966"
        publicDomain: false
        links:
          - { label: University of Notre Dame Press, url: "https://undpress.nd.edu/9780268001032/the-four-cardinal-virtues/" }
      - title: Mere Christianity (Book III, chs. 2, 9–12)
        kind: primary
        reader: student
        pages: 35
        role: selections
        portion: "Book III, chs. 2, 9–12"
        readPages: 35
        author: C.S. Lewis
        date: "1952"
        publicDomain: false
        links:
          - { label: HarperCollins, url: "https://www.harpercollins.com/products/mere-christianity-c-s-lewis" }
    curriculumOptions:
