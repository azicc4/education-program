        pages: 150
        author: James Baldwin
        date: "1896"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/18442" }
    curriculumOptions:
      - name: Aesop Cursive Copybook Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/penmanship/aesop-cursive-copybook-set/"
        notes: For 6–7-year-olds, copying the fables' morals doubles as penmanship practice.
      - name: "Writing & Rhetoric Book 1: Fable"
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/products/writing-rhetoric-book-1-fable"
