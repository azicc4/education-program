  - id: character-virtue-11
    title: "The Gentleman and the Courtier: Newman and Castiglione"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 16
    order: 11
    prerequisites: [character-virtue-07, character-virtue-09]
    related: [theology-18, literature-23]
    summary: >-
      Newman's famous definition, "it is almost a definition of a gentleman to say he is one who never inflicts
      pain," from The Idea of a University (Discourse VIII), praises the refined gentleman and also warns that
      liberal culture without religion yields only a counterfeit of virtue. Read it against Castiglione's
      Renaissance ideal of the courtier (grace, sprezzatura, arms and letters) and the knightly ideal
      already studied. Ask what adds to natural refinement to make a Christian gentleman.
    objectives:
      - Read Newman's Discourse VIII (Knowledge viewed in relation to Religion) and memorize the gentleman passage
      - Read selections of The Book of the Courtier (Book I on arms and letters, Book IV on the courtier's end)
      - Write a comparative essay on the knight, the courtier and the gentleman, and on what each lacks without charity
