      - title: "Cyropaedia: The Education of Cyrus"
        kind: primary
        reader: student
        pages: 326
        role: selections
        author: Xenophon (trans. Henry Graham Dakyns)
        date: "c. 370 BC (trans. 1897)"
        publicDomain: true
