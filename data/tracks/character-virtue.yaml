        portion: "8–10 Lives (Solon, Aristides, Themistocles, Pericles, Alexander, Fabius, Cato the Elder, Cicero, Caesar, Brutus)"
        author: Plutarch
        date: "c. 100 AD (trans. 1683, rev. 1864)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/674" }
    curriculumOptions:
      - name: AmblesideOnline Plutarch Study Guides (Anne White)
        publisher: AmblesideOnline
        tradition: classical
        url: "https://www.amblesideonline.org/plutarch"
        notes: Free 12-week guides with lightly edited North/Dryden text, for ages 9–14. Charlotte Mason, Christian.
      - name: "Plutarch's Lives, Volume 1"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/mcp/plutarchs-lives-volume-1/"
        notes: Student edition used in MP's upper-grammar and logic years.
    historicalPrecedent: >-
      Franklin (Autobiography, Part I) records that as a boy he "read abundantly" in Plutarch's Lives, "and I
      still think that time spent to great advantage." Plutarch was among the most-owned books in
      18th-century American libraries, and Hamilton's army pay book contains his notes on Plutarch.
    sources:
      - { label: "Franklin, Autobiography (Project Gutenberg)", url: "https://www.gutenberg.org/ebooks/20203" }

  - id: character-virtue-07
    title: "Chivalry and the Knightly Ideal"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 13
    order: 7
    prerequisites: [character-virtue-03]
    related: [literature-08]
    summary: >-
      Chivalry joined the warrior's courage to Christian charity and courtesy: protecting the weak, keeping
      faith, generosity, and loyalty to God, lord and lady. Read the Arthurian legends in Lanier's boys'
      edition of Malory, and Léon Gautier's classic study with its "Ten Commandments of Chivalry." Discuss
      what a knight owes and how the ideal applies to a modern gentleman or lady.
    objectives:
      - Read The Boy's King Arthur and discuss Arthur, Lancelot, Gawain, Galahad and Mordred as studies in virtue and its failure
      - Learn Gautier's ten commandments of chivalry and relate each to a cardinal or theological virtue
      - Take a chivalric "vow" for a season (defending the weak, keeping one's word, courtesy to all) and keep a record
    coreTexts:
