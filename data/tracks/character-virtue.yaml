          - { label: "A System of Moral Philosophy (Archive.org, vol. 1)", url: "https://archive.org/details/systemmoralphilo01hutc" }
    historicalPrecedent: >-
      Witherspoon, president of the College of New Jersey (Princeton) and a signer of the Declaration, gave
      these lectures to seniors, among them James Madison (class of 1771), Aaron Burr and many future
      legislators and judges. Moral philosophy was the capstone course in every colonial college.
    notes: >-
      This overlaps philosophy-13 (Pieper, MacIntyre). Coordinate so that the philosophy seminar covers
      metaphysics and epistemology and this row covers moral practice. Witherspoon was a Presbyterian minister,
      and his lectures show the Reformed-Scottish Enlightenment strand of the founding.
