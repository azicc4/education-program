        url: "https://www.memoriapress.com/curriculum/science/handbook-of-nature-study/"
        notes: A print copy of Comstock as the parent's reference.
      - name: "Behold and See 5"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/behold-and-see-5/"
        notes: Catholic upper-elementary science.

  - id: natural-science-07
    title: "Physical Science by Experiment: Faraday's Candle"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 11
    order: 7
    prerequisites: [natural-science-06]
    related: [chemistry-01]
    summary: >-
      A year of hands-on physical science covering matter, heat, light, sound, simple machines,
      magnetism and electricity. Every lesson has an experiment and a written lab report (question,
      hypothesis, procedure, data, conclusion). The crown is Faraday's Chemical History of a Candle,
      his 1860 Christmas lectures for children, performed as a series of real demonstrations.
    objectives:
      - Write a complete lab report with controlled variables and measured data
      - Perform Faraday's candle demonstrations and explain combustion
      - Explain simple machines, heat transfer, and basic circuits
    workload:
      readingHours: 18
      readingBasis: "504 pp: Faraday's Candle 104 pp at ~20 pp/h (5 h), Macaulay's The Way Things Work (illustrated) 400 pp at ~30 pp/h (13 h)"
      work:
        - { kind: exercises, hours: 55, note: "physical-science lessons (e.g. Novare), 36 wk x 2 x 45 min" }
        - { kind: lab, hours: 35, note: "~30 experiments x 1 h plus Faraday's candle demonstrations, ~6 x 1 h" }
        - { kind: writing, hours: 15, note: "complete lab reports, ~30 x 30 min" }
    coreTexts:
      - title: The Chemical History of a Candle
        kind: primary
        reader: student
        pages: 104
        author: Michael Faraday
        date: "1861"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14474" }
      - title: The Way Things Work Now
        kind: secondary
        reader: student
        pages: 400
        author: David Macaulay
        date: "2016"
        publicDomain: false
        links:
          - { label: HarperCollins, url: "https://www.harpercollins.com/products/the-way-things-work-now-david-macaulay" }
    curriculumOptions:
      - name: Physical Science (Novare)
        publisher: Classical Academic Press / Novare
        tradition: classical
        url: "https://classicalacademicpress.com/products/physical-science-program-1"
        notes: Classical Christian, mastery-based. The Memoria Press recommendation for grade 8 (https://www.memoriapress.com/curriculum/science/novare-physical-science/).
      - name: "REAL Science Odyssey: Chemistry 1 / Physics 1"
        publisher: Pandia Press
        tradition: secular
        url: "https://pandiapress.com/products/real-science-odyssey-chemistry-level-one"
        notes: Lab-heavy secular option.
      - name: Intro to Physics and Chemistry (online)
        publisher: Kolbe Academy
        tradition: catholic
        url: "https://courses.kolbe.org/"
        notes: Catholic online option.
    historicalPrecedent: >-
      Faraday gave the Candle lectures at the Royal Institution's Christmas Lectures for young people in
      1848 and 1860. Hillsdale K-12 names Faraday among the scientists studied in the middle grades.
    sources:
      - { label: "Hillsdale K-12 Curriculum Overview", url: "https://k12.hillsdale.edu/getmedia/2cb68a3e-9ca4-467d-9cfa-03f069335028/curriculum-overview_interactive__1.pdf" }

  - id: natural-science-08
    title: "Programming I: From Scratch to Python"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 12
    order: 8
    prerequisites: []
    related: []
    summary: >-
      Computational thinking for the future inventor. Begin with Scratch's block programming (loops,
      events, variables) through games and animations. Then move to Python and write real programs:
      calculators, text games, data from science experiments, and small automations. The student learns
      to break problems into steps, debug patiently, and make tools.
    objectives:
      - Build interactive Scratch projects using loops, conditionals and variables
      - Write Python programs with functions, lists, dictionaries and files
      - Use Python to record and graph data from a science experiment
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 60, note: "~80 lessons x 45 min: Scratch tutorials, then Python Crash Course chapters on functions, lists, dictionaries and files" }
        - { kind: project, hours: 40, note: "Scratch games and animations, then Python programs (calculator, text game, graph of experiment data), ~50 x 45 min" }
    curriculumOptions:
      - name: Scratch
        publisher: MIT Media Lab
        tradition: secular
        url: "https://scratch.mit.edu/"
        notes: Free. Ideal first language at 10.
      - name: "Python Crash Course, 3rd ed. (Eric Matthes)"
        publisher: No Starch Press
        tradition: secular
        url: "https://nostarch.com/python-crash-course-3rd-edition"
        notes: Project-based introduction, good for a motivated 11–12 year old.
      - name: "Think Python, 3rd ed. (Allen Downey)"
        publisher: Green Tea Press
        tradition: secular
        url: "https://greenteapress.com/wp/think-python-3rd-edition/"
        notes: Free online. More conceptual, teaches thinking like a computer scientist.
      - name: "Automate the Boring Stuff with Python (Al Sweigart)"
        publisher: No Starch Press
        tradition: secular
        url: "https://automatetheboringstuff.com/"
        notes: Free online. Practical scripts for real tasks.
    historicalPrecedent: >-
      Boole's Laws of Thought (1854) joined logic and algebra, and his algebra later became the basis of
      digital circuits. The founders' ideal of the practical inventor (Franklin's stove and lightning
      rod, Jefferson's polygraph and plow) is today served by programming.
    notes: Keep screen time purposeful and bounded. Programming is making, not consuming.

  - id: natural-science-09
    title: "Life Science & Linnaean Classification"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10.5
    ageEnd: 11.5
    order: 9
    prerequisites: [natural-science-06]
    related: []
    summary: >-
      Cells and the microscope, the classification of living things, plants, animals, ecology and the
      basics of heredity. Students learn binomial nomenclature from its inventor, Linnaeus, a devout
      naturalist who saw classification as reading the order of creation. They prepare microscope
      slides and dissect a flower.
    objectives:
      - Use a compound microscope and prepare wet-mount slides
      - Classify organisms using kingdom-to-species taxonomy and binomial names
      - Dissect a flower and label its parts and describe plant and animal cells
    workload:
      readingHours: 2
      readingBasis: "Species Plantarum is a Latin catalog, consulted rather than read: ~20 pp of genus entries with a parent at ~10 pp/h (the reading load counts ~400 pp)"
      work:
        - { kind: exercises, hours: 55, note: "life-science lessons (e.g. Novare) on cells, classification, plants, animals, ecology and heredity, 36 wk x 2 x 45 min" }
        - { kind: lab, hours: 25, note: "microscope work, wet-mount slides and flower dissection, ~25 x 1 h" }
        - { kind: writing, hours: 8, note: "lab write-ups and labeled drawings, ~25 x 20 min" }
    coreTexts:
      - title: "Species Plantarum (Latin)"
        kind: primary
        reader: together
        pages: 1200
        role: selections
        author: Carl Linnaeus
        date: "1753"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/20771" }
    curriculumOptions:
      - name: Life Science (Novare)
        publisher: Classical Academic Press / Novare
        tradition: classical
        url: "https://classicalacademicpress.com/products/novare-life-science"
        notes: Classical Christian middle-school life science.
      - name: Life Science
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/life-science/"
        notes: Catholic middle-school option.
      - name: "REAL Science Odyssey: Biology Level 2"
        publisher: Pandia Press
        tradition: secular
        url: "https://pandiapress.com/products/real-science-odyssey-biology-level-two"
        notes: Rigorous secular middle-school biology with labs.
    notes: Latin students can read Linnaeus's genus and species descriptions directly (links well with the Latin track).

  - id: natural-science-10
    title: "Electronics & Making: Franklin's Workshop"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 13
    order: 10
    prerequisites: [natural-science-07, natural-science-08]
    related: []
    summary: >-
      Hands-on electricity and engineering in Franklin's tradition. Students repeat Franklin's Leyden-jar
      and static experiments, then build circuits on a breadboard (resistors, capacitors, LEDs,
      transistors, logic gates), solder a small project, and program an Arduino microcontroller to sense
      and act on the world.
    objectives:
      - Measure voltage, current and resistance and apply Ohm's law
      - Build and debug breadboard circuits and solder a working kit
      - Program an Arduino to read a sensor and control an output
      - Read Franklin's letters on electricity and reproduce a safe static experiment
    workload:
      readingHours: 11
      readingBasis: "~167 pp of Franklin's letters on electricity (18th-c. prose) at ~15 pp/h"
      work:
        - { kind: lab, hours: 40, note: "Make: Electronics experiments on the breadboard, ~36 x 1 h, plus Franklin's static experiments (4 h)" }
        - { kind: project, hours: 25, note: "15 Arduino Starter Kit builds x 1.5 h and a soldered kit (~3 h)" }
        - { kind: exercises, hours: 6, note: "Ohm's law and circuit calculations, ~8 x 45 min" }
    coreTexts:
      - title: Experiments and Observations on Electricity, made at Philadelphia in America
        kind: primary
        reader: student
        pages: 496
        role: selections
        author: Benjamin Franklin
        date: "1751"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/b30783471" }
      - title: "The Kite Experiment (Franklin to Collinson, Oct. 1752)"
        kind: primary
        reader: student
        pages: 2
        author: Benjamin Franklin
        date: "1752"
        publicDomain: true
        links:
          - { label: Founders Online, url: "https://founders.archives.gov/documents/Franklin/01-04-02-0138" }
    curriculumOptions:
      - name: "Make: Electronics, 3rd ed. (Charles Platt)"
        publisher: Make Community
        tradition: secular
        url: "https://www.makershed.com/products/make-electronics-3rd-edition-print"
        notes: Learning by discovery with matching component packs.
      - name: Arduino Starter Kit
        publisher: Arduino
        tradition: secular
        url: "https://store.arduino.cc/products/arduino-starter-kit-multi-language"
        notes: Official kit with a project book of 15 builds.
    historicalPrecedent: >-
      Franklin's electrical experiments (1746–1752), published in London as Experiments and
      Observations on Electricity, made him the most famous American scientist in Europe and won him
      the Royal Society's Copley Medal (1753).
    notes: Never attempt the kite experiment. Franklin was lucky, and others were killed repeating it. Teach mains-voltage safety explicitly.

  - id: natural-science-11
    title: Human Anatomy, Physiology & First Aid
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 13
    order: 11
    prerequisites: [natural-science-09]
    related: []
    summary: >-
      The body's systems (skeletal, muscular, circulatory, respiratory, digestive, nervous, endocrine,
      reproductive) studied with models, drawings and dissection. The course is paired with certified
      first aid and CPR training. A future leader should be able to act calmly in an emergency and care
      for his own health.
    objectives:
      - Name and explain the function of the major organs and systems
      - Draw and label the skeleton, heart and major vessels from memory
      - Earn a first-aid/CPR/AED certification
    workload:
      readingHours: 11
      readingBasis: "336 pp of Macaulay's The Way We Work (illustrated) at ~30 pp/h; Gray's Anatomy is reference only"
      work:
        - { kind: exercises, hours: 55, note: "lessons on the body's systems with models and labeled drawings, 36 wk x 2 x 45 min" }
        - { kind: lab, hours: 9, note: "dissections (heart, eye, kidney and others), ~6 x 1.5 h" }
        - { kind: memorization, hours: 8, note: "skeleton, heart and major vessels drawn and labeled from memory" }
        - { kind: practice, hours: 10, note: "Red Cross first-aid/CPR/AED certification (~6 h) plus first-aid drills" }
    coreTexts:
      - title: Anatomy of the Human Body (Gray's Anatomy)
        kind: instructional
        reader: student
        pages: 1400
        role: reference
        author: Henry Gray
        date: "1918 (20th ed.)"
        publicDomain: true
        links:
          - { label: Bartleby.com, url: "https://www.bartleby.com/107/" }
      - title: The Way We Work
        kind: secondary
