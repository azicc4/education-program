track: natural-science
title: Natural Science
trackGroup: Math & Science
description: >-
  Natural science is taught as natural philosophy: first loving attention to the created world, then
  disciplined experiment, then the great primary sources in which modern science was born. It begins
  with outdoor play, gardening, animals and collecting (0–6). Charlotte Mason–style nature study with
  Comstock, Burgess and Fabre, plus naked-eye astronomy, follows (6–10). Middle years bring hands-on
  physical and life science, Faraday's Candle, electronics and a first programming language (10–12).
  An accelerated high-school sequence runs from 12 to 16: anatomy and first aid, biology (Mendel and a
  critical reading of Darwin with Humani Generis), conceptual physics, chemistry with Lavoisier and
  Dalton, the astronomy of Ptolemy, Copernicus, Kepler and Galileo, algorithms, and calculus-based
  physics read beside Newton. A philosophy-of-science unit (Duhem, Jaki) shows the Christian roots of
  science. College (17–18) is a St. John's/Thomas Aquinas College natural-philosophy seminar and
  laboratory. End state: a Franklin-style natural philosopher and practical inventor. The student
  observes precisely, designs experiments, reasons mathematically about nature, writes code and builds
  circuits, reads the founders of science in their own words, and understands how faith and reason
  bear on scientific claims.
rows:
  - id: natural-science-01
    title: Outdoor Exploration & Sensory Nature Play
    type: practice
    level: early-5
    stage: early-development
    ageStart: 0
    ageEnd: 4
    order: 1
    prerequisites: []
    related: []
    summary: >-
      Daily unstructured time outdoors (grass, water, mud, sand, leaves, wind, weather) with an adult who
      names what the child sees and wonders aloud. Contact with nature in childhood is associated with
      better attention, mood, physical activity and motor development. Free play is the foundation of
      scientific curiosity.
    objectives:
      - Spend time outdoors every day in all reasonable weather
      - Handle natural materials and observe animals, plants and weather with an adult naming them
      - Ask and be asked "what do you notice?" and "what do you wonder?"
    sources:
      - { label: "Chawla (2015), Benefits of Nature Contact for Children", url: "https://doi.org/10.1177/0885412215595441" }
      - { label: "AAP (2018), The Power of Play", url: "https://doi.org/10.1542/peds.2018-2058" }
    notes: Supervise water play closely. Teach "look, don't touch" for unknown plants, fungi and insects.

  - id: natural-science-02
    title: Gardening & Caring for Animals
    type: practice
    level: early-5
    stage: early-development
    ageStart: 2
    ageEnd: 6
    order: 2
    prerequisites: [natural-science-01]
    related: []
    summary: >-
      A child-sized garden plot, seeds sprouting on the windowsill, and responsibility for a pet or
      backyard animals (chickens, fish, a caterpillar-to-butterfly kit). These teach life cycles,
      patience, cause and effect, and stewardship, and give children real work that matters.
    objectives:
      - Plant, water and harvest a simple crop (beans, radishes, sunflowers)
      - Observe a life cycle (butterfly, frog, chick) from start to finish
      - Feed and care for an animal on a daily routine
    curriculumOptions:
      - name: "Onions in My Boots: Basic Gardening for Young Sprouts"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/onions-in-my-boots-basic-gardening-for-young-sprouts/"
        notes: Simple, faith-friendly children's gardening guide.
    sources:
      - { label: "Chawla (2015), Benefits of Nature Contact for Children", url: "https://doi.org/10.1177/0885412215595441" }

  - id: natural-science-03
    title: Collecting, Sky-Watching & First Experiments
    type: practice
    level: early-5
    stage: early-development
    ageStart: 4
    ageEnd: 6
    order: 3
    prerequisites: [natural-science-01]
    related: []
    summary: >-
      Collections of rocks, shells, leaves and feathers, sorted and labeled. Watching the moon change
      and finding the Big Dipper. Simple kitchen experiments (sink/float, melting, magnets, shadows)
      where the child predicts before trying. This is the seed of the scientific method: notice, guess,
      test, tell.
    objectives:
      - Build and sort a nature collection by observable properties
      - Track the moon's phases for a month on a simple chart
      - Make a prediction before a simple experiment and describe the result
    curriculumOptions:
      - name: "Behold and See K: Exploring Nature with Stories, Activities, and Nature Walks"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/behold-see-k-exploring-nature-with-stories-activities-and-nature-walks/"
        notes: Gentle Catholic kindergarten nature program.
      - name: Kindergarten Supplemental Science Enrichment Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/classical-core-curriculum/kindergarten-supplemental-science-enrichment-set/"
        notes: Read-aloud science picture books for the classical kindergarten.

  - id: natural-science-04
    title: "Nature Study I: Comstock, Burgess & the Nature Journal"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 8
    order: 4
    prerequisites: [natural-science-02, natural-science-03]
    related: []
    summary: >-
      Charlotte Mason–style nature study. There is a weekly nature walk, and the child keeps a nature
      journal of dated, labeled drawings of birds, trees, flowers, insects and weather. Comstock's
      Handbook of Nature Study guides the parent. Burgess's Bird Book and Animal Book are read aloud
      as living books that name and describe North American wildlife.
    objectives:
      - Identify 25 local birds, 15 trees and common wildflowers by sight
      - Keep a weekly illustrated nature journal with dates, places and observations
      - Narrate a Burgess chapter and connect it to animals seen outdoors
    workload:
      readingHours: 20
      readingBasis: "599 pp read aloud (the two Burgess books) at ~28 pp/h; Comstock is the parent's reference and not counted"
      work:
        - { kind: lab, hours: 55, note: "field observation on the weekly nature walk, 72 x 45 min" }
        - { kind: writing, hours: 25, note: "weekly nature-journal entry of dated, labeled drawings, 72 x 20 min" }
        - { kind: discussion, hours: 8, note: "narration of Burgess chapters tied to animals seen outdoors, ~90 x 5 min" }
    coreTexts:
      - title: Handbook of Nature Study
        kind: instructional
        reader: teacher
        pages: 938
        role: reference
        author: Anna Botsford Comstock
        date: "1911"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/78142" }
          - { label: Archive.org, url: "https://archive.org/details/handbookofnature00coms" }
      - title: The Burgess Bird Book for Children
        kind: secondary
        reader: together
        pages: 236
        author: Thornton W. Burgess
        date: "1919"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/3074" }
      - title: The Burgess Animal Book for Children
        kind: secondary
        reader: together
        pages: 363
        author: Thornton W. Burgess
        date: "1920"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/2441" }
    curriculumOptions:
      - name: The Book of Birds Set & My Nature Journal
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/science/the-book-of-birds-set/"
        notes: "Classical nature-study units. Pair with My Nature Journal (https://www.memoriapress.com/curriculum/science/my-nature-journal/)."
      - name: "Behold and See 3: Beginning Science"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/behold-and-see-3-beginning-science/"
        notes: Catholic elementary science with a nature-study flavor.
      - name: "REAL Science Odyssey: Biology 1"
        publisher: Pandia Press
        tradition: secular
        url: "https://pandiapress.com/pages/real-science-odyssey"
        notes: Hands-on secular elementary life science with lab sheets.
    historicalPrecedent: >-
      The Cornell nature-study movement (Liberty Hyde Bailey, Anna Comstock), active from the 1890s,
      put nature study into American schools. Charlotte Mason's Parents' Union Schools in England made
      the nature notebook a daily habit.

  - id: natural-science-05
    title: Naked-Eye Astronomy & Earth Science
    type: unit
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 10
    order: 5
    prerequisites: [natural-science-03]
    related: []
    summary: >-
      Learn the constellations, the motions of the sun, moon and planets, the seasons, and how to find
      north by Polaris, using only the eyes and a star chart. Earth science covers rocks and minerals,
      weather observation and recording, and landforms. The sky is where natural philosophy began, and
      these observations prepare for Ptolemy and Kepler later.
    objectives:
      - Identify 15+ constellations and 5 bright stars through the seasons
      - Explain day/night, the seasons and the moon's phases with a model
      - Keep a weather log and classify common rocks and minerals
    workload:
      readingHours: 4
      readingBasis: "72 pp of Rey's Find the Constellations read together at ~20 pp/h (diagram-heavy)"
      work:
        - { kind: exercises, hours: 12, note: "Book of Astronomy lessons and models of day, seasons and moon phases, ~24 x 30 min" }
        - { kind: lab, hours: 35, note: "~30 night-sky sessions x 45 min (22 h), a weather log ~100 days x 5 min (8 h), rock and mineral classification ~6 x 45 min (5 h)" }
    coreTexts:
      - title: Find the Constellations
        kind: instructional
        reader: together
        pages: 72
        author: H. A. Rey
        date: "1954"
        publicDomain: false
        links:
          - { label: HarperCollins, url: "https://www.harpercollins.com/products/find-the-constellations-h-a-rey" }
    curriculumOptions:
      - name: Book of Astronomy Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/science/book-astronomy/"
        notes: Constellations and star stories in the classical core.
      - name: "REAL Science Odyssey: Earth & Environment 1"
        publisher: Pandia Press
        tradition: secular
        url: "https://pandiapress.com/products/real-science-odyssey-earth-environment-1"
        notes: Hands-on elementary earth science.
      - name: Apologia Astronomy (Young Explorer series)
        publisher: Apologia
        tradition: protestant
        url: "https://www.apologia.com/shop/all-science/astronomy/"
        notes: Popular Christian elementary astronomy. It is written from a young-earth creationist perspective (see notes on biology-01).
    notes: A planisphere and a pair of 7×50 or 10×50 binoculars are the only equipment needed.

  - id: natural-science-06
    title: "Nature Study II: Fabre's Insects & Naturalist Observation"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 10
    order: 6
    prerequisites: [natural-science-04]
    related: []
    summary: >-
      Jean-Henri Fabre, the great French naturalist whom Darwin called "an inimitable observer," shows
      how patient watching becomes science. Children read Fabre's Book of Insects and The Life of the
      Spider, keep live insects for observation, and write naturalist's field notes. Fabre's
      Story-Book of Science introduces everyday physics and chemistry through dialogue.
    objectives:
      - Observe and record the behavior of a living insect over several weeks
      - Write field notes with measurements, sketches and questions
      - Narrate Fabre chapters and distinguish observation from inference
    workload:
      readingHours: 45
      readingBasis: "1,075 pp read aloud: Book of Insects 271 pp and Story-Book of Science 400 pp at ~25 pp/h (27 h), Life of the Spider 404 pp (Fabre's own text) at ~20 pp/h (20 h)"
      work:
        - { kind: lab, hours: 30, note: "keeping live insects and field observation, ~40 sessions x 45 min" }
        - { kind: writing, hours: 13, note: "naturalist's field notes with measurements and sketches, ~40 x 20 min" }
        - { kind: discussion, hours: 12, note: "narration of Fabre chapters, separating observation from inference, ~100 x 7 min" }
    coreTexts:
      - title: Fabre's Book of Insects
        kind: secondary
        reader: together
        pages: 271
        author: Jean-Henri Fabre (retold by Mrs. Rodolph Stawell)
        date: "1921"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/67000" }
      - title: The Life of the Spider
        kind: primary
        reader: together
        pages: 404
        author: Jean-Henri Fabre
        date: "1912 (Eng. trans.)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/1887" }
      - title: The Story-Book of Science
        kind: secondary
        reader: together
        pages: 400
        author: Jean-Henri Fabre
        date: "1917 (Eng. trans.)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/56795" }
    curriculumOptions:
      - name: The Book of Insects Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/science/book-insects/"
        notes: Classical insect study with drawing and memory work.
      - name: Handbook of Nature Study (print)
        publisher: Memoria Press
