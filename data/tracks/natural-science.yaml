        notes: Hands-on history-of-science course. Useful for younger siblings or as a lab supplement.
    historicalPrecedent: >-
      John Winthrop, Hollis Professor at Harvard (1738–1779), observed the 1761 and 1769 transits of
      Venus and taught Newtonian astronomy to John Adams's generation. Jefferson's Notes on the State of
