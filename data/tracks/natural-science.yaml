  - id: natural-science-18
    title: "Philosophy of Science & the Catholic Contribution (Duhem, Jaki)"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 18
    prerequisites: []
    related: [logic-08, biology-01, physics-02]
    summary: >-
      What is a scientific theory, and what can it prove? Students read Pierre Duhem, a Catholic
      physicist and historian who discovered the medieval roots of mechanics (Buridan, Oresme) and
      analyzed the structure of physical theory. They read Stanley Jaki, Benedictine priest and
      physicist, on why science was "stillborn" in other cultures and was born alive in Christian
      Europe. Then they compare Bacon's induction, Popper's falsification and Kuhn's paradigms.
    objectives:
      - Explain the Duhem thesis on testing hypotheses and the aim of physical theory
      - Summarize Jaki's argument about the Christian origins of science and its critics
      - Distinguish scientific, philosophical and theological claims in a given debate
    workload:
      readingHours: 17
      readingBasis: "344 pp of Duhem's Aim and Structure of Physical Theory at ~20 pp/h; Jaki, Bacon, Popper and Kuhn have no counted texts"
      work:
        - { kind: discussion, hours: 15, note: "Duhem thesis, Jaki and Bacon, Popper and Kuhn, ~20 x 45 min" }
        - { kind: writing, hours: 10, note: "two short papers, e.g. on the Duhem thesis and on the Christian-origins argument and its critics" }
    coreTexts:
      - title: The Aim and Structure of Physical Theory
        kind: primary
        reader: student
        pages: 344
        pace: long
        author: Pierre Duhem
        date: "1906 (trans. 1954)"
        publicDomain: false
        links:
          - { label: Princeton University Press, url: "https://press.princeton.edu/books/paperback/9780691025247/the-aim-and-structure-of-physical-theory" }
    curriculumOptions:
      - name: Stanley Jaki's books (The Savior of Science, Science and Creation, etc.)
        publisher: Real View Books
        tradition: catholic
        url: "https://www.realviewbooks.com/"
        notes: Publisher of Fr. Jaki's works.
      - name: "A New Natural Philosophy: Recovering a Natural Science and Christian Pedagogy"
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/products/a-new-natural-philosophy-recovering-a-natural-science-and-christian-pedagogy"
        notes: Classical Christian reflection on science education.
    notes: >-
      Present the "Christian origins" thesis as an argued historical position with serious scholarly
      critics, not as settled fact.

  - id: natural-science-19
    title: "College Seminar: Natural Philosophy & Laboratory (St. John's / TAC Model)"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 19
    prerequisites: [natural-science-18]
    related: [philosophy-14, chemistry-01, physics-02]
    summary: >-
      A great-books natural philosophy seminar joined to a laboratory, modeled on the St. John's College
      laboratory and the Thomas Aquinas College natural science sequence. Students read Aristotle's
      Physics (the nature of motion and cause), Archimedes on floating bodies, Galileo, Newton, Lavoisier,
      Faraday's Experimental Researches in Electricity, Maxwell's Treatise on Electricity and Magnetism,
      Mendel, and Einstein on relativity. Classic experiments are repeated at the bench. The goal is to
      see how modern science follows from, and departs from, Aristotelian natural philosophy.
    objectives:
      - Discuss Aristotle's definitions of nature, motion and cause in seminar
      - Repeat Faraday's induction experiments and follow Maxwell's path to the field equations
      - Write a senior essay on a question in natural philosophy
    workload:
      readingHours: 40
      readingBasis: "671 pp: Maxwell vol. 2 ~167 pp (mathematical) at ~8 pp/h (21 h), Einstein 168 pp at ~20 pp/h (8 h), Jefferson's Notes 336 pp at ~25 pp/h (13 h); the other seminar authors (Aristotle's Physics, Archimedes, Newton, Lavoisier, Faraday, Mendel) have no counted texts and are left out"
      work:
        - { kind: discussion, hours: 60, note: "great-books seminar, 30 wk x 2 h" }
        - { kind: lab, hours: 45, note: "weekly laboratory repeating classic experiments incl. Faraday's induction, 30 x 1.5 h" }
        - { kind: exercises, hours: 20, note: "following Maxwell's derivations toward the field equations, ~20 x 1 h" }
        - { kind: writing, hours: 30, note: "senior essay on a question in natural philosophy, research and revision" }
    coreTexts:
