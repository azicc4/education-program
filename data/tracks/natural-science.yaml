  - id: natural-science-20
    title: "College Computer Science: SICP & the Theory of Computation"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 20
    prerequisites: [natural-science-16]
    related: [mathematics-17, logic-07, philosophy-14]
    summary: >-
      The capstone of the computing strand, and a course in thinking rather than in tools. Structure and
      Interpretation of Computer Programs teaches abstraction, recursion, higher-order procedures, state
      and interpreters: how a language itself is built. The theory of computation (automata, formal
      languages, computability, and complexity including P vs NP) then asks what can be computed at all.
      Students read Turing's founding papers as primary sources: the 1936 paper on computable numbers and
      the 1950 "Computing Machinery and Intelligence", which opens the philosophical question of machine
      minds.
    objectives:
      - Work through SICP chapters 1–4, including writing a metacircular evaluator (an interpreter for Scheme in Scheme)
      - Prove results about finite automata, regular and context-free languages, and Turing machines
      - Explain the halting problem and reproduce Turing's diagonal argument
      - Define the classes P and NP and explain what NP-completeness means
      - Write a seminar essay on Turing's 1950 paper in the light of Aristotle and Aquinas on intellect
    workload:
      readingHours: 7
      readingBasis: "64 pp: Turing 1936 36 pp (mathematical) at ~6 pp/h (6 h), Turing 1950 28 pp at ~20 pp/h (1 h); SICP is a textbook and counted as exercises"
      work:
        - { kind: exercises, hours: 200, note: "SICP chs. 1–4 with the 6.001 lectures and problem sets incl. the metacircular evaluator (~120 h), then Sipser's theory of computation lectures and proof sets (~80 h)" }
        - { kind: writing, hours: 15, note: "seminar essay on Turing 1950 with Aristotle and Aquinas on intellect" }
    coreTexts:
      - title: Structure and Interpretation of Computer Programs (2nd ed.)
        kind: instructional
        reader: student
        pages: 660
        role: selections
        portion: "Chapters 1–4"
        pace: long
        author: Harold Abelson and Gerald Jay Sussman
        date: "1996"
        publicDomain: false
        links:
          - { label: "Free full text (CC BY-SA HTML edition)", url: "https://sarabander.github.io/sicp/" }
          - { label: "Free PDF (MIT)", url: "https://web.mit.edu/6.001/6.037/sicp.pdf" }
      - title: "On Computable Numbers, with an Application to the Entscheidungsproblem"
        kind: primary
        reader: student
        pages: 36
        author: Alan M. Turing
        date: "1936"
        publicDomain: false
        links:
          - { label: "PDF (University of Virginia course copy)", url: "https://www.cs.virginia.edu/~robins/Turing_Paper_1936.pdf" }
      - title: Computing Machinery and Intelligence
        kind: primary
        reader: student
        pages: 28
        author: Alan M. Turing
        date: "1950"
        publicDomain: false
        links:
          - { label: "PDF (UMBC course copy)", url: "https://redirect.cs.umbc.edu/courses/471/papers/turing.pdf" }
    curriculumOptions:
      - name: "6.001 Structure and Interpretation of Computer Programs"
        publisher: MIT OpenCourseWare
        tradition: secular
        url: "https://ocw.mit.edu/courses/6-001-structure-and-interpretation-of-computer-programs-spring-2005/"
        notes: "The original MIT course built on SICP, with lecture notes and problem sets. Free."
      - name: "18.404J Theory of Computation (Sipser)"
        publisher: MIT OpenCourseWare
        tradition: secular
        url: "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/"
        notes: "Michael Sipser's own course, with full video lectures. It follows his textbook Introduction to the Theory of Computation."
      - name: How to Design Programs (2nd ed.)
        publisher: MIT Press / free online
        tradition: secular
        url: "https://htdp.org/"
        notes: "A gentler alternative or bridge to SICP, with the same design-first philosophy. The full text is free online."
    historicalPrecedent: >-
      Leibniz, a hero of 18th-century learning, dreamed of a calculus ratiocinator that would settle disputes by
      calculation. Babbage and Ada Lovelace's Analytical Engine (1830s–40s) made the dream mechanical.
      Turing's 1936 paper answered Hilbert's decision problem and defined the modern computer in the same stroke.
    notes: >-
      Added by family decision as the college-level completion of the programming strand. The texts are
      copyrighted but freely available from the authors or their institutions. Turing's 1950 paper pairs
      well with the philosophy of mind in philosophy-14 and with Aquinas on the immateriality of the intellect.
