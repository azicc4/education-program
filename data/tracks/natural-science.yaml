      From programmer to computer scientist: Harvard's CS50 (C, Python, SQL, web), then algorithms and
      data structures (sorting, searching, recursion, graphs, dynamic programming, complexity)
      practiced through the USA Computing Olympiad. Strong students read CLRS and SICP. They build a
      substantial project, such as a tool, a simulation or a scientific-data pipeline.
