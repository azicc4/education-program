  - id: natural-science-15
    title: "Astronomy: Ptolemy, Copernicus, Kepler & Galileo"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 15
    prerequisites: [natural-science-05]
    related: [physics-01]
    summary: >-
      The St. John's approach to the Scientific Revolution. Students work through the geocentric models
      of Ptolemy's Almagest, Copernicus's heliocentric alternative (Book I of De Revolutionibus),
      Kepler's discovery of elliptical orbits in the Astronomia Nova, and Galileo's telescopic
      discoveries in the Starry Messenger. They make their own observations with a small telescope
      and ask what counts as evidence for a cosmology.
    objectives:
      - Model retrograde motion with epicycles and with a heliocentric system
      - Follow Kepler's reasoning to the ellipse and state his three laws
      - Observe Jupiter's moons and the phases of Venus and record them as Galileo did
      - Assess the Galileo affair historically and fairly
    workload:
      readingHours: 9
      readingBasis: "134 pp of Galileo, Copernicus Book I and Winthrop at ~15 pp/h; the Green Lion Ptolemy and Kepler selections are worked as exercises"
      work:
        - { kind: exercises, hours: 30, note: "working through the Almagest and Astronomia Nova selections, epicycle and heliocentric models, and Kepler's laws, ~30 x 1 h" }
        - { kind: lab, hours: 12, note: "telescope observation of Jupiter's moons and the phases of Venus, logged as Galileo did, ~12 x 1 h" }
        - { kind: discussion, hours: 5, note: "what counts as evidence for a cosmology, ~6 x 45 min" }
        - { kind: writing, hours: 5, note: "a short historical essay on the Galileo affair" }
    coreTexts:
      - title: The Sidereal Messenger (Sidereus Nuncius)
        kind: primary
        reader: student
        pages: 50
