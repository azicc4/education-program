  - id: economics-10
    title: "College Principles of Microeconomics and Macroeconomics"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 10
    prerequisites: [economics-09, economics-05]
    related: [mathematics-18, mathematics-16]
    summary: >-
      A college-level principles sequence, with calculus where helpful. Microeconomics covers consumer
      and producer theory, market structures, externalities, public goods and game theory. Macroeconomics
      covers national accounts, money and banking, the Federal Reserve, growth, unemployment and
      inflation, and fiscal and monetary policy, with Keynesian, monetarist and Austrian views presented
      fairly. Investing matures with Graham's The Intelligent Investor. The capstone is a policy paper
      that uses real data.
    objectives:
      - Solve standard micro problems (elasticity, consumer surplus, profit maximization, monopoly pricing)
      - Explain GDP, the money multiplier, and how the Federal Reserve conducts monetary policy
      - Compare Keynesian, monetarist and Austrian accounts of the business cycle
      - Apply Graham's margin-of-safety principle to evaluate a company's financial statements
      - Write a data-driven policy paper of 3,000 words
