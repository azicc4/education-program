        publisher: Pontifical Council for Justice and Peace
        tradition: catholic
        url: "https://www.vatican.va/roman_curia/pontifical_councils/justpeace/documents/rc_pc_justpeace_doc_20060526_compendio-dott-soc_en.html"
        notes: The official synthesis; use chapters 4 (principles) and 7 (economic life) as the reference text.
      - name: "TAN Academy: An Introduction to Economics"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/tan-academy-an-introduction-to-economics/"
    notes: >-
      A Catholic/Protestant note. Protestant readers approach the same questions through the Reformed idea
      of vocation and "sphere sovereignty" (Kuyper, Lectures on Calvinism) and Weber's thesis on the
      Protestant ethic. The Catholic encyclicals are more explicit about the just wage and the state's
      subsidiary role. Catholic thinkers themselves disagree about how far Centesimus Annus endorses market
      economies versus distributism.

  - id: economics-08
    title: "Classical Political Economy and Its Critics: Say, Ricardo, Mill and Marx"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 8
    prerequisites: [economics-06]
    related: [philosophy-11, philosophy-12]
    summary: >-
      The nineteenth-century debate that shaped modern politics. Say's Treatise gives his "law of markets";
      Jefferson recommended it alongside Smith as shorter and clearer. Ricardo's Principles gives comparative advantage, rent, and the labor theory
      of value. Mill's Principles of Political Economy is the Victorian synthesis, with its distinction
      between the laws of production and the laws of distribution. Marx's Communist Manifesto and selections
      from Capital are read critically as the great challenge to the whole tradition, and his errors about
      value, class and history are traced to their historical consequences.
    objectives:
      - State Say's law and Ricardo's theory of comparative advantage with a numerical example
      - Explain the labor theory of value and why the marginal revolution replaced it
      - Summarize Mill on production versus distribution and on the stationary state
      - Explain Marx's theory of surplus value and class struggle and give the main economic and moral objections to it
    coreTexts:
      - title: A Treatise on Political Economy
        reader: student
        pages: 488
        author: Jean-Baptiste Say
        date: "1803"
        publicDomain: true
        links:
          - { label: Archive.org (1821 English ed.), url: "https://archive.org/details/treatiseonpoliti01sayjuoft" }
      - title: On the Principles of Political Economy and Taxation
        reader: student
        pages: 450
        author: David Ricardo
        date: "1817"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/33310" }
      - title: Principles of Political Economy
        reader: student
        pages: 1000
        author: John Stuart Mill
        date: "1848"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/30107" }
      - title: The Communist Manifesto
        reader: student
        pages: 38
        author: Karl Marx and Friedrich Engels
        date: "1848"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/61" }
      - title: "Capital, Volume One (selections)"
        reader: student
        pages: 1100
        author: Karl Marx
        date: "1867"
        publicDomain: true
        links:
          - { label: Marxists Internet Archive, url: "https://www.marxists.org/archive/marx/works/1867-c1/" }
      - title: "The Marx-Engels Reader (2nd ed.)"
        reader: student
        pages: 788
        author: Karl Marx and Friedrich Engels; Robert C. Tucker (ed.)
        date: "1972; 2nd ed. 1978"
        publicDomain: false
        links:
          - { label: W. W. Norton, url: "https://wwnorton.com/books/9780393090406" }
      - title: The National System of Political Economy
        reader: student
        pages: 414
        author: Friedrich List (trans. Sampson S. Lloyd)
        date: "1841; Eng. 1885"
        publicDomain: true
        links:
          - { label: "Archive.org (1904 ed.)", url: "https://archive.org/details/nationalsystemp01nichgoog" }
      - title: "The Conquest of Bread (elective)"
        reader: student
        pages: 299
        author: Peter Kropotkin
        date: "1892"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/23428" }
    curriculumOptions:
      - name: "Marxism, Socialism, and Communism (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/marxism-socialism-communism"
    historicalPrecedent: >-
      In 1819, at thirteen, John Stuart Mill was taken by his father through "a complete course of
      political economy," with Ricardo's newly published Principles read and summarized on their daily
      walks. Mill describes it in his Autobiography, the classic account of an accelerated classical
      education.
      Jefferson wrote to John Norvell in 1807 that Smith's Wealth of Nations is the best book "unless
      Say's Political economy can be had, which treats the same subjects on the same principles, but in a
      shorter compass & more lucid manner."
    sources:
      - { label: "J. S. Mill, Autobiography (Project Gutenberg)", url: "https://www.gutenberg.org/ebooks/10378" }
      - { label: "Jefferson to John Norvell, 11 June 1807 (Founders Online)", url: "https://founders.archives.gov/documents/Jefferson/99-01-02-5737" }
      - { label: "Hamilton, Final Version of the Report on the Subject of Manufactures, 5 December 1791 (Founders Online)", url: "https://founders.archives.gov/documents/Hamilton/01-10-02-0001-0007" }
    notes: >-
      Three critics of the free-trade market are read against Smith and Ricardo. Friedrich List
      lived in Pennsylvania from 1825 to about 1832, wrote Outlines of American Political Economy
      (1827) for the American protectionists, and drew on Hamilton's Report on Manufactures (1791)
      and the "American School" (Daniel Raymond, Mathew Carey, and Henry Clay's American System).
      His National System argues for protecting infant industries until a nation can compete, and
      should be read beside Hamilton's Report (linked under sources) as the founders' own
      alternative to laissez-faire. Marx is read critically through Tucker's Marx-Engels Reader,
      which contains the Manifesto and the key selections from Capital and can replace the
      separate texts above. Kropotkin's Conquest of Bread is an elective statement of anarchist
      communism, read as a critic of both the market and the state; the student should test its
      picture of voluntary cooperation against Aristotle on property (Politics II) and Leo XIII's
      Rerum Novarum (economics-07).

  - id: economics-09
    title: "Twentieth-Century Economics: Hayek, Röpke and Sowell"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 9
    prerequisites: [economics-08, economics-07]
    related: [civics-law-12]
    summary: >-
      This course reads the twentieth-century arguments about planning, knowledge and the humane economy.
      Hayek's "The Use of Knowledge in Society" (1945) argues that prices convey dispersed knowledge no
      planner can gather, and The Road to Serfdom (1944) argues that central planning leads to tyranny.
      Röpke's A Humane Economy (1960) is the German ordoliberal and Christian case for a market "beyond
      supply and demand," rooted in family, property and community. Sowell's Basic Economics serves as a
      comprehensive, jargon-free reference. Keynes's ideas are presented fairly through the course
      lectures and the college principles course.
    objectives:
      - Explain Hayek's knowledge problem and its bearing on central planning
      - Summarize the argument of The Road to Serfdom and its reception
      - Explain Röpke's claim that the market depends on moral and social preconditions it cannot produce itself
      - Use Sowell's framework to analyze three current policy debates (housing, minimum wage, trade)
    coreTexts:
