      Core texts are required; choose 2 of the electives (The Warden and Barchester Towers may be taken as a
      pair). Newman's Apologia and Idea of a University are core because they define the liberal education this
      program aims at. Catholic/Protestant note. Newman (now St. John Henry Newman) left the Church of England for Rome in 1845.
      The Apologia is his defense of that conversion against Charles Kingsley, and Loss and Gain fictionalizes
      it. Protestant readers can read him as the great apologist for dogmatic Christianity against liberalism, a
      cause shared across traditions. George Eliot had lost her evangelical faith; Middlemarch is the humanist
      counterpoint.

  - id: literature-24
