      Chesterton's Orthodoxy, The Everlasting Man, The Man Who Was Thursday and the Father Brown stories;
      Belloc's The Path to Rome; and Eliot's The Waste Land as the modernist crisis to which the Catholic
      revival answered. Kipling's Kim (read earlier) is revisited as imperial literature.
