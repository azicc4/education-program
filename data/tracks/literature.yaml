  # ───────────── American literature ─────────────
  - id: literature-27
    title: "American Literature I: Founding to the American Renaissance"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.25
    ageEnd: 15.5
    order: 27
    prerequisites: [literature-12, literature-14]
    related: []
    exams: [ap-english-literature]
    summary: >-
      American letters from Franklin to Melville. The course reads the later parts of Franklin's Autobiography,
      Irving's Sketch-Book, Cooper's Deerslayer, Poe's tales and poems, Hawthorne's Scarlet Letter, Melville's Moby-Dick,
      Emerson's Essays, Thoreau's Walden and "Civil Disobedience", and Douglass's Narrative. The questions are
      what is American about American literature, and how Puritan, Enlightenment and Romantic strands
      interweave.
    objectives:
      - Read Moby-Dick complete and discuss its cosmology, its Ahab and its Ishmael
      - Contrast Hawthorne's Puritan conscience with Emerson's self-reliance
      - Analyze Douglass's Narrative as rhetoric and as an argument from natural rights
      - Write a thesis-driven essay on an American Renaissance text
