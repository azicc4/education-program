    curriculumOptions:
      - name: The Lion, the Witch and the Wardrobe Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/literature-and-poetry/fourth/the-lion-the-witch-and-the-wardrobe-set/"
        notes: Student and teacher guides for the first Narnia book.
      - name: Dangerous Journey Set (Pilgrim's Progress retold)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/literature-and-poetry/third/dangerous-journey-set/"
        notes: Uses Dangerous Journey, an illustrated abridgement in Bunyan's own words, with a study guide.
      - name: Little Pilgrim's Progress (Illustrated Edition)
        publisher: Moody Publishers
        tradition: protestant
        url: "https://www.moodypublishers.com/little-pilgrims-progress-the-illustrated-edition"
        notes: The standard evangelical children's retelling, with Joe Sutphin's illustrations.
    notes: >-
      Catholic/Protestant note. Bunyan was a Puritan Baptist preacher, and the allegory reflects Reformed
      conversion theology (justification received as a crisis, the burden falling off at the Cross). Catholic
      readers have long loved the book, and Chesterton and Knox both admired it. A Catholic teacher may point out
      that the pilgrimage also images the lifelong cooperation of grace and works. Lewis was an Anglican whose
      "mere Christianity" is shared ground for both traditions.

  - id: literature-04
    title: "Greek & Norse Myths for Children"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 8.5
    order: 4
    prerequisites: [literature-01]
    related: []
    summary: >-
      The gods and heroes of Greece and the North, read in the classic children's versions. The D'Aulaires'
      books are the modern standard, and Hawthorne's and Kingsley's Victorian retellings supply richer prose.
      Myth is the grammar of Western allusion. Without it, Milton, Shakespeare and the poets cannot be read.
    objectives:
      - Name the Olympians, their attributes and their Roman names
      - Retell the labors of Heracles and the stories of Perseus, Theseus and Jason
      - Recognize mythological allusions in everyday language (panic, echo, Achilles' heel)
      - Contrast the Greek gods with the God of Scripture
    workload:
      readingHours: 45
      readingBasis: "1,234 pp read aloud at ~27 pp/h (D'Aulaires, Hawthorne, Kingsley, Colum)"
      work:
        - { kind: exercises, hours: 10, note: "Memoria Press D'Aulaires guide, 30 lessons x 20 min (facts, vocabulary, comprehension)" }
        - { kind: memorization, hours: 5, note: "Olympians, attributes and Roman names by flashcard, ~30 x 10 min" }
        - { kind: discussion, hours: 14, note: "narration of the hero tales and Greek gods vs God of Scripture, 54 weeks x 15 min" }
    coreTexts:
