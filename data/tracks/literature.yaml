      Spenser's Faerie Queene Book I, Marlowe's Doctor Faustus, Bacon's Essays and the King James Bible as English
      prose, then Milton's Paradise Lost complete. The prose of Walton, Browne and Bunyan round out the term. This
      is the age in which English became a great literary language. The metaphysical poets (Donne, Herbert) are
      read alongside in the poetry track.
