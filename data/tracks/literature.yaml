  - id: literature-10
    title: "What the Founders & Lincoln Read"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 9.5
    ageEnd: 11
    order: 10
    prerequisites: [literature-03, literature-07]
    related: [poetry-05, history-23]
    summary: >-
      A unit built on the actual boyhood reading of Franklin, Washington's generation and Lincoln. It covers the
      King James Bible, Bunyan's Pilgrim's Progress in full, Plutarch's Lives, Weems' Life of Washington,
      Franklin's Autobiography, Robinson Crusoe and Addison's Cato. The student reads the books that formed
      the men who founded and preserved the republic, and learns why those men valued them.
    objectives:
      - Read Pilgrim's Progress (Part I) complete in Bunyan's text
      - Read at least six of Plutarch's Lives (Lycurgus, Solon, Themistocles, Cato the Younger, Cicero, Caesar)
      - Read Franklin's Autobiography Part I, noting the books Franklin names and his method of imitating the Spectator
      - Distinguish legend (Weems' cherry tree) from history, and explain why Weems wrote as he did
      - Memorize a speech from Addison's Cato (e.g. "'Tis not in mortals to command success")
    workload:
      readingHours: 100
      readingBasis: "1,690 pp read by the student: KJV Bible selections (~770 pp) at ~15 pp/h (51 h), Bunyan Part I, White's Plutarch and Cato (640 pp) at ~16 pp/h (38 h), Weems and Franklin (280 pp) at ~25 pp/h (11 h)"
      work:
        - { kind: discussion, hours: 25, note: "weekly discussion of the Lives, Weems vs history, and Franklin's reading, 54 x 30 min" }
        - { kind: memorization, hours: 3, note: "one speech from Addison's Cato" }
      electiveHours: 30
      electiveBasis: "the remaining Old Testament books: Chronicles, Ezra, Nehemiah, Esther, the Song of Solomon, Jeremiah, Lamentations, Ezekiel and the Minor Prophets (~430 pp, ~29 h)"
