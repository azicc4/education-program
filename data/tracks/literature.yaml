  - id: literature-03
    title: "Pilgrim's Progress, Narnia & the Christian Imagination"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 9
    order: 3
    prerequisites: [literature-02]
    related: []
    summary: >-
      Christian allegory and fantasy for young readers. The course reads Bunyan's Pilgrim's Progress in a
      children's retelling, Lewis's seven Chronicles of Narnia, and MacDonald's Curdie books. The child learns to
      read a story on two levels (literal and allegorical), which is the foundation for Spenser, Dante and
      Bunyan in full later.
    objectives:
      - Identify allegorical figures (Christian, Evangelist, Giant Despair; Aslan) and what they signify
      - Retell the journey structure of Pilgrim's Progress from the City of Destruction to the Celestial City
      - Read all seven Narnia books, at least the later ones independently
      - Connect episodes to Scripture stories already known
    workload:
      readingHours: 50
      readingBasis: "1,202 pp read aloud or, for the later Narnia books, read by the child: dense one-volume Narnia (768 pp), Little Pilgrim's Progress and Curdie at ~25 pp/h"
      work:
        - { kind: discussion, hours: 18, note: "narration and allegory/Scripture discussion, 72 weeks x 15 min" }
        - { kind: exercises, hours: 5, note: "Memoria Press Lion, Witch and Wardrobe or Dangerous Journey guide questions if used, ~20 lessons x 15 min" }
    coreTexts:
      - title: Little Pilgrim's Progress
