      The first plays read in full: A Midsummer Night's Dream, then Twelfth Night, As You Like It, Much Ado
      About Nothing and The Comedy of Errors. The student reads aloud in parts, memorizes speeches, and stages
      scenes. Comedy teaches the conventions of Shakespeare's stage and verse (blank verse, prose, song) in the
      most forgiving form.
