  - id: literature-06
    title: "Tales from Shakespeare & Spenser"
    type: unit
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 9
    order: 6
    prerequisites: [literature-02]
    related: [poetry-03]
    summary: >-
      A bridge to Shakespeare and the Renaissance. The student reads the Lambs' prose Tales from Shakespeare
      and Jean Lang's Faerie Queene stories, and memorizes short passages in Shakespeare's own words, following
      Ken Ludwig's method. The plots and people become familiar years before the plays are studied.
    objectives:
      - Retell the plots of at least eight plays (e.g. The Tempest, Midsummer, Macbeth, Lear)
      - Memorize and recite three short Shakespeare passages (e.g. "I know a bank where the wild thyme blows")
      - Retell the Redcrosse Knight's quest from Faerie Queene Book I
      - Watch or attend one live or filmed family-friendly production
    workload:
      readingHours: 20
      readingBasis: "497 pp read together: Lambs' Tales (320 pp) and Jean Lang's Faerie Queene stories (94 pp) at ~25 pp/h (17 h), Midsummer passages (~83 pp) at ~20 pp/h (4 h); Ludwig's 368-pp method book is parent preparation and not counted"
      work:
        - { kind: memorization, hours: 12, note: "three or more Shakespeare passages by Ludwig's method, 36 weeks x 2 x 10 min" }
        - { kind: discussion, hours: 9, note: "retelling the plots of eight plays and the Redcrosse quest, 36 x 15 min" }
        - { kind: project, hours: 3, note: "one live or filmed family-friendly production" }
    coreTexts:
      - title: Tales from Shakespeare
        kind: secondary
        reader: together
        pages: 320
        author: Charles & Mary Lamb
        date: "1807"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/573" }
      - title: How to Teach Your Children Shakespeare
        kind: instructional
        reader: teacher
        pages: 368
        lessons: 9
        lessonLabel: chapter
        lessonsNote: "Open Library table of contents: 9 play chapters, A Midsummer Night's Dream to The Tempest, plus 2 interludes and 5 appendices"
        author: Ken Ludwig
        date: "2013"
