      - { label: "C. S. Lewis, A Preface to Paradise Lost (Memoria Press)", url: "https://www.memoriapress.com/curriculum/educational-resources/preface-paradise-lost/" }
    notes: >-
      Core texts are required; choose 2 of the electives. Core is Spenser, Bacon (whom the founders read for
      counsel on statecraft) and Paradise Lost complete. Catholic/Protestant note. Milton was a Puritan republican whose De Doctrina Christiana held heterodox views
      (anti-trinitarian leanings, mortalism) that most Protestants also reject. Paradise Lost itself is broadly
      orthodox in its narrative and is read by both traditions as the great English Christian epic; Lewis's
      Preface is the classic defense. Spenser's Book I is Protestant allegory: Duessa and Archimago figure the
      Roman Church. Note this plainly, as a historical fact of Elizabethan polemic.

  - id: literature-20
    title: "English Literature II: The Augustan Age"
