    historicalPrecedent: >-
      Aesop was the first reading book of English and colonial grammar schools. Locke's Some Thoughts Concerning
      Education (1693) recommends Aesop for a child's first reading after the primer, and Aesop was among the
      handful of books the boy Lincoln read and re-read on the Indiana frontier.
    notes: >-
      Read unabridged versions. Grimm and Andersen contain frightening episodes; that is part of their moral
      force. Lang's color fairy books continue through 12 volumes for eager readers.

  - id: literature-02
    title: "Classic Children's Novels (Read-Aloud)"
    type: course
    level: early-5
    stage: formal
    ageStart: 6.5
    ageEnd: 8
    order: 2
    prerequisites: [literature-01]
    related: []
    summary: >-
      The first full-length novels, read aloud and then re-read independently. They are the Victorian and
      Edwardian children's classics: The Wind in the Willows, Heidi, Alice, Pinocchio, Winnie-the-Pooh and
      George MacDonald's fairy novels. Their prose is rich and their moral worlds are serious, and they build
      the attention span for long narrative.
    objectives:
      - Follow a chapter book across several weeks, recalling characters and earlier events
      - Narrate a chapter orally and draw a scene from it
      - Discuss a character's choice (e.g. Toad's boasting, Pinocchio's lies) in terms of virtue and vice
      - Begin reading shorter chapters independently by age 7–8
    workload:
      readingHours: 60
      readingBasis: "1,713 pp read aloud at ~28 pp/h (Winnie-the-Pooh and Alice go faster, MacDonald and Kingsley slower)"
      work:
        - { kind: discussion, hours: 18, note: "chapter narration and virtue/vice discussion, 2 x 10 min a week over 54 weeks" }
        - { kind: project, hours: 9, note: "narration drawings of a scene, ~36 x 15 min" }
