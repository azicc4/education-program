track: literature
title: Literature
trackGroup: English
description: >-
  A read-aloud-to-Great-Books sequence built on old literature, with its weight on great works in English from
  Shakespeare to the twentieth century. It starts with fables, fairy tales and myth told aloud (6–9). It moves
  through the legends, adventure novels and historical romances that nineteenth-century children read on their own
  (9–12), and through the texts the Founders and Lincoln were raised on. Shakespeare runs as a four-stage spine
  (comedies → histories → tragedies → romances), always with memorization and performance. From about 12 the
  student reads the great works in translation (Homer, Virgil, the Greek tragedians, Augustine, Dante) and then
  a chronological survey of English literature (Spenser to Waugh and Eliot) and American literature (Franklin to
  O'Connor and Percy), with a term of the European novel. Two college Great Books seminars (17–18) close the track;
  they are modeled on Hillsdale's core, St. John's College and Thomas Aquinas College. End-state competency: the
  student has read the central works of the English-language canon and its classical and Christian sources
  entire; can discuss any of them in a Socratic seminar; can write a sustained critical essay; and carries a
  memorized store of scenes and passages to draw on in speech and writing. Catholic sources supply the
  theological frame, and Protestant classics (Bunyan, Milton, Lewis) are read in full with brief notes where the
  traditions differ.
rows:
  # ───────────── Read-aloud & early-reader literature (6–9) ─────────────
  - id: literature-01
    title: "Fables, Fairy Tales & First Stories"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 7.5
    order: 1
    prerequisites: []
    related: [poetry-02]
    summary: >-
      Daily read-aloud and narration from the oldest stories in the tradition: Aesop, Grimm, Andersen, Andrew
      Lang's fairy books, Beatrix Potter and Kipling's Just So Stories. The fable teaches the moral imagination,
      and the fairy tale teaches that the world is enchanted, perilous and just. Both supply the stock of
      allusion that later literature assumes.
    objectives:
      - Narrate (retell aloud) a fable or fairy tale in sequence with its key details
      - State the moral of an Aesop fable in one sentence and apply it to a real situation
      - Recognize stock characters and patterns (the youngest son, the trickster, the three trials)
      - Sit attentively through 20–30 minutes of read-aloud of an unabridged text
    workload:
      readingHours: 65
      readingBasis: "2,003 pp read aloud: Potter's small picture books at ~50 pp/h (8 h), Aesop, Grimm, Andersen, Lang and Kipling (1,603 pp) at ~27 pp/h (59 h)"
      work:
        - { kind: discussion, hours: 18, note: "narration and moral of the story after readings, 2 x 10 min a week over 54 weeks" }
        - { kind: exercises, hours: 6, note: "Memoria Press Blue Fairy Book guide questions if used, ~24 lessons x 15 min" }
    coreTexts:
