        notes: Selections from Lang with vocabulary, comprehension and narration questions. Also see their Tales from Beatrix Potter set for 2nd grade.
      - name: Classic Children's Literature (free online course)
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/classic-childrens-literature"
        notes: Parent-facing lectures on why and how to read fairy tales and children's classics. Useful teacher formation.
