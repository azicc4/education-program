      Twentieth-century American fiction. The course reads Fitzgerald's The Great Gatsby, Hemingway's The Sun
      Also Rises and The Old Man and the Sea, Faulkner's The Sound and the Fury, Cather's Death Comes for the
      Archbishop, Flannery O'Connor's stories, Walker Percy's The Moviegoer and Harper Lee's To Kill a
