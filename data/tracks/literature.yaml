      Bleak House, with electives from Emily Brontë's Wuthering Heights, Dickens's David Copperfield and A Tale of
      Two Cities, Thackeray's Vanity Fair and Gaskell's North and South. It covers the "condition of England" question, the Victorian
      conscience, and the novel at the height of its social and moral ambition.
