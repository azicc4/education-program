  - id: literature-23
    title: "English Literature V: High Victorians & the Oxford Movement"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 14.75
    order: 23
    prerequisites: [literature-22]
    related: [poetry-11]
    summary: >-
      The later Victorian achievement. The course reads George Eliot's Middlemarch (the greatest English novel,
      by many judgments), Trollope's Barsetshire novels, Hardy's Mayor of Casterbridge, Tennyson's Idylls of the
      King, and Newman's Apologia, Idea of a University and Loss and Gain. It traces faith and doubt, the
      Oxford Movement, and the English idea of a gentleman and a liberal education.
    objectives:
      - Read Middlemarch complete and analyze its narrator and its ethic of "unhistoric acts"
      - Read Newman's Idea of a University (Discourses V–VII) and state his definition of liberal knowledge
      - Compare Hardy's fatalism with Eliot's humanism and Newman's faith
      - Write a 2,500-word research essay using at least two secondary sources
    workload:
      readingHours: 44
      readingBasis: "1,316 pp: Middlemarch (793 pp) at ~30 pp/h (26 h), Mayor of Casterbridge (363 pp) at ~35 pp/h (10 h), Newman's Apologia Chapters II and V and Idea of a University Discourses V–VII (160 pp) at ~19 pp/h (8 h); the electives are not counted"
      work:
        - { kind: writing, hours: 8, note: "one 2,500-word research essay with two secondary sources, drafted and revised" }
        - { kind: discussion, hours: 9, note: "fortnightly seminar, 12 x 45 min" }
      electiveHours: 49
      electiveBasis: "the rest of the Apologia (~310 pp, ~16 h), further Discourses of the Idea (~100 pp, ~5 h), a second essay draft (~12 h) and a weekly seminar in place of the fortnightly one (~16 h)"
