    ageEnd: 10
    order: 8
    prerequisites: [literature-05]
    related: []
    summary: >-
      Medieval legend in the great American retellings by Howard Pyle and Sidney Lanier. Pyle's Robin Hood
      comes first, then his four-volume Arthurian cycle and Lanier's Boy's King Arthur (Malory abridged in
      Malory's own words), with Pyle's novels of chivalry. This is the school of knighthood as a moral ideal:
      courtesy, loyalty, largesse and the Grail quest. It prepares for Malory, Spenser and Tennyson later.
    objectives:
      - Narrate the major Arthurian episodes (the sword in the stone, the Round Table, the Grail, the fall of Camelot)
      - Explain the code of chivalry and where knights keep or betray it
      - Read Malory's own prose (via Lanier) and note archaic words and style
      - Write a short narrative imitating Pyle's archaic style
