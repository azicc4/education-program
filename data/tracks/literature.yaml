      and The Sound and the Fury first and discuss them with the student. They are adult books (promiscuity,
      heavy drinking, suicide, and in Faulkner a disordered family and incestuous obsession) and are placed at
      15.5–16 for that reason; The Great Gatsby (adultery, a killing) and The Moviegoer (casual affairs) deserve
      the same parental reading. Gutenberg's Hemingway, Faulkner and Fitzgerald texts are public domain in the
      U.S. only (1925–1929 publications). O'Connor and Percy were Catholic converts or cradle Catholics writing
      for a "hostile audience". Their essays (Mystery and Manners; The Message in the Bottle) make good companion
      reading. The Fountainhead is read as a critical elective at 15.5–16, for its hold on ambitious young
      readers and on American politics. Howard Roark's integrity and refusal to compromise his work are
      admirable; Rand's Objectivism, which makes rational selfishness a virtue and altruism a vice, is set
      against Aristotle's magnanimous man and his account of friendship (philosophy-07), and against Christian
      charity and humility (theology-14, character-virtue-09). The student should write on whether Roark is a
      great-souled man or a proud one. The novel includes a violent sexual encounter that Rand presents
      approvingly; a parent should read it first.

  # ───────────── European novel ─────────────
