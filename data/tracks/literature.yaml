      - { label: "Hillsdale College: Classical Liberal Arts Core", url: "https://www.hillsdale.edu/academics/classical-liberal-arts-core/" }
    historicalPrecedent: >-
      The colonial college course of study was largely this list read in the original. Harvard's seventeenth- and
      eighteenth-century course included Greek and Hebrew Scripture, the Greek poets and orators, Aristotelian
      logic and ethics, and Cicero. J. S. Mill had read
      Herodotus, Xenophon and six dialogues of Plato in Greek by age 8, and Thucydides and Aristotle's Rhetoric by
      12.
    notes: >-
      Plato, Aristotle and Scripture stay in this seminar as works of literature, because St. John's College and
      Thomas Aquinas College read them that way: as dialogues, arguments and narratives to be discussed whole
      around a table. Philosophical and theological depth comes in the philosophy track (philosophy-05) and the
      theology track (theology-15). This seminar reads them as literature and conversation; coordinate so works
      are not read twice at the same depth.

  - id: literature-32
    title: "Great Books Seminar II: Christendom to the Modern Age"
    type: course
    level: college
    stage: formal
    ageStart: 17.25
    ageEnd: 18
    order: 32
    prerequisites: [literature-31]
    related: [poetry-14]
    summary: >-
      A second college seminar, from the Paradiso complete through Cervantes, Montaigne, Shakespeare, Milton, Pascal,
      Goethe and Dostoevsky, on the model of Hillsdale's Great Books 102 and the St. John's junior year. It
      closes the literature track with the student able to read, discuss and write about any major work of the
      Western canon at the level of a strong college junior.
    objectives:
      - Read the Paradiso complete, and write on the unity of the Comedy
      - Discuss Montaigne's and Pascal's rival accounts of the self
      - Write and defend a senior-style essay (5,000 words) on a text of the student's choosing
      - Present a public lecture or a seminar-leader's opening question to an audience
    workload:
      readingHours: 55
      readingBasis: "1,244 pp in a half year at ~20–40 pp/h: Longfellow's Paradiso with key cantos of the Inferno and Purgatorio (280 pp) at ~20 (14 h), Pascal, Paradise Lost, Faust and Montaigne selections (566 pp) at ~21 (27 h), Four Quartets at ~10 (5 h), Don Quixote and Karamazov selections (350 pp) at ~38 (9 h); the re-read selections from literature-18, -19 and -30 are counted"
      work:
        - { kind: discussion, hours: 36, note: "one 2-hour seminar a week x 18 weeks" }
        - { kind: writing, hours: 22, note: "one 5,000-word senior essay, drafted, revised and defended" }
        - { kind: project, hours: 8, note: "a public lecture or seminar-leader's opening question, prepared and delivered" }
      electiveHours: 127
      electiveBasis: "the rest of the Inferno, Purgatorio, Paradise Lost, Montaigne's Essays, the Pensées, Don Quixote and the Brothers Karamazov (~2,250 pp, ~80 h), a second weekly seminar (~34 h) and further essay drafts (~13 h)"
