      Power and the Glory depict adultery, alcoholism and a sinful priest, in the service of a Catholic account
      of grace; 1984 has sexual content and scenes of torture. They are placed at 15.5–16 and read with
      discussion. Catholic/Protestant note: Tolkien was Catholic and Lewis Anglican. Their long friendship, and
