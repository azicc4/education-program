  - id: literature-05
    title: "Homer, Virgil & the Heroes for Young Readers"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 9.5
    order: 5
    prerequisites: [literature-04]
    related: []
    summary: >-
      The whole story of Troy, the return of Odysseus, Aeneas' voyage to Italy and the quest for the Golden
      Fleece, in the prose retellings by Alfred J. Church, Padraic Colum and Andrew Lang that generations of
      schoolchildren read. This prepares the student for Homer and Virgil entire at 12–13 and for Latin reading
      of the Aeneid.
    objectives:
      - Narrate the Trojan War from the Judgment of Paris to the fall of the city
      - Trace Odysseus' voyage episode by episode and map it
      - Compare Achilles, Hector, Odysseus and Aeneas as types of heroism (wrath, duty, cunning, piety)
      - Memorize the opening invocation of the Iliad or Odyssey in English
    workload:
      readingHours: 55
      readingBasis: "1,164 pp of prose retellings read by the student at ~22 pp/h (Church, Colum, Lang); Church's Odyssey for Boys and Girls has no page count and is left out"
      work:
        - { kind: discussion, hours: 18, note: "narration and hero comparisons, 54 weeks x 20 min" }
        - { kind: project, hours: 3, note: "map of Odysseus' voyage, episode by episode" }
        - { kind: memorization, hours: 2, note: "opening invocation of the Iliad or Odyssey in English" }
