      - { label: "Hillsdale free course: The Odyssey", url: "https://online.hillsdale.edu/courses/promo/odyssey" }
    historicalPrecedent: >-
      Colonial college admission (Harvard, Yale, King's, William & Mary) required the ability to read Virgil and
      Cicero and to construe the Greek New Testament. Homer in Greek followed in the first college years.
      J. S. Mill's Autobiography records that Pope's Iliad was the first English poem he loved as a small boy, read alongside the Greek he had begun at three.
      Jefferson told Peter Carr (1785) to read Homer, Virgil and the Greek tragedians in the original.
    notes: >-
      Translation choice: Fagles (vigorous, contemporary) or Lattimore (line-for-line, closest to the Greek) for
      seminar work, and Pope and Dryden as English poems in their own right (see poetry-10). Read Homer in Greek
      later (Greek track).

  - id: literature-17
