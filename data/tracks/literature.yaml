    notes: >-
      Catholic/Protestant note. Dante's Purgatorio and his placing of popes in Hell have been read as both
      supremely Catholic and proto-reformist. Dante is an orthodox Catholic poet who distinguishes the office of
      the papacy from the sins of individual popes. Longfellow, a Unitarian, translated him out of admiration, and
      the Comedy is shared ground. Chaucer's pardoner and friars show the lay criticism of clerical abuse that
      preceded the Reformation. Read the Confessions again in the theology track; here the focus is its art.
      Chaucer split: this row carries the fuller reading of the Canterbury Tales, in modern verse translation.
      The original Middle English (the General Prologue and the Nun's Priest's Tale, read aloud with glosses and
      the opening lines memorized) is taught in old-english-05 at 16, so those selections are not assigned in
      Middle English here. The bawdy fabliaux (Miller's, Reeve's, Merchant's) are left out at this age.

  - id: literature-19
    title: "English Literature I: The Renaissance & Seventeenth Century"
    type: course
    level: 9-12
