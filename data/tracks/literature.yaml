    ageStart: 13.75
    ageEnd: 14
    order: 20
    prerequisites: [literature-19]
    related: [poetry-10]
    summary: >-
      Restoration and eighteenth-century literature, the age the Founders read and imitated. The course covers
      Dryden, Pope's Rape of the Lock and Essay on Man, Swift's satire, Addison and Steele's Spectator,
      Johnson's Rasselas, Goldsmith's Vicar of Wakefield, and Boswell's Life of Johnson, the greatest biography in
      English. Its concerns are wit, balance, the heroic couplet and the periodical essay.
    objectives:
      - Read Boswell's Life of Johnson (abridged or selections of 300+ pages) and keep a commonplace of Johnson's sayings
      - Imitate a Spectator essay by Franklin's method (notes, then rewrite, then compare)
      - Analyze Swift's irony in A Modest Proposal
      - Explicate a passage of Pope's heroic couplets
