        notes: MODG schedules Franklin's Autobiography and Plutarch in its history and literature years.
    historicalPrecedent: >-
      Franklin's Autobiography lists his boyhood books: Pilgrim's Progress, Burton's historical collections,
      Plutarch's Lives ("in which I read abundantly"), Defoe's Essay upon Projects and Mather's Essays to Do Good.
      He learned to write by rewriting Spectator essays from memory. Herndon's biography records that the young
      Lincoln read the Bible, Aesop, Pilgrim's Progress, Robinson Crusoe and Weems' Life of Washington; Lincoln
      later recalled Weems in his 1861 Trenton address. Washington had Addison's Cato performed for the army at
      Valley Forge, and Nathan Hale's and Patrick Henry's famous lines echo it.
    sources:
      - { label: "Franklin, Autobiography (Gutenberg)", url: "https://www.gutenberg.org/ebooks/20203" }
      - { label: "Herndon & Weik, Abraham Lincoln: The True Story of a Great Life, vol. 1", url: "https://www.gutenberg.org/ebooks/38483" }
    notes: >-
      Catholic/Protestant note. The KJV was the Bible of the Founders and of English literature, and it is read
      here for its literary and historical influence. Catholic families will use the Douay-Rheims (Challoner) for
      devotion and doctrine (see the theology track). The two share much of their English diction, because the
      KJV translators consulted the Rheims New Testament.

