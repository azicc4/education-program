  - id: literature-16
    title: "Ancient Epic & Tragedy in Translation"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12.5
    ageEnd: 13
    order: 16
    prerequisites: [literature-05, literature-14]
    related: [greek-11]
    summary: >-
      Homer's Iliad and Odyssey and Virgil's Aeneid complete in verse translation. With them come Aeschylus'
      Oresteia, Sophocles' Theban plays, Euripides' Medea and selections from Ovid's Metamorphoses. This is the
      foundation of the Western literary tradition, read slowly with seminar discussion. It runs parallel to Latin
      Aeneid reading and precedes Greek.
    objectives:
      - Read the Iliad, Odyssey and Aeneid complete in a verse translation
      - Explain the epic conventions (invocation, in medias res, catalogue, epic simile, descent to the underworld)
      - Analyze the tragic hero, hamartia, and the chorus with reference to Aristotle's Poetics
      - Write a 1,000-word seminar essay comparing Achilles, Odysseus and Aeneas
      - Memorize the proem of each epic (in English; in Latin for the Aeneid)
    workload:
      readingHours: 115
      readingBasis: "1,999 pp of verse and drama in translation at ~15–20 pp/h: Fagles Iliad (564 pp) at ~20 (28 h), Lattimore Odyssey and Fitzgerald Aeneid (794 pp) at ~18 (45 h), Aeschylus, Sophocles and Euripides in Victorian verse (558 pp) at ~15 (37 h), Ovid selections at ~20 (4 h)"
