  - id: literature-07
    title: "McGuffey's Readers & the 19th-Century Schoolbook Canon"
    type: unit
    level: early-5
    stage: formal
    ageStart: 8.5
    ageEnd: 10
    order: 7
    prerequisites: [literature-01]
    related: [poetry-04]
    summary: >-
      The anthologies that formed American readers from 1836 into the twentieth century. McGuffey's Fourth to
      Sixth Eclectic Readers excerpt Shakespeare, Milton, Addison, Johnson, Irving, Scott, Dickens, Webster and
      the Bible, each with vocabulary and rules for reading aloud. Bingham's Columbian Orator is the
      declamation book on which Frederick Douglass taught himself. The student reads selections aloud, answers
      McGuffey's questions, and meets a hundred authors in miniature.
    objectives:
      - Read aloud with correct articulation, inflection and emphasis, following McGuffey's rules
      - Complete the questions and definitions for weekly lessons in the Fourth and Fifth Readers
      - Keep a commonplace book of memorable sentences from the selections
      - Identify at least 30 authors the Readers introduce and note which to read in full later
    workload:
      readingHours: 75
