  # ───────────── College Great Books (17–18) ─────────────
  - id: literature-31
    title: "Great Books Seminar I: Antiquity & the Bible"
    type: course
    level: college
    stage: formal
    ageStart: 16.5
    ageEnd: 17.25
    order: 31
    prerequisites: [literature-16, literature-18]
    related: [philosophy-05, theology-15]
    summary: >-
      A college-level Socratic seminar on the ancient foundations, modeled on the freshman years of St. John's
      College and Thomas Aquinas College and on Hillsdale's Great Books 101. It returns to the key books of the Iliad,
      and adds Hesiod, the central books of Herodotus and Thucydides, Plato's Republic, Aristotle's Ethics,
      Lucretius and Virgil, with Genesis, Exodus and Job as literature. Texts are read in Greek or Latin where the language tracks allow.
    objectives:
      - Lead and participate in two-hour seminars on primary texts with no secondary sources
      - Write a 3,000-word seminar paper and defend it orally (St. John's "don rag" / oral examination)
      - Read at least one work (e.g. Iliad I or Aeneid I) in the original language
      - Trace the dialogue between Athens and Jerusalem across the term
    workload:
