  - id: literature-18
    title: "The Christian Middle Ages: Augustine, Beowulf, Dante, Chaucer"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13.25
    ageEnd: 13.5
    order: 18
    prerequisites: [literature-16]
    related: [poetry-09, old-english-05, old-english-04]
    summary: >-
      The literary achievement of Christendom. The course reads Augustine's Confessions as spiritual
      autobiography, Beowulf and Sir Gawain as heroic and chivalric poetry, Dante's Inferno and Purgatorio complete
      with Paradiso selections, the fuller reading of Chaucer's Canterbury Tales in modern verse translation, the
      morality play Everyman and the opening books of Malory's Morte d'Arthur. It pairs with the Old English
      units and medieval history.
    objectives:
      - Read the Confessions (Books I–X) and trace the structure of conversion
      - Read the Inferno and Purgatorio complete, and map Dante's moral architecture
      - "Read the Canterbury Tales in modern verse translation: the General Prologue and at least eight tales (e.g. Knight's, Man of Law's, Wife of Bath's, Clerk's, Franklin's, Pardoner's, Second Nun's, and the Parson's Prologue with the Retraction), leaving the Nun's Priest's Tale for old-english-05"
      - Compare the heroic ideal in Beowulf with the Christian knight in Gawain
      - Trace the pilgrimage frame and the "quiting" of tale against tale across the Canterbury Tales
    workload:
      readingHours: 69
      readingBasis: "1,257 pp at ~15–25 pp/h: Esolen Dante, Inferno and Purgatorio with Paradiso selections (~390 pp with notes) at ~15 (26 h), Confessions I–X (~131 pp) at ~15 (9 h), Heaney Beowulf (facing-page, 256 pp) at ~25 (10 h), Gawain, Chaucer, Everyman and Malory I–IV (480 pp) at ~20 (24 h)"
      work:
        - { kind: writing, hours: 10, note: "two 2–3 page essays with revision (e.g. Beowulf vs Gawain)" }
        - { kind: project, hours: 4, note: "a chart or map of Dante's moral architecture" }
        - { kind: discussion, hours: 27, note: "weekly seminar, 36 x 45 min" }
      electiveHours: 39
      electiveBasis: "the rest of the Paradiso (~110 pp, ~7 h), Pearl and Sir Orfeo (~80 pp, ~4 h), Malory Books V–IX (~250 pp, ~13 h) and a longer seminar schedule (54 x 45 min, ~13 h)"
