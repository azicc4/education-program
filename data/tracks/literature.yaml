  - id: literature-15
    title: "Shakespeare II: The Histories & Roman Plays"
    type: course
    level: 6-8
    stage: formal
    ageStart: 12.25
    ageEnd: 12.5
    order: 15
    prerequisites: [literature-13]
    related: [poetry-05]
    summary: >-
      Shakespeare on kingship, rebellion, war and the republic: Julius Caesar, Henry V, Richard II and Henry IV
      Part 1. These are the plays a future statesman most needs. The course gives close attention to the great
      political speeches (Brutus and Antony in the Forum; Henry at Harfleur and Agincourt; Gaunt's "This royal
      throne of kings") and memorizes one full speech per play.
    objectives:
      - Read four history/Roman plays complete
      - Analyze Antony's funeral oration as rhetoric (ethos, pathos, irony, repetition)
      - Trace the legitimacy question from Richard II to Henry V (the Henriad)
      - Memorize and declaim one full speech per play (e.g. St. Crispin's Day, Friends Romans countrymen)
    workload:
      readingHours: 40
      readingBasis: "602 pp of history and Roman plays read by the student at ~16 pp/h"
      work:
        - { kind: memorization, hours: 10, note: "one full speech per play x 4 (~30–40 lines each)" }
