    summary: >-
      College-level reading of the two hardest "pagan" authors, with a commentary. Lucretius's De
      Rerum Natura (Books I and III) is Epicurean physics and the ancestor of modern materialism
      that Jefferson admired. Tacitus's Agricola and Annals I and XV show tyranny, flattery and
      liberty under the emperors.
    objectives:
      - Read De Rerum Natura I and III in Latin and give a Christian and classical critique of Epicureanism
      - Read the Agricola complete and selections from Annals I, IV and XV
      - Analyse Tacitean style (brevity, inconcinnity, sententiae)
      - Write a Latin summary (argumentum) of each book read
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 165, note: "Lucretius I and III, about 2,200 lines at ~20 lines/h (110 h); Agricola and Annals selections, about 55 pp at ~1 pp/h (55 h); counted 363 pp" }
        - { kind: writing, hours: 20, note: "Latin argumentum for each book read (10 h) and a Christian and classical critique of Epicureanism (10 h)" }
        - { kind: discussion, hours: 15, note: "weekly tutorial on Epicureanism and Tacitean style, 30 x 30 min" }
