        notes: Includes Ovid excerpts in its natural-method progression.
    historicalPrecedent: >-
      Boston's early course had "Ovid de Tristibus" and the Metamorphoses. In 1789, "Ovid's
      Metamorphoses" was set in the third class. Boston Latin in the 1880s read the Metamorphoses
      in the Fourth Class alongside Caesar.

  - id: latin-10
    title: "Ecclesiastical Latin I: Vulgate, Hymns, Mass & the Hours"
