  - id: latin-08
    title: "Latin Composition I: Bradley's Arnold & North and Hillard"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11.5
    ageEnd: 14
    order: 8
    prerequisites: [latin-04]
    summary: >-
      "Making Latin": English-to-Latin prose composition done every week or two across two to three years.
      The student starts with single sentences on one construction at a time (Bradley's Arnold)
      and moves to connected passages in the style of Caesar and Cicero (North & Hillard). Nothing
      else fixes grammar so permanently.
    objectives:
      - Complete the core exercises of Bradley's Arnold Parts I–II
      - Write a correct 100-word Latin paragraph in the style of Caesar
      - Choose the right idiom for purpose, result, indirect speech and conditions
      - Keep a personal phrase-book of Ciceronian idioms collected from reading
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 70, note: "about 56 proses over 2.5 years, roughly one every other week of term (the core exercises of Arnold I–II, then about 20 North & Hillard passages) x ~75 min, including writing out corrections; the two books are workbooks, not reading" }
        - { kind: discussion, hours: 19, note: "tutor correction of each prose, 56 x 20 min" }
      electiveHours: 56
      electiveBasis: "about 34 further proses from Arnold and North & Hillard, for a weekly rhythm, with tutor correction (~56 h)"
    coreTexts:
      - title: "A Practical Introduction to Latin Prose Composition (Bradley's Arnold)"
        kind: instructional
        reader: student
        pages: 440
        lessons: 67
        lessonLabel: lesson
        lessonsNote: "Archive.org scan (1899 printing) table of contents: 67 numbered exercises (I-LXVII) plus supplementary exercises"
        author: Thomas Kerchever Arnold, rev. George Granville Bradley
        date: "1839 / rev. 1884"
        publicDomain: true
        order: 1
        role: selections
        portion: "Parts I–II"
        pace: long
        links:
          - { label: Archive.org, url: "https://archive.org/details/practicalintrod00arnouoft" }
      - title: Latin Prose Composition for the Middle Forms of Schools
        kind: instructional
        reader: student
        pages: 299
        lessons: 256
        lessonLabel: lesson
        lessonsNote: "Archive.org 1913 printing: 256 numbered exercises plus preliminary exercises A-C"
        author: M. A. North & A. E. Hillard
        date: "1895"
        publicDomain: true
        order: 2
        role: selections
        portion: "about 20 connected passages"
        pace: long
        links:
          - { label: "Archive.org (1913 printing)", url: "https://archive.org/details/north-m.-hilladr-a.-latin-prose-composition-1913" }
    curriculumOptions:
      - name: Henle Latin (composition exercises, Years 1–3)
        publisher: Memoria Press / Loyola Press
        tradition: catholic
        url: "https://www.memoriapress.com/curriculum/latin/henle-latin-i-set/"
        notes: Henle builds English-to-Latin exercises into every unit, so it can stand in for Arnold for younger students.
    historicalPrecedent: >-
      The 1789 Boston course prescribes "The making of Latin, from Garretson's Exercises" in the
      second class and "The making of Latin from King's History of the Heathen Gods" in the third.
      Bradley's Arnold and North & Hillard were the standard English public-school (Eton, Rugby,
      Marlborough) and American prep-school composition books c. 1880–1950.
    notes: >-
      Done with a tutor (the family has tutors available): prose and verse composition need an expert to
      correct the student's exercises line by line. The "Arnold" of Bradley's Arnold is Thomas Kerchever
      Arnold, not Thomas Arnold of Rugby. Bradley was Master of Marlborough and later Dean of
      Westminster. Answer keys were restricted to teachers, so a Latinist tutor to correct proses is
      highly desirable.

  - id: latin-09
    title: "Ovid: Metamorphoses & Tristia (First Latin Verse)"
    type: course
    level: 6-8
    stage: formal
    ageStart: 12
    ageEnd: 13
    order: 9
    prerequisites: [latin-07]
    related: [greek-11]
    exams: [ap-latin]
    summary: >-
      The first Latin poetry. The student reads selected myths from the Metamorphoses (Creation
      and Flood, Daedalus and Icarus, Pyramus and Thisbe, Baucis and Philemon, Apollo and Daphne)
      and some of Ovid's exile elegies, the Tristia. He learns to scan the dactylic hexameter and
      the elegiac couplet aloud. Ovid is the mythological dictionary of all later Western art and
      poetry.
    objectives:
      - Scan and read aloud dactylic hexameter and elegiac couplets fluently
      - Read about 600–800 lines of the Metamorphoses in Latin
      - Memorize and recite the opening of the Metamorphoses (I.1–20)
      - Trace three Ovidian myths into later English poetry or painting
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 45, note: "about 700 lines of the Metamorphoses at ~20 lines/h (35 h) and ~150 lines of the Tristia (8 h); the counted 131 pp agree" }
        - { kind: exercises, hours: 8, note: "scansion drill in hexameter and elegiac couplets, 16 x 30 min" }
        - { kind: memorization, hours: 3, note: "Metamorphoses I.1–20" }
        - { kind: project, hours: 6, note: "tracing three Ovidian myths into English poetry or painting" }
