      second class. The Ratio Studiorum assumed daily liturgical Latin for all students.
    notes: >-
      Catholic and Protestant readers differ here. For Catholics the Vulgate was declared the
      authentic Latin text by the Council of Trent, and the Nova Vulgata (1979) is the current
