  - id: latin-07
    title: "Caesar & Nepos: First Real Authors"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11.5
    ageEnd: 12.5
    order: 7
    prerequisites: [latin-04, latin-05]
    related: [greek-08]
    summary: >-
      The traditional first unadapted author. The student reads Caesar's Gallic War (Books I–IV
      with the Helvetian campaign) and Nepos's Lives (Hannibal, Themistocles, Atticus). The prose
      is clear, military and political, and it trains accurate construing. It also opens
      discussion of ambition, command and the fall of the Republic.
    objectives:
      - Read at least Bellum Gallicum I and selections from II–VII in Latin
      - Read three of Nepos's Lives, including Hannibal
      - Construe periodic sentences with ablative absolutes and indirect speech
      - Write a one-page English essay judging Caesar as a commander and a statesman
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 80, note: "about 80 pp of Latin actually construed (BG I ~30, selections II–VII ~25, three Lives of Nepos ~22; counted 133 pp) with the tutor at ~1 pp/h, 36 weeks x 3 x 45 min" }
        - { kind: writing, hours: 4, note: "one-page English essay on Caesar as commander and statesman, with revision" }
        - { kind: discussion, hours: 9, note: "weekly discussion of ambition, command and the Republic, 36 x 15 min" }
