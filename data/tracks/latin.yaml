      Latin as the living language of the Church. The student reads the Vulgate (Genesis 1–11,
      Gospel of John, Psalms), the great hymns (Veni Creator, Pange Lingua, Dies Irae, Stabat
      Mater), the Ordinary of the Mass, and Vespers and Compline. He learns where medieval Latin
      differs from classical usage. Prayer and grammar reinforce each other.
    objectives:
      - Read the Vulgate Genesis 1–3 and John 1 without a translation
      - Follow the Latin Mass (Ordinary) and Compline in Latin with understanding
      - Memorize and sing or recite four great Latin hymns
