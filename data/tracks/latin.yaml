    summary: >-
      The summit of the school course. The student reads Aeneid Books I, IV and VI in full and
      the chief passages of Book II, the rest in translation, plus Eclogue IV. Pietas, duty,
      founding a nation and the cost of empire make this the founding father's epic. Large
      passages are memorized. Elective: the rest of Book II and Eclogue I.
    objectives:
      - Read Aeneid I, IV and VI in Latin and the chief passages of Book II (about 2,600 lines)
      - Scan and read hexameter aloud with expression at sight
      - Memorize at least 100 lines (e.g. I.1–33, VI.847–853)
      - Write an essay on pietas in Aeneas compared with Achilles or Odysseus
      - Read Eclogue IV and know its place in Christian reception (the "Messianic" eclogue)
    workload:
