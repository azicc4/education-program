  - id: latin-17
    title: "College Latin I: Lucretius & Tacitus"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 17
    prerequisites: [latin-13, latin-14]
    related: [greek-15]
    summary: >-
      College-level reading of the two hardest "pagan" authors, with a commentary. Lucretius's De
      Rerum Natura (Books I and III) is Epicurean physics and the ancestor of modern materialism
      that Jefferson admired. Tacitus's Agricola and Annals I and XV show tyranny, flattery and
      liberty under the emperors.
    objectives:
      - Read De Rerum Natura I and III in Latin and give a Christian and classical critique of Epicureanism
      - Read the Agricola complete and selections from Annals I, IV and XV
      - Analyse Tacitean style (brevity, inconcinnity, sententiae)
      - Write a Latin summary (argumentum) of each book read
    coreTexts:
      - title: De Rerum Natura
        reader: student
        pages: 289
        author: Lucretius
        date: "c. 55 BC"
        publicDomain: true
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/lucretius.html" }
      - title: Agricola, Germania, Annales, Historiae
        reader: student
        pages: 800
        author: Tacitus
        date: "c. AD 98–120"
        publicDomain: true
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/tac.html" }
          - { label: "Dickinson College Commentaries, Agricola & Annals 15", url: "https://dcc.dickinson.edu/tacitus-agricola/1" }
    historicalPrecedent: >-
      Tacitus was a staple of colonial college reading and a favourite of Jefferson and the
      Whig opposition, as the historian of liberty lost. Colonial colleges read Latin authors
      through all four years, with Latin as the language of disputations and commencement
      theses.
    notes: >-
      Lucretius should be read with a teacher. His denial of providence and of the soul's
      immortality is the classical counter-position that Christian authors (Lactantius,
      Augustine, Aquinas) answer.

  - id: latin-18
    title: "College Latin II: Augustine & Aquinas in Full, Reading at Sight"
    type: course
    level: college
    stage: formal
    ageStart: 17.5
    ageEnd: 18.5
    order: 18
    prerequisites: [latin-16, latin-17]
    summary: >-
      The finishing course. The student reads the whole of the Confessions in Latin and a sequence
      of Summa questions (e.g. on law, I-II qq.90–97, which is foundational for natural-law
      political thought). He reads selections of Neo-Latin (Erasmus, Thomas More's Utopia, Grotius)
      and practises daily sight-reading of unseen passages from any period. The test is the
      Harvard standard of reading Tully (and, from 1655, Virgil) "ex tempore".
    objectives:
      - Read Confessions I–X in Latin
      - Read Summa Theologiae I-II qq.90–97 (the Treatise on Law) in Latin
      - Translate an unseen passage of Cicero, Livy or Virgil at sight with minimal help
      - Read a Neo-Latin political text (More, Erasmus's Institutio Principis Christiani, or Grotius)
    coreTexts:
      - title: Confessiones
        reader: student
        pages: 383
        author: St. Augustine
        publicDomain: true
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/august.html" }
      - title: "Summa Theologiae, I-II (Treatise on Law)"
        reader: student
        pages: 150
        author: St. Thomas Aquinas
        publicDomain: true
        links:
          - { label: Corpus Thomisticum, url: "https://www.corpusthomisticum.org/" }
      - title: Institutio Principis Christiani
        reader: student
        pages: 277
        author: Desiderius Erasmus
        date: "1516"
        publicDomain: true
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/erasmus.html" }
    historicalPrecedent: >-
      Harvard, 1642: admission required reading "Tully, or such like classicall Latine Author
      extempore". Graduates then defended Latin theses in public. Colonial college libraries and
      curricula (Harvard, Yale, William & Mary, King's) assumed Latin as a working language for
      theology, law and natural philosophy. Jefferson's Latin let him read Grotius, Pufendorf and
      Coke's Latin sources directly.
    sources:
      - { label: "New Englands First Fruits (1643)", url: "https://archive.org/details/NewEnglandsFirstFruitsInRespectFirstOfTheCounversionOfSome" }
