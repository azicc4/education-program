  - id: latin-13
    title: "Roman Historians: Livy & Sallust"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 13
    prerequisites: [latin-11]
    exams: [ap-latin]
    summary: >-
      Roman history in Roman words. Livy's Preface and Book I (the kings, Lucretia, the founding of
      liberty) and selections from the Hannibalic war (Books XXI–XXII). Sallust's Bellum
      Catilinae is read as a study of republican decay beside Cicero's speeches. These were the
      founders' handbooks on virtue, faction and liberty.
    objectives:
      - Read Livy's Praefatio and large parts of Book I in Latin
      - Read Sallust's Bellum Catilinae (chapters 1–13 and the Caesar–Cato debate, 51–54)
      - Compare Sallust's Catiline with Cicero's in an essay
      - Draw three lessons on republican virtue that Adams or Jefferson drew from Roman history
