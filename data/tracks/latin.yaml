    historicalPrecedent: >-
      Harvard's 1642 admission rule: "When any Scholar is able to understand Tully, or such like
      classicall Latine Author extempore… Let him then and not before be capable of admission." Boston 1789: "Tully's Epistles,
      or Offices" (third class) and "Tully's Orations" (fourth class). Jefferson recommended
      "Cicero's philosophies" for morality to his nephew Peter Carr (1785). King's College
      (Columbia) read the Tusculan Disputations in the fourth year, and Yale examined its Berkeley
      Scholars on them in 1780 (see the founding lists).
    sources:
      - { label: "New Englands First Fruits (1643), Harvard rules", url: "https://archive.org/details/NewEnglandsFirstFruitsInRespectFirstOfTheCounversionOfSome" }
      - { label: "Jefferson to Peter Carr, 19 Aug 1785 (Wikisource)", url: "https://en.wikisource.org/wiki/Letter_to_Peter_Carr_-_August_19,_1785" }

  - id: latin-12
