      The summit of the school course. The student reads Aeneid Books I, II, IV and VI in full,
      the rest selectively and the rest in translation, plus Eclogues I and IV. Pietas, duty,
      founding a nation and the cost of empire make this the founding father's epic. Large
      passages are memorized.
    objectives:
      - Read Aeneid I, II, IV and VI in Latin (about 3,000 lines)
      - Scan and read hexameter aloud with expression at sight
      - Memorize at least 100 lines (e.g. I.1–33, VI.847–853)
      - Write an essay on pietas in Aeneas compared with Achilles or Odysseus
      - Read Eclogue IV and know its place in Christian reception (the "Messianic" eclogue)
    coreTexts:
