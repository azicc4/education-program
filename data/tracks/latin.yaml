track: latin
title: Latin
trackGroup: Languages
description: >-
  Latin is the spine of the language program and the gateway to the Western and Catholic
  intellectual tradition. The arc follows the historical grammar-school sequence (Boston Latin
  School, 1789: Accidence, Corderius and Aesop, then Eutropius, then Caesar, Cicero, Ovid and
  Virgil, with "making Latin" throughout). It moves from chants and vocabulary at 7, through
  complete mastery of forms and syntax by about 12, graded readers, and the school authors
  (Caesar, Nepos, Ovid, Cicero, Virgil, Livy, Sallust, Horace). Ecclesiastical Latin (Vulgate,
  hymns, liturgy, Augustine and Aquinas) runs alongside, and prose and verse composition run
  throughout. At college level (17–18) the student reads Lucretius, Tacitus, Augustine and
  Aquinas in the original. End state: the old Harvard admission standard. The student reads
  Cicero and Virgil "ex tempore", writes correct Latin prose, and can pick up any Latin text,
  classical, patristic, scholastic or Neo-Latin, and read it with a dictionary close at hand but
  rarely opened.
rows:
  - id: latin-01
    title: "Latin I: Song School & Prima Latina"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 8
    order: 1
    prerequisites: []
    related: [greek-01]
    summary: >-
      A gentle, oral-first start. The child chants noun and verb endings, learns about 100–150
      everyday and Church words, recites Latin prayers (Pater Noster, Ave Maria, Gloria Patri)
      and picks up English grammar terms along the way. The aim is joy, pronunciation and
      memory. Translation is kept to a minimum.
    objectives:
      - Pronounce Latin correctly in the ecclesiastical (Italianate) pronunciation
      - Chant first-conjugation verb endings and first- and second-declension noun endings
      - Know about 100–150 vocabulary words with English derivatives
      - Recite the Pater Noster, Ave Maria, Gloria Patri and Signum Crucis from memory
      - Identify nouns, verbs and adjectives in simple English and Latin sentences
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 30, note: "Prima Latina or Song School, about 30 lessons over 32 weeks, 3 x 20 min a week" }
        - { kind: memorization, hours: 15, note: "daily chants, 100–150 words and four prayers, about 5 min x 180 days" }
    curriculumOptions:
      - name: Prima Latina
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/latin/prima-latina-set/"
        notes: >-
          Grades 1–4. 25 short lessons with Latin prayers and ecclesiastical pronunciation. Feeds
          straight into Latina Christiana. Written by a Catholic author, so it has a Christian
          flavour without being denominational.
        lessons: 25
        lessonLabel: lesson
        lessonsNote: "Memoria Press product page: 25 lessons, with a review and test every 5 lessons"
      - name: Song School Latin (Books 1 & 2)
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/pages/series-song-school-latin"
        notes: >-
          The most playful option, with songs, stories and a video teacher. Book 2 leads into
          Latin for Children. Book 1 alone is enough for an accelerated 7-year-old.
        lessons: 63
        lessonLabel: lesson
        lessonsNote: "Classical Academic Press product pages: Book 1 has 31 weekly lessons, Book 2 has 32 (both incl. review chapters)"
      - name: "Latin's Not So Tough! (Levels 1–2)"
        publisher: Greek 'n' Stuff (Karen Mohs)
        tradition: protestant
        url: "https://www.greeknstuff.com/latin.html"
        notes: Inexpensive workbooks built on short daily lessons. Good for independent seat-work.
      - name: "Little Latin Readers, Classic Series"
        publisher: "Little Latin Readers"
        tradition: catholic
        url: "https://littlelatinreaders.com/for-homeschools/"
        notes: "Catholic reader-based Latin for grades 2–5, with Latin prayers and audio. Seton also sells the sets. A Catholic option, not a requirement."
      - name: "Foundations (Latin memory work)"
        publisher: "Classical Conversations"
        tradition: protestant
        url: "https://classicalconversations.com/programs/foundations/"
        notes: "Community memory program for ages 4+. Its Latin strand chants noun endings and verb conjugations and ends with John 1 from the Vulgate."
        lessons: 24
        lessonLabel: week
        lessonsNote: "Classical Conversations: each Foundations cycle is 24 weeks of memory work"
    historicalPrecedent: >-
      Jefferson "was placed at the Latin at 9" under the Rev. William Douglas (Autobiography,
      1821). In colonial Boston the first-year books were Cheever's Accidence, a small
      Nomenclator (vocabulary) and Corderius's Colloquies (H. G. Otis's recollection of the early
      1770s). J. S. Mill began Latin "in my eighth year".
    sources:
      - { label: "Jefferson, Autobiography (1821), Avalon Project", url: "https://avalon.law.yale.edu/19th_century/jeffauto.asp" }
      - { label: "J. S. Mill, Autobiography (Project Gutenberg)", url: "https://www.gutenberg.org/ebooks/10378" }
      - { label: "Hillsdale College, A Proper Understanding of K-12 Education (includes 'Why Learn Latin')", url: "https://online.hillsdale.edu/courses/k-12-education" }
    notes: >-
      Pronunciation (family decision): ecclesiastical (Italianate) first, the Catholic and Memoria Press
      default, which matches chant, the Mass and the Hours. Restored classical pronunciation is
      introduced later for reading Virgil and the poets aloud (see latin-12), so the student can use
      both.

  - id: latin-02
    title: "Latin II: Latina Christiana / Latin for Children"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 9
    order: 2
    prerequisites: [latin-01]
    summary: >-
      The first real grammar year. The student learns all five declensions in outline, the first
      and second conjugations in the active indicative, the verb sum, and about 250 more words. He
      begins translating short sentences both ways. Roman and Church history readings give the
      vocabulary a setting.
    objectives:
      - Decline first-, second- and third-declension nouns and 1st/2nd-declension adjectives
      - Conjugate first- and second-conjugation verbs in the six active indicative tenses
      - Translate simple Latin sentences into English and English sentences into Latin
      - Know about 300–400 cumulative vocabulary words and 100+ English derivatives
      - Sing or recite a few Latin hymns and sayings (e.g. Adeste Fideles, Veni Creator)
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 40, note: "Latina Christiana, 25 lessons x 4 sessions x 25 min" }
        - { kind: memorization, hours: 20, note: "vocabulary drill, chants and hymns, about 7 min x 180 days" }
    curriculumOptions:
      - name: Latina Christiana I
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/latin/latina-christiana-set/"
        notes: Cheryl Lowe's classic. Memoria recommends moving straight on to First Form afterwards.
        lessons: 30
        lessonLabel: lesson
        lessonsNote: "Memoria Press product page: 25 lessons + 5 review lessons"
      - name: Latin for Children, Primer A (and B)
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/pages/series-latin-for-children"
        notes: >-
          Chant-driven, with a video/audio course and a History Reader. Offers both pronunciations.
          Primers A–C together cover about the same ground as Latina Christiana plus First Form.
        lessons: 32
        lessonLabel: chapter
        lessonsNote: "Rainbow Resource: Primer A has 32 weekly chapters; Cathy Duffy: 32 lessons in each primer, so Primer B adds 32 more"
      - name: Latin Primer 1
        publisher: Canon Press
        tradition: protestant
        url: "https://canonpress.com/products/latin-primer-1-package"
        notes: >-
          The Douglas Wilson / Logos School tradition. Mostly memorizing vocabulary and endings.
      - name: "Beginning Latin I (MODG)"
        publisher: "Mother of Divine Grace School"
        tradition: catholic
        url: "https://books.modg.org/beginning-latin-i-bundle"
        notes: "MODG's own rules-based course for third grade. It starts with the third declension. Graded enrolment is also offered. A Catholic option, not a requirement."
      - name: "Course Plan & Tests: Latina Christiana"
        publisher: "Kolbe Academy"
        tradition: catholic
        url: "https://books.kolbe.org/products/course-plan-tests-latina-christiana-1"
        notes: "Kolbe's Catholic lesson plan and tests for Memoria's Latina Christiana (its Intro to Elementary Latin course)."
        lessons: 30
        lessonLabel: lesson
        lessonsNote: "Follows Latina Christiana I: 25 lessons + 5 review lessons (Memoria Press product page)"
      - name: "Introductory Latin (Latina Christiana)"
        publisher: "Our Lady of Victory School"
        tradition: catholic
        url: "https://olvs.org/academics/curriculum-courses/"
        notes: "OLVS's traditional Catholic homeschool course on Latina Christiana. It can be taken as a single-course enrolment."
        lessons: 30
        lessonLabel: lesson
        lessonsNote: "Follows Latina Christiana I: 25 lessons + 5 review lessons (Memoria Press product page)"
    historicalPrecedent: >-
      Boston's 1789 school committee set the youngest Latin class on Cheever's Accidence,
      Corderius's Colloquies (Latin and English), the Nomenclator and Aesop's Fables (Latin and
      English), then Ward's Latin Grammar or Eutropius.
    sources:
      - { label: "Catalogue of the Boston Public Latin School (1886), incl. 1789 votes & Otis recollection", url: "https://archive.org/details/catalogueofbosto00bostuoft" }

  - id: latin-03
    title: "Latin III: First & Second Form Latin (Forms Mastery)"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 10.5
    order: 3
    prerequisites: [latin-02]
    summary: >-
      Grammar-first mastery of the Latin forms: all conjugations in the active and passive, all
      five declensions, pronouns, and adjectives of the third declension. The work is drilled to
      automaticity through daily recitation, so that later reading years are spent on meaning and
      not on paradigms.
    objectives:
      - Conjugate any regular verb in all indicative tenses, active and passive
      - Decline all five declensions, i-stems, and personal, demonstrative and relative pronouns
      - Parse any regular noun or verb form on sight (person, number, tense, voice, case)
      - Translate connected sentences of 10–15 words
      - Write the grammar recitation (all paradigms) from memory in under 20 minutes
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 90, note: "First and Second Form, about 54 weeks x 4 sessions x 25 min" }
        - { kind: memorization, hours: 35, note: "daily grammar recitation of all paradigms, 54 weeks x 4 x 10 min" }
    curriculumOptions:
      - name: First Form & Second Form Latin
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/latin/first-form-latin-set/"
        notes: >-
          "Grammar-first" design. Streaming video lessons are available. Second Form set:
          https://www.memoriapress.com/curriculum/latin/second-form-latin-set/
        lessons: 65
        lessonLabel: lesson
        lessonsNote: "Memoria Press product pages: First Form 34 two-page lessons, Second Form 31"
      - name: Latin for Children, Primers B & C
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/pages/series-latin-for-children"
        notes: Continues the CAP chant approach. Leads into Latin Alive! for upper grades.
        lessons: 64
        lessonLabel: chapter
        lessonsNote: "Cathy Duffy review: 32 lessons (chapters) in each primer"
      - name: Latin Primer 2 & 3
        publisher: Canon Press
        tradition: protestant
        url: "https://canonpress.com/products/latin-primer-2-package"
        notes: Continuation of the Canon sequence.
      - name: "Beginning Latin II & III (MODG)"
        publisher: "Mother of Divine Grace School"
        tradition: catholic
        url: "https://books.modg.org/beginning-latin-ii-bundle"
        notes: "Grades 4–5 of MODG's own sequence (Beginning Latin III at https://books.modg.org/beginning-latin-iii-bundle). It continues with Fundamentals of Latin Grammar I–II in grades 6–7. A Catholic option, not a requirement."
      - name: "Course Plan & Tests: First Form Latin"
        publisher: "Kolbe Academy"
        tradition: catholic
        url: "https://books.kolbe.org/products/course-plans-tests-form-latin-1"
        notes: "Kolbe's Catholic lesson plan and tests for Memoria's First Form Latin."
        lessons: 34
        lessonLabel: lesson
        lessonsNote: "Follows First Form Latin: 34 lessons (Memoria Press product page)"
      - name: "TRV-221 Latin Grammar I (Alvarez)"
        publisher: "Classical Liberal Arts Academy"
        tradition: catholic
        url: "https://classicalliberalarts.com/catalog/online-courses/trivium/trv-221-latin-grammar-i/"
        notes: "Online course in the forms (orthography and etymology) from the 16th-century Jesuit grammar of Emmanuel Alvarez. Self-paced. The link was confirmed from search listings rather than the page itself."

  - id: latin-04
    title: "Latin IV: Grammar Completion (Syntax & the Subjunctive)"
    type: course
    level: early-5
    stage: formal
    ageStart: 10
    ageEnd: 12
    order: 4
    prerequisites: [latin-03]
    summary: >-
      This year completes the whole of Latin grammar: participles, infinitives and indirect
      statement, the subjunctive and its uses (purpose, result, cum-clauses, indirect question,
      conditions), gerunds and gerundives, and deponent verbs. Choose one main text. The three
      options stand for three pedagogies: the Catholic Jesuit grammar-translation approach
      (Henle), the university compressed course (Wheelock), and the natural or reading method
      (Ørberg). Many families pair Ørberg with one of the others.
    objectives:
      - Master the subjunctive mood and the sequence of tenses
      - Translate ablative absolutes, indirect statement, gerunds and gerundives accurately
      - Read 20–30 lines of adapted connected Latin at a sitting without looking up forms
      - Command a working vocabulary of about 1,000 words (DCC Latin Core List)
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 190, note: "one main grammar (Henle I, Wheelock or Ørberg) over 2 years, 72 weeks x 4 sessions x 40 min" }
        - { kind: memorization, hours: 40, note: "DCC core list to about 1,000 words, flashcards 72 weeks x 4 x 8 min" }
    coreTexts:
      - title: Latin Core Vocabulary (1,000 most common words)
        kind: instructional
        reader: student
        author: Dickinson College Commentaries
        publicDomain: false
        links:
          - { label: DCC (free online), url: "https://dcc.dickinson.edu/latin-core-list1" }
    curriculumOptions:
      - name: Henle Latin, First Year (with Memoria Press guides)
        publisher: Memoria Press / Loyola Press (Robert J. Henle, S.J.)
        tradition: catholic
        url: "https://www.memoriapress.com/curriculum/latin/henle-latin-i-set/"
        notes: >-
          The 1945 Jesuit series that descends from the Ratio Studiorum. Its exercises mix Roman,
          American and Christian content. Memoria's Third and Fourth Form cover the same syntax
          for younger students. Also sold by Christianbook
          (https://www.christianbook.com/henle-latin-1-text-first-year/robert-henle/9780829410266/pd/646687).
      - name: Wheelock's Latin (7th ed.)
        publisher: HarperCollins
        tradition: secular
        url: "https://www.harpercollins.com/products/wheelocks-latin-7th-edition-frederic-m-wheelockrichard-a-lafleur"
        notes: >-
          The standard US college text, with every chapter built on real sentences from Cicero,
          Virgil and others. Too dense for most 10-year-olds unless paced over two years.
        lessons: 40
        lessonLabel: chapter
        lessonsNote: "Wikipedia, Wheelock's Latin: the seventh edition has forty chapters (capita)"
      - name: "Lingua Latina per se Illustrata, Pars I: Familia Romana"
        publisher: Hackett Publishing (Hans Ørberg)
        tradition: secular
        url: "https://hackettpublishing.com/lingua-latina-per-se-illustrata-series/familia-romana-part-i"
        notes: >-
          The whole book is in Latin, and grammar is learned from context. It builds real reading
          fluency and pairs well with Henle or Wheelock for explicit grammar. Pars II (Roma
          Aeterna) moves into Livy, Virgil and Cicero.
        lessons: 35
        lessonLabel: chapter
        lessonsNote: "Hackett product page: thirty-five chapters, each divided into two or three lectiones"
      - name: North American Cambridge Latin Course (Units 1–4)
        publisher: Cambridge University Press
        tradition: secular
        url: "https://www.cambridge.org/us/education/subject/classics/latin/north-american-cambridge-latin-course-5th-edition"
        notes: >-
          A story-based reading course set in Pompeii, Roman Britain and Rome. Rich in culture
          but slower on forms. Best used as a supplementary reader, not as the main grammar here.
      - name: "Ossa Latinitatis Sola: The Mere Bones of Latin (Latinitatis Corpus I)"
        publisher: Catholic University of America Press (Reginald Foster & Daniel McCarthy)
        tradition: catholic
        url: "https://www.cuapress.org/9780813228327/ossa-latinitatis-sola-ad-mentem-reginaldi-rationemque/"
        notes: >-
          The method of Fr. Reginald Foster, O.C.D., papal Latinist 1969–2009, set out in 105
          "encounters" over three "Experiences" and read from real Latin of every age, pagan and
          Christian, from the start. It is written for adults, so a parent works through it
          alongside the child or it is used from about 12 as a second pass after Henle or
          Wheelock. Fr. McCarthy's site (https://thelatinlanguage.org/ossa/) has readings, errata
          and course listings. The Liturgy Institute (London) teaches two-week online and in-person
          courses straight from the book, with Pooley's Ossa Ostensa workbook; they admit adults
          (18+), so they suit a parent learning ahead of the child
          (https://liturgyinstitute.org/la411/). Ossium Carnes Multae (latin-11) continues the method.
        lessons: 105
        lessonLabel: lesson
        lessonsNote: "BMCR 2018.08.31 review: 105 encounters (lessons) over three years of study"
      - name: "Latin 1 (Henle): Books, Tests, Keys & CD"
        publisher: "Seton Home Study School"
        tradition: catholic
        url: "https://setonbooks.com/foreign-language/1891-latin-1-books-tests-keys-cd.html"
        notes: "Seton's high-school Latin 1 set: Henle First Year text and key, grammar, tests and a pronunciation CD."
      - name: "Course Plan & Tests: Henle Latin I"
        publisher: "Kolbe Academy"
        tradition: catholic
        url: "https://books.kolbe.org/products/course-plans-tests-henle-latin-i"
        notes: "Kolbe also teaches Henle Latin I–IV as self-paced and live online courses."
      - name: "Henle Latin: First Year (recorded course)"
        publisher: "Homeschool Connections"
        tradition: catholic
        url: "https://caravel.homeschoolconnections.com/catalog/1676748838"
        notes: "Recorded Catholic online class for middle and high school, in two semesters (Part Two follows). Optional graded instructor access."
        lessons: 12
        lessonLabel: lesson
        lessonsNote: "Homeschool Connections catalog page: 12 recorded classes"
      - name: "Latin I – Live Online Course (Wheelock)"
        publisher: "Veritas Press (Veritas Scholars Academy)"
        tradition: protestant
        url: "https://store.veritaspress.com/latin-i-live-online-course.html"
        notes: "Live online class covering Wheelock's Latin, chapters 1–22. Latin II covers chapters 23–40."
        lessons: 22
        lessonLabel: chapter
        lessonsNote: "Veritas Press course page: Wheelock's Latin chapters 1-22"
    historicalPrecedent: >-
      The Jesuit Ratio Studiorum (1599) set out three grammar classes (lower, middle and upper)
      before Humanities and Rhetoric. Henle's four-year series is its twentieth-century American
      heir.
    notes: >-
      A Catholic/Protestant difference: Henle's reading content is openly Catholic (saints, the
      Church, Christian Rome). Protestant classical schools (Classical Conversations Challenge,
      for example) also use Henle widely and simply read past the confessional material.

  - id: latin-05
    title: "Graded Readers: Fabulae Faciles, Corderius, Erasmus & Eutropius"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10.5
    ageEnd: 12
    order: 5
    prerequisites: [latin-03]
    related: [greek-07]
    summary: >-
      Wide, easy, connected reading alongside grammar completion. Ritchie's Fabulae Faciles tells
      the stories of Perseus, Hercules, the Argonauts and Ulysses in simplified Latin. Corderius's
      and Erasmus's Colloquies are the school dialogues colonial boys actually read. Eutropius's
      Breviarium gives the whole of Roman history in plain classical prose. The goal is volume
      and speed.
    objectives:
      - Read Fabulae Faciles through, about 60 pages of Latin
      - Read 20+ of Corderius's and several of Erasmus's Colloquies, and act out one aloud
      - Read Eutropius Books I–II (kings and early Republic) as a historical reader
      - Sustain 15 minutes of reading without stopping to parse every word
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 50, note: "about 200 pp of Latin text (Fabulae Faciles ~60, Corderius and Erasmus ~45, Eutropius I–II ~15, Phaedrus ~80) read for speed at ~4 pp/h; the counted 547 pp include notes, vocabularies and a third of the whole Colloquia" }
        - { kind: recitation, hours: 4, note: "acting out a colloquy aloud, with rehearsal" }
    coreTexts:
      - title: "Ritchie's Fabulae Faciles: A First Latin Reader"
        kind: instructional
        reader: student
        pages: 134
        lessons: 100
        lessonLabel: section
        lessonsNote: "Project Gutenberg text: 100 numbered sections (Perseus, Hercules, the Argonauts, Ulysses)"
        author: Francis Ritchie (ed. J. C. Kirtland)
        date: "1884 (US ed. 1903)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/8997" }
          - { label: "Steadman edition with facing vocabulary (free PDF)", url: "https://geoffreysteadman.com/ritchies-fabulae-faciles/" }
      - title: "Colloquiorum Centuria Selecta (Corderius's school colloquies, Willymot ed.)"
        kind: instructional
        reader: student
        pages: 122
        lessons: 100
        lessonLabel: section
        lessonsNote: "Archive.org 1831 scan: a centuria of 100 numbered colloquies"
        author: Mathurin Cordier
        date: "1564 (this ed. 1831)"
        publicDomain: true
        role: selections
        portion: "20+ colloquies"
        links:
          - { label: Archive.org, url: "https://archive.org/details/maturinicorderi00cordgoog" }
      - title: Colloquia (Colloquies)
        kind: primary
        reader: student
        pages: 650
        author: Desiderius Erasmus
        date: "1518–1533"
        publicDomain: true
        role: selections
        portion: "several colloquies"
        links:
          - { label: "The Latin Library (Latin)", url: "https://www.thelatinlibrary.com/erasmus/coll.shtml" }
          - { label: "Project Gutenberg (English trans., vol. I)", url: "https://www.gutenberg.org/ebooks/14031" }
      - title: Breviarium ab Urbe Condita
        kind: primary
        reader: student
        pages: 164
        author: Eutropius
        date: "c. 369"
        publicDomain: true
        role: selections
        portion: "Books I–II"
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/eutropius.html" }
          - { label: "Dickinson College Commentaries (notes)", url: "https://dcc.dickinson.edu/eutropius/breviarium-preface" }
      - title: Fabulae (Aesopic fables in verse)
        kind: primary
        reader: student
        pages: 100
        author: Phaedrus
        date: "1st c."
        publicDomain: true
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/phaedrus.html" }
    curriculumOptions:
      - name: Lingua Latina, Familia Romana (reading supplement)
        publisher: Hackett Publishing
        tradition: secular
        url: "https://hackettpublishing.com/lingua-latina-per-se-illustrata-series"
        notes: If Ørberg was not the main text in latin-04, use it here as the extensive reader.
        lessons: 35
        lessonLabel: chapter
        lessonsNote: "Hackett product page: thirty-five chapters, each divided into two or three lectiones"
      - name: Latin Alive! (Books 1–3)
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/pages/series-latin-alive"
        notes: Upper-school course with many adapted readings from real authors.
      - name: "Little Latin Readers, Premium Series"
        publisher: "Little Latin Readers"
        tradition: catholic
        url: "https://littlelatinreaders.com/for-homeschools/"
        notes: "Catholic graded readers for grades 6–8 with drills, Latin prayers and liturgical quotations. Gentler than Fabulae Faciles, so it is a bridge or a supplement."
    historicalPrecedent: >-
      Boston Latin School, 1789: "Corderius's Colloquies — Latin and English… Aesop's Fables —
      Latin and English… Eutropius". Otis also recalled "Clarke's Introduction" and "making
      Latin" from Garretson's Exercises in the fourth year. Erasmus's Colloquies were read in
      English and colonial grammar schools from Milton's day onward.
    sources:
      - { label: "Catalogue of the Boston Public Latin School (1886)", url: "https://archive.org/details/catalogueofbosto00bostuoft" }

  - id: latin-06
    title: "Reference Grammars: Bennett, Allen & Greenough, Gildersleeve"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 18
    order: 6
    prerequisites: [latin-04]
    related: [greek-06]
    summary: >-
      The student learns to use a full scholarly reference grammar, the habit of the
      nineteenth-century schoolboy. Bennett is compact enough for daily use. Allen & Greenough is
      the standard American citation grammar ("A&G §419"). Gildersleeve & Lodge serves the
      advanced student and composition. From here on, every commentary note is looked up.
    objectives:
