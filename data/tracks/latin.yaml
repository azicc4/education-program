  - id: latin-14
    title: "Horace: Odes, Satires & Epistles (with the Ars Poetica)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 15.5
    order: 14
    prerequisites: [latin-12]
    related: [old-english-03]
    exams: [ap-latin]
    summary: >-
      The poet of the golden mean, contentment and friendship, and the most quoted Latin author
      in eighteenth-century English letters. The student reads selected Odes (I.9, I.11, II.3,
      II.10, III.1–6 "Roman Odes", III.30), two Satires and the Ars Poetica. He learns the lyric
      metres (Alcaic, Sapphic, Asclepiad) and builds a stock of tags for conversation and
      writing.
    objectives:
      - Read 25–30 Odes and scan the Alcaic, Sapphic and Asclepiad metres
      - Read the Ars Poetica and summarize its precepts on poetry
      - Memorize five Odes (e.g. I.11 "carpe diem", III.2 "dulce et decorum", III.30 "exegi monumentum")
      - Imitate one Horatian ode in English verse
    coreTexts:
      - title: Carmina, Sermones, Epistulae, Ars Poetica
        reader: student
        pages: 350
        author: Horace
        date: "c. 35–13 BC"
        publicDomain: true
        links:
          - { label: The Latin Library, url: "https://www.thelatinlibrary.com/hor.html" }
    curriculumOptions:
      - name: Wheelock's Latin Reader
        publisher: HarperCollins
        tradition: secular
        url: "https://www.christianbook.com/wheelocks-reader-2nd-edition-selections-literature/frederic-wheelock/9780060935061/pd/935061"
        notes: Contains Horace and Catullus selections with notes.
    historicalPrecedent: >-
      Horace was set in Boston's highest class in 1789 ("Greek Testament. Horace. Homer.").
      Jefferson names Horace among the school poets. Eton and Westminster boys memorized Horace
      in bulk and composed Latin lyric verse on his model.

  - id: latin-15
    title: "Latin Composition II: Advanced Prose & Verse"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 16.5
    order: 15
    prerequisites: [latin-08, latin-12]
    related: [poetry-10]
    summary: >-
      The capstone of "making Latin". The student writes continuous Ciceronian prose from English
      originals (a Federalist paragraph, a Burke passage, a Washington letter) and composes Latin
      elegiacs and hexameters with a Gradus ad Parnassum. The aim is to write a Latin letter, speech
      or dedication with confidence.
    objectives:
      - Complete North & Hillard's continuous-prose passages (Part II)
      - Render a 250-word English passage into periodic Ciceronian Latin
      - Compose 12 correct elegiac couplets on a set theme
      - Write and deliver a short Latin oration (3–5 minutes)
    coreTexts:
      - title: Latin Prose Composition for the Middle Forms of Schools
        reader: student
        pages: 299
        author: M. A. North & A. E. Hillard
        date: "1895"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/north-m.-hilladr-a.-latin-prose-composition-1913" }
      - title: "A Practical Introduction to Latin Prose Composition (Bradley's Arnold), Part III"
        reader: student
        author: T. K. Arnold, rev. G. G. Bradley
        date: "1884"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/practicalintrod00arnouoft" }
    curriculumOptions:
      - name: "Live online classes and tutors"
        publisher: Scholé Academy (Classical Academic Press)
        tradition: classical
        url: "https://scholeacademy.com/"
        notes: "Live online classical language courses with expert teachers. Useful if a local tutor is not available."
    historicalPrecedent: >-
      Boston 1789, highest class: "Gradus ad Parnassum. The making of Latin continued." English
      public schools (Eton, Rugby, Shrewsbury) made Latin verse composition the crown of the Sixth
      Form. Harvard 1642 required candidates to "make and speake true Latine in Verse and Prose".
    notes: >-
      Done with a tutor (the family has tutors available): prose and verse composition need an expert to
      correct the student's exercises line by line. A tutor able to correct Latin proses is almost
      essential. Consider an online Latin prose-composition tutor or a university classicist.

  - id: latin-16
    title: "Ecclesiastical Latin II: Augustine, Bede & Aquinas"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16.5
    order: 16
    prerequisites: [latin-10, latin-11]
    related: [old-english-02]
    summary: >-
      Patristic and medieval Latin prose. The student reads selections from Augustine's
      Confessions (Book I and the conversion in Book VIII) and Bede's Ecclesiastical History
      (Caedmon, Gregory and the Angles). He then turns to Thomas Aquinas: the Eucharistic hymns
      (Pange Lingua, Adoro Te) and the scholastic article form of the Summa (e.g. I q.2 a.3, the
      Five Ways). He learns how Christian Latin reshaped classical prose.
    objectives:
      - Read Confessions I and VIII in Latin
      - Read Bede HE IV.24 (Caedmon) and II.1 (Gregory and the English slaves)
      - Read and outline three articles of the Summa Theologiae in Latin (objections, sed contra, respondeo, replies)
      - Memorize Adoro Te Devote or Pange Lingua
