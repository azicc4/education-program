    historicalPrecedent: >-
      Harvard, 1642: admission required reading "Tully, or such like classicall Latine Author
      extempore". Graduates then defended Latin theses in public. Colonial college libraries and
      curricula (Harvard, Yale, William & Mary, King's) assumed Latin as a working language for
      theology, law and natural philosophy. Jefferson's Latin let him read Grotius, Pufendorf and
      Coke's Latin sources directly.
