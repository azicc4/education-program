    ageEnd: 18.5
    order: 18
    prerequisites: [latin-16, latin-11, latin-14]
    summary: >-
      The finishing course. The student reads the narrative books of the Confessions (I–IX) in Latin and a sequence
      of Summa questions (e.g. on law, I-II qq.90–97, which is foundational for natural-law
      political thought). He reads selections of Neo-Latin (Erasmus, Thomas More's Utopia, Grotius)
      and practises regular sight-reading of unseen passages from any period. The test is the
      Harvard standard of reading Tully (and, from 1655, Virgil) "ex tempore". Elective: Confessions
      X and the rest of Erasmus's Institutio.
    objectives:
      - Read Confessions I–IX in Latin
      - Read Summa Theologiae I-II qq.90–97 (the Treatise on Law) in Latin
      - Translate an unseen passage of Cicero, Livy or Virgil at sight with minimal help
      - Read a Neo-Latin political text (More, Erasmus's Institutio Principis Christiani, or Grotius)
