      Harvard's 1642 admission rule named Tully (Cicero); Virgil was added to the requirement by the 1655 laws. In Boston 1789 the upper
      classes read Virgil, and Otis recalled "the first books of the Aeneid". In the 1880s the
      Boston Latin Fourth Class read Aeneid I–II and the Third Class Aeneid III–V and the
