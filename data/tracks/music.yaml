    summary: >-
      The grammar of Western art music: four-part chorale harmony (voice leading, diatonic and chromatic
      chords, modulation, non-chord tones), figured bass, and Fux's five species of counterpoint. Fux's
      Gradus ad Parnassum (1725) taught Haydn, Mozart and Beethoven. Harmonizing Bach chorales is the
      traditional proof of mastery.
    objectives:
      - Write two- and three-voice counterpoint in all five species (Fux)
      - Harmonize a melody or figured bass in four parts with correct voice leading, including secondary dominants and modulation to related keys
      - Analyze Bach chorales and Classical sonata expositions with Roman numerals
      - Reach ABRSM Grade 6–8 theory or Advanced Placement Music Theory level
