  - id: music-14
    title: "College: Music as a Liberal Art, from Boethius to the Western Canon"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 14
    prerequisites: [music-11, music-12]
    related: [philosophy-08, mathematics-12, mathematics-21]
    summary: >-
      A college seminar on music as the quadrivial art of number in time. Read Plato (Republic III, Timaeus),
      Aristotle (Politics VIII), Augustine's De musica, Boethius's De institutione musica (musica mundana,
      humana, instrumentalis) and the treatises and documents in Strunk's Source Readings, through Zarlino,
      Rameau and the Romantics. Pair the reading with advanced harmony and analysis of major works, and ask
      what music does to the soul and to the city.
    objectives:
      - Read Boethius Book I in full and explain the Pythagorean ratios of the consonances and the threefold division of music
      - Trace the idea of music's ethical power from Plato to Pius X and Benedict XVI
      - Complete a harmony-and-analysis sequence equivalent to two college semesters (chromatic harmony, form, analysis of a sonata movement and a fugue)
      - Write a seminar paper on music and moral formation
    workload:
      readingHours: 40
      readingBasis: "710 pp: Boethius Book I ~77 pp at ~12 pp/h (6 h), Strunk selections ~517 pp at ~20 pp/h (26 h), Consolation 116 pp at ~20 pp/h (6 h); Plato, Aristotle and Augustine are named but have no counted texts"
      work:
        - { kind: exercises, hours: 150, note: "chromatic harmony, form and analysis of a sonata movement and a fugue, equivalent to two college semesters, ~30 wk x 5 h" }
        - { kind: discussion, hours: 45, note: "seminar on music's ethical power from Plato to Benedict XVI, 30 wk x 1.5 h" }
        - { kind: writing, hours: 20, note: "a seminar paper on music and moral formation" }
