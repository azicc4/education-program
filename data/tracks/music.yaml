track: music
title: Music
trackGroup: Arts & Body
description: >-
  Music was one of the seven liberal arts, and for Plato and Boethius it was a discipline that orders
  the soul. This track treats it as both performing art and liberal art. It begins with the singing voice:
  folk song and solfège in the Kodály tradition, or the Catholic Ward Method built on Gregorian chant
  (6–10). An instrument follows (piano or violin, with recorder as a first reading instrument), then graded
  theory, and the great repertories of the Church: Gregorian chant from the Liber Usualis, Catholic and
  Protestant hymnody, and Renaissance polyphony sung in choir (7–16). Music history and appreciation run
  alongside, then harmony, species counterpoint and composition (12–16), and a college capstone on music as
  a liberal art from Boethius's De institutione musica through the Western tradition (17–18). The end state
  is a graduate who sings at sight, plays one instrument at an intermediate-to-advanced grade, reads and
  writes four-part harmony, knows chant and the major composers and periods, and can explain why the
  ancients placed music among the arts of number.
rows:
  - id: music-01
    title: "Singing and Solfège: Kodály Foundations"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 8
    order: 1
    prerequisites: []
    related: [early-development-10, poetry-02]
    summary: >-
      Formal music begins with the voice. The Kodály approach teaches pitch through movable-do solfège and
      hand signs, rhythm through spoken syllables, and repertoire through the child's own folk songs,
      moving from sound to sign to symbol. By eight the child sings in tune, keeps a steady beat, and reads
      simple melodies in stick notation and on the staff.
    objectives:
      - Sing 50 or more folk songs, rounds and singing games in tune with a light head voice
      - Use Curwen hand signs and solfège for the pentatonic scale (s-m, l, d-r), then the full diatonic scale
      - Read and clap quarter, eighth and half notes and rests with rhythm syllables
      - Sing simple two-part rounds and ostinati
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 35, note: "Kodály lessons or children's choir: solfège, hand signs and rhythm syllables, 72 wk x ~30 min" }
        - { kind: practice, hours: 35, note: "singing folk songs, rounds and singing games at home, 72 wk x 3 x ~10 min" }
    curriculumOptions:
      - name: Kodály-certified teachers and programs (OAKE)
        publisher: Organization of American Kodály Educators
        tradition: secular
        url: "https://www.oake.org/"
        notes: Find a Kodály-trained teacher or children's choir. Materials are folk-song based.
      - name: British Kodály Academy (courses and resources)
        publisher: British Kodály Academy
        tradition: secular
        url: "https://www.kodaly.org.uk/"
        notes: UK counterpart, with good parent and teacher courses.
      - name: "Discovering Art & Music in the Younger Years, Vol. 1"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/discovering-art-music-in-the-younger-years-set/"
        notes: Classical Christian introduction to great works of art and music for the early grades.
    historicalPrecedent: >-
      Zoltán Kodály's method became the basis of Hungarian national music education after 1945. Its roots are
      older: Guido of Arezzo's syllables (ut-re-mi, c. 1025) and John Curwen's tonic sol-fa and hand signs
      (England, 1840s–1870s), which taught millions of Victorian children to sing at sight.

  - id: music-02
    title: "The Ward Method: Chant-Based Musicianship"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 10
    order: 2
    prerequisites: [music-01]
    related: [theology-02, latin-10]
    summary: >-
      Justine Ward's method, developed from about 1910 with Fr. Thomas Shields of the Catholic University of America in response to
      Pius X's call for the restoration of Gregorian chant, trains children's voices, ear, rhythm and sight
      reading (numbered notation and then staff) and leads them into singing the chant of the liturgy.
      It is the Catholic alternative or complement to Kodály, and both use movable do.
    objectives:
      - Develop a pure, light vocal tone through Ward's daily vocal exercises
      - Sight-sing in number notation and then staff notation, and take melodic dictation
      - Conduct and feel free "chironomic" chant rhythm (arsis and thesis)
      - Sing the ordinary chants of a simple Mass (for example Mass XVIII) and common Latin hymns (Adoro te, Salve Regina)
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 70, note: "Ward lessons: vocal exercises, number and staff sight-singing, dictation and chironomy, 3 yr x 36 wk x 2 x 20 min" }
        - { kind: practice, hours: 25, note: "singing Mass XVIII and the common Latin hymns, 3 yr x 36 wk x ~14 min" }
    coreTexts:
      - title: "Music: First Year (Ward Method)"
        kind: instructional
        reader: teacher
        lessons: 36
        lessonLabel: chapter
        lessonsNote: "Archive.org scan table of contents: Chapters 1-36 in two parts"
        order: 1
        pace: long
        author: Justine Bayard Ward
        date: "1914"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/MusicFirstYear" }
      - title: "Music: Third Year, Teacher's Manual"
        kind: instructional
        reader: teacher
        lessons: 36
        lessonLabel: chapter
        lessonsNote: "Archive.org scan: Chapters One to Thirty-Six, each about one week's work"
        order: 2
        pace: long
        author: Justine Bayard Ward
        date: "1919"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/MusicThirdYear" }
    curriculumOptions:
      - name: Ward Method (teacher training and contacts)
        publisher: Church Music Association of America
        tradition: catholic
        url: "https://musicasacra.com/ward-method/"
        notes: CMAA keeps the Ward Method alive through courses and a list of certified teachers.
      - name: Kodály continuation (OAKE)
        publisher: Organization of American Kodály Educators
        tradition: secular
        url: "https://www.oake.org/"
        notes: The non-liturgical path, continuing the music-01 sequence.
    historicalPrecedent: >-
      Pius X, Tra le sollecitudini (1903), called for the use of Gregorian chant by the people to be restored.
      Ward's method was taught in thousands of American Catholic schools in the 1920s–1950s and in Europe.
    sources:
      - { label: "Pius X, Tra le sollecitudini (1903), English (Adoremus)", url: "https://www.adoremus.org/1903/11/tra-le-sollecitudini/" }

  - id: music-03
    title: "Instrument I: Practice, Musicianship and Repertoire (Piano or Violin)"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 10
    order: 3
    prerequisites: []
    related: [music-lessons-01, music-lessons-03, music-lessons-04]
    summary: >-
      The musicianship side of the child's primary instrument, piano for harmony and keyboard literacy or
      violin for ear and ensemble playing, taken alongside weekly private lessons. The child learns to practice
      daily (15–30 minutes, rising with age) from a written plan, connects what he plays to solfège and
      notation, listens to the repertoire he is learning, and performs. Aim to reach about ABRSM/RCM Grade 3 by 10.
    objectives:
      - Practice daily with a written practice plan kept by the student and checked by a parent
      - "Piano: five-finger positions to hands-together playing, scales and arpeggios in keys to 2 sharps and flats, Grade 1–3 repertoire (Bach Anna Magdalena, Clementi sonatinas)"
      - "Violin: posture, bow hold, first position, Suzuki Books 1–3 or equivalent"
      - Perform in a recital two or more times a year
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 35, note: "musicianship tying his pieces to solfège and notation, and keeping the written practice plan, 4 yr x 36 wk x 15 min" }
        - { kind: practice, hours: 45, note: "listening to recordings of the repertoire, 4 yr x 36 wk x 15 min (36 h), plus 8 or more recitals with dress rehearsals (~10 h); daily instrument practice and lessons are counted in the Music Lessons track" }
    curriculumOptions:
      - name: Suzuki Method
        publisher: Suzuki Association of the Americas
        tradition: secular
        url: "https://suzukiassociation.org/"
        notes: Ear-first "mother-tongue" method with a parent in lessons. Strong for violin from 4–6. Add note reading early.
      - name: Piano Adventures
        publisher: Faber Piano Adventures
        tradition: secular
        url: "https://pianoadventures.com/"
        notes: The most widely used reading-based piano method. Pair with a private teacher.
      - name: Hoffman Academy (online piano)
        publisher: Hoffman Academy
        tradition: secular
        url: "https://www.hoffmanacademy.com/"
        notes: Low-cost video piano lessons with solfège and ear training. A bridge where no teacher is available.
    historicalPrecedent: >-
      Jefferson played the violin for much of his life, and Franklin invented the glass armonica. Locke (§197),
      by contrast, thought music took too much time for a gentleman to gain "but a moderate skill" in it.
      This program sides with the ancients and Jefferson.
    sources:
      - { label: "Locke, Some Thoughts Concerning Education §197 (Archive.org)", url: "https://archive.org/details/somethoughtsconc00lockuoft" }
    notes: >-
      The lesson progression itself (teachers, method books, graded levels) lives in the Music Lessons track
      (music-lessons-01, -03 and -04). This row covers the practice habits, musicianship and repertoire study
      that complement those lessons.

  - id: music-04
    title: "Recorder and Reading Music"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 9
    order: 4
    prerequisites: [music-01]
    related: []
    summary: >-
      The soprano recorder is a cheap, portable first melodic instrument that makes staff reading concrete.
      Alongside it, the student learns the rudiments of notation: the staff and clefs, note and rest values,
      meter, key signatures to one sharp or flat, and basic musical terms. Combined with singing, this gives
      the student full musical literacy for early grades.
    objectives:
      - Play a one-octave diatonic range on soprano recorder (B-A-G first), reading from the staff
      - Play 30 or more folk tunes, hymn melodies and simple duets
      - Name notes on treble and bass staves, and read and write simple and compound meters
      - Know basic Italian tempo and dynamic markings
    workload:
      readingHours: 0
      work:
        - { kind: practice, hours: 50, note: "recorder, ~4 x 10 min a week x 72 wk, toward 30 or more tunes and duets" }
        - { kind: exercises, hours: 30, note: "notation rudiments (Reading Music) and musictheory.net drills, 72 wk x 25 min" }
    curriculumOptions:
      - name: "Reading Music: Introduction to Music Theory"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/reading-music/"
        notes: Rhythm, meter and notation text, workbook and teacher guide for the grammar years.
      - name: musictheory.net (free lessons and drills)
        publisher: musictheory.net
        tradition: secular
        url: "https://www.musictheory.net/"
        notes: Free note-reading, key and interval drills. Use as daily practice.
    notes: >-
      No specific recorder method book is listed. Most Kodály and Orff classroom recorder methods work well.

  - id: music-05
    title: "Hymnody: The Catholic and Protestant Hymn Traditions"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 12
    order: 5
    prerequisites: [music-01]
    related: [poetry-06, theology-02]
    summary: >-
      Memorize one great hymn a month (text and tune) across five years, covering the Latin office hymns of
      Ambrose and Aquinas, the Lutheran chorale, the metrical psalms, Watts and Wesley, the Victorian hymn
      writers, and American spirituals. Hymns are among the best poetry most children memorize and the
      shared song of Christian worship. Learn to sing the parts once voices allow.
    objectives:
      - Memorize 60 or more hymns (text and tune), including the major Latin, Lutheran, English and American hymns
      - Know the author, era and tradition of each hymn and the meter name (Common, Long, 8.7.8.7)
      - Sing hymns in parts (soprano/alto, then tenor/bass) from a hymnal
      - Compare a psalm with Watts's paraphrase of it
    workload:
      readingHours: 9
      readingBasis: "132 pp of Watts (psalm paraphrases and Divine Songs) read together at ~15 pp/h (verse)"
      work:
        - { kind: memorization, hours: 60, note: "60 hymns, text and tune, ~1 h each over a month of daily repetition" }
        - { kind: practice, hours: 18, note: "singing in parts from a hymnal once voices allow, ~2 yr x 36 wk x 15 min" }
        - { kind: exercises, hours: 10, note: "author, era, tradition and meter name for each hymn, 60 x 10 min" }
        - { kind: writing, hours: 3, note: "a psalm compared with Watts's paraphrase of it" }
    coreTexts:
      - title: The Psalms of David Imitated in the Language of the New Testament
        kind: primary
        reader: together
        pages: 312
        role: selections
        author: Isaac Watts
        date: "1719"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/13166" }
      - title: Divine Songs for Children
        kind: primary
        reader: together
        pages: 28
        author: Isaac Watts
        date: "1715"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/13439" }
    curriculumOptions:
      - name: "Adoremus Hymnal (2nd ed.)"
        publisher: Ignatius Press
        tradition: catholic
        url: "https://ignatius.com/adoremus-hymnal-standard-edition-2nd-edition-adh2ch/"
        notes: Catholic hymnal with Latin chant, the great English hymns and the Mass ordinaries.
      - name: "Cantus Christi 2020: Psalter & Hymnal"
        publisher: Canon Press
        tradition: protestant
        url: "https://canonpress.com/products/cantus-christi-2020-psalter-hymnal"
        notes: Reformed psalter-hymnal used by many classical Christian schools, with metrical psalms and hymns in parts.
    historicalPrecedent: >-
      The Bay Psalm Book (1640) was the first book printed in British North America. Watts's Psalms and Hymns
      and the Wesleys' hymns were the most sung texts in 18th- and 19th-century America.
    notes: >-
      Catholic and Protestant note: Catholic practice gives pride of place to Gregorian chant and Latin hymns
      in the liturgy (Sacrosanctum Concilium 116) and also uses vernacular hymns. The Reformed tradition
      emphasizes metrical psalm-singing, and Lutheran and Anglican/Methodist traditions center on the chorale and
      the English hymn. Many great hymns are shared by both, and either hymnal serves.

  - id: music-06
    title: "Music Appreciation I: Composers and the Orchestra"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 11
    order: 6
    prerequisites: [music-01]
    related: []
    summary: >-
      Listen closely to one composer a term (Charlotte Mason's "composer study"), with a short biography, the
      instruments of the orchestra, and the main forms (fugue, sonata, symphony, concerto, opera, mass).
      Go to live concerts. The aim is familiarity and love: the child knows Bach, Handel, Haydn, Mozart and
      Beethoven as well as he knows the heroes of his history books.
    objectives:
      - Study 12 or more major composers from Palestrina to Dvořák, and recognize their best-known works by ear
      - Identify the instruments and sections of the orchestra by sight and sound
      - Attend 4 or more live concerts or services with sacred music a year
      - Narrate a composer's life and describe a listened-to work in simple musical vocabulary
    workload:
      readingHours: 10
      readingBasis: "240 pp of Brower's story-lives of composers at ~25 pp/h"
      work:
        - { kind: exercises, hours: 80, note: "composer study: guided listening and lessons on instruments and forms, 108 wk x 30 min (54 h), plus 12 or more live concerts or services x 2 h" }
        - { kind: discussion, hours: 18, note: "narrating composers' lives and describing works heard, 108 wk x 10 min" }
    coreTexts:
      - title: "The World's Great Men of Music: Story-Lives of Master Musicians"
        kind: secondary
        reader: student
        pages: 240
        author: Harriette Brower
        date: "1922"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/13291" }
    curriculumOptions:
      - name: Music Appreciation I Set (book and audio)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/music-appreciation-i-set/"
        notes: Twenty-six canonical works set in historical context.
      - name: Zeezok Music Appreciation (composer biographies)
        publisher: Zeezok Publishing
        url: "https://www.zeezok.com/"
        notes: Nondenominational Christian publisher. Uses Opal Wheeler's classic composer biographies with activity books.

  - id: music-07
    title: "Gregorian Chant and the Liber Usualis"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 13
    order: 7
    prerequisites: [music-02]
    related: [latin-10, theology-02]
    summary: >-
      Learn to read square notation on the four-line staff (neumes, clefs, the Solesmes rhythmic signs) and
      to sing the chant of the Mass and Office: the Ordinaries (Kyriale), seasonal antiphons, sequences
      (Victimae paschali, Veni Sancte Spiritus), office hymns and psalm tones. Chant is the foundation of
      Western music and its Latin reinforces the Latin track. The student should end able to sing a simple
      sung Mass and Vespers.
    objectives:
      - Read square notation in do and fa clefs, and sing neumes (podatus, clivis, torculus, porrectus, and others) correctly
      - Sing the eight psalm tones and chant a psalm with its antiphon
      - Sing three or more Mass Ordinaries (e.g. I, VIII, XI, XVIII) and the four seasonal Marian antiphons
      - Translate and explain the Latin texts sung
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 70, note: "square notation, neumes, clefs and the eight psalm tones, 4 yr x 36 wk x 30 min" }
        - { kind: practice, hours: 50, note: "singing Mass Ordinaries, Marian antiphons, sequences and Vespers, 4 yr x 36 wk x 20 min; the Parish Book of Chant is sung, not counted as reading" }
        - { kind: translation, hours: 15, note: "translating and explaining the Latin texts sung, ~30 texts x 30 min" }
    coreTexts:
      - title: The Parish Book of Chant (2nd ed.)
        kind: primary
        reader: together
        author: Church Music Association of America
        date: "2012"
        publicDomain: false
        links:
          - { label: CMAA free PDF, url: "https://media.musicasacra.com/books/pbc_2nd.pdf" }
      - title: Liber Usualis (Solesmes)
        kind: primary
        reader: teacher
        pages: 1900
        role: reference
        author: Benedictines of Solesmes
        date: "1903 (later eds. to 1961)"
        publicDomain: true
        links:
          - { label: "Archive.org (1903 ed.)", url: "https://archive.org/details/liberusualismiss00cath" }
          - { label: "Archive.org (1961 ed.)", url: "https://archive.org/details/TheLiberUsualis1961" }
    curriculumOptions:
      - name: The Parish Book of Chant and CMAA resources
        publisher: Church Music Association of America
        tradition: catholic
        url: "https://musicasacra.com/"
        notes: Free chant books, summer Sacred Music Colloquium, and training in chant and polyphony.
      - name: "Early Sacred Music: From the Temple Through the Middle Ages"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/early-sacred-music-set/"
        notes: History-oriented course on psalmody, chant and early polyphony. Complements singing practice.
    sources:
      - { label: "Vatican II, Sacrosanctum Concilium (§116, chant's pride of place)", url: "https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19631204_sacrosanctum-concilium_en.html" }
    notes: >-
      Protestant families can take this as music history and Latin, or substitute psalm chanting (Anglican
      chant) using a psalter. The Liber Usualis is large, so the Parish Book of Chant is the practical
      student book.

  - id: music-08
    title: "Music Theory I: Graded Rudiments (ABRSM Grades 1–5)"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 12
    order: 8
    prerequisites: [music-04]
    related: []
    exams: [ap-music-theory]
    summary: >-
      A structured theory sequence through the graded exam syllabi: all major and minor keys and scales,
      intervals, triads and their inversions, cadences, simple and compound time, transposition, the C clefs,
      ornaments, instruments and terms. Sitting the ABRSM Grade 5 theory exam (or RCM equivalent) by about 12
      gives an external benchmark.
    objectives:
      - Write all major and minor (harmonic and melodic) scales and key signatures
      - Name and write all intervals and triads, and recognize perfect, imperfect, plagal and interrupted cadences
      - Transpose a melody by an interval and between clefs
      - Pass ABRSM Grade 5 theory or RCM Level 6–8 theory
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 100, note: "graded theory workbooks and musictheory.net drill through ABRSM Grades 1–5, 3 yr x 36 wk x ~55 min" }
        - { kind: exam-prep, hours: 15, note: "past Grade 5 (or RCM) theory papers under time and the exam itself" }
    curriculumOptions:
      - name: ABRSM Music Theory graded exams
        publisher: ABRSM
        tradition: secular
        url: "https://www.abrsm.org/en-us"
        notes: "The UK/international standard. Grade 5 theory is traditionally required before higher practical grades."
      - name: Royal Conservatory Certificate Program (theory levels)
        publisher: The Royal Conservatory of Music
        tradition: secular
        url: "https://www.rcmusic.com/learning/examinations"
        notes: North American equivalent, with practical and theory levels coordinated.
      - name: musictheory.net
        publisher: musictheory.net
        tradition: secular
        url: "https://www.musictheory.net/"
        notes: Free lessons and exercises for self-study and drill.

  - id: music-09
    title: "Instrument II: Repertoire Study, Performance and Service"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 14
    order: 9
    prerequisites: [music-03]
    related: [music-lessons-03, music-lessons-05, music-lessons-07]
    summary: >-
      Complements the graded private lessons on the primary instrument (to about Grade 6–7 by 14). The student
      studies the serious repertoire he is playing across periods (Bach inventions, Classical sonatas, Romantic
      character pieces, or for violin Vivaldi and Bach concertos) as music history and analysis, and puts the
      instrument at the service of the community in chamber music, orchestra, and accompanying hymns or choir.
    objectives:
      - Pass graded practical exams in sequence (ABRSM or RCM) to about Grade 6–7
      - Learn and perform 6 or more substantial pieces a year from contrasting periods
      - Play in a chamber group, orchestra or church ensemble, or accompany congregational hymns
      - Sight-read at two grades below the performance level
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 50, note: "studying his repertoire as music history and analysis, 6 or more pieces a year, 4 yr x 36 wk x 20 min" }
        - { kind: practice, hours: 60, note: "sight-reading drill, 4 yr x 36 wk x 15 min (36 h), plus service playing (hymns, choir or church ensemble), ~24 x 1 h; daily practice, lessons and ensemble rehearsals are counted in the Music Lessons track" }
        - { kind: exam-prep, hours: 15, note: "aural tests, scales and mock exams for ~4 graded practical exams" }
    curriculumOptions:
      - name: ABRSM practical graded exams
        publisher: ABRSM
        tradition: secular
        url: "https://www.abrsm.org/en-us"
        notes: Graded repertoire lists and sight-reading standards.
      - name: RCM Certificate Program
        publisher: The Royal Conservatory of Music
        tradition: secular
        url: "https://www.rcmusic.com/learning/examinations"
        notes: North American graded curriculum and exams.
      - name: Suzuki Method (continuing books)
        publisher: Suzuki Association of the Americas
        tradition: secular
        url: "https://suzukiassociation.org/"
        notes: For violin students continuing in Suzuki studios. Add orchestra.
    notes: >-
      The lesson progression itself (graded levels, auditions, ensembles) lives in the Music Lessons track
      (music-lessons-03, -05, -07 and -09). This row covers the repertoire study, performance and service that
      complement those lessons.

  - id: music-10
    title: "The Choral Tradition: Polyphony and the Choir"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 16
    order: 10
    prerequisites: [music-07]
    related: [latin-10, music-lessons-02, music-lessons-06, music-lessons-10]
    summary: >-
      Sing in a serious choir (a parish schola, cathedral or Anglican choir school, or community youth choir)
      and learn the great a cappella repertoire of the Renaissance: Palestrina, Victoria, Byrd, Tallis, Josquin,
      alongside Bach chorales and English anthems. Choral singing trains sight reading, blend, Latin
      diction, and the discipline of rehearsal and service.
    objectives:
      - Sing weekly in a choir with a liturgical or classical repertoire for three or more years
      - Sight-sing a part in four-voice polyphony and hold it against other parts
      - Learn 20 or more motets and anthems (for example Palestrina's Sicut cervus, Byrd's Ave verum, Tallis's If ye love me, Victoria's O magnum mysterium)
      - Earn choir awards or take a section-leader role
    workload:
      readingHours: 20
      readingBasis: "426 pp of Dickinson's Music in the History of the Western Church at ~20 pp/h"
      work:
        - { kind: practice, hours: 300, note: "weekly rehearsal and sung service, 3 yr x 36 wk x 2.5 h (270 h), plus learning parts of 20 or more motets at home, ~20 x 1.5 h" }
        - { kind: exercises, hours: 20, note: "sight-singing drill toward choir awards (RSCM Voice for Life or similar), ~40 x 30 min" }
    coreTexts:
      - title: Music in the History of the Western Church
        kind: secondary
        reader: student
        pages: 426
        pace: long
        author: Edward Dickinson
        date: "1902"
