  - id: greek-10
    title: "Plato: Apology & Crito"
    type: course
    level: 9-12
    stage: formal
    elective: true
    electiveNote: >-
      The core Greek path reads the New Testament and Homer; the Apology and Crito are read in
      translation in philosophy-03.
    ageStart: 15
    ageEnd: 16
    order: 10
    prerequisites: [greek-08]
    related: [philosophy-03]
    summary: >-
      Socrates on trial and in prison. The Apology and Crito are the first philosophical texts
      read in the original. The questions are the examined life, obedience to law and conscience,
      and the citizen's duty. Attic prose at its most natural.
    objectives:
      - Read the Apology and Crito complete in Greek
      - Memorize Apology 38a ("the unexamined life…") in Greek
      - Write an essay on the Laws' speech in the Crito and civil disobedience (compare King, Thoreau, Aquinas on unjust law)
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 45, note: "Apology (30 pp) and Crito (15 pp) at ~1 pp/h" }
        - { kind: memorization, hours: 2, note: "Apology 38a" }
        - { kind: writing, hours: 8, note: "essay on the Laws' speech and civil disobedience" }
        - { kind: discussion, hours: 8, note: "the examined life and obedience to law, 16 x 30 min" }
    coreTexts:
      - title: Apology of Socrates
        kind: primary
        reader: student
        pages: 30
        author: Plato
        date: "c. 399–390 BC"
        publicDomain: true
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0169:text=Apol.:section=17a" }
          - { label: "Steadman, Plato's Apology (free PDF)", url: "https://geoffreysteadman.com/platos-apology/" }
      - title: Crito
        kind: primary
        reader: student
        pages: 15
        author: Plato
        publicDomain: true
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0169:text=Crito:section=43a" }
          - { label: "Steadman, Plato's Crito (free PDF)", url: "https://geoffreysteadman.com/platos-crito/" }
    historicalPrecedent: >-
      Jefferson assigned "Plato's Socratic dialogues" to Peter Carr for morality (1785), though
      he later disparaged Plato's Republic. Socratic dialogues were standard reading in the
      colonial colleges and the English universities.

  - id: greek-11
    title: "Homer: Odyssey & Iliad"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 11
    prerequisites: [greek-04, greek-07]
    related: [latin-12, literature-16]
    summary: >-
      Homeric dialect and the dactylic hexameter. The student reads Odyssey Books I and IX–XII
      (Cyclops to Scylla) and Iliad I, VI (Hector and Andromache), and XXII–XXIV (the death of
      Hector and Priam's ransom). The rest is read in translation. Homer comes after Virgil in
      Latin, so the student can see what Virgil imitated.
    objectives:
      - Read about 2,500 lines of Homer in Greek
      - Scan and recite Homeric hexameter; memorize Iliad I.1–7 and Odyssey I.1–10
      - Know the main features of the Homeric dialect
      - Write a comparative essay on Achilles, Hector, Odysseus and Aeneas
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 100, note: "about 2,500 lines of Homer at ~25 lines/h (counted 339 pp)" }
        - { kind: exercises, hours: 8, note: "Homeric dialect and hexameter scansion drill" }
        - { kind: memorization, hours: 3, note: "Iliad I.1–7 and Odyssey I.1–10" }
        - { kind: writing, hours: 8, note: "comparative essay on Achilles, Hector, Odysseus and Aeneas" }
        - { kind: discussion, hours: 10, note: "weekly discussion, 40 x 15 min" }
    coreTexts:
      - title: Odyssey
        kind: primary
        reader: student
        pages: 400
        author: Homer
        publicDomain: true
        role: selections
        portion: "Books I and IX–XII"
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0135" }
          - { label: "Dickinson College Commentaries, Odyssey", url: "https://dcc.dickinson.edu/homer-odyssey/i-1-43" }
          - { label: "Steadman, Odyssey 9–12 (free PDF)", url: "https://geoffreysteadman.com/files-odyssey-9-12/" }
      - title: Iliad
        kind: primary
        reader: student
        pages: 618
        author: Homer
        publicDomain: true
        role: selections
        portion: "Books I, VI and XXII–XXIV"
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0133" }
          - { label: "Dickinson College Commentaries, Iliad 6", url: "https://dcc.dickinson.edu/homer-iliad/homer-iliad-vi-1-36" }
          - { label: "Steadman, Iliad 6 & 22 (free PDF)", url: "https://geoffreysteadman.com/iliad-6-22/" }
      - title: "Idylls (elective)"
        kind: primary
        reader: student
        pages: 150
        author: Theocritus
        date: "c. 270 BC"
        publicDomain: true
        links:
          - { label: "Gutenberg (tr. Andrew Lang, prose)", url: "https://www.gutenberg.org/ebooks/4775" }
          - { label: "Gutenberg (tr. Calverley, verse)", url: "https://www.gutenberg.org/ebooks/11533" }
      - title: "Odes (Anacreontea) (elective)"
        kind: primary
        reader: student
        pages: 100
        author: Anacreon
        date: "6th century BC and later"
        publicDomain: true
        links:
          - { label: "Gutenberg (tr. Thomas Moore, 1800)", url: "https://www.gutenberg.org/ebooks/38230" }
    historicalPrecedent: >-
      Boston 1789, top class: "Greek Testament. Horace. Homer." Otis recalled that the "highest
      classes dipped into Xenophon and Homer." The 1880s Boston Latin Third Class read "Homer,
      Iliad." Harvard and Yale examined entrants on Greek grammar and the Greek Testament, and
      Homer followed in college.

  - id: greek-12
    title: "Herodotus: The Histories"
    type: course
    level: 9-12
    stage: formal
    elective: true
    electiveNote: >-
      The core Greek path reads the New Testament and Homer; Herodotus is read in translation in
      history-15.
    ageStart: 15.5
    ageEnd: 16.5
    order: 12
    prerequisites: [greek-10]
    related: [history-15]
    summary: >-
      The "Father of History" in Ionic Greek. The student reads Book I (Croesus and Solon, Cyrus)
      and the Persian War narratives (Thermopylae in Book VII, Salamis in Book VIII). Themes:
      liberty against despotism, fortune and hubris, and the Greek sense of law ("Law is king").
    objectives:
      - Read Herodotus I.1–94 (Croesus logos) in Greek
      - Read the Thermopylae narrative (VII.201–233) in Greek
      - Recognize Ionic dialect forms
      - Explain the Greek idea of freedom under law (Demaratus to Xerxes, VII.104)
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 65, note: "about 100 pp of Greek actually assigned (I.1–94 ~55, Thermopylae ~14, Salamis narrative ~30) at ~1.5 pp/h; the counted 233 pp include a third of the whole Histories" }
        - { kind: exercises, hours: 4, note: "Ionic dialect forms" }
        - { kind: writing, hours: 4, note: "short essay on freedom under law (Demaratus to Xerxes)" }
        - { kind: discussion, hours: 8, note: "liberty, fortune and hubris, 16 x 30 min" }
    coreTexts:
      - title: Histories
        kind: primary
        reader: student
        pages: 700
        author: Herodotus
        date: "c. 430 BC"
        publicDomain: true
        role: selections
        portion: "Book I (I.1–94, the Croesus logos) and the Persian War narratives (Thermopylae, VII.201–233; Salamis, Book VIII)"
        pace: long
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0125" }
          - { label: "Steadman, Herodotus Book 1 (free PDF)", url: "https://geoffreysteadman.com/files-herodotus/" }
    historicalPrecedent: >-
      Jefferson's reading plan for Carr (1785) begins ancient history "in the original" with
      "Herodotus, Thucydides, Xenophontis Hellenica, Xenophontis Anabasis, Arrian…".
    sources:
      - { label: "Jefferson to Peter Carr, 19 Aug 1785 (Wikisource)", url: "https://en.wikisource.org/wiki/Letter_to_Peter_Carr_-_August_19,_1785" }

  - id: greek-13
    title: "Septuagint & the Greek Fathers"
    type: course
    level: 9-12
    stage: formal
    elective: true
    electiveNote: >-
      The core Greek path reads the New Testament and Homer; the Greek Fathers are read in
      translation in theology-16.
    ageStart: 15.5
    ageEnd: 16.5
    order: 13
    prerequisites: [greek-09]
    related: [hebrew-04, latin-10, latin-16]
    summary: >-
      Biblical and patristic Greek. The student reads the Septuagint Genesis 1–11 and selected
      Psalms, the Old Testament the apostles quoted. He then reads Greek Fathers: St. John
      Chrysostom (a homily), St. Basil's Address to Young Men on Greek Literature (on how
      Christians should read the pagan classics), and the Nicene Creed in Greek.
    objectives:
      - Read LXX Genesis 1–3 and 6–9 and ten Psalms in Greek
      - Compare LXX, Hebrew and Vulgate readings of three key passages (e.g. Gen 1:2, Ps 22/21, Isa 7:14)
      - Read one Chrysostom homily and Basil's Address to Young Men (selections) in Greek
      - Recite the Nicene–Constantinopolitan Creed in Greek
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 25, note: "no page counts; estimated LXX Genesis 1–3 and 6–9 and ten Psalms (~14 pp at ~3 pp/h, 5 h), one Chrysostom homily and Basil's Address in selection (~20 pp at ~1 pp/h, 20 h)" }
        - { kind: writing, hours: 5, note: "comparison of LXX, Hebrew and Vulgate in three passages" }
        - { kind: memorization, hours: 2, note: "the Nicene–Constantinopolitan Creed in Greek" }
        - { kind: discussion, hours: 5, note: "canon and the Fathers on pagan literature, 10 x 30 min" }
    coreTexts:
      - title: "Genesis 1–11: Septuagint and Vulgate with facing vocabulary"
        kind: instructional
        reader: student
        author: Geoffrey Steadman (ed.)
        publicDomain: false
        role: selections
        portion: "LXX Genesis 1–3 and 6–9"
        links:
          - { label: "Steadman (free PDF)", url: "https://geoffreysteadman.com/genesis-1-11/" }
    curriculumOptions:
      - name: "Septuaginta: A Reader's Edition"
        publisher: Hendrickson / Deutsche Bibelgesellschaft
        tradition: secular
        url: "https://www.christianbook.com/septuaginta-readers-edition-flexisoft-black-volumes/9781683071853/pd/071853"
        notes: Rahlfs–Hanhart text with running vocabulary. The best single tool for reading the LXX.
    notes: >-
      Catholic and Orthodox Christians, and the Fathers, received the LXX's wider canon, which
      includes the deuterocanonical books (Wisdom, Sirach, Maccabees, etc.). Protestants follow
      the shorter Hebrew canon and call these books the Apocrypha. Chrysostom and Basil are
      honoured by Catholic, Orthodox and many Protestant readers.

  - id: greek-14
    title: "Attic Tragedy: Sophocles, Aeschylus & Euripides"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16.5
    ageEnd: 17
    order: 14
    prerequisites: [greek-11]
    summary: >-
      The student reads one tragedy in Greek, Sophocles' Antigone, with selections from
      Euripides' Medea and the Oresteia, and the rest in translation. He learns the iambic
      trimeter, the choral lyric and the structure of tragedy. Antigone's clash of divine law and
      civic decree is the natural-law debate in dramatic form.
    objectives:
      - Read Sophocles' Antigone in Greek (dialogue complete, choral odes selectively)
      - Scan iambic trimeter
      - Memorize the "Ode to Man" (Antigone 332–375), at least its first strophe
      - Write an essay on Antigone and natural law (compare Aquinas and Martin Luther King)
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 70, note: "Antigone dialogue complete and odes in part, with selections of Medea and Libation Bearers, about 1,450 lines at ~20 lines/h (counted 155 pp)" }
        - { kind: exercises, hours: 3, note: "iambic trimeter scansion" }
        - { kind: memorization, hours: 3, note: "Ode to Man, first strophe or more" }
        - { kind: writing, hours: 8, note: "essay on Antigone and natural law" }
    coreTexts:
      - title: Antigone
        kind: primary
        reader: student
        pages: 94
        author: Sophocles
        date: "c. 441 BC"
        publicDomain: true
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0185" }
          - { label: "Steadman, Antigone (free PDF)", url: "https://geoffreysteadman.com/sophocles-antigone/" }
      - title: Medea
        kind: primary
        reader: student
        pages: 122
        author: Euripides
        publicDomain: true
        role: selections
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0113" }
      - title: Libation Bearers (Oresteia)
        kind: primary
        reader: student
        pages: 60
        author: Aeschylus
        publicDomain: true
        role: selections
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0007" }
    historicalPrecedent: >-
      Jefferson names "Euripides, Sophocles" among the poets Carr "will read at school" (1785).
      Tragedy was a set text in the English sixth forms and American colleges.

  - id: greek-15
    title: "College Greek: Thucydides, Plato & Reading at Sight"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 15
    prerequisites: [greek-14, greek-11]
    related: [latin-17, history-15]
    summary: >-
      The hardest Attic prose and the core texts of political philosophy. Thucydides: the
      Archaeology, Pericles' Funeral Oration (II.35–46), the Plague, the Mytilene debate, the
      Corcyraean stasis (III.82–83) and the Melian Dialogue. Then Plato: Republic I and selections
      from the Phaedo or Gorgias. Sight-reading of the Greek New Testament and Xenophon becomes a
      daily habit.
    objectives:
      - Read the Funeral Oration, the Mytilene debate, the stasis at Corcyra and the Melian Dialogue in Greek
      - Read Republic I (or Gorgias) in Greek
      - Read any NT passage at sight
      - Write a paper connecting Thucydides on faction to Federalist No. 10
    workload:
      readingHours: 0
      work:
        - { kind: translation, hours: 95, note: "Thucydides set passages, about 50 pp of Greek (counted 200 pp) at ~0.8 pp/h (60 h), and Republic I, about 40 pp at ~1.2 pp/h (35 h)" }
        - { kind: practice, hours: 50, note: "daily sight-reading of the NT and Xenophon, 36 weeks x 4 x 20 min" }
        - { kind: writing, hours: 15, note: "paper connecting Thucydides on faction to Federalist No. 10" }
        - { kind: discussion, hours: 15, note: "tutorial on the political texts, 30 x 30 min" }
    coreTexts:
      - title: History of the Peloponnesian War
        kind: primary
        reader: student
        pages: 600
        author: Thucydides
        date: "c. 400 BC"
        publicDomain: true
        role: selections
        portion: "the Archaeology, the Funeral Oration (II.35–46), the Plague, the Mytilene debate, the stasis at Corcyra (III.82–83) and the Melian Dialogue"
        pace: long
        links:
          - { label: "Perseus (Greek)", url: "https://www.perseus.tufts.edu/hopper/text?doc=Perseus:text:1999.01.0199" }
          - { label: "Steadman, Thucydides selections (free PDF)", url: "https://geoffreysteadman.com/thucydides/" }
    historicalPrecedent: >-
      Thucydides was the second author on Jefferson's list for Carr. Hobbes translated him into
      English (1629) as a warning against democracy. The founders cited the Greek leagues and
      factions in the Federalist debates (Federalist 18–20).
