track: ap-history
title: "AP History (side track)"
trackGroup: AP & Exams
description: >-
  A side track that prepares the student for the three College Board history exams: AP United
  States History, AP European History and AP World History: Modern. It supplements the main
  history track and never replaces it. Everything here is AP-specific content, organized by the
  College Board's Course and Exam Descriptions (CEDs), and is read alongside the primary-source
  seminars of Cycle 3 (history-13 to history-28), not instead of them. The main track gives the
  student the documents, the statesmen and the argument of the Western and American story. This
  track adds what the College Board also expects: the survey coverage of each CED unit, social,
  economic, Western and immigration history, non-Western history for AP World, the College Board's
  vocabulary of historical thinking skills and reasoning processes, and drilled practice in the four
  question types (MCQ, SAQ, DBQ, LEQ). Each exam is taken in the May the relevant course finishes:
  AP U.S. History and AP European History at about 16, and AP World History: Modern at about 17. The
  survey textbooks the College Board's framework favors have interpretive slants. The notes on each
  row name them from both left and right and suggest counterweight texts to read beside them.
rows:
  # ───────────────────────── Shared skills (all three exams) ─────────────────────────
  - id: ap-history-01
    title: "AP History Writing Workshop: Historical Thinking Skills, SAQ, DBQ & LEQ"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 17
    order: 1
    prerequisites: []
    related: [grammar-composition-11, grammar-composition-12, rhetoric-07, logic-02, history-28, history-23]
    exams: [ap-us-history, ap-european-history, ap-world-history-modern]
    summary: >-
      A running AP-specific writing and skills workshop shared by all three AP history exams. It
      starts a few months before AP U.S. History and continues until AP World History is sat. The
      student learns the College Board's six historical thinking skills (developments and processes,
      sourcing and situation, claims and evidence in sources, contextualization, making connections,
      argumentation) and three reasoning processes (comparison, causation, continuity and change).
      He then writes timed short-answer questions (SAQs), document-based questions (DBQs) and long
      essay questions (LEQs) to the College Board rubrics, using the CED's examples and released free-response questions.
      The main track's seminar essays teach him to argue from sources. This workshop teaches him to do
      it in 40 or 60 minutes to a published rubric.
    objectives:
      - Source any document by HIPP (historical situation, intended audience, purpose, point of view) and explain how each affects its use as evidence
      - Write a defensible, analytic thesis and a contextualization paragraph in under ten minutes
      - Complete a 7-document DBQ in 60 minutes (15-minute reading period), using at least 4 documents plus outside evidence and sourcing at least 2
      - Answer three source-based SAQs in 40 minutes (secondary text, primary text, non-text source), the format from May 2027
      - Write a 40-minute LEQ on a single broad prompt using comparison, causation or continuity and change, and earn the "complexity" point on at least one practice essay
      - Score his own and released sample essays against the College Board rubrics, and agree with the official scores within one point
    coreTexts:
      - title: "AP U.S. History Course and Exam Description (effective fall 2026): skills, reasoning processes and rubrics"
        reader: teacher
        author: College Board
        date: "2026"
        publicDomain: false
        links:
          - { label: CED (PDF), url: "https://apcentral.collegeboard.org/media/pdf/ap-us-history-course-and-exam-description.pdf" }
          - { label: "AP History Exam Updates (May 2027)", url: "https://apcentral.collegeboard.org/courses/ap-history-exam-updates" }
      - title: "Released free-response questions, scoring guidelines and sample student responses"
        reader: student
        author: College Board
        publicDomain: false
        links:
          - { label: "AP U.S. History past exam questions", url: "https://apcentral.collegeboard.org/courses/ap-united-states-history/exam/past-exam-questions" }
          - { label: "AP European History past exam questions", url: "https://apcentral.collegeboard.org/courses/ap-european-history/exam/past-exam-questions" }
          - { label: "AP World History: Modern past exam questions", url: "https://apcentral.collegeboard.org/courses/ap-world-history/exam/past-exam-questions" }
    curriculumOptions:
      - name: AP Classroom (AP Daily videos, topic questions, progress checks, question bank)
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/instructional-resources/ap-classroom"
        notes: >-
          The official practice platform. A homeschooled student gets access by joining the exam-only
          section set up by the AP coordinator at the school where he tests. The AP Daily videos on the
          DBQ and LEQ are the best short explanations of the rubrics.
      - name: "AP®/College US History (free, includes Writing Coach)"
        publisher: Khan Academy
        tradition: secular
        url: "https://www.khanacademy.org/humanities/us-history/ap-us-history"
        notes: Free videos, practice and essay prompts. The Writing Coach gives quick feedback on thesis and contextualization drafts.
      - name: Teaching American History document collections
        publisher: Ashland University
        tradition: classical
        url: "https://teachingamericanhistory.org/"
        notes: >-
          A free supply of fuller primary documents for home-made DBQs. Seven excerpts on a single
          question from its collections make a DBQ drawn from the founders' own words rather than a
          textbook's selection.
    historicalPrecedent: >-
      Written examination on set historical questions entered the Oxford and Cambridge Modern History
      schools in the 1850s–1870s (see history-30). The document-based question was introduced on the
      AP U.S. History exam in 1973.
    sources:
      - { label: "College Board: AP History Exam Updates (effective May 2027)", url: "https://apcentral.collegeboard.org/courses/ap-history-exam-updates" }
      - { label: "AP Students: I'm homeschooled. How can I take an AP Exam?", url: "https://apstudents.collegeboard.org/help-center/im-homeschooled-how-can-i-take-ap-exam" }
    notes: >-
      AP-specific. From the May 2027 exams all three histories share one format. Section I has 55
      MCQs in 55 minutes (40%) and 3 required source-based SAQs in 40 minutes (20%). Section II has
      one DBQ with 7 documents in about 60 minutes (25%) and one LEQ in about 40 minutes (15%). The LEQ
      is now a single broad prompt with choice built into it, and the DBQ covers a wider chronological
      range. The exams are digital (Bluebook app). A homeschooled student must find a school whose AP
      coordinator will order his exams, ideally by the November ordering deadline. The rubrics
      reward a particular formula (thesis, contextualization, evidence, sourcing, complexity). Teach
      it as a genre, and keep the main track's longer seminar essays as the real training in
      historical judgment.

  # ───────────────────────── AP U.S. History (exam at about 16) ─────────────────────────
  - id: ap-history-02
    title: "AP U.S. History I: Periods 1–4 (1491–1848)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 15.5
    order: 2
    prerequisites: [ap-history-01]
    related: [history-13, history-14, history-23, civics-law-11, civics-law-12, literature-27, spanish-07, economics-06]
    exams: [ap-us-history]
    summary: >-
      AP-specific content for the first half of the AP U.S. History CED. It covers Unit 1 (Period 1,
      1491–1607), Unit 2 (1607–1754), Unit 3 (1754–1800) and Unit 4 (1800–1848), read alongside
      history-13, history-14 and history-23. Those seminars already give the founding in
      the founders' own words. This row adds the survey breadth and the College Board's framing
      across its eight themes (American and national identity, work and technology, geography,
      migration, politics and power, America in the world, culture, social structures). It adds
      Native societies before and after contact, the Columbian Exchange and the Spanish, French and
      Dutch empires, the Atlantic slave trade, colonial economies and the Market Revolution, and
      Jacksonian democracy. It is not a replacement for the seminars.
    objectives:
      - "Explain the CED key concepts for Periods 1–4 and identify at least 3 specific examples for each"
      - "Contrast Spanish, French, Dutch and English colonization (labor systems, relations with Native peoples, religion) using the encomienda, the fur trade and the plantation"
      - Trace the growth of slavery from the Atlantic trade through the Constitution's compromises to the cotton boom, with population and trade data
      - "Explain the Market Revolution (canals, railroads, the factory system, the Second Bank) and its effects on women, workers and sectional economies"
      - Explain the Second Great Awakening and the reform movements (temperance, abolition, women's rights at Seneca Falls) that followed from it
      - Complete progress checks for Units 1–4 and one timed DBQ and LEQ from Periods 1–4
    coreTexts:
      - title: "AP U.S. History Course and Exam Description, Units 1–4"
        reader: teacher
        author: College Board
        date: "effective fall 2026"
        publicDomain: false
        links:
          - { label: CED (PDF), url: "https://apcentral.collegeboard.org/media/pdf/ap-us-history-course-and-exam-description.pdf" }
          - { label: AP Central course page, url: "https://apcentral.collegeboard.org/courses/ap-united-states-history" }
      - title: "The American Pageant, AP Edition (18th ed.)"
        reader: student
        pages: 1150
        author: David M. Kennedy & Margaret O'Mara
        date: "2025"
        publicDomain: false
        links:
          - { label: Cengage (National Geographic Learning), url: "https://ngl.cengage.com/products/9798214071107" }
      - title: "Give Me Liberty! An American History, AP Edition (7th ed.) (alternative survey text)"
        reader: student
        pages: 1350
        author: Eric Foner et al.
        date: "2024"
        publicDomain: false
        links:
          - { label: W. W. Norton, url: "https://wwnorton.com/books/9781324071396" }
