          - { label: "A Teacher's Guide to Land of Hope", url: "https://www.encounterbooks.com/books/teachers-guide-land-hope/" }
          - { label: "Student Workbook (primary sources per chapter)", url: "https://www.encounterbooks.com/books/student-workbook-land-hope/" }
          - { label: Land of Hope education site, url: "https://landofhope.education/" }
