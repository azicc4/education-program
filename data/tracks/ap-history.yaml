        reader: student
        author: Joseph Locke & Ben Wright (eds.)
        publicDomain: false
        links:
          - { label: Text, url: "https://www.americanyawp.com/text/" }
          - { label: Reader (primary sources), url: "https://www.americanyawp.com/reader/" }
