    curriculumOptions:
      - name: AP United States History (course page, past exam questions and AP Classroom)
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/courses/ap-united-states-history"
        notes: Use the released free-response questions and the CED practice exam in the last six weeks.
      - name: "Barron's AP U.S. History Premium, 2027"
        publisher: Barron's (Simon & Schuster)
        tradition: secular
        url: "https://www.simonandschuster.com/books/AP-U-S-History-Premium-2027-5-Practice-Tests-+-Comprehensive-Review-+-Online-Practice/Eugene-V-Resnick/Barrons-AP-Prep/9798349701580"
        notes: >-
          Five practice tests, updated for the May 2027 SAQ and LEQ changes. The Princeton Review AP
          U.S. History Premium Prep (26th ed., Penguin Random House) is the alternative. Check that
          any prep book is labeled for the 2027 format.
      - name: "American Heritage (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/american-heritage"
        notes: A free, founding-principles counterweight to the survey. Its lectures on Progressivism and the New Deal present the critique the CED gives less room.
    historicalPrecedent: >-
      Turner's 1893 frontier address and Beard's Economic Interpretation of the Constitution (1913)
      began the professional arguments over the meaning of American history that the CED's
      secondary-source questions still draw on. Du Bois's Black Reconstruction (1935) opened the
      revision of the Dunning School's account of Reconstruction.
    sources:
      - { label: "AP U.S. History Exam (format and May 2027 changes)", url: "https://apcentral.collegeboard.org/courses/ap-united-states-history/exam" }
      - { label: "Princeton Review AP U.S. History Premium Prep, 26th ed.", url: "https://www.penguinrandomhouse.com/books/807044/princeton-review-ap-us-history-premium-prep-26th-edition-by-the-princeton-review/" }
    notes: >-
      AP-specific content, read alongside the main track. Timing: history-26 (Cold War and civil
      rights) runs 16–16.5 in the main track, so Periods 8–9 are learned here first in survey form
      and then read in depth in the seminar. Read Kennan's Long Telegram and King's Letter from
      history-26 early if possible, since both are standard AP documents. What the main track
      already covers: Tocqueville, Webster–Calhoun, Douglass, Lincoln–Douglas and Lincoln's speeches
      (history-23); Wilson's Fourteen Points, the Atlantic Charter and the World Wars (history-26);
      containment, King and Reagan (history-26); landmark cases (civics-law-14); Hayek and Sowell
      (economics-09). What the AP adds: the West and Native American policy; immigration and
      nativism; the Gilded Age economy, labor and Populism; Progressivism as a movement (the main
      track meets it mainly as a critique of the founding at 17, history-31); the New Deal's
      programs and their economic results; the home fronts of both wars; postwar suburbia,
      consumer culture and the Great Society; the women's and other rights movements; and 1980 to
      the present (globalization, the end of the Cold War, 9/11). Historiography expected: the
      frontier thesis versus the New Western History; Progressive, consensus and New Left readings;
      and the Dunning School versus the revisionists on Reconstruction. Slants: see ap-history-02.
      For the 20th century, Foner and the Yawp give the most room to the New Deal order and social
      movements. Land of Hope and Hillsdale are warmer toward constitutionalism and the
      conservative revival and more critical of Progressivism. Paul Johnson's A History of the
      American People (history-28) is a readable right-of-center survey to set against either.

  # ───────────────────────── AP European History (exam at about 16) ─────────────────────────
  - id: ap-history-04
    title: "AP European History: c. 1450 to the Present"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 4
    prerequisites: [ap-history-01]
    related: [history-21, history-22, history-25, history-26, history-30, philosophy-09, philosophy-10, philosophy-12, natural-science-15, physics-02, economics-06, economics-08, literature-30]
    exams: [ap-european-history]
    summary: >-
      AP-specific preparation for AP European History, read alongside the main track's European
      seminars and ending in the May exam at about 16 (16.5 if the family would rather not sit it in the same May as
      U.S. History). It covers the CED's nine units: Renaissance and Exploration; the Age of
      Reformation; Absolutism and Constitutionalism; Scientific, Philosophical and Political
      Developments; Conflict, Crisis and Reaction in the Late 18th Century; Industrialization and Its
      Effects; 19th-Century Perspectives and Political Developments; 20th-Century Global Conflicts;
      and the Cold War and Contemporary Europe. It follows the seven themes: interaction of Europe and the world,
      economic and commercial developments, cultural and intellectual developments, states and other institutions of power,
      social organization, national and European identity, and technological and scientific innovation.
    objectives:
      - "Explain the CED key concepts for all nine units, with attention to the four chronological periods (c. 1450–1648, 1648–1815, 1815–1914, 1914–present)"
      - Explain the Commercial Revolution, the price revolution and the rise of the Dutch and English Atlantic economies
      - Compare absolutism (Louis XIV, Peter the Great, the Habsburgs, Prussia) with English and Dutch constitutionalism
      - Explain the Scientific Revolution and the Enlightenment as historical movements (academies, salons, print, enlightened despots), not only as ideas
      - Explain the social effects of industrialization (urbanization, the family, class, public health) and the ideologies that answered it
      - Explain the Russian Revolution, the interwar economy, Stalinism and fascism, decolonization, European integration from the Schuman Declaration to the EU, and the revolutions of 1989
      - Complete progress checks for Units 1–9, two timed DBQs, and one full practice exam
    coreTexts:
      - title: AP European History Course and Exam Description
        reader: teacher
        author: College Board
        publicDomain: false
        links:
          - { label: CED (PDF), url: "https://apcentral.collegeboard.org/media/pdf/ap-european-history-course-and-exam-description.pdf" }
          - { label: AP Central course page, url: "https://apcentral.collegeboard.org/courses/ap-european-history" }
      - title: "A History of Western Society Since 1300 for the AP® Course (13th ed.)"
        reader: student
        pages: 1000
        author: John P. McKay et al.
        publicDomain: false
        links:
          - { label: BFW / Macmillan Learning, url: "https://www.bfwpub.com/high-school/us/product/A-History-of-Western-Society-Since-1300-for-the-AP-Course/p/1319221637" }
      - title: A History of Europe in the Modern World (alternative survey text)
        reader: student
        pages: 1100
        author: R. R. Palmer, Joel Colton & Lloyd Kramer
        publicDomain: false
        links:
          - { label: McGraw Hill, url: "https://www.mheducation.com/highered/product/a-history-of-europe-in-the-modern-world-kramer.html" }
      - title: "The Western Heritage (alternative survey text)"
        reader: student
        pages: 1100
        author: Donald Kagan, Steven Ozment, Frank M. Turner et al.
        publicDomain: false
        links:
          - { label: Pearson, url: "https://www.pearson.com/en-us/subject-catalog/p/western-heritage-the-combined-volume/P200000002916/9780137497799" }
