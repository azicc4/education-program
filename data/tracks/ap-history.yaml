      - name: "Barron's AP World History: Modern Premium, 2027"
        publisher: Barron's (Simon & Schuster)
        tradition: secular
        url: "https://www.simonandschuster.com/books/AP-World-History-Modern-Premium-2027-Prep-Book-With-5-Practice-Tests-+-Comprehensive-Review-+/John-McCannon/Barrons-AP-Prep/9798349701399"
        notes: >-
          Five practice tests, updated for the May 2027 SAQ and LEQ changes. The Princeton Review AP
          World History: Modern Premium Prep (8th ed.) is the alternative.
      - name: "Christ the King, Lord of History"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/books/christ-the-king-lord-of-history-a-catholic-world-history-from-ancient-to-modern-times/"
        notes: >-
          Anne Carroll's Catholic world history (also the Cycle 2 spine, history-07). An explicitly
          Catholic interpretive counterweight to the secular surveys. It is thin on Asia and Africa,
          so it cannot serve as the AP text.
    historicalPrecedent: >-
      Leo XIII's Rerum Novarum (history-25) and the 20th-century popes' encyclicals on development and
      peace read the industrial and colonial world from Rome, a global perspective older than the
      AP course. Ho Chi Minh opened Vietnam's 1945 declaration by quoting Jefferson, a sign of how far
      the American founding traveled.
    sources:
      - { label: "AP World History: Modern Exam (format, May 2027)", url: "https://apcentral.collegeboard.org/courses/ap-world-history/exam" }
      - { label: "Princeton Review AP World History: Modern Premium Prep, 8th ed.", url: "https://www.penguinrandomhouse.com/books/807045/princeton-review-ap-world-history-modern-premium-prep-8th-edition-by-the-princeton-review/" }
    notes: >-
      AP-specific content, read alongside the main track. What the main track covers: the French
      Revolution, 1848, Marx and Rerum Novarum (history-25); the World Wars and totalitarianism
      (history-26); Smith, Marx, Hayek and Sowell (economics-06, economics-08,
      economics-09). What the AP adds: the Haitian and Latin American revolutions; imperialism from
      the colonized side; industrialization outside Europe; Chinese history from the Opium Wars to Mao
      and Deng; decolonization and the Cold War in the Global South; and globalization. The Chinese
      track (chinese-11) can supply modern Chinese texts for Units 7–9. Slants: see ap-history-05.
      The surveys tend to explain imperialism mainly through economic exploitation and racism. Sowell
      and the papal documents stress culture, institutions and religion. Have the student write one
      LEQ each way. A student sitting this at 17 overlaps the college Western Heritage and American
      Heritage courses (history-30, history-31). Keep this row to the AP survey and its practice
      tests, and let the college seminars carry the reading.
