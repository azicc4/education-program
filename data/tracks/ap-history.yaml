        notes: The official framework and past exam questions. The CED's unit guides are the checklist for the non-Western material.
      - name: "OER Project World History AP (free; also on Khan Academy)"
        publisher: OER Project / Khan Academy
        tradition: secular
        url: "https://www.oerproject.com/World-History-AP"
        notes: >-
          A free full course aligned to the CED topic by topic, with readings, videos and source
          collections. The same course is on Khan Academy at /humanities/world-history-project-ap
          with practice. It is heavy on frameworks and "big history" framing.
      - name: "AMSCO AP World History: Modern (1200–Present), 2nd ed."
        publisher: Perfection Learning
        tradition: secular
        url: "https://perfectionlearning.com/ap-and-honors/social-studies/advanced-placement-world-history-modern"
        notes: Concise and CED-aligned. The most efficient review text, but thin on primary sources.
    historicalPrecedent: >-
      Jefferson told Peter Carr to learn Spanish because the ancient history of the Americas "is
      written in that language" (see spanish-07). The Jesuit colleges trained missionaries such as
      Ricci (chinese-10) in the languages and classics of Asia. Serious study of the great non-Western
      civilizations belongs to the older learning too, not only to the modern survey.
    sources:
      - { label: "AP World History: Modern Exam (format, May 2027)", url: "https://apcentral.collegeboard.org/courses/ap-world-history/exam" }
      - { label: "AP Students: AP World History: Modern", url: "https://apstudents.collegeboard.org/courses/ap-world-history-modern" }
      - { label: "Khan Academy: AP®/College World History", url: "https://www.khanacademy.org/humanities/world-history-project-ap" }
    notes: >-
      AP-specific content, read alongside the main track. What the curriculum already touches:
      Bernal Díaz and Las Casas on the conquest of Mexico (spanish-07); Ricci and the Ming–Qing Jesuit
      mission (chinese-10); the Confucian classics in the original (chinese-12, chinese-13); Columbus
      and the European side of exploration (history-13, history-22); the Crusades from the Latin side
      (history-19). Everything else here is new: the program nowhere else treats Islamic
      civilization, sub-Saharan Africa, India, the Mongols, the steppe or the pre-Columbian states as
      subjects in their own right. Slants: Strayer and Bentley are both explicitly global and
      comparative. They treat Europe as one civilization among several, favor social, economic and
      environmental history, and are often critical of Western expansion. Readers on the right find
      them short on the religious and intellectual sources of Western distinctiveness. Readers on
      the left find older Western-civ texts Eurocentric. Recommended counterweights are Thomas
      Sowell's Conquests and Cultures, an economist's comparative account of how conquest spread and
      destroyed cultural capital, and Anne Carroll's Christ the King, Lord of History for a Catholic
      frame (see ap-history-06). Chinese and Spanish readers should read the Zheng He inscription and
      Bernal Díaz in the original where possible.

  - id: ap-history-06
    title: "AP World History: Modern II: c. 1750–Present (Units 5–9)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16.5
    ageEnd: 17
    order: 6
    prerequisites: [ap-history-05]
    related: [history-25, history-26, economics-08, economics-09, chinese-11, civics-law-15, theology-20]
    exams: [ap-world-history-modern]
    summary: >-
      The second half of AP World History: Modern, ending in the May exam at about 17. It covers CED Unit 5
      (Revolutions: the Atlantic revolutions including Haiti and Latin American independence, and the
      Industrial Revolution), Unit 6 (Consequences of Industrialization: imperialism in Africa and Asia,
      industrialization outside Europe in Meiji Japan, Russia and the Ottoman reforms, migration and
      indentured labor), Unit 7 (Global Conflict: the world wars as global wars, the Russian and
      Chinese revolutions), Unit 8 (Cold War and Decolonization: India, Africa, Vietnam, the
      non-aligned movement) and Unit 9 (Globalization: technology, disease, economics, human rights,
      global culture). The main track's European seminars supply the European half. This row supplies the world.
    objectives:
      - Compare the American, French, Haitian and Latin American revolutions, using the Declaration of the Rights of Man, the Haitian constitution and Bolívar
      - Explain imperialism (the Opium Wars, the Scramble for Africa, the British Raj) and resistance to it, reading Commissioner Lin's letter to Queen Victoria
      - Compare state-led industrialization in Meiji Japan, Russia and the Ottoman Tanzimat with the British model
      - Explain decolonization in India, Africa and Southeast Asia, reading the Vietnamese Declaration of Independence (1945) against the American Declaration it quotes
      - Explain globalization since 1945 (trade, technology, disease, the environment, rights movements and their critics)
      - Sit a full-length released or practice exam under timed conditions before the May exam
