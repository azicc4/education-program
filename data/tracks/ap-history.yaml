    curriculumOptions:
      - name: AP United States History (course page, CED and AP Classroom)
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/courses/ap-united-states-history"
        notes: The official framework. Use its unit guides as the checklist, and AP Classroom's progress checks at the end of each unit.
      - name: "AMSCO Advanced Placement United States History"
        publisher: Perfection Learning
        tradition: secular
        url: "https://perfectionlearning.com/ap-and-honors/social-studies/advanced-placement-united-states-history"
        notes: >-
          A concise text that follows the CED topic by topic. It is the most efficient single book
          for a student who already has the seminars behind him. It is updated to the current
          framework.
      - name: "The Hillsdale K-12 American History & Civics Curriculum (1776 Curriculum)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://k12historyandcivics.hillsdale.edu/"
        notes: Free primary-source lessons by era. The counterweight framework to the CED's themes.
    historicalPrecedent: >-
      AP U.S. History was first offered in 1956. Its framework was rewritten in 2014 and, after
      public criticism that the new version slighted the founders and American ideals, revised in
      2015 to add more on founding documents and national identity. The 9-period structure dates
      from that revision.
    sources:
      - { label: "AP U.S. History Exam (format)", url: "https://apcentral.collegeboard.org/courses/ap-united-states-history/exam" }
      - { label: "AP Students: AP U.S. History", url: "https://apstudents.collegeboard.org/courses/ap-united-states-history" }
    notes: >-
      AP-specific content, read alongside the main track. Pace: Units 1–4 carry roughly 30–48% of the
      exam. The CED's periods overlap (Period 4 ends 1848 and Period 5 begins 1844), so this row runs to 1848.
      What the main track already covers: the colonial charters, Bradford, Winthrop, the Mayflower
      Compact (history-13); the Declaration, Constitution, Federalist and Farewell (history-14,
      history-23, civics-law-11); Tocqueville and the Webster–Calhoun debate (history-23,
      civics-law-12); New Spain through Bernal Díaz and Las Casas (spanish-07). What the AP adds:
      pre-contact Native societies and the Columbian Exchange; comparative colonization; the
      Atlantic economy and slavery as a labor system; colonial social history (indentured servants,
      women, the Great Awakening); the Market Revolution and early industrialization; Indian
      removal; and the historiography the CED's secondary-source SAQs expect (e.g. Progressive,
      consensus and "Atlantic world" readings of the Revolution). Interpretive slants: the American
      Pageant is a lively, mainstream political narrative written from a broadly liberal-consensus
      viewpoint. Give Me Liberty! is by Eric Foner, a leading historian of the left. It frames the
      whole story as a contest over the meaning of freedom and gives heavy weight to race, labor
      and social movements, and critics on the right find it tilted. The American Yawp is free and
      written by academic historians. It foregrounds race, gender, class and inequality, and gives
      comparatively less room to constitutional ideas and religion as motives, so read it as one
      school of interpretation. Its Reader is excellent for primary sources. Land of Hope and the
      Hillsdale 1776 Curriculum lean the other way: they are conservative-leaning and emphasize
      founding ideals and statesmen, and critics on the left find them celebratory. Recommended
      pairing: one survey (Pageant or AMSCO) plus Land of Hope, with the Yawp Reader for documents.
      The student should be able to state each school's reading of an event, which is exactly what
      the SAQ on secondary sources demands.

  - id: ap-history-03
    title: "AP U.S. History II: Periods 5–9 (1844–present)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16
    order: 3
    prerequisites: [ap-history-02]
    related: [history-23, history-26, history-28, history-31, civics-law-14, economics-09, social-science-07, literature-28, literature-29]
    exams: [ap-us-history]
    summary: >-
      AP-specific content for the second half of the AP U.S. History CED. It covers Unit 5 (Period 5,
      1844–1877), Unit 6 (1865–1898), Unit 7 (1890–1945), Unit 8 (1945–1980) and Unit 9 (1980–present),
      read alongside history-23 and history-26, and ending in the May exam at about 16. The
      main track treats the Civil War, the World Wars, the Cold War and civil rights through their
      great documents. The AP adds what a documents course passes over: Manifest Destiny and the
      Mexican War, Reconstruction's aftermath, the settlement and conquest of the West, the Gilded
      Age economy, immigration and nativism, Populism and Progressivism, the Depression and New
      Deal as economic history, the postwar social movements, the conservative resurgence and the
      period since 1980.
    objectives:
      - "Explain the CED key concepts for Periods 5–9 and identify at least 3 specific examples for each"
      - Explain Reconstruction and its end, comparing the Dunning, revisionist (Du Bois, Foner) and recent interpretations
      - Describe the transformation of the West (railroads, the Plains wars, the Dawes Act, mining and ranching) and weigh Turner's frontier thesis against the New Western History
      - Trace immigration from the 1840s Irish and German waves through Chinese Exclusion (1882), Ellis Island, the 1924 quota law and the 1965 Immigration Act
      - Explain industrialization, labor conflict, Populism and Progressivism, and the causes and remedies of the Great Depression, using wage, price and output data
      - Explain the social movements of 1945–1980 (civil rights, women's, Chicano, American Indian) and the conservative movement from Goldwater to Reagan
      - Sit a full-length released or practice exam under timed conditions before the May exam
    coreTexts:
      - title: "AP U.S. History Course and Exam Description, Units 5–9"
        reader: teacher
        author: College Board
        date: "effective fall 2026"
        publicDomain: false
        links:
          - { label: CED (PDF), url: "https://apcentral.collegeboard.org/media/pdf/ap-us-history-course-and-exam-description.pdf" }
          - { label: "CED clarifications", url: "https://apcentral.collegeboard.org/media/pdf/ap-us-history-course-and-exam-description-clarifications.pdf" }
      - title: "The American Pageant, AP Edition (18th ed.), or Give Me Liberty!, AP Edition (7th ed.)"
        reader: student
        pages: 1150
        author: Kennedy & O'Mara; Foner et al.
        publicDomain: false
        links:
          - { label: "Cengage: The American Pageant", url: "https://ngl.cengage.com/products/9798214071107" }
          - { label: "Norton: Give Me Liberty!", url: "https://wwnorton.com/books/9781324071396" }
      - title: "Land of Hope (counterweight survey), with the Teacher's Guide"
        reader: student
        pages: 504
        author: Wilfred M. McClay
        publicDomain: false
        links:
          - { label: Encounter Books, url: "https://www.encounterbooks.com/books/land-of-hope-revised_edition/" }
          - { label: "A Teacher's Guide to Land of Hope", url: "https://www.encounterbooks.com/books/teachers-guide-land-hope/" }
