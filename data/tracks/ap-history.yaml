    historicalPrecedent: >-
      AP European History was among the first AP subjects (1956). R. R. Palmer's A History of the
      Modern World (1950) was for decades the standard American college and AP text for modern
      Europe.
    sources:
      - { label: "AP European History Exam (format, May 2027)", url: "https://apcentral.collegeboard.org/courses/ap-european-history/exam" }
      - { label: "AP Students: AP European History", url: "https://apstudents.collegeboard.org/courses/ap-european-history" }
      - { label: "Princeton Review AP European History Premium Prep, 25th ed.", url: "https://www.penguinrandomhouse.com/books/807029/princeton-review-ap-european-history-premium-prep-25th-edition-by-the-princeton-review/" }
    notes: >-
      AP-specific content, read alongside the main track. Mapping to the main track: Units 1–2
      (Renaissance, Reformation) use history-22. Unit 3 (constitutionalism) uses history-21, and Unit 4
      uses philosophy-09 and philosophy-10 for the Enlightenment ideas and natural-science-15 and physics-02 for Copernicus to Newton.
      Units 5–7 (French Revolution to 1914) use history-25, economics-06 and economics-08. Units 8–9 use
      history-26. Gaps the AP fills: exploration and the Commercial Revolution; absolutism in France, Russia,
      Austria and Prussia; the Dutch Republic; the Scientific Revolution and Enlightenment as social
      history; 18th-century wars and Napoleon in detail; the agricultural and industrial
      revolutions and their social effects; women and the family; the Russian Revolution; and
      everything after 1945 (decolonization, integration, 1968, the Soviet bloc, 1989, migration),
      which the main track reaches only through Solzhenitsyn and Centesimus Annus. Slants:
      McKay puts social history and "everyday life" first. It is strong on women, family and
      economy and lighter on religion and ideas. Palmer, Colton and Kramer is a classic
      liberal-internationalist political and intellectual narrative, dense but very authoritative.
      Kagan's Western Heritage was co-written by a noted defender of teaching Western civilization and
      is the most traditional of the three. Pair McKay with The Golden Thread, or with Dawson's
      Dividing of Christendom from history-22, to restore religion and ideas. The Catholic-Protestant
      balance on the Reformation is handled in history-22.

  # ───────────────────────── AP World History: Modern (exam at about 17) ─────────────────────────
  - id: ap-history-05
    title: "AP World History: Modern I: c. 1200–1750 (Units 1–4)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 5
    prerequisites: [ap-history-01]
    related: [spanish-07, chinese-10, chinese-12, chinese-13, history-13, history-19, history-22]
    exams: [ap-world-history-modern]
    summary: >-
      AP-specific content that needs the most new reading in this program, because the main track
      is centered on the West. It covers CED Unit 1 (the Global Tapestry, c. 1200–1450: Song China,
      Dar al-Islam, South and Southeast Asia, the Americas, Africa and Europe), Unit 2 (Networks of
      Exchange: the Silk Roads, the Mongol Empire, the Indian Ocean and trans-Saharan trade, with Mali),
      Unit 3 (Land-Based Empires, 1450–1750: the Ottoman, Safavid and Mughal "gunpowder
      empires", the Ming and Qing, Tokugawa Japan) and Unit 4 (Transoceanic Interconnections: Zheng He, the Iberian
      voyages, the Aztec and Inca conquests, the Columbian Exchange and the Atlantic slave trade). The travelers and
      eyewitnesses (Ibn Battuta, Zheng He, Bernal Díaz, Babur) are read as primary sources, in keeping with the program's method.
    objectives:
      - Explain Song China's economy, Neo-Confucianism and technology, and the spread of Islam from the Abbasids to the Delhi Sultanate and Southeast Asia
      - Read Ibn Battuta on Mali, Delhi and China, and explain the trans-Saharan and Indian Ocean trade networks
      - Explain Mongol conquest and the Pax Mongolica as a cause of exchange (technology, disease, the Black Death)
      - Compare how the Ottoman, Safavid, Mughal, Qing and Tokugawa states legitimized and consolidated power
      - Compare Zheng He's voyages with the Iberian voyages, and the Aztec and Inca states before and after conquest, using the Florentine Codex against Bernal Díaz
      - Complete progress checks for Units 1–4 and one timed DBQ and LEQ from c. 1200–1750
    coreTexts:
      - title: "AP World History: Modern Course and Exam Description, Units 1–4"
        reader: teacher
        author: College Board
