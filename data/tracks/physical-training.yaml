        kind: instructional
        reader: student
        pages: 270
        lessons: 14
        lessonLabel: chapter
        lessonsNote: "Project Gutenberg 44215 text: Chapters I-XIV"
        author: Daniel Carter Beard
        date: "1920"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/44215" }
      - title: Woodcraft and Camping
        kind: instructional
        reader: student
        pages: 87
        lessons: 10
        lessonLabel: chapter
        lessonsNote: "Project Gutenberg 34607 table of contents: Chapters I-X"
