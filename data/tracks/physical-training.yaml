track: physical-training
title: Physical Training
trackGroup: Arts & Body
description: >-
  "A sound mind in a sound body" is the first line of Locke's Some Thoughts Concerning Education, and
  Jefferson told his nephew that "a strong body makes the mind strong." The track builds hardiness,
  courage, skill and self-command through the physical arts a founding-era gentleman was expected to
  have, updated with current pediatric evidence. It begins with swimming, tumbling, running and outdoor
  play (4–10), adds the traditional accomplishments of archery, horsemanship, woodcraft, marksmanship
  and team sport (7–16), then the combat arts of wrestling and fencing (10–16), and finally
  supervised strength training (12–18). Every row stresses safety, discipline and courage over
  specialization. The end state is a young adult who can swim a mile and save a life, camp and navigate in
  the backcountry, ride, shoot safely and accurately, defend himself, play on a team, and keep a lifelong
  strength and conditioning routine.
rows:
  - id: physical-training-01
    title: "Learning to Swim and Water Safety"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 4
    ageEnd: 8
    order: 1
    prerequisites: []
    related: [early-development-09, early-development-19]
    summary: >-
      Drowning is a leading cause of death among young children. The AAP recommends swim lessons for most
      children from age 1, together with barriers, constant supervision and life jackets, since no lesson
      makes a child "drown-proof." By 4–8 the child should move through formal learn-to-swim levels to
      water competency: entering deep water, surfacing, floating, turning, swimming 25 yards and exiting.
    objectives:
      - Progress through Red Cross Learn-to-Swim Levels 1–3 or an equivalent (breath control, floats, glides, front crawl, treading water)
      - "Achieve water competency: jump into deep water, return to the surface, float or tread for one minute, turn, swim 25 yards, exit"
      - Learn water-safety rules, including life jackets in boats and "reach or throw, don't go"
    curriculumOptions:
      - name: Learn-to-Swim (Levels 1–6)
        publisher: American Red Cross
        tradition: secular
        url: "https://www.redcross.org/take-a-class/swimming/swim-lessons/kids-swim-lessons"
        notes: Six-level progression offered at most community pools.
      - name: USA Swimming clubs (competitive pathway after basic competency)
        publisher: USA Swimming
        tradition: secular
        url: "https://www.usaswimming.org/"
        notes: Club swimming builds stroke technique and endurance from about 7–8.
    historicalPrecedent: >-
      Locke (Thoughts §8): swimming "saves many a man's life; and the Romans thought it so necessary, that
      they ranked it with letters." Franklin taught himself to swim as a boy, once swam the Thames from
      Chelsea to Blackfriars, and wrote a letter of swimming advice to Oliver Neave that was widely reprinted.
    sources:
      - { label: "AAP: Drowning Prevention and Water Safety", url: "https://www.aap.org/en/patient-care/drowning-prevention-and-water-safety/" }
      - { label: "AAP Policy (2019): Prevention of Drowning", url: "https://publications.aap.org/pediatrics/article/143/5/e20190850/37134/Prevention-of-Drowning" }
      - { label: "Franklin to Oliver Neave, on swimming (Founders Online)", url: "https://founders.archives.gov/documents/Franklin/01-15-02-0169" }
      - { label: "Locke, Some Thoughts Concerning Education §8 (Archive.org)", url: "https://archive.org/details/somethoughtsconc00lockuoft" }

  - id: physical-training-02
    title: "Tumbling, Gymnastics and Calisthenics Foundations"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 10
    order: 2
    prerequisites: []
    related: []
    summary: >-
      Gymnastics develops strength relative to body weight, flexibility, balance, spatial awareness and
      courage. These are the foundation for every later sport and combat art. Take recreational gymnastics
      or tumbling classes and do a short daily calisthenics routine at home (bear crawls, hollow holds,
      push-ups, pull-up progressions, handstands against a wall).
    objectives:
      - Forward and backward rolls, cartwheel, bridge, handstand against a wall (30 seconds)
      - Hang from a bar 30 seconds or more, and progress to one or more strict pull-ups by 10
      - Balance-beam walking, jumping and landing with control
      - Ten minutes of daily calisthenics as a habit (paired with morning prayer or before lessons)
    workload:
      readingHours: 0
      work:
        - { kind: practice, hours: 240, note: "recreational gymnastics or tumbling class, ~3 yr x 36 wk x 1 h (108 h), plus ten minutes of calisthenics on ~200 days a year x 4 yr (133 h)" }
    curriculumOptions:
      - name: USA Gymnastics member clubs (recreational and developmental programs)
        publisher: USA Gymnastics
        tradition: secular
        url: "https://usagym.org/"
        notes: Choose a recreational or developmental program rather than an early-specialization competitive track.
    historicalPrecedent: >-
      Greek education joined gymnastike to mousike. In America, Charles Beck introduced German Turnen
      gymnastics at George Bancroft's Round Hill School (Northampton, Mass., 1825), one of the first school
      gymnasiums in the country.

  - id: physical-training-03
    title: "Walking, Running and Field Games"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 10
    order: 3
    prerequisites: [physical-training-02]
    related: []
    summary: >-
      Daily vigorous activity (the CDC and WHO recommend 60 minutes or more for school-age children) through
      long walks, running games, tag, relays and field days. Jefferson prescribed two hours of walking a day
      for his nephew. Build aerobic base gradually. Short sprints and play come first, and steady running
      distances are added from about 9–10.
    objectives:
      - Sixty minutes or more of moderate-to-vigorous activity daily, much of it outdoors
      - Family hikes of 3–5 miles by age 8, and 8–10 miles by 10
      - Run a mile continuously by 8, and a 5K by 10–11 if interested
      - Learn to throw, catch and kick well through playground and field games
    workload:
      readingHours: 0
      work:
        - { kind: practice, hours: 240, note: "organized walks, hikes, runs and field games, ~4 yr x 40 wk x 1.5 h; the rest of the daily 60 minutes is free play and not counted" }
    historicalPrecedent: >-
      Jefferson to Peter Carr (1785): "Give about two of them, every day, to exercise; for health must not be sacrificed to learning... Walking is the best
      possible exercise. Habituate yourself to walk very far." He also judged ball games "too violent for the
      body" and to "stamp no character on the mind," a view later schools like Rugby rejected.
    sources:
      - { label: "Jefferson to Peter Carr, 19 Aug. 1785 (Founders Online)", url: "https://founders.archives.gov/documents/Jefferson/01-08-02-0319" }
      - { label: "Jefferson to Peter Carr, 19 Aug. 1785 (Wikisource)", url: "https://en.wikisource.org/wiki/Letter_to_Peter_Carr_-_August_19,_1785" }
      - { label: "Monticello: Exercise", url: "https://www.monticello.org/encyclopedia/exercise" }

  - id: physical-training-04
    title: "Hiking, Camping and Woodcraft"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 13
    order: 4
    prerequisites: [physical-training-03]
    related: [natural-science-11, mathematics-15, sports-02, sports-05]
    summary: >-
      The student learns to be at home in the wilderness: pack and walk a trail, pitch a tent, build and put out
      a fire, cook outdoors, purify water, use a knife and axe safely, tie the essential knots, read a map and
      compass, and give first aid. Advance from family day hikes to overnight and multi-day backpacking
      trips, ideally through a scouting-type program with the patrol method and rank advancement.
    objectives:
      - "Master 10 knots and lashings, knife and axe safety, fire building (including in wet weather), and Leave No Trace"
      - Navigate a 5-mile cross-country course with map and compass by 12
      - Complete a 3-night backpacking trip carrying his own gear by 13
      - Earn first-aid certification and know wilderness responses to cold, heat, sprains and bleeding
    workload:
      readingHours: 25
      readingBasis: "807 pp of the 1911 Scout Handbook, Beard and Nessmuk (plain how-to prose) at ~30 pp/h"
      work:
        - { kind: practice, hours: 310, note: "skills sessions (knots and lashings, knife and axe, fire, outdoor cooking, water, map and compass), ~100 x 1 h, plus day hikes and camping trips, ~6 yr x 35 h, building to a 3-night backpacking trip; first-aid certification is counted in practical-arts-11" }
