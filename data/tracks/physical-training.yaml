    historicalPrecedent: >-
      Locke opens his treatise with "a sound mind in a sound body" (Juvenal's mens sana in corpore sano).
      Jefferson told Carr "a strong body makes the mind strong." The 19th-century "muscular Christianity" of
      Kingsley and Hughes made physical vigor a Christian duty.
