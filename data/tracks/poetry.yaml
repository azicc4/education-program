        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/penmanship/copybook-cursive-scripture-poems/"
        notes: Copywork of Scripture and poems. Useful for fixing psalms in memory.
    historicalPrecedent: >-
      The Bay Psalm Book (1640) was the first book printed in British North America. Watts's Psalms and Divine
      Songs were among the most-memorized texts of colonial and early-republic childhood, and Franklin printed
      Watts's Psalms in 1729. Psalm-singing and hymn memorization were universal in 18th- and 19th-century
      schools and homes, Catholic and Protestant.
    notes: >-
      Catholic/Protestant note. Protestant English hymnody (Watts, Wesley, Newton) and the Catholic Latin hymn
      tradition (Aquinas's Adoro te devote, Pange lingua; Caswall and Newman as translators) are both treated
      as English poetry. Catholic Psalter numbering (Vulgate/Douay) differs by one from the Hebrew/KJV for most
      of Psalms 10–147. Note which numbering is in use when memorizing.

  - id: poetry-07
    title: "Prosody & Scansion"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 12.5
    order: 7
    prerequisites: [poetry-04]
    related: []
    exams: [ap-english-literature]
    summary: >-
      The formal study of English meter. The student learns stress and syllable, the feet (iamb, trochee,
      anapest, dactyl, spondee), line lengths (trimeter to hexameter), caesura and enjambment, substitution,
      and rhyme and its kinds. Every memorized poem is scanned. The texts are Stephen Fry's The Ode Less
      Travelled (practical, with daily exercises), Hollander's Rhyme's Reason (each form illustrated in itself)
      and Fussell's Poetic Meter and Poetic Form (the standard college text), with Saintsbury and Alden for
      historical depth.
    objectives:
      - Scan any line of accentual-syllabic English verse and name its meter
      - Identify and explain metrical substitution (initial trochee, feminine ending, spondee) and its expressive effect
      - Distinguish accentual-syllabic, accentual (Old English, Hopkins' sprung rhythm) and syllabic verse
      - Complete Fry's exercises in iambic pentameter (write 50+ correct lines)
    coreTexts:
      - title: "The Ode Less Travelled: Unlocking the Poet Within"
        author: Stephen Fry
        date: "2005"
        publicDomain: false
        links:
          - { label: Barnes & Noble, url: "https://www.barnesandnoble.com/w/the-ode-less-travelled-stephen-fry/1100624994?ean=9781592403110" }
      - title: "Rhyme's Reason: A Guide to English Verse"
