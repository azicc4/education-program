  - id: poetry-04
    title: "Ballads & Narrative Verse"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 11
    order: 4
    prerequisites: [poetry-03]
    related: [literature-08]
    summary: >-
      The ballad tradition and the great narrative poems. The course reads the Child Ballads and Percy's
      Reliques (Sir Patrick Spens, Chevy Chase, the Robin Hood ballads), Macaulay's Lays of Ancient Rome, Scott's
      Lady of the Lake, Coleridge's Rime of the Ancient Mariner, Longfellow's Evangeline and Hiawatha, and
      Browning's Pied Piper. Narrative verse carries a young reader through long poems by the power of story.
      The ballad stanza is also the first form the student will write.
    objectives:
      - Memorize one long narrative poem (Horatius, 70 stanzas; or the Rime, Part I)
      - Identify the ballad stanza (4-3-4-3 stresses, abcb rhyme), refrain and incremental repetition
      - Compose an original ballad of 8+ stanzas on a historical or family subject
      - Read aloud a narrative poem with dramatic variation of voice
