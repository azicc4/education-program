      Wordsworth and Coleridge's Lyrical Ballads and Wordsworth's sonnets and odes; Keats's Odes; Tennyson's In
      Memoriam; Browning's dramatic monologues; Christina Rossetti; Newman's Dream of Gerontius; and Gerard
