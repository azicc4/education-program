      Catholic/Protestant note. This period's devotional poetry comes from both sides of the Reformation divide.
      Southwell was a Jesuit priest martyred at Tyburn in 1595 and canonized in 1970. Donne was born into a
      recusant Catholic family and became an Anglican dean. Herbert was a devout Anglican country parson, and
      Milton a Puritan. Crashaw (Anglican turned Catholic) can be added. The shared devotional tradition is
      itself a lesson. Chaucer here is studied only as the maker of the English pentameter couplet. The fuller
      reading of the Canterbury Tales is in literature-18, and the General Prologue in the original Middle
      English, read aloud and memorized, is in old-english-05.

  - id: poetry-10
    title: "Translating Latin Verse into English"
