      and published poems.
    sources:
      - { label: "Scholastic Awards: FAQ (eligibility, homeschoolers, fees)", url: "https://www.artandwriting.org/frequently-asked-questions/" }
      - { label: "Scholastic Awards: Categories (Poetry; Writing Portfolio)", url: "https://www.artandwriting.org/awards/how-to-enter/categories/" }
      - { label: "Foyle Young Poets of the Year Award (Poetry Society, UK; ages 11–17, open worldwide, free)", url: "https://foyleyoungpoets.org/rules/" }
      - { label: "Young Poets Network (Poetry Society, UK; free challenges for poets up to 25, worldwide)", url: "https://ypn.poetrysociety.org.uk/" }
    notes: >-
      This row carries the program's "poetic competence" goal. Work with a verse mentor or tutor, ideally one who
      writes metrical verse: meet every week or two to go over drafts line by line (meter, diction, image, form),
      and let the mentor choose which finished poems go out to competitions and journals. Poets associated with
      the classical-school world or with journals publishing formal verse can also critique portfolios. Outlets
      by stage: the Scholastic Awards (U.S., grades 7–12) and the Foyle Young Poets Award (worldwide, ages 11–17,
      one poem of up to 40 lines for international entrants) while the student is eligible; Young Poets Network
      challenges for practice; and Dappled Things as a first adult Catholic venue.

  - id: poetry-14
    title: "Poetics Seminar: Aristotle to Eliot"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 14
    prerequisites: [poetry-13]
    related: [literature-32]
    summary: >-
      A college seminar on what poetry is and what it is for. The course reads Aristotle's Poetics, Horace's Ars
      Poetica, Longinus On the Sublime, Sidney's Defence of Poesy, Pope's Essay on Criticism, Wordsworth's Preface
      to Lyrical Ballads, Shelley's Defence of Poetry, Eliot's "Tradition and the Individual Talent", and Lewis's An
      Experiment in Criticism. The student writes a defense of poetry of their own. Theory comes last, after the
      student has made poems.
    objectives:
      - Summarize and critique Aristotle's account of mimesis, plot, character and catharsis
      - Compare Sidney's and Shelley's defenses of poetry against Plato's charge
      - Evaluate Wordsworth's claim that poetry uses "the real language of men"
      - Write a 4,000-word "Defence of Poetry" of the student's own, citing the tradition
