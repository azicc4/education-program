      Close study of the English poets from the Middle Ages to the Restoration: Chaucer's General Prologue,
      Shakespeare's Sonnets, Sidney, Donne's Songs and Holy Sonnets, Herbert's The Temple, Southwell, Marvell,
      and Milton's shorter poems (the Nativity Ode, Lycidas, the sonnets). The metaphysical conceit and the
      devotional lyric are the center of the course. The student writes imitations of Donne and Herbert.
    objectives:
      - Memorize 5 Shakespeare sonnets, 2 Holy Sonnets and 2 Herbert poems
      - Explicate a metaphysical conceit (e.g. Donne's compasses) in a 1,000-word essay
      - Scan the pentameter couplets of the General Prologue's opening (hear it read in Middle English; the student's own reading aloud in the original comes in old-english-05)
      - Write an imitation of a Herbert pattern poem or a Donne holy sonnet
