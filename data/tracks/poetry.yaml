track: poetry
title: Poetry
trackGroup: English
description: >-
  Poetry is heard, memorized, recited, understood, and finally made. The track begins with nursery rhymes and
  Mother Goose in infancy, which lay down rhythm and phonological awareness. It builds a large memorized store
  through the great school anthologies (Stevenson, Palgrave, Lang, The Harp and Laurel Wreath) and through the
  nineteenth-century practice of declamation. From 11 it moves into the craft: prosody and scansion, then the
  forms (couplet, ballad stanza, sonnet, blank verse, ode), studied in the major English poets from Chaucer to
  Eliot, along with the Psalms and hymnody and the Augustan art of translating Latin verse. End-state competency
  ("poetic competence"): by 16 the student has 1,500+ lines by heart, can scan any English line and name its
  form, and has a portfolio of serious original verse (sonnets, blank verse, odes, verse translations from
  Latin) that meets the standards of the tradition. A college poetics seminar (Aristotle to Eliot) supplies the
  theory at 17–18.
rows:
  - id: poetry-01
    title: "Nursery Rhymes, Mother Goose & Lullabies"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 0
    ageEnd: 6
    order: 1
    prerequisites: []
    related: [literature-01]
    summary: >-
      Sing and say nursery rhymes, lullabies and finger-plays with the child every day from birth. Rhyme,
      alliteration and strong meter train the ear to hear the sound-structure of words. That phonological
      awareness predicts later reading. It also gives the child a first inheritance of English verse before
      formal schooling.
    objectives:
      - "Birth–2: hear lullabies and bouncing rhymes daily (lap games, clapping to the beat)"
      - "2–4: join in on rhyming words and complete familiar couplets"
      - "4–6: recite 30+ Mother Goose rhymes; clap syllables; produce rhymes for a given word"
      - Associate verse with affection and play (sung at bedtime, in the car, at work)
    coreTexts:
      - title: The Real Mother Goose
        author: Blanche Fisher Wright (illus.)
        date: "1916"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/10607" }
      - title: The Oxford Nursery Rhyme Book
        author: Iona & Peter Opie (eds.)
        date: "1955"
        publicDomain: false
        links:
