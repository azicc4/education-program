    summary: >-
      The capstone of poetic competence: a year-long workshop producing a finished portfolio of serious verse in
      the major forms of the English tradition. The portfolio holds a sonnet sequence, a long poem in blank verse,
      a Horatian and a Pindaric/irregular ode, a satire in heroic couplets, and verse translations from Latin.
      Each piece goes through drafts, critique and revision against the models from Milton, Wordsworth, Keats,
      Hopkins and Frost. The year ends with a public reading.
    objectives:
      - "Complete a portfolio of 12 sonnets (including a linked sequence), 150+ lines of blank verse, two odes, a couplet satire, and 3 Latin translations"
      - Critique a peer's poem in terms of meter, diction, image and form
      - Revise each poem at least three times, keeping drafts to show development
      - Give a public reading of the portfolio from memory
