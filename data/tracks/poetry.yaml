  - id: poetry-05
    title: "Declamation & Public Recitation"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 12
    order: 5
    prerequisites: [poetry-03]
    related: [literature-07, literature-10, literature-13, literature-15, rhetoric-05]
    summary: >-
      The nineteenth-century art of declamation: speaking a memorized poem or speech before an audience with
      trained voice, posture and gesture. Texts come from the Columbian Orator, McGuffey's Sixth Reader,
      Shakespeare's speeches, Macaulay, Kipling and the great patriotic verse. The student performs at a public
      "exhibition" each term. This is the bridge from poetry to rhetoric.
    objectives:
      - Declaim a memorized piece of 40–100 lines each term before an audience
      - Apply McGuffey's rules of articulation, inflection, accent, emphasis and pause
      - Mark a text for breath, emphasis and pause before memorizing it
      - Recite Kipling's "If—" and one Shakespeare speech from the literature track
    coreTexts:
      - title: The Columbian Orator
        author: Caleb Bingham (ed.)
        date: "1797"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/columbianoratorc00bing" }
      - title: "McGuffey's Sixth Eclectic Reader (with rules for elocution)"
        author: William Holmes McGuffey
        date: "1879 rev. ed."
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/16751" }
      - title: "Rewards and Fairies (contains \"If—\")"
        author: Rudyard Kipling
        date: "1910"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/556" }
      - title: Lays of Ancient Rome
        author: Thomas Babington Macaulay
        date: "1842"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/847" }
      - title: The Complete Works of William Shakespeare (speeches)
        author: William Shakespeare
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/100" }
    curriculumOptions:
      - name: 7th Grade Recitation
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/recitation/7th-grade-recitation/"
        notes: The last of MP's graded recitation programs. Add a public exhibition each term.
      - name: The Columbian Orator (free)
        publisher: Archive.org
        tradition: classical
        url: "https://archive.org/details/columbianoratorc00bing"
        notes: Bingham's own "Rules for Eloquence" preface plus 80+ pieces to declaim. It is its own course.
      - name: Poetry Out Loud (national recitation contest)
        publisher: National Endowment for the Arts and state arts agencies (administered by Mid Atlantic Arts)
        tradition: secular
        url: "https://www.poetryoutloud.org/"
        notes: >-
          The national recitation contest, running from school or group rounds through state finals to a national
          final. Open to students in grades 9–12; homeschoolers enter through a local school or a homeschool group
          registered with the state coordinator. Poems must come from its online anthology. Enter once the student
          is doing high-school work (about 12–13 here), and keep competing through 16.
    historicalPrecedent: >-
      Declamation was a fixture of Anglo-American schooling from the colonial Latin schools through the 1800s:
      weekly "speaking" of memorized pieces, and public exhibitions at term's end. Bingham's Columbian Orator
      (1797) went through dozens of editions. Douglass bought it at about 12 and credited it with his rhetoric
      of freedom. McGuffey's Fifth and Sixth Readers open with rules of elocution.
    sources:
      - { label: "Poetry Out Loud: Rules & Eligibility", url: "https://poetryoutloud.org/rules-eligibility/" }
    notes: >-
      Coordinate with the rhetoric track, which takes up the delivery canon (actio) formally. The student's tutor
      or verse mentor should hear each piece before the exhibition and coach breath, pace and emphasis; the
      evaluation criteria in Poetry Out Loud's Teacher's Guide make a useful shared rubric.

  - id: poetry-06
    title: "Psalms & Hymnody as Poetry"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 12
    order: 6
    prerequisites: [poetry-03]
    related: [hebrew-06, music-05]
    summary: >-
      The Psalms are the oldest poetry the student will memorize. The unit studies Hebrew parallelism (read
      further in the Hebrew track), the psalms in the KJV and Douay-Rheims, and the English metrical psalm (Bay
      Psalm Book, Watts). It then turns to the great hymn-writers as poets: Watts, the Wesleys, Newton and Cowper
      (Olney Hymns), Keble, and Caswall's translations of the Latin breviary hymns. These are English verse
      forms (common meter, long meter) that the student will sing and write.
    objectives:
      - Memorize Psalms 1, 23, 51, 90 and 121 (in a Bible translation) and one metrical psalm
      - Identify synonymous, antithetic and synthetic parallelism in Hebrew poetry
      - Scan hymn meters (common meter 8.6.8.6, long meter 8.8.8.8) and match texts to tunes
      - Write a metrical paraphrase of a short psalm in common meter
