    summary: >-
      Verse translation and "imitation" in the Augustan manner. The student studies Dryden's Aeneid and Pope's
      Homer as models, and Johnson's London and Vanity of Human Wishes as imitations of Juvenal. They read
      Horace in Latin with Conington's verse translations, then produce their own English verse renderings of
      Horace's odes and passages of Virgil and Ovid, in heroic couplets, blank verse and stanzas. This joins the
      Latin track to the poetry track, and it is how English poets have always learned their craft.
    objectives:
      - Compare three translations of the same passage (e.g. Aeneid II or Iliad VI) for fidelity, meter and diction
      - Translate 6 Horace odes into rhymed English stanzas
      - Translate 50+ lines of Virgil into heroic couplets or blank verse
      - Write a Johnsonian "imitation" of a Latin satire applied to modern life
