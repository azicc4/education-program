  - id: poetry-03
    title: "The Great Anthologies: Memorization & Recitation"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 10
    order: 3
    prerequisites: [poetry-02]
    related: [literature-06, literature-07]
    summary: >-
      Longer and greater poems learned by heart from the classic school anthologies: Andrew Lang's Blue Poetry
      Book, Palgrave's Golden Treasury and Favorite Poems Old and New. The student learns the lyrics every
      educated English speaker once knew (Blake, Wordsworth, Tennyson, Longfellow, Shakespeare's songs) and
      begins to hear the differences among meters.
    objectives:
      - Memorize 25+ lyric poems of 12–40 lines (total 600+ lines) and review them on a rotating schedule
      - Recite a poem before an audience with appropriate expression, pace and volume
      - Tell iambic from trochaic and anapestic rhythm by ear
      - Name the poet and approximate century of each memorized poem
