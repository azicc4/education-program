  - id: poetry-08
    title: "Poetic Forms & First Composition"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 13.5
    order: 8
    prerequisites: [poetry-07]
    related: []
    summary: >-
      Each traditional form is studied in its best examples and then written by the student. The sequence runs
      heroic couplet, quatrain and ballad stanza, tetrameter couplet, rhyme royal and ottava rima, Spenserian
      stanza, the sonnet (Petrarchan and Shakespearean), blank verse, villanelle and sestina. The weekly rhythm
      is read → scan → imitate → revise. The Oxford Book of English Verse serves as the source book.
    objectives:
      - Write a finished poem in each of eight forms, revised at least twice
      - Write two sonnets (one Petrarchan, one Shakespearean) with a true volta
      - Write 30 lines of blank verse on a narrative subject
      - Explain why a poet chose a given form, and the effect of the choice, for any studied poem
