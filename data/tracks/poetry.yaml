        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/read-alouds/a-childrens-anthology-of-poems-lullabies/"
        notes: A read-aloud anthology for the nursery years.
      - name: Junior Kindergarten Recitation
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/recitation/junior-kindergarten-recitation/"
        notes: A structured daily recitation of rhymes, prayers and short poems for ages 4–5.
    sources:
      - { label: "Bryant, Bradley, Maclean & Crossland (1989), Nursery rhymes, phonological skills and reading, J Child Lang", url: "https://pubmed.ncbi.nlm.nih.gov/2760133/" }
      - { label: "AAP (2024), Literacy Promotion: An Essential Component of Primary Care Pediatric Practice (policy statement)", url: "https://pubmed.ncbi.nlm.nih.gov/39342414/" }
    notes: >-
      Evidence: Bryant et al. found that 3-year-olds' knowledge of nursery rhymes predicted later phonological
      awareness and early reading, even after controlling for IQ and social background. The AAP recommends daily
      reading, rhyming, singing and talking from infancy. Sing rather than recite where possible. For bilingual
      households, do the same in Spanish and Chinese (see the language tracks).

  - id: poetry-02
    title: "Children's Verse & First Memorization"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 8
    order: 2
    prerequisites: [poetry-01]
    related: [literature-01, literature-02]
    summary: >-
      The first formal memory work in verse. The child learns a short poem each week from Stevenson's A Child's
      Garden of Verses, Milne, de la Mare, Eugene Field, Lear and Belloc, recites it with clear diction, and
      keeps a poetry notebook with each poem copied out and illustrated. Poems are chosen for strong rhythm and
      rhyme and for a child's world seen truthfully.
    objectives:
      - Memorize 30–40 short poems (4–20 lines) in two years and keep them in review
      - Recite with clear articulation, natural pauses and eye contact
      - Copy each poem in the poetry notebook (pairs with handwriting and copywork)
      - Hear and clap the beat of a line; identify rhyming words
