    summary: >-
      Twentieth-century poetry in English. The course reads Frost's early books, Yeats, Housman's A Shropshire
      Lad, Chesterton's "Lepanto" and ballads, Eliot's "Prufrock", The Waste Land and Four Quartets, and Kipling's
      verse. The question is how modern poets kept, broke or remade the traditional forms. Frost's blank verse
