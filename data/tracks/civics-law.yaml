          - { label: Avalon Project, url: "https://avalon.law.yale.edu/18th_century/declare.asp" }
      - title: "The Constitution of the United States: A Transcription"
        kind: primary
        reader: together
        pages: 20
        role: selections
        portion: the Preamble
        readPages: 1
        date: "1787"
        publicDomain: true
        links:
          - { label: National Archives, url: "https://www.archives.gov/founding-docs/constitution-transcript" }
    curriculumOptions:
