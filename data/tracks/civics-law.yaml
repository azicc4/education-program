  - id: civics-law-18
    title: "College Seminar: Law and Jurisprudence"
    type: course
    level: college
    stage: formal
    ageStart: 17.5
    ageEnd: 18
    order: 18
    prerequisites: [civics-law-13, civics-law-16]
    related: [philosophy-14, theology-22, philosophy-16]
    summary: >-
      A pre-law seminar on what law is. The natural-law tradition (Aquinas, Blackstone's Introduction,
      the Declaration) is set against legal positivism and legal realism. Oliver Wendell Holmes's "The
      Path of the Law" (1897) is the classic statement of the modern view. The seminar also covers methods
      of constitutional interpretation (originalism, textualism, living constitutionalism) through paired
      Supreme Court opinions. Jefferson's reading list for Bernard Moore is used as a template for the
      student's own plan of lifelong legal reading.
    objectives:
      - Contrast the natural-law, positivist and realist definitions of law, using Aquinas, Blackstone and Holmes
      - Explain originalism and its critics, citing majority and dissenting opinions
      - Draft a personal reading plan in the law on the model of Jefferson's letter to Bernard Moore
      - Deliver a moot-court argument on a live constitutional question
