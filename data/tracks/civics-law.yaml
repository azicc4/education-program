    curriculumOptions:
      - name: "Plutarch's Lives, Volume 1"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/mcp/plutarchs-lives-volume-1/"
      - name: "Winston Churchill and Statesmanship (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/winston-churchill-and-statesmanship"
        notes: Hillsdale publishes the official Churchill biography and documents.
    historicalPrecedent: >-
      Plutarch was a staple of colonial reading. Franklin recalls reading Plutarch's Lives "in which I
      read abundantly" as a boy, and Hamilton, Adams and Madison quote him. Washington had Addison's Cato,
      a play drawn from Plutarch's life of Cato, staged for his officers at Valley Forge.

  - id: civics-law-09
    title: "Ancient and Medieval Political Philosophy: Aristotle, Cicero and Aquinas on Law"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13
    ageEnd: 14
    order: 9
    prerequisites: [civics-law-08]
    related: [philosophy-07, character-virtue-13, latin-11, theology-22, philosophy-15]
    summary: >-
      Jefferson said the Declaration rested on "the elementary books of public right, as Aristotle,
      Cicero, Locke, Sidney." This course reads the first two, then St. Thomas. From Aristotle's Politics
      (Books I–III, VII) the student takes man as a political animal, the forms of regimes and the mixed
      constitution. From Cicero's Republic and Laws he takes natural law and the Roman res publica
      ("true law is right reason in agreement with nature"). From Aquinas's Treatise on Law (Summa I-II,
      qq. 90–97) he takes the eternal, natural, human and divine law, and the principle that an unjust law
      is no law. De Regno adds Aquinas on kingship and tyranny.
    objectives:
      - Explain Aristotle's six regimes and his argument for the "polity" or mixed regime
      - Summarize Cicero's definition of a commonwealth and of true law
      - State Aquinas's definition of law (an ordinance of reason for the common good, made by whoever has care of the community, and promulgated) and the four kinds of law
      - Write a comparative essay on natural law in Cicero and Aquinas
    coreTexts:
      - title: "Politics: A Treatise on Government (Jowett trans.)"
        kind: primary
        reader: student
        pages: 229
        role: selections
        portion: Books I–III and VII
        author: Aristotle
        date: c. 350 BC
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/6762" }
      - title: "The Treatises of M. T. Cicero (includes On the Republic and On the Laws; Yonge trans.)"
