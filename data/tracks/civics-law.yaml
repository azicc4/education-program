  - id: civics-law-17
    title: "College Seminar: American Political Thought"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 17
    prerequisites: [civics-law-12, civics-law-15]
    related: [philosophy-10, history-31, history-23]
    summary: >-
      A survey of American political argument from the primary sources. It runs from the Puritan covenant
      and the Revolutionary pamphlets through Jefferson and Hamilton, Calhoun and Lincoln (the
      Lincoln–Douglas debates), and Frederick Douglass. It continues with the Progressives, the New Deal,
      and the twentieth-century conservative and civil-rights movements. Teaching American History's
      document collections and Hillsdale's American Heritage course supply the readings. The student also
      studies how Congress was designed to work and how it works now.
    objectives:
      - Present seminar reports on 12 major American political documents from 1630 to 1965
      - Explain the Lincoln–Douglas dispute over popular sovereignty and the Declaration
      - Compare the founders' idea of natural rights with the Progressive idea of historical rights
      - Write a capstone essay on a perennial American political question
