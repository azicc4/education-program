  - id: civics-law-06
    title: "How American Government Works: The Branches, Lawmaking, and State and Local Government"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 12
    order: 6
    prerequisites: [civics-law-05]
    related: [history-14]
    summary: >-
      A structured civics course. It covers the three branches and their powers, how a bill becomes law,
      elections and the Electoral College, federalism, and the student's own state constitution, county
      and town. The spine is Joseph Story's Familiar Exposition of the Constitution (1840), which the
      Supreme Court justice wrote for schools. Field trips make it concrete: a town council meeting, a
      courtroom, the state capitol, and a letter to one's representative.
    objectives:
      - Trace a bill from introduction through committee, floor votes, conference and signature or veto
      - Explain the powers of each branch and give an example of each check and balance
      - Describe the structure of one's own state government and name one's governor, legislators, mayor and county officials
      - Attend and write a report on a local government meeting and a court session
      - Write a respectful letter to an elected official about a real issue
    coreTexts:
      - title: A Familiar Exposition of the Constitution of the United States
        kind: instructional
        reader: student
        pages: 372
        pace: long
        author: Joseph Story
        date: "1840"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/familiarexpositi00stor" }
      - title: "The Legislative Process (House of Representatives)"
        kind: instructional
        reader: student
        author: U.S. House of Representatives
        publicDomain: true
        links:
          - { label: house.gov, url: "https://www.house.gov/the-house-explained/the-legislative-process" }
    curriculumOptions:
      - name: "The Hillsdale 1776 Curriculum: American Civics (free)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://k12historyandcivics.hillsdale.edu/"
        notes: Middle-school civics lessons built on primary sources.
      - name: "The Forgotten Realm: Civics for American Christians"
        publisher: Roman Roads Press
        tradition: protestant
        url: "https://romanroadspress.com/store/civics/"
        notes: A civics sourcebook from a Protestant classical publisher.
      - name: "Civics and American Government (Dave Raymond)"
        publisher: Compass Classroom
        tradition: protestant
        url: "https://compassclassroom.com/shop/product/civics-with-dave-raymond/"
        notes: A live class aimed at high schoolers; suits an advanced 11–12-year-old.
      - name: "Create Your Own Country and Constitution (recorded course)"
        publisher: "Homeschool Connections"
