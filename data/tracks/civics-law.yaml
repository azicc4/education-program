  - id: civics-law-15
    title: "Catholic Social Teaching on the State, Subsidiarity and Religious Liberty"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 17
    order: 15
    prerequisites: [civics-law-09, civics-law-12]
    related: [theology-20, economics-07]
    summary: >-
      This course reads the Church's teaching on political authority. In Immortale Dei (1885) and Libertas
      (1888), Leo XIII teaches that authority comes from God and describes the proper relation of Church
      and state. Rerum Novarum (1891) sets out the limits of the state and the rights of families and
      associations. Quadragesimo Anno (1931) defines subsidiarity. The Compendium of the Social Doctrine of
      the Church gives the synthesis. John Courtney Murray's We Hold These Truths (1960), the classic
      Catholic defense of the American founding, is read with them. Murray argued that its natural-law
      "consensus" is compatible with Catholic teaching, and he helped shape Vatican II's declaration on
      religious liberty.
    objectives:
      - Define the common good, subsidiarity and solidarity with reference to the encyclicals
      - Explain Leo XIII's teaching on the origin of political authority and the limits of state power
      - Summarize Murray's argument about the American "public consensus" and the First Amendment's religion clauses
      - Write an essay comparing the Catholic principle of subsidiarity with American federalism
