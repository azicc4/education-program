    curriculumOptions:
      - name: John Jay Fellows Program (semester residency)
        publisher: John Jay Institute
        tradition: protestant
        url: "https://www.johnjayfellows.com/jji-fellows"
        notes: >-
          The model for this row and civics-law-20. It is a tuition-free semester for college
          graduates with a stipend: five three-week Socratic seminar modules (about 150 pages a
          night), Friday field studies, and daily prayer from the Book of Common Prayer. It is
          ecumenical (Evangelical, Catholic and Orthodox) and badged Protestant here only for its
          Anglican-evangelical ethos. A goal for after college, not an option at 17.
      - name: Center for the Study of Law and Religion (publications, lectures and videos)
        publisher: Emory University School of Law (John Witte Jr.)
        tradition: secular
        url: "https://cslr.law.emory.edu/"
        notes: >-
          The leading academic center in the field, where Harold Berman taught and which Witte
          directed for many years. Its free lectures and essays suit an advanced student.
      - name: Acton University
        publisher: Acton Institute
        tradition: catholic
        url: "https://university.acton.org/"
        notes: An ecumenical summer conference with tracks on Christian anthropology, natural law and political theology.
    historicalPrecedent: >-
      The New England Puritans wrote biblical law and covenant into their first codes. John
      Cotton's draft "Moses his Judicials" (1636) was set aside, but the Massachusetts Body of
      Liberties (1641) supported its capital laws with Old Testament citations. Rutherford's Lex,
      Rex and Calvin's doctrine of the lesser magistrates were read in the colonies as warrants for
      lawful resistance.
    sources:
      - { label: "The Massachusetts Body of Liberties (1641), Hanover College", url: "https://history.hanover.edu/texts/masslib.html" }
      - { label: "John Jay Institute, Learning Together (current seminar modules)", url: "https://www.johnjayfellows.com/learning-together" }
      - { label: "John Jay Institute curriculum page, archived 23 Feb 2009 (Wayback Machine)", url: "https://web.archive.org/web/20090223104713/http://www.johnjayinstitute.org/index.cfm?get=get.curriculum" }
    notes: >-
      The John Jay
      Institute's current site names five modules: Christian Worldview and Engagement with Culture;
      Natural Law; Christianity and Politics from the Patristic Age through the Reformation; The
      American Founding and Constitution; and Modern Political Theory and Christian Thought. An
      archived 2006–2009 curriculum gives fuller descriptions. "The Bible, Christianity, Culture
      and Politics" read Genesis 1–11, the Decalogue, Psalms, Isaiah, Jeremiah, Daniel, Amos,
      Matthew 5–6 and 22, Romans 13 and Revelation, with H. Richard Niebuhr, T.S. Eliot,
      Christopher Dawson, J. Gresham Machen and Bonhoeffer. "Christianity and the State through
      the Reformation" ran from Irenaeus, Tertullian, Origen, Eusebius and Augustine through Gelasius
      I, Justinian, Gregory VII, John of Salisbury, Aquinas, Ockham, Marsilius and Gerson to Luther,
      Calvin, Beza, Knox, Ponet, Cartwright, Hooker and Althusius. Those lists can extend this row.
      No public source names a current John Jay course titled "Christian Legal Philosophy", its
      faculty, or its editions. The Institute's statement of beliefs says all law and public policy
      should agree with the principles of natural law. Catholic and Protestant readers differ on
      the authority of Scripture's judicial law. Aquinas and Calvin agree that it does not bind
      Christian states as such, which later theonomists dispute.

  - id: civics-law-20
    title: "College Seminar: Christian Legal Philosophy II: Blackstone to Benedict XVI, Just and Unjust Laws, and Religious Liberty"
    type: course
    level: college
    stage: formal
    ageStart: 17.5
    ageEnd: 18
    order: 18.5
    prerequisites: [civics-law-19, civics-law-18]
    related: [philosophy-16, theology-20, rhetoric-08, history-26, history-31]
    summary: >-
      Modern Christian jurisprudence and its public uses. Blackstone ranks the law of nature and
      revelation above all human law. Kuyper's sphere sovereignty and Leo XIII's Libertas give the
      Reformed and Catholic accounts of law, liberty and the limits of the state. Pacem in Terris
      (1963) grounds rights and duties in the natural law. The same year, King's Letter from
      Birmingham Jail cites Augustine and Aquinas to distinguish just from unjust laws. In his 2011
      Bundestag address Benedict XVI asks what makes law just and answers positivism with "nature
      and reason". Harold Berman, John Witte Jr. and the Jewish legal scholar Robert Cover give the
      scholarly account of how law and religion interact. The seminar ends with American
      religious-liberty law, from Madison's Memorial and Remonstrance to the modern cases.
    objectives:
      - Explain Blackstone's account of the law of nature and revealed law as superior to municipal law, and how far he let it bind English judges
      - Compare Kuyper's sphere sovereignty with the Catholic principle of subsidiarity
      - Analyze King's use of Augustine and Aquinas and test it against Pacem in Terris §51 and ST I-II q.96 a.4
      - Summarize Benedict XVI's critique of a purely positivist concept of law and his appeal to an "ecology of man"
      - Explain Berman's claim that law and religion share ritual, tradition, authority and universality, and Cover's claim that law lives within a community's narratives
      - Brief Employment Division v. Smith, Hosanna-Tabor and Kennedy v. Bremerton, and argue a moot religious-liberty case from the Memorial and Remonstrance and Dignitatis Humanae
