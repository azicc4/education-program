  - id: civics-law-10
    title: "Early Modern Political Philosophy: Hooker, Locke, Sidney, Montesquieu and Vattel"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 10
    prerequisites: [civics-law-09]
    related: [philosophy-10]
    summary: >-
      These are the books the founders actually cited. Hooker's Laws of Ecclesiastical Polity, Book I, is
      the bridge from Aquinas to Locke, and Locke cites "the judicious Hooker." Locke's Second Treatise
      covers the state of nature, property, consent and the right of revolution. Sidney's Discourses
      argue for resisting tyranny. Montesquieu's Spirit of the Laws, Books XI–XII, is the source of the
      separation of powers. Vattel's Law of Nations was the founders' manual of international law. The
      Protestant resistance theory of Vindiciae contra Tyrannos and Rutherford's Lex, Rex is read beside
      them.
    objectives:
      - Outline Locke's argument from the state of nature to consent and the dissolution of government
      - Trace Hooker's natural-law teaching and show how Locke borrows it
      - Explain Montesquieu's separation of powers and its use in Federalist No. 47
      - Compare Sidney's and Locke's accounts of the right to resist tyranny
      - Identify Vattel's influence on the Declaration's language and on early American diplomacy
