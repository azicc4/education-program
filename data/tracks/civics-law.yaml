  - id: civics-law-13
    title: "The Common Law: Blackstone and Coke"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16.5
    order: 13
    prerequisites: [civics-law-10]
    related: [latin-11, history-21]
    summary: >-
      Blackstone's Commentaries (1765–69) was the founders' law book. Burke told Parliament in 1775 that
      nearly as many copies had sold in America as in England, and Lincoln taught himself law from it. The student reads the Introduction ("Of
      the Nature of Laws in General") and Book I, "Of the Rights of Persons," and samples Books II–IV on
      property, torts and crimes. Coke's Institutes, which Jefferson and Adams worked through as law
      apprentices, are sampled for Magna Carta, the Petition of Right and the ancient constitution. The
      course also covers how common law develops: precedent, stare decisis, and trial by jury.
    objectives:
      - Summarize Blackstone's account of the law of nature, revelation and municipal law
      - Explain the "absolute rights of individuals" (personal security, personal liberty, private property)
      - Brief five classic common-law cases in the standard format (facts, issue, holding, reasoning)
      - Trace the line from Magna Carta through Coke to the Fifth, Sixth and Seventh Amendments
    coreTexts:
      - title: Commentaries on the Laws of England
        kind: primary
        reader: student
        pages: 2000
        role: selections
        portion: "the Introduction and Book I (Of the Rights of Persons), with samples from Books II–IV"
        pace: long
        author: William Blackstone
        date: 1765–1769
        publicDomain: true
        links:
          - { label: Avalon Project, url: "https://avalon.law.yale.edu/subject_menus/blackstone.asp" }
          - { label: Project Gutenberg (Book I), url: "https://www.gutenberg.org/ebooks/30802" }
      - title: "The First Part of the Institutes of the Laws of England (Coke upon Littleton)"
        kind: primary
        reader: student
        role: selections
        portion: passages on Magna Carta, the Petition of Right and the ancient constitution
        author: Sir Edward Coke
        date: "1628"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/cu31924021661693" }
    historicalPrecedent: >-
      Jefferson's course of reading for Bernard Moore (c. 1773, recopied for John Minor in 1814) set out a
      daily schedule. Physical studies, ethics, religion and natural law (including Vattel) came before
      eight in the morning, law from eight to twelve, politics from twelve to one, history in the
      afternoon, and belles lettres, criticism, rhetoric and oratory from dark to bedtime. The law
      reading runs from Coke's Institutes through Bacon's Abridgment to "the inimitable Commentaries of
      Blackstone." In his autobiography Adams recalls telling Jeremiah Gridley, before his admission to
      the Boston bar (1758), that he had read Wood's Institutes, Coke upon Littleton and the other
      Institutes, and the reports. Gridley's advice was to "pursue the Law itself, rather than the gain
      of it."
    sources:
      - { label: "Jefferson to John Minor, 30 Aug. 1814, including Jefferson to Bernard Moore (Founders Online)", url: "https://founders.archives.gov/documents/Jefferson/03-07-02-0455" }
      - { label: "John Adams, Autobiography, 1758 (Founders Online)", url: "https://founders.archives.gov/documents/Adams/01-03-02-0016-0006" }

