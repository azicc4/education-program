    summary: >-
      Two outside observers of the American experiment. Burke's Reflections on the Revolution in France
      (1790) contrasts the "prescriptive" liberties of Englishmen, and so of the Americans he had
      defended, with abstract revolutionary rights. Tocqueville's Democracy in America (1835/1840) explains
      what made American self-government work: townships, associations, religion, mores, the jury and
      the legal profession. It also names its dangers: majority tyranny, individualism and soft despotism.
    objectives:
      - Explain Burke's idea of society as a partnership between the dead, the living and the unborn
      - Contrast the American and French revolutions using Burke and the Declaration
      - Summarize Tocqueville on township government, voluntary associations and "self-interest rightly understood"
      - Write an essay testing Tocqueville's warnings about soft despotism against present-day America
