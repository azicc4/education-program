    summary: >-
      Constitutional law is learned from the cases. The student reads opinions (edited, then in full)
      starting with Marbury v. Madison (judicial review) and McCulloch v. Maryland (implied powers and
      federal supremacy). Dred Scott v. Sandford is read critically, beside Lincoln's answer to it and
      Justice Curtis's dissent. Brown v. Board of Education follows, then a few modern cases. Knowledge
      becomes skill in a mock-trial team (evidence, direct and cross-examination, opening and closing
      statements) and a moot-court appellate argument.
