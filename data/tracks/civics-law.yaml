        notes: A year-long great-books fellowship for undergraduates. Apply once in college.
    historicalPrecedent: >-
      The Institute's namesake joined law and faith in one career. John Jay studied under King's
      College's 1763 plan, which set Grotius or Pufendorf in the fourth year. He became the first
      Chief Justice and in retirement served as president of the American Bible Society
      (1821–1827). In 1963 King's Birmingham letter showed that the Augustinian and Thomist
      distinction between just and unjust laws could still move American law.
    sources:
      - { label: "John Jay Institute, Our Beliefs (natural law and religious liberty)", url: "https://www.johnjayfellows.com/our-beliefs" }
      - { label: "John Jay Institute curriculum page, archived 23 Feb 2009 (Wayback Machine)", url: "https://web.archive.org/web/20090223104713/http://www.johnjayinstitute.org/index.cfm?get=get.curriculum" }
    notes: >-
      The John Jay Institute's archived
      2006–2009 module "Christianity, American Constitutionalism and Jurisprudence" read Coke,
      Selden, Hale and Blackstone, colonial charters and the founding documents. It also read Jay,
      Marshall, Kent and Story, and set James Fitzjames Stephen against J.S. Mill. "Modern
      Political Theory and Christian Thought" added Milton, Baxter, Wilberforce, Coleridge, Groen
      van Prinsterer, Kuyper, Leo XIII, John Courtney Murray, Reinhold Niebuhr, John Paul II and
      Richard John Neuhaus. The Institute's statement of beliefs calls religious freedom America's
      first freedom. The King letter is under copyright (King Estate) but is free to read at the
      King Institute. Cover was Jewish. His essay is included because it explains how a religious
      community's law lives alongside the state's, a theme Berman and Witte take up. civics-law-15
      already reads Leo XIII against Dignitatis Humanae. Here the question is the jurisprudence of
      religious liberty.
