  - id: civics-law-05
    title: "Founding Documents II: The Bill of Rights, the Gettysburg Address and the Constitution's Structure"
    type: unit
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 11
    order: 5
    prerequisites: [civics-law-04]
    related: [rhetoric-02, history-06]
    summary: >-
      The child memorizes the ten amendments of the Bill of Rights (at least in summary, the First in
      full) and the whole Gettysburg Address, and learns the seven Articles of the Constitution by name
      and subject. Read with a parent, selected primary sources from Hillsdale's Constitution Reader show
      that the documents answer real arguments. Hillsdale's short free course introduces the Constitution.
    objectives:
      - Recite the Gettysburg Address and the First Amendment word-perfect
      - Name the subject of each of the first ten amendments and each of the seven Articles
      - Explain separation of powers, federalism and checks and balances with examples
      - Connect the Gettysburg Address to the Declaration ("four score and seven years ago")
