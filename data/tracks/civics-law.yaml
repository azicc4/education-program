      Story, a sitting Supreme Court justice and Harvard law professor, condensed his three-volume
      Commentaries (1833) into the Familiar Exposition (1840) for use in schools and by general readers.

  - id: civics-law-07
    title: "Parliamentary Procedure, Debate and Model Legislature"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 14
    order: 7
    prerequisites: [civics-law-06]
    related: [rhetoric-09, logic-02]
    summary: >-
      Self-government is a skill as well as a body of knowledge. The student learns to run and take part in
      a meeting under Robert's Rules: motions, seconds, amendments, the previous question, points of
      order, minutes. He practices in a family or co-op club modeled on Franklin's Junto, then in
      congressional debate or a Youth & Government model legislature. Jefferson's Manual, written for the
      Senate he presided over, shows where the rules came from.
    objectives:
      - Chair a meeting and keep minutes using Robert's Rules
      - Make, second, amend, and table a motion correctly; know the order of precedence of the common motions
      - Draft a bill with findings and enacting clauses and argue for it in a mock legislative session
      - Deliver a three-minute persuasive speech and answer cross-examination
    coreTexts:
      - title: "Robert's Rules of Order (1915 edition)"
        kind: instructional
        reader: student
        pages: 320
        role: reference
        author: Henry M. Robert
        date: "1915"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/9097" }
      - title: A Manual of Parliamentary Practice
        kind: instructional
        reader: student
        pages: 188
        author: Thomas Jefferson
        date: "1801"
        publicDomain: true
        links:
          - { label: Archive.org (1834 ed.), url: "https://archive.org/details/manualofparliame00jeffrich" }
    curriculumOptions:
      - name: "Robert's Rules of Order Newly Revised (current edition)"
        publisher: Robert's Rules Association
        tradition: secular
        url: "https://www.robertsrules.com/"
        notes: The current authoritative edition used by most organizations; the free 1915 text is enough for learning.
      - name: Everyday Debate & Discussion
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/products/everyday-debate"
        notes: A gentle introduction to structured debate for the upper grammar and logic stages.
      - name: National Speech & Debate Association (Congressional Debate event)
        publisher: NSDA
        tradition: secular
        url: "https://www.speechanddebate.org/"
        notes: Congressional Debate is a model-legislature competition run under parliamentary procedure.
    historicalPrecedent: >-
      Franklin's Junto (1727) was a young tradesmen's club with standing queries and set debate rules;
      Franklin credited it with much of his education. Jefferson compiled his Manual of Parliamentary
      Practice while presiding over the Senate as Vice President (1797–1801), and the House still uses it.
    sources:
      - { label: "Franklin, Standing Queries for the Junto (1732), Founders Online", url: "https://founders.archives.gov/documents/Franklin/01-01-02-0088" }

  - id: civics-law-08
    title: "Statesmanship: Plutarch, Washington, Lincoln and Churchill"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 13
    order: 8
    prerequisites: [civics-law-05]
    related: [character-virtue-06, character-virtue-10, rhetoric-08, literature-10, history-09]
    summary: >-
      The founders learned statesmanship from Plutarch's Lives, and later statesmen learned it from the
      founders. The student reads paired Lives (Lycurgus and Numa, Solon and Publicola, Cato the Younger,
      Cicero and Demosthenes). He then studies the great American and British speeches on free government:
      Washington's Farewell Address, Lincoln's Lyceum Address and Second Inaugural, and Churchill's 1940
      speeches. Each speech is analyzed, partly memorized, and answered in a short essay on the
      statesman's virtues.
    objectives:
      - Read at least eight of Plutarch's Lives and compare paired statesmen in writing
      - Summarize Washington's warnings in the Farewell Address (faction, foreign entanglements, religion and morality)
      - Explain Lincoln's argument in the Lyceum Address for "reverence for the laws" as the political religion
      - Memorize the closing paragraph of the Second Inaugural and a passage from "Their Finest Hour"
      - Write an essay on what makes a statesman, as distinct from a politician
    coreTexts:
      - title: "Plutarch: Lives of the Noble Grecians and Romans (Dryden/Clough)"
        kind: primary
        reader: student
        pages: 1300
        role: selections
        portion: "at least eight Lives, including Lycurgus and Numa, Solon and Publicola, Cato the Younger, Cicero and Demosthenes"
        pace: long
        author: Plutarch
        date: c. 100
        publicDomain: true
        links:
