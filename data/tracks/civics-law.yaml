  - id: civics-law-19
    title: "College Seminar: Christian Legal Philosophy I: Covenant, Biblical Law, Augustine, Aquinas and the Reformers"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 17.5
    order: 17.5
    prerequisites: [civics-law-10, civics-law-13, civics-law-15]
    related: [philosophy-08, philosophy-15, theology-19, theology-22, history-29, latin-18]
    summary: >-
      How did Christian theology shape Western law? This seminar follows the John Jay Institute's
      modules on the Bible and politics and on Christianity and the state through the Reformation.
      It begins with biblical law and covenant: the Sinai covenant and the Decalogue, Deuteronomy's
      judges and its king under the law, Samuel's warning about kings, Romans 13 and Acts 5:29.
      It continues with Augustine's City of God XIX on peace, the two cities and the definition of
      a people, and with Aquinas on the Old Law's judicial precepts, reread with his Treatise on
      Law. The Reformed line follows: Calvin on civil government (Institutes IV.20), Althusius's
      covenantal federalism, and Rutherford's Lex, Rex. Harold Berman's Law and Revolution supplies
      the historian's frame: the Western legal tradition was born in the Papal Revolution of
      1075–1122.
    objectives:
      - Explain covenant as a legal and political form (Exodus 19–24, Deuteronomy 17) and trace it into Althusius and the Puritan charters
      - Distinguish the moral, ceremonial and judicial precepts of the Old Law (ST I-II qq. 99, 104–105) and compare Calvin's answer to whether the judicial law binds Christian states (Institutes IV.20.14–16)
      - Contrast Augustine's definition of a people (City of God XIX.24) with Cicero's (XIX.21) and state what follows for justice and the state
      - Outline Calvin's three parts of civil government (magistrate, laws, people) and his teaching on the "lesser magistrates" (IV.20.31), and trace it into Rutherford
      - Summarize Berman's thesis on the Papal Revolution and the origin of the Western legal tradition
      - Write a paper on Romans 13 and Acts 5:29 as read by Augustine, Aquinas, Calvin and Rutherford
    coreTexts:
      - title: "The Bible: Exodus 19–24; Deuteronomy 16–17; 1 Samuel 8; Jeremiah 29; Matthew 22; Romans 2 and 13; Acts 5"
        kind: primary
        reader: student
        pages: 20
