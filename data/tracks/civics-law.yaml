track: civics-law
title: Civics & Law
trackGroup: Founder Skills
description: >-
  Civic formation for a future statesman. It runs from the child's first communities to the texts and
  practice of self-government. In early childhood (2–6) the child learns to belong and to be loyal: to the
  family and the parish first, then to the nation through the Pledge, the flag, the anthem and patriotic
  songs. From 6 to 11 the founding documents are memorized and then understood: the Declaration, the
  Preamble, the Bill of Rights and the Gettysburg Address, read with Hillsdale's primary-source approach.
  From 10 to 13 the student learns how the government works (the three branches, how a bill becomes law,
  state and local government) and practices it through Robert's Rules, debate and model legislature. He
  also reads the statesmen: Plutarch, Washington, Lincoln and Churchill. From 13 to 16 he reads, in
  order, the political philosophy the founders drew on: Aristotle, Cicero and Aquinas; Hooker, Locke,
  Sidney, Montesquieu and Vattel; then The Federalist and the Anti-Federalists, Burke and Tocqueville. He
  also studies the common law as the founders did, from Blackstone and Coke, and argues landmark cases in
  mock trial and moot court. Catholic social teaching on the state, and John Courtney Murray on the
  American proposition, close the high-school sequence. College-level seminars (17–18) cover the
  Constitution, American political thought, and law and jurisprudence. The end state is a young citizen
  who can recite the founding documents, explain the Constitution clause by clause, argue from the
  natural-law tradition and the common law, run a meeting, and hold public office or read law.
rows:
  - id: civics-law-01
    title: "First Communities: Family, Parish and Neighborhood"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 2
    ageEnd: 6
    order: 1
    prerequisites: []
    related: [early-development-12, theology-01, character-virtue-01]
    summary: >-
      Civic life begins at home. The family is the first society and the parish the second. Through chores,
      family meals, Sunday Mass, and knowing the neighbors, the parish priest, the mailman and the
      firefighters, the child learns that he belongs to communities with rules, roles and duties of service.
      Catholic social teaching calls the family the "original cell of social life," and subsidiarity (the
      idea that larger bodies should help, not replace, smaller ones) starts here.
    objectives:
      - Do real daily chores that serve the household (setting the table, tidying, feeding pets)
      - Know the names and roles of family members, the pastor, and neighborhood helpers
      - Take part in parish life (Mass, feast days, a parish service project) and family decision-making in small ways
      - Learn basic rules of courtesy toward elders and guests
    coreTexts:
      - title: Compendium of the Social Doctrine of the Church (ch. 5, "The Family, the Vital Cell of Society")
        kind: primary
        reader: teacher
        pages: 25
        role: selections
        portion: 'ch. 5, "The Family, the Vital Cell of Society"'
        readPages: 25
        author: Pontifical Council for Justice and Peace
        date: "2004"
        publicDomain: false
        links:
          - { label: Vatican.va (free), url: "https://www.vatican.va/roman_curia/pontifical_councils/justpeace/documents/rc_pc_justpeace_doc_20060526_compendio-dott-soc_en.html" }
    notes: >-
      Parent reading, not child reading. Protestant families will find the same pattern in the Reformed
      idea of "sphere sovereignty" (family, church and state as distinct spheres; see Kuyper's Lectures on
      Calvinism in civics-law-15).

  - id: civics-law-02
    title: "The Pledge, the Flag, the Anthem and Patriotic Song"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 3
    ageEnd: 6.5
    order: 2
    prerequisites: []
    related: [early-development-10, music-01]
    summary: >-
      Young children love ritual and song, and they learn loyalty the way they learn language: by
      repetition. Recite the Pledge of Allegiance daily with hand on heart. Teach how to treat the flag,
      and sing "The Star-Spangled Banner," "My Country, 'Tis of Thee" and "America the Beautiful." Tell the
      stories behind them: Fort McHenry, Betsy Ross, the Liberty Bell.
    objectives:
      - Recite the Pledge of Allegiance from memory with correct posture
      - Sing the first verse of the national anthem and two other patriotic songs
      - Recognize the flag, the bald eagle, the Liberty Bell, the Statue of Liberty and the Capitol
      - Know basic flag etiquette (don't let it touch the ground; raise it at dawn, lower it at dusk)
    coreTexts:
      - title: "4 U.S. Code § 4: Pledge of Allegiance to the Flag"
        kind: primary
        reader: teacher
        pages: 1
        author: U.S. Congress
        date: "1942 / 1954"
        publicDomain: true
        links:
          - { label: Cornell LII, url: "https://www.law.cornell.edu/uscode/text/4/4" }
      - title: "4 U.S. Code Chapter 1: The Flag (the Flag Code)"
        kind: primary
        reader: teacher
        pages: 6
        author: U.S. Congress
        publicDomain: true
        links:
          - { label: Cornell LII, url: "https://www.law.cornell.edu/uscode/text/4/chapter-1" }
    curriculumOptions:
      - name: "Teaching American History & Civics, Grades K-2 (free online course for parents)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/teaching-american-history-civics-grades-k-2"
        notes: Shows parents how Hillsdale-affiliated schools teach symbols, holidays and heroes at this age.
    sources:
      - { label: "Smithsonian NMAH: The Star-Spangled Banner", url: "https://amhistory.si.edu/starspangledbanner/" }
    notes: >-
      Families with conscientious objections to the Pledge can study West Virginia v. Barnette (1943)
      later, in civics-law-14.

  - id: civics-law-03
    title: "American Symbols, Holidays and Heroes"
    type: unit
    level: early-5
    stage: formal
    ageStart: 6.5
    ageEnd: 8
    order: 3
    prerequisites: [civics-law-02]
    related: [character-virtue-03, history-01, history-06]
    summary: >-
      The first formal civics unit, taught through the calendar. Each national holiday (Presidents' Day,
      Memorial Day, Independence Day, Constitution Day, Veterans Day, Thanksgiving) brings a story, a
      primary-source line to memorize, and a hero: Washington, Franklin, Jefferson, Lincoln. The
      catechism-style question-and-answer drill builds a store of civic facts that later courses explain.
    objectives:
      - Explain why each national holiday is kept and who or what it honors
      - Answer 50 or more catechism-style questions on American history and government
      - Tell the story of Washington, Franklin, Jefferson and Lincoln in their own words
      - Copy and recite short lines (for example "Liberty and Union, now and forever, one and inseparable!")
    curriculumOptions:
      - name: 200 Questions About American History
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/schools/cottage-school/200-questions-about-american-history-2/"
        notes: A question-and-answer drill of civic and historical facts; work through it over several years.
      - name: "The Hillsdale 1776 Curriculum (K-12 American History & Civics, free)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://k12historyandcivics.hillsdale.edu/"
        notes: Free lesson plans used in Hillsdale's charter schools; the K-2 and 3-5 units cover symbols, holidays and heroes.
      - name: "Teaching American History & Civics, Grades 3-5 (free online course for parents)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/teaching-american-history-civics-grades-3-5"
    historicalPrecedent: >-
      Nineteenth-century schoolbooks (the McGuffey Readers, Noah Webster's American Spelling Book)
      included patriotic selections and speeches by Washington and Webster for children to read aloud
      and memorize.

  - id: civics-law-04
    title: "Founding Documents I: The Declaration and the Preamble Memorized"
    type: unit
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 9
    order: 4
    prerequisites: [civics-law-03]
    related: [rhetoric-02, history-06, history-14]
    summary: >-
      The child memorizes the Declaration of Independence from "When in the Course of human events"
      through "the consent of the governed," along with the Preamble to the Constitution. Memorize first,
      then explain: equality, unalienable rights, the purpose of government, consent, and the six purposes
      in the Preamble. The first sentences are copied as penmanship lessons.
    objectives:
      - Recite the Declaration's first two paragraphs and the Preamble word-perfect
      - Explain in one's own words "all men are created equal," "unalienable Rights," and "consent of the governed"
      - Name the six purposes of government in the Preamble
      - Identify Jefferson, Adams, Franklin and the Second Continental Congress as authors and signers
