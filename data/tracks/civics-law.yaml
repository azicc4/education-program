        publisher: Roman Roads Press
        tradition: protestant
        url: "https://romanroadspress.com/store/foundations-in-liberty/"
        notes: A reader of founding documents from a Protestant classical publisher.
      - name: "The Hillsdale 1776 Curriculum (free)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://k12historyandcivics.hillsdale.edu/"
        notes: The American Founding unit includes lessons on the Declaration with student-ready primary sources.
      - name: "New American Cursive 2: Quotations from Famous Americans"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/penmanship/new-american-cursive-2-famous-americans-fourth-edition/"
