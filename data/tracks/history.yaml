    summary: >-
      The Middle Ages are read in their chronicles and charters: Bede on Augustine of Canterbury,
      Caedmon and Whitby; Einhard's Life of Charlemagne; the Song of Roland with Einhard's two-line
      account of Roncevaux beside it; Urban II at Clermont; Magna Carta; and Joinville's Life of
      St. Louis. Each source comes with a short guide, and the student starts writing one-page
      source reports (who wrote it, when, why, and what it tells us).
