  - id: history-32
    title: "College Seminar: Church History from Pentecost to the Present"
    type: course
    level: college
    stage: formal
    ageStart: 17.5
    ageEnd: 18
    order: 32
    prerequisites: [history-18, history-22]
    related: [theology-23, theology-16]
    summary: >-
      A college-level seminar on the history of Christianity. It covers the apostolic and
      patristic Church, the councils, monasticism, the papacy and empire, the schism of 1054, the
      mendicants and universities, the Reformation and Catholic Reform, the missions, the Church
      under revolution and totalitarianism, and Vatican I and II. It is read in documents (Eusebius,
      conciliar decrees, papal bulls, Reformation confessions, encyclicals) with a Catholic and a
      Protestant narrative side by side, so the student can explain where and why the traditions'
      histories diverge.
    objectives:
      - Read the decrees of Nicaea, Chalcedon, Trent and Vatican I–II in selection
      - Compare Catholic (Laux) and Protestant (Shelley) narratives of three contested episodes
      - Write a 5,000-word research paper on an episode in Church history, using primary sources
      - Give an account of the development of doctrine (Newman) and its historical use
    coreTexts:
      - title: Church History (Eusebius) — Nicene and Post-Nicene Fathers, Ser. 2, Vol. 1
        kind: primary
        reader: student
        pages: 630
        author: Eusebius, ed. Schaff & Wace
        publicDomain: true
        links:
          - { label: CCEL, url: "https://www.ccel.org/ccel/schaff/npnf201.html" }
      - title: Canons and Decrees of the Council of Trent
        kind: primary
        reader: student
        pages: 608
        publicDomain: true
        links:
          - { label: Hanover Historical Texts, url: "https://history.hanover.edu/texts/trent/trentall.html" }
      - title: "Medieval Sourcebook: Medieval Church; Empire & Papacy"
        kind: secondary
        reader: student
        publicDomain: true
        links:
          - { label: Empire & Papacy, url: "https://sourcebooks.fordham.edu/sbook1l.asp" }
    curriculumOptions:
      - name: "Church History: A History of the Catholic Church to 1940 (Laux)"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/books/church-history-a-history-of-the-catholic-church-to-1940/"
        notes: The standard Catholic narrative, with documents.
      - name: "Church History in Plain Language (Shelley)"
        publisher: Zondervan (via Bookshop.org)
        tradition: protestant
        url: "https://bookshop.org/p/books/church-history-in-plain-language-fifth-edition-the-story-of-the-church-for-today-s-readers-bruce-shelley/fb7b9f0bc3c0daa7"
        notes: The standard evangelical survey. Read it side by side with Laux.
      - name: Ancient Christianity & Theology 101 (free online courses)
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/theology-101"
        notes: "Theology 101: The Western Theological Tradition. Pair it with Ancient Christianity (/ancient-christianity)."
      - name: Kolbe Academy course catalog (Church history & humanities)
        publisher: Kolbe Academy
        tradition: catholic
        url: "https://courses.kolbe.org/"
        notes: Catholic Ignatian classical school with self-paced and live high-school courses. Check the current catalog for its Church history offerings.
    historicalPrecedent: >-
      Ecclesiastical history was a standard subject in the colonial colleges, Protestant divinity
      schools and Jesuit colleges alike, with Eusebius as the first textbook. Newman's Essay on
      the Development of Christian Doctrine (1845) made the history of the Church a theological
      question in its own right.
    notes: >-
      Neutral note: the seminar deliberately pairs a Catholic and a Protestant narrative. Where
      they differ (the papacy, the Reformation, the councils), the student states each case from
      its own sources before judging.
