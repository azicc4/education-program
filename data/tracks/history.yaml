      King Alfred had Bede translated into English for his people. Hume's History of England and
      the 19th-century Whig historians (Stubbs, Freeman) all begin from Bede and the Chronicle.
      Thomas Jefferson studied Anglo-Saxon because he believed English liberty was Saxon in origin.
      The Boy's Froissart (Lanier, 1879) was a favorite prize-book in Victorian and American
      schools. Froissart and Joinville were read as manuals of chivalry, and Scott drew on
      Froissart for his novels. Ages 14–15 can read the full Johnes translation.
