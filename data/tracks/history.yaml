  - id: history-15
    title: "Seminar: Ancient Greece — Herodotus & Thucydides"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12.5
    ageEnd: 13.5
    order: 15
    prerequisites: [history-08]
    related: [greek-12, greek-15, philosophy-05]
    summary: >-
      This is the first rigorous seminar. The student reads Herodotus substantially (Books I, VI–IX)
      and Thucydides nearly whole: the Archaeology, the causes of the war, Pericles' Funeral
      Oration, the plague, Mytilene, the Corcyraean stasis, the Melian Dialogue and Sicily.
      Xenophon's Hellenica is optional. The student meets the invention of history: inquiry
      (historia) versus Thucydides' "possession for all time." Weekly Socratic discussion and
      four argumentative essays.
    objectives:
      - Read about 1,200 pages of Herodotus and Thucydides
      - Contrast the two historians' method, sources and view of causation in a 1,500-word essay
      - Analyze the Funeral Oration and the Melian Dialogue as statements of Athenian self-understanding
      - Draw lessons for republics (stasis, empire, demagoguery) and test them against the founders' use of Greek history
    coreTexts:
