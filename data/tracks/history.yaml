      - name: The Old World and America
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/books/the-old-world-and-america/"
        notes: Fr. Furlong's classic Catholic world history for the middle grades, used by MODG.
      - name: "Middle Ages, Renaissance & Reformation"
        publisher: Veritas Press
        tradition: protestant
        url: "https://store.veritaspress.com/middle-ages-renaissance-reformation-self-paced-course.html"
