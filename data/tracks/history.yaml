      a coda for advanced students.

  - id: history-23
    title: "Seminar: The American Founding to the Civil War — the Founders, Douglass & Lincoln in Their Own Words"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 21
    prerequisites: [history-21, history-14]
    related: [literature-27, rhetoric-08, rhetoric-09, rhetoric-11, civics-law-11, literature-10]
    exams: [ap-us-history]
    summary: >-
      A year-long seminar on the American story from the Revolution to Lincoln's Second Inaugural,
      read almost entirely in primary sources from Founders Online, the Avalon Project and Teaching
      American History. The first half covers the Revolution: the colonial charters, the Stamp Act
      resolves, Paine's Common Sense, Adams's Thoughts on Government, the Declaration with
      Jefferson's rough draft, Washington's letters and his Circular to the States (1783), the
      Articles of Confederation, the Constitutional Convention and the ratification debate
      (Federalist and Anti-Federalist). The second half covers the early republic and the sectional
      crisis: Webster's Second Reply to Hayne against Calhoun, Douglass's Narrative and "What to the
      Slave Is the Fourth of July?", the Lincoln–Douglas debates, the House Divided and Cooper Union
      speeches, and the Gettysburg Address and Second Inaugural. Adams's Diary and Tocqueville's
      Democracy in America (Vol. I) are electives. This is the heart of forming a "modern founding
      father," and its key question is the meaning of the Declaration's equality principle.
    objectives:
      - Read Common Sense entire and Adams's Thoughts on Government, and compare their plans of government
      - Compare Jefferson's rough draft of the Declaration with the adopted text, and explain Congress's changes
      - Read 20 Washington letters (incl. the 1783 Circular and the Newburgh period) and write a character study
      - Read Federalist 1, 10, 39, 47–51, 70, 78 and two Anti-Federalist replies; write a 2,500-word essay on the ratification debate
      - Read Douglass's Narrative entire and his Fourth of July oration
      - Stage a debate reproducing Webster vs. Calhoun on union and nullification
      - Read at least three of the seven Lincoln–Douglas debates and write a judgment between the two on popular sovereignty
      - Write a 2,500-word essay on Lincoln's interpretation of the Declaration, from the Peoria speech to Gettysburg
