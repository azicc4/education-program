      voyage open the unit. Bradford's Of Plymouth Plantation is read in large part, with the
      Mayflower Compact, Winthrop's "A Model of Christian Charity" ("a city upon a hill"), and the
      colonial charters in the Avalon Project. The Catholic colonies (New Spain, New France,
      Maryland) and the missions are treated as fully as the Puritan ones.
