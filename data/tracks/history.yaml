    notes: >-
      Arrian is core: Jefferson told Peter Carr to go on from Thucydides and Xenophon to Arrian,
      and Alexander carries the Greek story to its end. Diodorus is an optional elective; Quintus
      Curtius and Justin are read in Latin in latin-13 and latin-07. For Thucydides, John Adams
      urged Hobbes's "learned and exact" 1629 translation on his son; a student who wants the
      founders' own English Thucydides can read Hobbes in place of Crawley.

  - id: history-16
    title: "Seminar: Rome from Republic to Empire — Polybius, Livy, Tacitus & Josephus"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13
    ageEnd: 14
    order: 16
    prerequisites: [history-15, history-09]
    related: [latin-13, latin-17, rhetoric-10, character-virtue-13]
    summary: >-
      A year-long seminar on the rise and fall of the Republic and the Principate that replaced it,
      read in their historians. The student reads Polybius Books I, III and VI (the mixed
      constitution, the founders' favorite ancient text on government) and Livy Books I–V and
      XXI–XXII (Hannibal). He then reads Tacitus's Agricola, Annals I–IV (Tiberius) and XV (the fire
      and the Christians under Nero), and Josephus's Jewish War on the fall of Jerusalem in AD 70,
      which joins Roman and sacred history. Sallust's moralist view of decline, Suetonius's lives of
      the Caesars and Machiavelli's Discourses on Livy are electives. Essays pair ancient analysis
      with American application, for example Polybius VI against Federalist 47–51 and John Adams's
      Defence. Tacitus's portrait of tyranny and flattery under a republican facade is the central
      lesson for a future statesman.
    objectives:
      - Explain Polybius's theory of the cycle of constitutions and the mixed constitution
      - Read Livy on the Second Punic War and assess Hannibal and Fabius as leaders
      - Write a 2,000-word essay on Polybius VI and the American separation of powers
      - Read the Agricola and Annals I–IV, XV, and analyze Tacitus's portrait of Tiberius
      - Read Jewish War Books V–VI and assess Josephus's reliability and loyalties
      - "From the electives: analyze Sallust's thesis that wealth and ambition corrupted Rome, or compare Tacitus and Suetonius as sources for the same emperor"
      - Write an essay on how liberty is lost under a republican facade, using Tacitus
    coreTexts:
