  - id: history-22
    title: "Seminar: Renaissance, Reformation & Counter-Reformation"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 15.5
    order: 20
    prerequisites: [history-12, history-19]
    related: [theology-19, philosophy-10, literature-19]
    exams: [ap-european-history]
    summary: >-
      The 16th century revisited at seminar depth. The student reads Machiavelli's Prince, More's
      Utopia and Erasmus as the Renaissance humanist debate, then the Reformation documents at
      length: Luther's 95 Theses and Freedom of a Christian, Calvin's Reply to Sadoleto, and the
      Augsburg Confession. On the Catholic side come Trent's decrees on Scripture, Justification and
      the Sacraments and Loyola's Spiritual Exercises (the Rules for Thinking with the Church). The
      English Reformation is read through More's trial and the Act of Supremacy. Dawson's The
      Dividing of Christendom frames the whole.
    objectives:
      - Read Luther and Trent on justification side by side and write a fair summary of each that its adherents would accept
      - Analyze The Prince against Erasmus's Education of a Christian Prince or More's Utopia
      - Explain the political consequences of the Reformation (cuius regio, the wars of religion, toleration)
      - Write a 2,500-word essay on the Reformation's legacy for liberty and conscience, using both Catholic and Protestant sources
