  - id: history-09
    title: "Sources III: Rome in Livy, Plutarch & Caesar"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 11.5
    order: 9
    prerequisites: [history-08]
    related: [latin-07, latin-05, literature-15]
    summary: >-
      Roman history is read in the sources. The student reads Livy Book I (Romulus to the Tarquins,
      Lucretia and the founding of the Republic), Plutarch's Romans (Numa, Publicola, Coriolanus,
      Fabius, Cato the Elder, the Gracchi, Marius, Cicero, Caesar, Brutus) and Caesar's Gallic War
      Books I and IV–V in English. Guerber is the guide. The student meets the Roman idea of
      virtus and the problem of how republics fall.
    objectives:
      - Read Livy Book I entire and narrate the founding and the expulsion of the kings
      - Read six Roman Lives and write a comparison of two (Plutarch's own method)
      - Read Caesar on the Helvetians and the invasion of Britain, and map the campaigns
      - Explain in a paragraph why the Republic fell, citing at least two sources
