      Jefferson's 1785 reading plan for Peter Carr begins "Herodotus. Thucydides." Thomas Arnold
      of Rugby edited Thucydides (1830–35) and made him central to the Sixth Form. Hobbes's first
      published work was his translation of Thucydides (1629), made as a warning against
      democracy.
