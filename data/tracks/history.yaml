  - id: history-08
    title: "Sources II: Greece in Herodotus, Plutarch & Xenophon"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10.5
    ageEnd: 11
    order: 8
    prerequisites: [history-07]
    related: [greek-08, character-virtue-06, literature-16]
    summary: >-
      Greek history is read in the Greeks' own words. The student reads Herodotus in selection
      (Croesus and Solon, Marathon, Thermopylae, Salamis), Plutarch's Lives of Lycurgus, Solon,
      Themistocles, Aristides, Pericles and Alexander, and passages of Xenophon's Anabasis, with
      Guerber or Mills as the guide. Narration moves to written summaries, and the child begins to
      ask "how does Herodotus know this?"
    objectives:
      - Read about 150 pages of Herodotus in selection and narrate the Persian Wars
      - Read five Plutarch Lives and write a character sketch of each statesman
      - Compare Sparta and Athens using Plutarch's Lycurgus and Solon
      - Distinguish eyewitness report, hearsay and legend in Herodotus
