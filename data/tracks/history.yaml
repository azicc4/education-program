      Colonial American colleges were Protestant foundations, and Reformation history was taught
      as the origin of their liberties. The Jesuit colleges of the Ratio Studiorum taught the same
      events as the Church's reform. Reading both sets of documents is the fairer inheritance of
      each.
    notes: >-
      Neutral note: this is the row where Catholic and Protestant accounts diverge most. Read the
      Theses and Trent in full, not just summaries of them. Catholics will add Loyola's Spiritual
      Exercises and Teresa, Protestants the Augsburg Confession and Calvin's Institutes. The
      theology track (theology-19) handles the doctrine; this row handles the events.

