    prerequisites: [history-21]
    related: [philosophy-11, philosophy-12, literature-22, literature-23]
    exams: [ap-european-history, ap-world-history-modern]
    summary: >-
      Europe from 1789 to 1914 in its documents and its interpreters. The student reads the French
      Revolution documents (the Declaration of the Rights of Man and the Terror), then Carlyle and
      Burke as contrasting witnesses. Then come the Congress of Vienna and the Conservative Order,
      1848, and the Communist Manifesto read critically. Leo XIII's Rerum Novarum and Pius IX's
      Quanta Cura give the Catholic response to modernity. For Britain, Bagehot's English
      Constitution and the Reform Acts from the 19th-century Britain sourcebook complete the course.
    objectives:
      - Compare the French Declaration of the Rights of Man (1789) with the American Declaration
      - Read the Communist Manifesto and Rerum Novarum, and write a comparison of their accounts of labor and property
      - Explain the British way of reform (1832, 1867) using Bagehot's "dignified" and "efficient" parts
      - Trace nationalism from Napoleon to German and Italian unification using the sourcebook
