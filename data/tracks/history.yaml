track: history
title: History
trackGroup: History
description: >-
  History is taught thoroughly and from primary sources, in three spiral cycles plus a
  college capstone. Cycle 1 (ages 6–10) is narrative history and heroes. It runs through four
  chronological units (Ancient, Medieval, Early Modern, American) using the old
  story-histories (Haaren & Poland's Famous Men, Guerber, H.E. Marshall, Hillyer), a wall
  timeline, maps and a Book of Centuries, with the first primary sources read aloud (Aesop, Bible
  narratives, Plutarch retold, the Declaration's preamble). Cycle 2 (ages 10–12) walks the same
  road again, this time reading the sources themselves with guides. Scripture and Hammurabi,
  Herodotus and Plutarch, Livy and Caesar, Acts and Eusebius, Bede and Einhard, Luther and Trent,
  Columbus and Bradford. Cycle 3 (ages 12–16) is a set of rigorous primary-source seminars with
  essays. The student reads the historians whole or in large part (Herodotus, Thucydides,
  Polybius, Livy, Tacitus, Josephus, Eusebius, Augustine, Bede, Froissart), the constitutional
  documents of England and America, the Founders in their own words (Founders Online, Avalon),
  Lincoln and Douglass, Burke and Tocqueville, Churchill, the popes and Solzhenitsyn. The cycle
  closes with a historiography unit that reads Hume, Gibbon and Macaulay critically alongside
  Dawson, Acton and Paul Johnson. The college years (17–18) follow Hillsdale's core: Western
  Heritage I–II, American Heritage, and a Church-history seminar. The end state is a young
  statesman who knows the Western and American story in its sequence. He has read the chief
  sources for himself, can weigh a chronicle against a charter and a partisan against a witness,
  and writes historical argument that is clear, fair and grounded in evidence, as the Founders did
  with Plutarch, Polybius, Rollin and Hume open on the desk.
rows:
  # ───────────────────────── CYCLE 1: Narrative history & heroes (6–10) ─────────────────────────
  - id: history-01
    title: "First Stories of the Past: Bible Narratives, Aesop & the Nation's Words"
    type: unit
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 7
    order: 1
    prerequisites: []
    related: [theology-03, literature-01, character-virtue-01]
    summary: >-
      The doorway into history is the story heard aloud. The child hears Bible narratives
      (Creation to the Exodus, David, Daniel; the life of Christ), Aesop's fables, family stories
      told by grandparents, and short hero tales. He also memorizes the Pledge of Allegiance and
      the preamble of the Declaration of Independence. The aim is a love of "true stories" and the
      first sense that the past is real, ordered, and full of people worth imitating.
    objectives:
      - Retell in order a Bible narrative or hero story heard the day before (narration)
      - Recite the Pledge and the Declaration's preamble ("We hold these truths…") from memory
      - Distinguish "long ago" from "now", and "a true story" from "a fable"
      - Begin a family timeline (grandparents, parents, child)
    coreTexts:
      - title: The Holy Bible (Douay-Rheims)
        kind: primary
        reader: together
        pages: 1600
        date: "1582–1610 (Challoner rev. 1749–52)"
        publicDomain: true
        links:
          - { label: DRBO.org, url: "https://www.drbo.org/" }
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/8300" }
      - title: The Holy Bible (King James Version)
        kind: primary
        reader: together
        pages: 1200
        date: "1611"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/10" }
      - title: The Aesop for Children
        kind: secondary
        reader: together
        pages: 104
        author: Aesop (ill. Milo Winter)
        date: "1919"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/19994" }
      - title: The Declaration of Independence
        kind: primary
        reader: together
        pages: 4
        author: Thomas Jefferson et al.
        date: "1776"
        publicDomain: true
        links:
          - { label: Avalon Project, url: "https://avalon.law.yale.edu/18th_century/declare.asp" }
    curriculumOptions:
      - name: Stories of Great Americans for Little Americans
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/american-and-modern-studies/stories-of-great-americans-for-little-americans-second-edition/"
        notes: Edward Eggleston's 1895 hero stories, re-edited with a guide. Good read-aloud at 6–7.
      - name: Child's Bible History
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/books/childs-bible-history/"
        notes: The classic short Catholic Bible history (Knecht), useful as the spine for Bible narratives.
      - name: "Our Lady of Victory: early-grade history (America My Country)"
        publisher: Our Lady of Victory School
        tradition: catholic
        url: "https://olvs.org/academics/curriculum-courses/"
        notes: Traditional Catholic program; its first-grade history is a simple workbook on flag, founders, Pilgrims and pioneers.
    historicalPrecedent: >-
      Colonial and 19th-century children met history first through Scripture, the catechism,
      fables and the school reader. The McGuffey Readers mixed Bible stories, fables and short
      patriotic pieces, and children memorized the Declaration and Washington's words for
      exhibitions and declamation days.
    notes: >-
      Catholic families may prefer the Douay-Rheims or RSV-CE and a Catholic Bible history
      (Knecht); Protestant families the KJV or ESV and a Bible storybook such as Egermeier or
      Hurlbut. The narratives read are the same.

  - id: history-02
    title: "Maps, Timelines & the Book of Centuries"
    type: unit
    level: early-5
    stage: formal
    ageStart: 6.5
    ageEnd: 10
    order: 2
    prerequisites: [history-01]
    related: []
    summary: >-
      This is the running "skeleton" of the whole history track. A wall timeline goes up in the
      schoolroom, the child learns map work, and a Book of Centuries is started: a hand-kept
      notebook with one spread per century, into which the child draws and dates people, events,
      buildings and inventions as he meets them. Memory work pins about 100–160 key dates and
      events in place by age 10. Everything later hangs on this frame.
    objectives:
      - Place the major eras (Creation/Patriarchs, Egypt, Israel, Greece, Rome, Christ, Middle Ages, Renaissance, Reformation, Exploration, America) in order
      - Memorize a timeline of about 100–160 events with dates
      - Locate the Mediterranean, Fertile Crescent, Greece, Italy, Holy Land, British Isles, France, Spain and the thirteen colonies on a blank map
      - Keep a Book of Centuries, adding an entry for every person or event studied
    coreTexts:
      - title: A Child's History of the World
        kind: secondary
        reader: together
        pages: 494
        author: V.M. Hillyer
        date: "1924"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/67149" }
          - { label: Baldwin Online, url: "https://www.mainlesson.com/display.php?author=hillyer&book=world&story=_contents" }
    curriculumOptions:
      - name: Timeline Program (160 events)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/classical-studies/timeline-program/"
        notes: Timeline cards, composition book and drill for the five eras. A clean backbone for the memorized timeline.
      - name: History Flashcards & Self-Paced courses
        publisher: Veritas Press
        tradition: protestant
        url: "https://veritaspress.com/selfpaced/history"
        notes: "Five card sets (OT & Egypt → 1815 to Present), 32 events each, sung and drilled. Can be used without the online course."
      - name: History Timeline Template
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/resources/title-here/"
        notes: A free printable timeline template from CHC. Pair it with saints' feast days.
      - name: "Foundations (history timeline memory work)"
        publisher: "Classical Conversations"
        tradition: protestant
        url: "https://classicalconversations.com/programs/foundations/"
        notes: "Community memory program for ages 4+ with a sung timeline and a three-year history cycle."
    historicalPrecedent: >-
      Chronology was taught as a discipline in the 18th and 19th centuries: "chronology and
      geography are the two eyes of history" was a schoolroom maxim. Charlotte Mason's
      Book of Centuries (late 19th c.) and the wall charts of Priestley's "Chart of Biography"
      (1765) are the direct ancestors of this practice.
    notes: >-
      The Book of Centuries is kept from about 7 through 16, so the child who reads Thucydides at 13
      already has a page waiting for 431 BC.

  - id: history-03
    title: "Cycle 1 · The Ancient World: Egypt, Israel, Greece & Rome"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 8
    order: 3
    prerequisites: [history-01]
    related: [literature-04, literature-05, character-virtue-06, latin-01]
    summary: >-
      The first narrative year covers the ancient world through its great men and deeds.
      Haaren & Poland's Famous Men of Greece and Famous Men of Rome (in the Memoria Press
      editions) give 30 lives each: Lycurgus, Solon, Leonidas, Pericles, Alexander, Horatius,
      Cincinnatus, Scipio, Caesar, Constantine. Guerber and Hillyer fill in Egypt and Israel. The
      Boys' and Girls' Plutarch is read aloud as the child's first taste of the ancient source
      itself.
    objectives:
      - Narrate the lives of about 20 Greek and Roman worthies and state the virtue or vice each shows
      - Place Egypt, Israel, Persia, Greece and Rome on the timeline and on a map
      - Hear Plutarch retold and name the difference between a "life" and a "history"
      - Recite short famous sayings (Leonidas, Horatius, Caesar's "veni, vidi, vici")
    coreTexts:
      - title: Famous Men of Greece
        kind: secondary
        reader: together
        pages: 265
        author: John H. Haaren & Addison B. Poland
        date: "1904"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/famousmengreece00polagoog" }
          - { label: Heritage History, url: "https://www.heritage-history.com/index.php?c=read&author=haaren&book=greece" }
      - title: Famous Men of Rome
        kind: secondary
        reader: together
        pages: 230
        author: John H. Haaren & Addison B. Poland
        date: "1904"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/famousmenofrome00haarrich" }
          - { label: Heritage History, url: "https://www.heritage-history.com/index.php?c=read&author=haaren&book=rome" }
      - title: The Story of the Greeks
        kind: secondary
        reader: together
        pages: 288
        author: H.A. Guerber
        date: "1896"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/23495" }
      - title: The Story of the Romans
        kind: secondary
        reader: together
        pages: 298
        author: H.A. Guerber
        date: "1896"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/storyofromans00guerrich" }
      - title: The Boys' and Girls' Plutarch
        kind: secondary
        reader: together
        pages: 468
        author: Plutarch (ed. John S. White)
        date: "1883"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/2484" }
    curriculumOptions:
      - name: Famous Men of Greece Set / Famous Men of Rome Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/classical-studies/famous-men-rome/"
        notes: The standard classical-school edition, with student and teacher guides, maps, drills and videos. Greece set is at /famous-men-greece/.
      - name: "Old Testament & Ancient Egypt / New Testament, Greece & Rome"
        publisher: Veritas Press
        tradition: protestant
        url: "https://store.veritaspress.com/old-testament-ancient-egypt-self-paced-course.html"
        notes: "Sung timeline cards plus an online course. Covers biblical history in the context of all history. The companion New Testament, Greece & Rome course is at https://store.veritaspress.com/new-testament-greece-rome-self-paced-course.html."
      - name: "The Story of Civilization, Vol. 1: The Ancient World"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/the-story-of-civilization-volume-1-the-ancient-world/"
        notes: Catholic narrative spine for the elementary years, with activity book and audio. Softer than Famous Men but more complete.
    historicalPrecedent: >-
      Haaren & Poland wrote the Famous Men series (1904) for the New York public schools on the
      old principle that the young learn history best through biography. Plutarch was the most
      widely read ancient author among the American founders. Hamilton, Adams, Jefferson and
      Franklin all cite him, and Mill read Langhorne's Plutarch "with great delight" as a small
      boy.
    sources:
      - { label: "J.S. Mill, Autobiography (1873), ch. 1", url: "https://www.gutenberg.org/ebooks/10378" }
    notes: >-
      The Famous Men books are by Haaren & Poland, not Guerber. Guerber's Story of the Greeks and
      Story of the Romans are the companion narratives.

  - id: history-04
    title: "Cycle 1 · The Middle Ages: Christendom, Kings & Saints"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 9
    order: 4
    prerequisites: [history-03]
    related: [literature-08, character-virtue-07, theology-04]
    summary: >-
      The second narrative year runs from the fall of Rome to the eve of the Renaissance, again
      through lives. Famous Men of the Middle Ages gives Alaric, Clovis, St. Benedict, Charlemagne,
      Alfred, William the Conqueror, Barbarossa, St. Louis and Joan of Arc. The early chapters of
      Marshall's Our Island Story give England's story from the Romans to the Wars of the Roses.
      Saints' lives and the Crusades are told as the living heart of Christendom.
    objectives:
      - Narrate the lives of about 20 medieval figures (kings, saints, popes, knights)
      - Explain in a child's terms what a monastery, a castle, a manor, a cathedral and a crusade were
      - Retell the story of Alfred, Charlemagne, William I, Magna Carta and St. Louis
      - Add the medieval centuries to the Book of Centuries
    coreTexts:
      - title: Famous Men of the Middle Ages
        kind: secondary
        reader: student
        pages: 270
        author: John H. Haaren & Addison B. Poland
        date: "1904"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/3725" }
      - title: Our Island Story
        kind: secondary
        reader: student
        pages: 540
        author: H.E. Marshall
        date: "1905"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/ourislandstoryhi00marsuoft" }
          - { label: Heritage History, url: "https://www.heritage-history.com/index.php?c=read&author=marshall&book=island" }
      - title: The Story of the Middle Ages
        kind: secondary
        reader: student
        pages: 234
        author: Samuel B. Harding
        date: "1911"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/28806" }
    curriculumOptions:
      - name: Famous Men of the Middle Ages Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/classical-studies/famous-men-middle-ages/"
        notes: Text, student and teacher guides, maps and drill.
      - name: "Middle Ages, Renaissance & Reformation"
        publisher: Veritas Press
        tradition: protestant
        url: "https://store.veritaspress.com/middle-ages-renaissance-reformation-self-paced-course.html"
        notes: Timeline cards and self-paced course, written from a Reformed perspective.
      - name: "The Story of Civilization, Vol. 2: The Medieval World"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/the-story-of-civilization-volume-2-the-medieval-world/"
        notes: A Catholic narrative of Christendom for children.
    historicalPrecedent: >-
      Our Island Story (1905) was the history every British child of the Empire era grew up on,
      and it was reissued in 2005 after a public campaign. In 19th-century schools the Middle Ages
      came to children through Scott, Froissart "for boys" and lives of the saints and kings.
    notes: >-
      Catholic and Protestant tellings differ mainly in emphasis: the papacy, monasticism and the
      Crusades on one side, Wycliffe and "forerunners of the Reformation" on the other. Reading
      Famous Men as the spine keeps the child on the shared ground of persons and deeds.

  - id: history-05
    title: "Cycle 1 · Early Modern: Renaissance, Reformation & the Age of Exploration"
    type: course
    level: early-5
    stage: formal
    ageStart: 8.5
    ageEnd: 9.5
    order: 5
    prerequisites: [history-04]
    related: [literature-06]
    summary: >-
      The third narrative unit covers Gutenberg, Columbus, Michelangelo, Luther and Loyola,
      Elizabeth, Drake and the Armada, and Galileo, and runs on to Louis XIV and Peter the Great.
      Our Island Story continues through the Tudors and Stuarts. Columbus's own account of the
      first landfall is read aloud, the child's first "explorer's primary source".
    objectives:
      - Narrate the lives of the great explorers, artists, reformers and monarchs
      - Tell the story of the Reformation and the Catholic Reformation fairly, naming Luther, Calvin, Henry VIII, More, Loyola, Teresa and Trent
      - Trace the voyages of Columbus, da Gama, Magellan and Cartier on a map
      - Hear extracts of Columbus's journal read aloud and narrate them
    coreTexts:
      - title: Our Island Story (Tudors & Stuarts chapters)
        kind: secondary
        reader: student
        pages: 100
        author: H.E. Marshall
        date: "1905"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/ourislandstoryhi00marsuoft" }
      - title: "Christopher Columbus: Extracts from Journal"
        kind: primary
        reader: student
        pages: 12
        author: Christopher Columbus
        date: "1492"
        publicDomain: true
        links:
          - { label: Medieval Sourcebook (Fordham), url: "https://sourcebooks.fordham.edu/source/columbus1.asp" }
      - title: A Child's History of the World (later chapters)
        kind: secondary
        reader: student
        pages: 150
        author: V.M. Hillyer
        date: "1924"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/67149" }
    curriculumOptions:
      - name: Famous Men of Modern Times Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/american-and-modern-studies/famous-men-modern-times/"
        notes: Continues the Famous Men lives from the Renaissance to the 19th century.
      - name: "The Story of Civilization, Vol. 3: The Making of the Modern World"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/books/the-story-of-civilization-volume-3-the-making-of-the-modern-world/"
        notes: A Catholic account of the Renaissance, Reformation, Catholic Reformation and exploration.
      - name: "Middle Ages, Renaissance & Reformation"
        publisher: Veritas Press
        tradition: protestant
        url: "https://store.veritaspress.com/middle-ages-renaissance-reformation-self-paced-course.html"
        notes: Its second half covers this period from a Reformed perspective.
    historicalPrecedent: >-
      Nineteenth-century Anglo-American schoolbooks (Marshall, Goodrich's "Peter Parley", the
      McGuffey Readers) told this period as a drama of discovery and liberty, and Catholic
      schoolbooks as the story of the Church's renewal and missions. This program tells both.
    notes: >-
      Neutral note: Catholics generally present the Reformation as a rupture, with Trent, Loyola
      and Teresa as the true reform. Protestants present it as the recovery of the Gospel. At this
      age, tell each figure's story in his own terms and save the argument for Cycles 2 and 3.

  - id: history-06
    title: "Cycle 1 · The American Story: Colonies, Founding & Nation"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 10
    order: 6
    prerequisites: [history-05]
    related: [literature-10, literature-12, character-virtue-04]
    summary: >-
      The last narrative year tells America's story from the Norsemen and Columbus through
      Jamestown, Plymouth, the Revolution, the Constitution, the frontier, the Civil War and into
      the 20th century. It uses H.E. Marshall's This Country of Ours and Guerber. The child
      memorizes the Declaration's preamble and the Gettysburg Address, learns the presidents, and
      hears Washington's and Lincoln's own words.
    objectives:
      - Narrate the founding of Virginia, Plymouth, Massachusetts Bay, Maryland and Pennsylvania
      - Tell the story of the Revolution, the Declaration and the Constitution in order
      - Recite the Declaration's preamble and the Gettysburg Address
      - Name the presidents in order through Lincoln, and the major wars through WWII
    coreTexts:
      - title: This Country of Ours
        kind: secondary
        reader: student
        pages: 500
        author: H.E. Marshall
        date: "1917"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/thiscountryofour01mars" }
          - { label: Heritage History, url: "https://www.heritage-history.com/index.php?c=read&author=marshall&book=country" }
      - title: The Story of the Thirteen Colonies
        kind: secondary
        reader: student
        pages: 356
        author: H.A. Guerber
        date: "1898"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/48051" }
      - title: The Gettysburg Address
        kind: primary
        reader: student
        pages: 1
        author: Abraham Lincoln
        date: "1863"
        publicDomain: true
        links:
          - { label: Avalon Project, url: "https://avalon.law.yale.edu/19th_century/gettyb.asp" }
    curriculumOptions:
      - name: The Hillsdale K-12 American History & Civics Curriculum (1776 Curriculum)
        publisher: Hillsdale College
        tradition: classical
        url: "https://k12historyandcivics.hillsdale.edu/"
        notes: Free K-12 lesson plans organized by era, from the Hillsdale network of classical charter schools. Primary-source based even in the lower grades.
      - name: From Sea to Shining Sea (CHC Grade 5)
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/from-sea-to-shining-sea-the-story-of-america/"
        notes: Catholic Textbook Project narrative of North America to the early 20th century.
      - name: The Story of the Thirteen Colonies & the Great Republic Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/american-and-modern-studies/american-history/"
        notes: Guerber's two American volumes with guides.
      - name: "Explorers to 1815 – Self-Paced Course"
        publisher: "Veritas Press"
        tradition: protestant
        url: "https://store.veritaspress.com/explorers-to-1815-self-paced-course.html"
        notes: "32 events from Prince Henry the Navigator to the Missouri Compromise, with timeline cards. Written from a Reformed perspective."
    historicalPrecedent: >-
      The Hillsdale K-12 Program Guide and the Barney Charter School Initiative put American
      history in the early grades as a story of founding principles and founders, read partly in
      the founders' own words. That approach descends from the McGuffey Readers and the
      19th-century "declamation" of the Declaration and Washington's Farewell.
    sources:
      - { label: "Hillsdale K-12: Curriculum Overview", url: "https://k12.hillsdale.edu/Curriculum/Overview/" }

  # ───────────────────────── CYCLE 2: Primary sources with guides (10–12) ─────────────────────────
  - id: history-07
    title: "Sources I: The Ancient Near East & Israel (Scripture, Hammurabi, Josephus)"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 10.5
    order: 7
    prerequisites: [history-03, history-02]
    related: [theology-07]
    summary: >-
      The second cycle starts where history starts, with Mesopotamia, Egypt and Israel, now read in
      the sources. The student reads Genesis 12–50, Exodus, Joshua–Kings in selection, Daniel and
      Maccabees. Beside them come the Code of Hammurabi and Near Eastern texts from the Ancient
      History Sourcebook, with excerpts from Josephus's Antiquities to see how an ancient historian
      retold the same events. Guerber's Story of the Chosen People is the guide.
    objectives:
      - Read the Code of Hammurabi and compare it with the Mosaic law (Exodus 20–23)
      - Trace the history of Israel from Abraham to the Maccabees on the timeline
      - Write a one-page narration comparing a biblical account with Josephus's retelling
      - Identify what kind of source a text is (law code, chronicle, prophecy, royal inscription)
    coreTexts:
      - title: The Code of Hammurabi
        kind: primary
        reader: student
        pages: 80
        date: "c. 1754 BC"
        publicDomain: true
        links:
          - { label: Ancient History Sourcebook, url: "https://sourcebooks.fordham.edu/ancient/hamcode.asp" }
          - { label: Avalon Project, url: "https://avalon.law.yale.edu/ancient/hamframe.asp" }
      - title: "Ancient History Sourcebook: Mesopotamia; Israel"
        kind: secondary
        reader: student
        publicDomain: true
        links:
          - { label: Mesopotamia, url: "https://sourcebooks.fordham.edu/ancient/asbook03.asp" }
          - { label: Israel, url: "https://sourcebooks.fordham.edu/ancient/asbook06.asp" }
      - title: Antiquities of the Jews (selections)
        kind: primary
        reader: student
        author: Flavius Josephus (tr. Whiston)
        date: "c. AD 94"
        publicDomain: true
        links:
