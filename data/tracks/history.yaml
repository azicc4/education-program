    historicalPrecedent: >-
      Churchill was himself a historian (Marlborough, The World Crisis, The Second World War, A
      History of the English-Speaking Peoples) who formed his style on Gibbon and Macaulay, read
      at Bangalore as a young officer. His career is the best modern case of what this track aims
      at: a statesman formed by history. King wrote the Letter in the tradition of the Declaration
      and of Lincoln. He quotes Augustine ("an unjust law is no law at all") and Aquinas.
      Hillsdale's American Heritage course places the civil-rights movement in that same line of
      argument from the founding.
    notes: >-
      Choose 2 of the 4 electives (Ad Beatissimi, the abridged Gulag Archipelago, Reagan's
      Brandenburg Gate speech, Centesimus Annus). A student who chooses the Gulag should write on
      how ideology licenses terror. The Birmingham Letter is still under copyright (King Estate).
      TAH publishes excerpts, and the full text is widely reprinted in anthologies.

  - id: history-28
    title: "Historiography: How History Is Written — Rollin, Hume, Gibbon, Macaulay, Acton, Dawson & Johnson"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 24
    prerequisites: [history-21, history-18, history-26]
    related: [philosophy-13, theology-23]
    summary: >-
      The capstone of the high-school cycle is reading the historians as historians. It starts
      with Rollin's pious-classical Ancient History (the founders' schoolbook), then Hume's
      skeptical Tory History of England, Gibbon's ironic Decline and Fall, Macaulay's Whig History,
      and Acton's inaugural Lecture on the Study of History. Dawson's Catholic cultural history and
      Paul Johnson's popular narrative represent the 20th century. The student learns to detect
      bias, weigh evidence, understand providential, Whig, Marxist and cultural interpretations,
      and articulate a Christian view of history that is neither naive nor cynical.
    objectives:
      - Read a long passage of each historian and identify his method, sources and assumptions
      - Compare Hume and Macaulay on the Stuarts, and Gibbon and Dawson on the rise of Christianity
      - Explain Acton's maxims on the historian's moral judgment
      - Write a 3,000-word historiographical essay on one event as told by three historians
