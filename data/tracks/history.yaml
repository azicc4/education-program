    historicalPrecedent: >-
      Polybius VI was the ancient text the framers cited on mixed government. John Adams's Defence
      of the Constitutions (1787) quotes it at length. Machiavelli's Discourses on Livy was read by
      Adams and Jefferson. Livy and Sallust were the standard historians in the upper forms of
      Boston Latin, Eton and the colonial colleges. Tacitus was the Whig historian par excellence.
      Jefferson called him the first writer in the world, and Gordon's translation (1728–31) with
      its Discourses was a Revolutionary-era handbook against tyranny. Gibbon's Decline and Fall
      begins where Tacitus leaves off.
    notes: >-
      Choose 2 of the 3 electives (Sallust, Suetonius, Machiavelli's Discourses). Polybius, Livy and
      the Annals are read in the selections named above, not entire.

  - id: history-18
    title: "Seminar: Late Antiquity & the Early Church — Eusebius & Augustine's City of God"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13.5
    ageEnd: 14.5
    order: 17
    prerequisites: [history-16, history-10]
    related: [theology-16, philosophy-08, literature-18]
    summary: >-
      The Christianization of the Empire and the Christian theology of history. The student reads
      Eusebius's Church History (Books I–III, VIII–X) and Life of Constantine in selection. He
      reads Augustine's City of God Books I–V, XIV.28, and XIX in excerpt, where Augustine answers
      the pagan charge that Christianity caused Rome's fall and founds the Western philosophy of
      history. Gibbon chapters 15–16 are read as the Enlightenment counter-reading.
    objectives:
      - Read about 400 pages of Eusebius and 250 pages of the City of God
      - Explain Augustine's "two cities" and his account of Rome's greatness and fall
      - Compare Eusebius's providential reading of Constantine with Augustine's more reserved view
      - Write an essay weighing Gibbon's ch. 15–16 against Eusebius and Augustine
