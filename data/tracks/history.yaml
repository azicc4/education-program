  # ───────────────────────── COLLEGE (17–18): Hillsdale core ─────────────────────────
  - id: history-29
    title: "College: Western Heritage I — From Genesis to the High Middle Ages"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 17.5
    order: 29
    prerequisites: [history-28, history-19]
    related: [literature-31, philosophy-14]
    summary: >-
      This course follows Hillsdale College's Western Heritage core: the formation of the West from
      Israel, Greece and Rome through Christendom, read in primary texts. At college level the
      student returns to sources read at 12–15 with more maturity. The readings are Genesis and
      Exodus, Thucydides, Plato's Apology, Aristotle's Politics I, Cicero, Augustine's
      Confessions and City of God, Benedict's Rule, Magna Carta, and Aquinas on law. Seminar
      discussion and a 4,000-word research paper using sources in the original language where
      possible (Latin/Greek).
    objectives:
      - Synthesize Jerusalem, Athens and Rome as the sources of Western civilization in a research paper
      - Read at least one historical source in Latin or Greek (e.g. Livy, Caesar, Thucydides) alongside the translation
      - Lead a seminar discussion on a primary text
      - Take the Hillsdale Western Heritage lecture series and pass a comprehensive oral exam on it
