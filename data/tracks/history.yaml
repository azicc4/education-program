      The colonial colleges (Harvard, Yale, William & Mary, King's, the College of New Jersey)
      taught ancient history through the classical authors themselves in the original. Hillsdale's
      Western Heritage sequence is the modern descendant, required of every student.
    notes: >-
      Hankins's Golden Thread (Encounter Books, 2025) is the narrative spine for the course. A Harvard
      historian of the Renaissance and the classical tradition, he traces how the Greek, Roman and
      Judeo-Christian threads were woven together from classical Greece through Christendom to the
      Renaissance. Read it chapter by chapter alongside the primary sources. Allen Guelzo's Volume II
      continues the story in history-30.

  - id: history-30
    title: "College: Western Heritage II — From the Renaissance to the Modern World"
    type: course
    level: college
    stage: formal
    ageStart: 17.5
    ageEnd: 18
    order: 30
    prerequisites: [history-29]
    related: [literature-32, philosophy-10]
    summary: >-
      The second half of the Western Heritage core covers the Renaissance, Reformation, scientific
      revolution, Enlightenment, the English, American and French revolutions, liberalism and its
      critics, and the totalitarian century. The primary texts include Machiavelli, Luther and
      Trent, Hobbes and Locke, Burke and Paine, Tocqueville, Marx, Leo XIII, Churchill and
      Solzhenitsyn. There is a seminar and a 4,000-word research paper.
    objectives:
      - Write a research paper on a modern Western turning point, using at least ten primary sources
      - Defend in oral examination a thesis about modernity's debt to, and break from, Christendom
      - Relate the English, American and French revolutions to each other through their founding documents
