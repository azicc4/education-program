      in exactly the spirit of this course. Adams to Abigail (12 May 1780) sets out the
      generational order: "I must study Politicks and War that my sons may have liberty to study
      Mathematicks and Philosophy." Webster's Reply to Hayne ("Liberty and Union, now and forever,
      one and inseparable!") was declaimed in American schools for a century and printed in the
      McGuffey and Elson readers. Lincoln educated himself on Weems's Washington, Plutarch and the
      Declaration.
