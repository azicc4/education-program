  - id: history-19
    title: "Seminar: Christendom — Bede & Einhard to Gregory VII, the Crusades & Froissart"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 18
    prerequisites: [history-18, history-11]
    related: [latin-16, literature-18, character-virtue-07, old-english-02]
    summary: >-
      A year-long seminar on how the barbarian kingdoms became Christendom and how Christendom
      argued over the relation of spiritual and temporal power. The student reads Bede's
      Ecclesiastical History whole, Einhard's Charlemagne again with Notker for contrast, and the
      Carolingian and Anglo-Saxon documents, with Dawson's The Making of Europe as the interpretive
      frame. The High and late Middle Ages follow in their documents and chronicles: the Investiture
      Contest (Gregory VII's Dictatus Papae and Henry IV's letters), Boniface VIII's Unam Sanctam,
      Urban II and the Crusade sources, Joinville's life and crusade of St. Louis, and Froissart on
      the Hundred Years' War and chivalry. Gregory of Tours, the Anglo-Saxon Chronicle and
      Villehardouin are electives. The questions are what made a "Christian civilization," and how
      the struggle of pope and emperor rooted the Western idea of limited government.
    objectives:
      - Read Bede entire and trace the conversion of the English and the Franks on a map
      - Compare a monastic historian (Bede) with a court biographer (Einhard) and, from the electives, an annalist or a bishop-historian
      - Write an essay on Dawson's thesis that religion is the key to cultural history, tested against these sources
      - Read the Gregory VII–Henry IV exchange and Unam Sanctam, and state each side's claim
      - Read Joinville entire and Froissart on Crécy, Poitiers and the Peasants' Revolt, and compare them as witnesses
      - Write a 2,000-word essay on church and state from Gelasius to Unam Sanctam, and its legacy for the First Amendment
