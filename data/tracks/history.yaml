  - id: history-14
    title: "Sources VIII: The Founding & the Republic in Documents"
    type: course
    level: 6-8
    stage: formal
    ageStart: 12
    ageEnd: 12.5
    order: 14
    prerequisites: [history-13]
    related: [literature-10, rhetoric-08, civics-law-04]
    exams: [ap-us-history]
    summary: >-
      A guided first reading of the American founding documents, as a bridge into Cycle 3. It
      covers the Declaration entire, the Constitution and Bill of Rights, Washington's Farewell
      Address, the Gettysburg Address and Second Inaugural, and short passages of the Federalist
      (Nos. 1, 10, 51). McClay's Land of Hope or a comparable narrative is the guide. The goal is
      command of the documents' structure and principal arguments before the seminars at 15–16.
    objectives:
      - Outline the Declaration (preamble, grievances, conclusion) and memorize its second paragraph
      - Summarize each Article of the Constitution and each of the first ten Amendments
      - Read Washington's Farewell and list his warnings (faction, foreign entanglement, religion and morality)
      - Read Lincoln's two great speeches and explain how he appeals to the Declaration
    coreTexts:
      - title: The Declaration of Independence
        kind: primary
        reader: student
        pages: 4
