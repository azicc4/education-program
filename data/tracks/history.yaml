      Froissart is read in selection. Neutral note: Catholic readers see the Investiture Contest as
      the Church's liberation from lay control. Protestant and secular readers often see papal
      overreach. Both traditions credit the struggle with producing the Western distinction between
      Church and state.

  - id: history-21
    title: "Seminar: English Constitutional History — Magna Carta to Burke"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 15
    order: 19
    prerequisites: [history-19]
    related: [philosophy-10, civics-law-13]
    exams: [ap-european-history]
    summary: >-
      The inheritance the American colonists claimed. The student reads Magna Carta closely with
      Coke's commentary (Second Institute), the Petition of Right (1628), the 1689 Bill of Rights,
      and selections from Clarendon's History of the Rebellion. Burke's Reflections on the
      Revolution in France closes the course as the classic defense of the "inheritance" view.
      Hume's and Macaulay's Histories of England are read in extended selections as models of
      narrative and as partisan (Tory and Whig) interpretations to be weighed critically.
    objectives:
      - Trace chapter 39 of Magna Carta through Coke, the Petition of Right and the Bill of Rights into the U.S. Bill of Rights
      - Read Clarendon on the outbreak of the Civil War and Macaulay on 1688, and compare their politics
      - Read Burke's Reflections in substantial part and summarize his argument on prescription and reform
      - Write a 2,500-word essay on whether the American Revolution was a conservative revolution, citing these sources
