  - id: history-10
    title: "Sources IV: The Early Church (Acts, Pliny, the Martyrs & Eusebius)"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 11.5
    order: 10
    prerequisites: [history-09]
    related: [theology-09, theology-12]
    summary: >-
      The birth and spread of Christianity is read as history. The student reads the Acts of the
      Apostles whole, Tacitus and Pliny on the Christians, the Martyrdom of Polycarp, the Passion
      of Perpetua and Felicity, and selections from Eusebius's Church History (the apostles'
      successors, the persecutions, Constantine). He learns to use a Christian source and a pagan
      source side by side.
    objectives:
      - Read Acts entire and map Paul's journeys
      - Compare Pliny's letter to Trajan with the Martyrdom of Polycarp as sources on persecution
      - Narrate Eusebius's account of Constantine's conversion and the Edict of Milan
      - Explain why Eusebius is called "the Father of Church History"
