          - { label: New Advent, url: "https://www.newadvent.org/fathers/2501.htm" }
    curriculumOptions:
      - name: History of the Early Church Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/christian-studies/history-of-early-church-set/"
        notes: "Guided readings in early Church history for the middle grades, from a broadly Christian perspective."
      - name: "The Story of the Church: Her Founding, Mission and Progress"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/products/books/the-story-of-the-church-her-founding-mission-and-progress/"
        notes: Classic Catholic school history of the Church. MODG uses it in 8th grade.
      - name: Ancient Christianity (free online course)
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/ancient-christianity"
        notes: Free lectures on the first centuries, good for the parent or an advanced 11-year-old.
    historicalPrecedent: >-
      Eusebius's Church History was a standard text in the colonial colleges and the Jesuit
      colleges alike. The Ratio Studiorum and Harvard's early course both treated sacred history
      as part of history proper.
    notes: >-
      Catholic and Protestant readers agree on the facts of the first three centuries but read
      them differently. Catholics stress apostolic succession and the Roman primacy that Eusebius
      and Irenaeus record. Protestants stress the primitive Church as a pattern for reform. Point
      out the passages each side cites.

  - id: history-11
    title: "Sources V: Medieval Christendom (Bede, Einhard, Roland, Magna Carta, Joinville)"
    type: course
