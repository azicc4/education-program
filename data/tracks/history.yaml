      grammar schools and by King Alfred's own order.

  - id: history-12
    title: "Sources VI: Renaissance, Reformation & Catholic Reform (Documents from Both Sides)"
    type: course
    level: 6-8
    stage: formal
    ageStart: 12
    ageEnd: 12.5
    order: 12
    prerequisites: [history-11, history-05]
    related: [theology-19]
    summary: >-
      The 16th century is read in the words of the men who made it, and from both sides. Luther's
      Ninety-Five Theses and Calvin's Reply to Sadoleto are read beside the decrees of the Council
      of Trent (on Scripture and Tradition, and on Justification). Erasmus's Praise of Folly and
      More's Utopia come in selection, along with the Act of Supremacy and Elizabeth's Armada
      speech. The student's task is to state each side's case so fairly that its own adherents
      would accept it.
    objectives:
      - Read the 95 Theses and the Trent decree on justification, and summarize each in one paragraph
      - Write a two-column comparison of Catholic and Protestant positions on Scripture, grace and the Church, citing the documents
      - Narrate the English Reformation from Henry VIII to Elizabeth, using the Act of Supremacy
      - Explain the Catholic Reformation (Trent, the Jesuits, Teresa of Avila) as a response and a renewal
    coreTexts:
