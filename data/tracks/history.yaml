  - id: history-31
    title: "College: American Heritage — From Colonial Settlement to the Present"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 31
    prerequisites: [history-23, history-26]
    related: [rhetoric-12, civics-law-17]
    summary: >-
      Hillsdale's American Heritage core, taken as the capstone of the American strand. The
      student makes a documentary study of the whole of American history: the founding
      principles, their challenge in slavery and the Civil War, the Progressive critique of the
      founding (Wilson, Croly), the New Deal, and the recovery of constitutionalism. The course
      reads Constitution 101 and the Federalist in full, Tocqueville Vol. II, and the Teaching
      American History core documents, and ends in a thesis on an American statesman.
    objectives:
      - Read the Federalist entire and Tocqueville Vol. II
      - Compare the founders' constitutionalism with the Progressive critique, using primary sources
      - Write a 5,000-word thesis on an American statesman, based on his papers (Founders Online, the Lincoln papers, etc.)
      - Deliver a 20-minute public lecture on the thesis
    coreTexts:
      - title: Democracy in America (Vol. 2)
