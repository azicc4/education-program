  - id: history-26
    title: "Seminar: The Twentieth Century — World Wars, Totalitarianism, the Cold War & Civil Rights"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 17
    order: 23
    prerequisites: [history-25, history-23]
    related: [rhetoric-08, philosophy-13, theology-20]
    exams: [ap-us-history, ap-european-history, ap-world-history-modern]
    summary: >-
      The 20th century in the words of statesmen and witnesses. For World War I the student reads
      Wilson's Fourteen Points with documents from the sourcebook. For the interwar crisis come
      Pius XI's Mit brennender Sorge (against Nazism) and Divini Redemptoris (against Communism),
      both 1937, and the Nazism and Holocaust documents. For World War II he reads Churchill's great
      speeches of 1940 and the Atlantic Charter, and Churchill is studied as a model
      statesman-historian. The Cold War opens with Kennan's Long Telegram and Churchill's "Sinews
      of Peace" (the Iron Curtain), with documents from the Avalon Cold War collection, and is judged
      through Solzhenitsyn's Harvard address "A World Split Apart." For civil rights he reads King's
      "Letter from Birmingham Jail," which argues from Augustine and Aquinas, as the fulfillment of
      the Declaration–Lincoln–Douglass argument. Benedict XV's Ad Beatissimi, the abridged Gulag
      Archipelago, Reagan at the Brandenburg Gate and John Paul II's Centesimus Annus (the Catholic
      reading of 1989) are electives.
    objectives:
      - Read and deliver one of Churchill's 1940 speeches, and analyze its rhetoric
      - Read Mit brennender Sorge and Divini Redemptoris, and state the Church's case against both totalitarianisms
      - Compare the Fourteen Points and the Atlantic Charter as statements of war aims
      - Analyze Kennan's Long Telegram and Churchill's Fulton speech as the founding documents of containment
      - Read King's Letter entire and trace his use of natural law (Augustine, Aquinas) and the Declaration
      - Write a 2,500-word essay either on statesmanship in 1938–40, drawing on Churchill's speeches and the diplomatic documents, or on Solzhenitsyn's Harvard address as a critique of both East and West
    coreTexts:
