      Witherspoon personally taught eloquence at the College of New Jersey (Princeton), where his
      students included Madison. Blair's Lectures ran to some 130 editions and became the rhetoric
      textbook of American colleges through the mid-19th century.
    notes: >-
      Richard Weaver's The Ethics of Rhetoric (1953; Project Gutenberg
      https://www.gutenberg.org/ebooks/68421) is an excellent 20th-century coda on rhetoric,
      truth and the Phaedrus.

  - id: rhetoric-12
    title: "College Seminar: Oratory, Moot Court & the Rhetoric of Statesmanship"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 12
    prerequisites: [rhetoric-09, rhetoric-11]
    related: [logic-08, theology-23]
    summary: >-
      This is the capstone of the trivium. The student composes and delivers original speeches in
      all three genres before public audiences: a deliberative address on a live policy question, a
      forensic argument in moot court (appellate brief plus oral argument), and a commemorative
      (epideictic) oration. He critiques recorded speeches of statesmen and revisits Aristotle,
      Cicero and Quintilian with adult experience.
    objectives:
      - Write and argue a moot-court appellate brief before a panel
      - Deliver a 15-minute deliberative address from notes, then take hostile questions
      - Deliver a formal commemorative oration (e.g. for a national holiday or a funeral)
      - Critique speeches by the five canons in a written portfolio
    curriculumOptions:
      - name: Classical Logic and Rhetoric (free online course)
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/logic"
        notes: Use as a review. Hillsdale requires this as a core course of all undergraduates.
      - name: The Rhetoric Companion
        publisher: Canon Press
        tradition: protestant
        url: "https://canonpress.com/products/the-rhetoric-companion-package"
        notes: A rhetoric course in dialogue form from the classical Christian school movement. It can support the senior thesis and speech.
      - name: Rhetoric Alive! Senior Thesis
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/products/rhetoric-alive-senior-thesis-student-workbook"
        notes: Guides a senior thesis researched, written and defended orally.
    notes: >-
      Optional homiletics: a student preparing for ministry can add the art of preaching,
      beginning with Augustine's On Christian Doctrine, Book IV (New Advent,
      https://www.newadvent.org/fathers/12024.htm), which is the first Christian rhetoric. Catholic and Protestant traditions differ on who preaches (the ordained homily
      within the Mass versus the central Protestant sermon), but both inherit Augustine's rhetoric.
