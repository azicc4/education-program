  - id: early-development-18
    title: "Bilingual by Ear II: Songs, Stories and Play in Spanish and Mandarin"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 3
    ageEnd: 6
    order: 18
    prerequisites: [early-development-05]
    related: [spanish-02, chinese-02, chinese-03]
    summary: >-
      Keep up and deepen oral exposure. Native-speaker caregivers and playmates, picture books read aloud in
      each language, songs and rhymes, and games that require the child to speak. The aim by six is easy
      listening comprehension and conversational speech in both languages, so that formal reading and
      writing (Spanish at about 7, Chinese characters from about 7) builds on a spoken base.
    objectives:
      - Several hours a week of live interaction in each language (caregiver, playgroup, weekend language school, relatives)
      - A library of picture books in Spanish and in Mandarin, read aloud by fluent speakers
      - Sing 20 or more songs and rhymes in each language, and play games (store, cooking, hide-and-seek) conducted in them
      - "Mandarin: hear and imitate the four tones through songs and rhymes. Pinyin and characters wait for the formal track"
      - By 6, the child follows stories and holds simple conversations in both languages
    coreTexts:
      - title: Chinese Mother Goose Rhymes
        reader: together
        pages: 157
        author: Isaac Taylor Headland (trans.)
        date: "1900"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/40425" }
    curriculumOptions:
      - name: Song School Spanish Book 1
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/products/song-school-spanish-book-1-program"
        notes: Chant- and song-based Spanish for early elementary. Use orally from about 5–6 as a bridge to the spanish track.
    sources:
      - { label: "Kuhl et al., PNAS 2003 (live vs. recorded exposure)", url: "https://www.pnas.org/doi/10.1073/pnas.1532872100" }
    notes: >-
      I could not verify a Mandarin early-childhood curriculum; the chinese-track agent should propose one.
      Audio and video are supplements. The research shows that live, social exposure drives early
      phonetic learning.

  - id: early-development-19
    title: "Outdoor Hours, Nature Walks and Gross-Motor Skill"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 3
    ageEnd: 7
    order: 19
    prerequisites: [early-development-09]
    related: [natural-science-03, natural-science-04, physical-training-01, fine-arts-02]
    summary: >-
      Charlotte Mason urged several hours a day out of doors for young children, and the WHO recommends at
      least three hours of activity a day for 3–4-year-olds, including an hour of energetic play. Go on
      daily walks and weekly nature rambles, learn to name local birds, trees and flowers, climb, run, ride
      a bike, and take swim lessons. This is the root of both the natural-science and physical-training
      tracks.
    objectives:
      - "Three or more hours of activity daily, including 60 minutes or more of moderate-to-vigorous play (WHO, ages 3–4)"
      - A weekly nature walk. By 6, name 20 or more local plants and animals and keep a simple picture nature notebook
      - "Motor milestones: hop, skip, catch a bounced ball, pedal a bicycle, swim a short distance with support"
      - Formal swim lessons (see physical-training-01) and supervised climbing, balancing and rough-and-tumble play
    coreTexts:
