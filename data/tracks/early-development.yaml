        reader: teacher
        pages: 938
        author: Anna Botsford Comstock
        date: "1911"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/78142" }
      - title: Home Education (Part II, Out-of-Door Life for the Children)
        reader: teacher
        pages: 55
        author: Charlotte M. Mason
        date: "1886"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/71087" }
    sources:
      - { label: "WHO Guidelines for Children under 5 (2019)", url: "https://www.who.int/publications/i/item/9789241550536" }
      - { label: "CDC: Milestones by 5 Years", url: "https://www.cdc.gov/act-early/milestones/5-years.html" }

  - id: early-development-20
    title: "Readiness for Formal Schooling: Memory Work, Letters and Narration"
    type: practice
    level: early-5
    stage: early-development
    ageStart: 5
    ageEnd: 7
    order: 20
    prerequisites: [early-development-17, early-development-14, early-development-12]
    related: [reading-phonics-03, latin-01, mathematics-04, rhetoric-01]
    summary: >-
      This is the bridge into the formal curriculum. Quintilian argued against wasting the years before seven
      and said the child's memory is most retentive when young, but that early learning must be play and
      never drudgery. At 5–6 the child learns letter sounds and letter formation, recites memorized poems,
      prayers and catechism, narrates stories, counts past 100, and gets used to short daily "lessons" of
      10–20 minutes. Formal reading, Latin and Spanish/Chinese literacy begin at 6–7 in their own tracks.
    objectives:
      - Knows all letter sounds, blends simple words, and forms letters with a correct pencil grip (hand-off to reading-phonics)
      - Recites 20 or more poems, the basic prayers, and short catechism answers from memory
      - Narrates a fable or story of several paragraphs in sequence after one hearing
      - Counts to 100, subitizes to 10, adds and subtracts within 10 with objects
      - Sits for short, complete lessons with full attention, and does chores independently
    curriculumOptions:
      - name: Junior Kindergarten and Kindergarten curriculum
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/junior-kindergarten/"
        notes: Classical Christian. Includes letters, numbers, prayer, recitation and read-alouds.
      - name: Kindergarten Enrichment (3rd ed.)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/kindergarten-enrichment-third-edition/"
        notes: Read-aloud, art-card and poetry enrichment for 5–6-year-olds.
      - name: "AmblesideOnline Year 0 (Charlotte Mason: no formal academics before 6)"
        publisher: AmblesideOnline
        tradition: classical
        url: "https://www.amblesideonline.org/ao-y0-bks"
        notes: The gentler alternative. Delay formal lessons to 6 and keep to read-alouds, nature and habits.
    coreTexts:
      - title: McGuffey's Eclectic Primer and First Reader
        reader: together
        pages: 160
        author: William Holmes McGuffey
        date: "1836 (rev. 1879)"
        publicDomain: true
        links:
          - { label: Project Gutenberg (First Reader), url: "https://www.gutenberg.org/ebooks/14640" }
    historicalPrecedent: >-
      Quintilian I.1.15–20: some held that children should not learn letters before seven, but Quintilian
      (following Chrysippus) wanted no age to be idle, provided early learning is "an amusement." McGuffey's
      Primer and First Reader were the standard American entry into reading for five- and six-year-olds
      through the 19th century.
    sources:
      - { label: "Quintilian, Institutio Oratoria Book I ch. 1–3 (LacusCurtius)", url: "https://penelope.uchicago.edu/Thayer/E/Roman/Texts/Quintilian/Institutio_Oratoria/1A%2A.html" }
    notes: >-
      Start (family decision): gentle formal lessons begin at 5, meaning short daily phonics and number
      work in the Quintilian and Memoria Press manner. Full formal schooling begins at 6–7. There is a
      real disagreement to settle here. Quintilian and Memoria Press begin gentle formal lessons at 4–5,
      while Charlotte Mason and the Montessori tradition delay formal academics to about 6. For an
      accelerated program, gentle formal lessons from 5 with strict time limits fit best.
