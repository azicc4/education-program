track: biology
title: Biology
trackGroup: Math & Science
description: >-
  From Mendel's peas to molecular genetics. Honors biology grounded in the classic papers, then AP Biology. Evolution is read alongside Catholic teaching (Humani Generis). The goal is command of cell biology, genetics, evolution and ecology, and a strong AP Biology exam by about 14.
rows:
  - id: biology-01
    title: "Biology: Cells, Heredity & Evolution (Mendel, Darwin, Humani Generis)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 13.5
    order: 1
    prerequisites: []
    related: [theology-14, natural-science-09, natural-science-11]
    summary: >-
      A full lab biology course covering biochemistry, the cell, genetics, molecular biology, evolution,
      ecology and the diversity of life. Students read Mendel's pea paper (by an Augustinian friar), the
      first edition of Darwin's Origin of Species read critically as an argument, and Pius XII's
      encyclical Humani Generis on what Catholic teaching permits and forbids in evolutionary theory.
    objectives:
      - Carry out lab work (microscopy, dissection, a Mendelian cross, DNA extraction)
      - Solve monohybrid and dihybrid genetics problems and explain Mendel's reasoning from his data
      - Outline Darwin's argument and distinguish its empirical claims from philosophical extrapolations
      - State the Catholic position in Humani Generis and compare other Christian positions fairly
    coreTexts:
