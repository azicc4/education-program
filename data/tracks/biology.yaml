    notes: >-
      Neutral note on differing views. Catholic teaching (Humani Generis, 1950; later papal statements)
      allows scientific inquiry into the evolution of the human body from pre-existing matter. It holds
      that each human soul is directly created by God and rejects polygenism and materialist
      philosophy. Many Protestants hold the same view, while others (e.g., Apologia, Answers in Genesis)
      hold young-earth creationism. Present the evidence and the arguments honestly, and let parents
      decide the emphasis. Campbell Biology (Pearson) is the standard AP/college text if a
      print textbook is preferred. The Selfish Gene is an elective and a critical reading for the
      end of the course (13+): it is the classic popular statement of the gene's-eye view of
      evolution and of kin selection, and the student should separate its genuine science from
      Dawkins's reductionist and materialist gloss ("survival machines"), which Humani Generis
      and theology-14 answer. Jurassic Park is a light elective for 13+, a thriller about cloning
      dinosaurs from ancient DNA. Read it for the ethics of science: Ian Malcolm's chaos-theory
      warnings against the hubris of doing whatever technology makes possible. Parents should know
      it has thriller violence and some profanity.
