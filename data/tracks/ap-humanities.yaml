    sources:
      - { label: "AP Chinese Language and Culture Course and Exam Description (PDF)", url: "https://apcentral.collegeboard.org/media/pdf/ap-chinese-language-and-culture-course-and-exam-description.pdf" }
      - { label: "AP Chinese Language and Culture exam (AP Central)", url: "https://apcentral.collegeboard.org/courses/ap-chinese-language-and-culture/exam" }
      - { label: "AP World Language and Culture revisions (2026–27)", url: "https://apcentral.collegeboard.org/courses/ap-world-languages-revisions" }
    notes: >-
      Already covered: the track teaches both simplified and traditional characters (chinese-07), intermediate
      grammar and registers (chinese-09) and unadapted modern prose to HSK 5 (chinese-11). There is no official
      HSK–AP concordance. As a planning rule, a student with solid HSK 4 listening and reading is near the AP
      level, and HSK 5 gives a comfortable margin. The student could therefore sit AP after chinese-09 (about 14)
      rather than wait until 16. The gap is mechanical and cultural. Typing is the biggest one: a handwriting-
      trained student must practice IME typing weekly for a term, since homophone selection errors cost points.
      The rest is the course project, timed picture narration and email, and everyday contemporary culture
      (festivals, school life, social customs, technology) as distinct from the classics. Allow a semester.
      A homeschooler needs a school or online AP provider that sets up the AP Digital Portfolio for the PPR.

  - id: ap-humanities-06
    title: "AP Music Theory: Dictation, Sight-Singing & Part-Writing (Exam Prep)"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 15
    order: 6
    prerequisites: []
    related: [music-11, music-08, music-01, music-02, music-07, music-10]
    exams: [ap-music-theory, music-graded-exams]
    summary: >-
      An AP-specific supplement to music-08 (graded rudiments) and music-11 (harmony, figured bass and species
      counterpoint), with ear training drawn from the solfège of music-01, the Ward Method (music-02), chant
      (music-07) and choir (music-10). It adds only what the exam requires: melodic and harmonic dictation,
      recorded sight-singing, part-writing in the College Board's voice-leading conventions, aural multiple
      choice, and the eight CED units, including modes and form.
    objectives:
      - "Know the exam: 75 multiple-choice questions, most with audio (45%); 7 written free-response questions (2 melodic dictation, 2 harmonic dictation, part-writing from figured bass, part-writing from Roman numerals, harmonizing a melody or composing a bass line; 45%); 2 sight-singing melodies (10%)"
      - Take down a 4–8 bar diatonic melody (major or minor, simple or compound meter) in 3–4 hearings
      - Write the outer voices and Roman numerals of a short progression by ear (harmonic dictation), including cadential 6/4, V7, predominants and secondary dominants
      - Part-write from figured bass and from Roman numerals in four voices without parallels, spacing errors or unresolved tendency tones
      - Sight-sing two melodies with 75 seconds of study and 30 seconds to perform, recorded
      - Cover the CED units (fundamentals, chord function and cadence, predominant function, embellishments and motive, secondary function, modes and form) using AP terminology
    curriculumOptions:
      - name: AP Music Theory (AP Central course and exam pages, CED)
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/courses/ap-music-theory"
        notes: The official source. The CED sets out the eight units and the voice-leading rules the exam is scored by. It was lightly clarified for 2026–27.
      - name: AP Music Theory past exam questions (with audio and scoring guidelines)
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/courses/ap-music-theory/exam/past-exam-questions"
        notes: Free. The scoring guidelines show exactly how dictation and part-writing points are awarded.
      - name: AP Classroom (topic questions and progress checks)
        publisher: College Board
        tradition: secular
        url: "https://apclassroom.collegeboard.org"
        notes: Available through the school or online provider that orders the exam. It includes aural progress checks.
      - name: "Tonal Harmony, 9th ed. (Kostka, Payne & Almén)"
        publisher: McGraw Hill
        tradition: secular
        url: "https://www.mheducation.com/highered/product/tonal-harmony-kostka.html"
        notes: The standard college harmony text, and the reference for the AP course's harmonic content. Use it with its workbook for part-writing drill.
      - name: "Barron's AP Music Theory Premium, 5th ed. (Nancy Fuller Scoggin)"
        publisher: Barron's
        tradition: secular
        url: "https://www.simonandschuster.com/books/AP-Music-Theory-Premium-Fifth-Edition-2-Practice-Tests-+-Comprehensive-Review-+-Online-Audio/Nancy-Fuller-Scoggin/Barrons-AP-Prep/9781506288031"
        notes: Exam-focused review with online audio and two practice tests.
      - name: musictheory.net
        publisher: musictheory.net
        tradition: secular
        url: "https://www.musictheory.net/"
        notes: Free drills for interval, chord and key identification, and ear-training trainers.
      - name: teoria.com (melodic and harmonic dictation exercises)
        publisher: teoria.com
        tradition: secular
        url: "https://teoria.com/en/exercises/md.php"
        notes: Free, configurable melodic dictation and other ear-training exercises. It is the best free source of daily dictation.
    sources:
      - { label: "AP Music Theory Course and Exam Description (PDF)", url: "https://apcentral.collegeboard.org/media/pdf/ap-music-theory-course-and-exam-description.pdf" }
      - { label: "AP Music Theory exam (AP Central)", url: "https://apcentral.collegeboard.org/courses/ap-music-theory/exam" }
      - { label: "AP Music Theory exam overview (AP Students)", url: "https://apstudents.collegeboard.org/courses/ap-music-theory/assessment" }
    notes: >-
      Already covered: rudiments to ABRSM Grade 5 (music-08), and four-part harmony, figured bass and chorale
      analysis at AP level or beyond (music-11). Movable-do solfège, the Ward Method and chant give a trained
      ear and sight-singing, and the schola adds part-singing at sight (music-10). Gregorian chant also covers
      the modes in CED Unit 8. The gaps are three. (1) Dictation: the main track trains the ear but does not
      drill writing down melodies and bass lines under time. Do 10 minutes of dictation daily for a year.
      Start from chant incipits and hymn tunes the student knows, then move to unfamiliar tonal melodies.
      (2) AP-specific conventions: the scoring guidelines penalize particular voice-leading errors, and some
      terms differ from ABRSM's (e.g. "imperfect authentic" cadence, "phrase model", Roman-numeral figures).
      (3) Singing into a recorder with a strict 75-second study time. From May 2027 the exam is in hybrid
      digital form through Bluebook, with no change to its structure.
