track: philosophy
title: Philosophy
trackGroup: Faith & Philosophy
description: >-
  Philosophy begins in wonder. The track starts with conversation around picture books and
  children's questions. Around 9 it turns to Socratic dialogue and at 11 to Plato's account of
  Socrates' trial and death. The student then reads the great conversation in order, from the
  sources: Plato and Aristotle, the Stoics, the Christian synthesis of Augustine, Boethius and
  Aquinas, the early moderns (Descartes, Hobbes, Locke, Hume, Kant), the political thinkers who
  shaped the American founding and its critics (Rousseau, Burke, Tocqueville, J.S. Mill), and the
  19th-century revolt (Marx, Nietzsche, Kierkegaard). Twentieth-century Catholic and Thomist
  answers (Pieper, Maritain, Gilson, MacIntyre, John Paul II) close the sequence. Peter Kreeft and
  Mortimer Adler serve as guides. Modern thinkers are read seriously and critically from within a
  realist, Aristotelian-Thomist frame. By 18 the student can read a primary philosophical text
  closely, reconstruct its arguments, place it in the history of ideas, and defend a reasoned
  position in seminar and in writing.
rows:
  - id: philosophy-01
    title: Wonder & Big Questions at Home
    type: practice
    level: early-5
    stage: early-development
    ageStart: 4
    ageEnd: 7
    order: 1
    prerequisites: []
    related: [theology-03]
    summary: >-
      Young children ask philosophical questions without prompting: What is real? Is it fair? Why
      is there something? Parents cultivate this by taking the questions seriously, asking "What do
      you think? Why?" and discussing picture books and fables that raise questions of
      friendship, courage, fairness and truth. Nothing is taught formally. The aim is the habit of
      wondering aloud and giving reasons.
    objectives:
      - Ask and answer "why" questions and give a reason for an opinion
      - Listen to another child's view and say whether they agree and why
      - Discuss the moral of a fable or picture book
      - Notice puzzles (e.g. "Is a copy of my toy my toy?") with delight rather than frustration
    coreTexts:
      - title: "Big Ideas for Little Kids: Teaching Philosophy through Children's Literature (2nd ed.)"
        reader: teacher
        pages: 185
        author: Thomas E. Wartenberg
        publicDomain: false
        links:
          - { label: Amazon, url: "https://www.amazon.com/Big-Ideas-Little-Kids-Philosophy/dp/147580444X" }
    sources:
      - { label: "EEF: Philosophy for Children evaluation report (2015), via ERIC", url: "https://eric.ed.gov/?id=ED581147" }
    notes: >-
      Evidence on "philosophy for children" (P4C) is mixed. A 2015 Education Endowment Foundation
      trial found about two months' extra progress in reading and maths, but a larger follow-up
      trial found no measurable gain. Treat this as formation of the habit of reasoned
      conversation, not as a test-score intervention.

  - id: philosophy-02
    title: "Philosophy for Kids: Socratic Conversation"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 11
    order: 2
    prerequisites: [philosophy-01]
    related: [logic-02]
    summary: >-
      A weekly guided conversation on the classic questions of values, knowledge, reality and
      reasoning, framed as short puzzles. Parent or tutor leads by the Socratic method: define the
      term, test the definition with counterexamples, refine it. This prepares the child to meet
      Socrates himself.
    objectives:
      - Propose and test definitions (e.g. of courage, friendship, justice) with counterexamples
      - Distinguish opinion, belief and knowledge in simple cases
      - Keep a philosophy notebook of questions and tentative answers
      - Conduct a short Socratic dialogue with a sibling or parent
    coreTexts:
      - title: "Philosophy for Kids: 40 Fun Questions That Help You Wonder about Everything!"
        reader: together
        pages: 211
        author: David A. White
        date: "2001"
        publicDomain: false
        links:
          - { label: Routledge, url: "https://www.routledge.com/Philosophy-for-Kids-40-Fun-Questions-That-Help-You-Wonder-About-Everything/White/p/book/9781041045441" }
    curriculumOptions:
      - name: Philosophy for Kids (self-directed, parent-led)
        publisher: Prufrock Press / Routledge
        tradition: secular
        url: "https://www.routledge.com/Philosophy-for-Kids-40-Fun-Questions-That-Help-You-Wonder-About-Everything/White/p/book/9781041045441"
        notes: >-
          For ages 10 and up. Each question is tied to a real philosopher, so it previews the
          great conversation.
      - name: Socrates Meets Jesus (read aloud and discuss, 10–11)
        publisher: Memoria Press (distributor; Kreeft, InterVarsity)
        tradition: catholic
        url: "https://www.memoriapress.com/curriculum/educational-resources/socrates-meets-jesus/"
        notes: >-
          Kreeft's dialogue imagines Socrates as a modern divinity student. A friendly first
          encounter with Socratic method on questions of faith.

  - id: philosophy-03
    title: "Socrates: Euthyphro, Apology, Crito, Phaedo"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 12.5
    order: 3
    prerequisites: [philosophy-02]
    related: [logic-03, rhetoric-07, greek-10]
    summary: >-
      Students read Plato's four dialogues on the trial and death of Socrates: piety (Euthyphro),
      the philosopher's defense of his life (Apology), justice and the laws (Crito), and the
      immortality of the soul (Phaedo). Kreeft's Philosophy 101 by Socrates uses the Apology as a
      guided introduction to what philosophy is.
    objectives:
      - Trace the Euthyphro dilemma and state its significance for ethics and theology
      - Summarize Socrates' defense and his claim that the unexamined life is not worth living
      - Evaluate the Laws' argument in the Crito for obeying the city
      - Reconstruct at least two arguments for immortality in the Phaedo
    coreTexts:
      - title: Euthyphro
        reader: together
        pages: 20
        author: Plato (trans. Jowett)
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/1642" }
      - title: Apology, Crito, and Phaedo of Socrates
        reader: together
        pages: 140
        author: Plato
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/13726" }
      - title: "Philosophy 101 by Socrates: An Introduction to Philosophy via Plato's Apology"
        reader: student
        pages: 149
        author: Peter Kreeft
        date: "2002"
        publicDomain: false
        links:
          - { label: St. Augustine's Press, url: "https://www.staugustine.net/9781587318306/philosophy-101-by-socrates/" }
