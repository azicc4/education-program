    historicalPrecedent: >-
      The revival had a public purpose from the start. Maritain wrote the introduction to
      UNESCO's 1948 symposium on the philosophical grounds of human rights, the background to the
      Universal Declaration. There he observed that nations could agree on a list of rights while
      disagreeing about why they hold. The Hart–Fuller debate of 1958 over Nazi-era statutes made
      the natural-law-versus-positivism question a standard part of legal education.
    notes: >-
      To be revised when the user attaches the John Jay Institute curriculum. The Institute's
      archived "Natural Law and Public Moral Discourse" module paired Lewis and Budziszewski with
      challengers including Peter Singer. Singer's Practical Ethics can be added here as a
      contemporary utilitarian foil. Budziszewski defends the older Thomist view of natural law
      and Finnis and George the "new natural law". Feser is sharply critical of the new theory, and
      the disagreement is itself a good seminar question. Grisez's 1965 article is copyrighted
      but free on Notre Dame's repository.
