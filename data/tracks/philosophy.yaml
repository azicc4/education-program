    curriculumOptions:
      - name: "Natural Law, Natural Rights, and American Constitutionalism (free website)"
        publisher: The Witherspoon Institute (NEH "We the People" project)
        tradition: classical
        url: "https://nlnrac.org/"
        notes: >-
          Essays and primary sources arranged as Classical, Early Modern, American, Contemporary
          and Critics. It follows this row's sequence almost exactly and is the best free
          companion to it.
      - name: Aquinas 101 (free video courses)
        publisher: The Thomistic Institute (Dominican Friars)
        tradition: catholic
        url: "https://aquinas101.thomisticinstitute.org/"
        notes: Short lectures by Dominican friars, including one on the natural law. Use them alongside q.94.
      - name: Natural Law research and articles
        publisher: Acton Institute
        tradition: catholic
        url: "https://www.acton.org/research/natural-law"
        notes: >-
          Essays and lectures on natural law and the free society. Acton is an ecumenical
          institute founded by a Catholic priest.
    historicalPrecedent: >-
      The founders learned natural law as a college subject. King's College's 1763 plan put
      Grotius or Pufendorf in the fourth year, and John Jay (class of 1764) studied under it.
      Witherspoon's Princeton lectures sent Madison's generation to Grotius, Pufendorf and
      Burlamaqui, and Burlamaqui entered the Harvard course in the Revolutionary era. In 1790–91
      James Wilson, a signer of the Declaration and the Constitution and a Supreme Court justice,
      gave his law lectures at the College of Philadelphia with President Washington in the
      audience at the first one. He grounded American law in the law of nature, which he held to
      be the law of God.
    sources:
      - { label: "A History of Columbia University 1754–1904 (1904), Appendix B: the 1763 Plan of Education (Internet Archive)", url: "https://archive.org/details/historyofcolumbi00coluuoft" }
      - { label: "Witherspoon, Lectures on Moral Philosophy (3rd ed., 1810) (Internet Archive)", url: "https://archive.org/details/lecturesonmoralp00with" }
      - { label: "John Jay Institute, Learning Together (current seminar modules)", url: "https://www.johnjayfellows.com/learning-together" }
      - { label: "John Jay Institute curriculum page, archived 23 Feb 2009 (Wayback Machine)", url: "https://web.archive.org/web/20090223104713/http://www.johnjayinstitute.org/index.cfm?get=get.curriculum" }
    notes: >-
      To be revised when the user attaches the John Jay Institute curriculum. Publicly, the
      John Jay Institute (Langhorne, PA; founded 2005 by the Rev. Alan R. Crippen II) lists
      "Natural Law" as one of five three-week seminar modules in its post-college Fellows Program.
      An archived 2006–2009 description of the module, then titled "Natural Law and Public Moral
      Discourse," names Sophocles, Plato, Aristotle, Cicero, Aquinas, Calvin, Hooker, C.S. Lewis
      and J. Budziszewski, with Kant, Mill, Nietzsche and Peter Singer as challengers. Its aim was
      to find common moral ground with opponents on politics, technology, sexuality and human
      life. This row follows that sequence and adds the early-modern jurists the founders read.
      The current syllabus, editions and page assignments are not public. civics-law-09 reads
      Cicero and Aquinas at 13–14, and here they are reread as philosophy. A Catholic/Protestant
      note: Calvin (Institutes II.8.1, on the law "engraved on every heart") and Hooker give the
      Reformed and Anglican doctrine of natural law. Budziszewski, an evangelical who entered
      the Catholic Church in 2004, writes for both readerships.

  - id: philosophy-16
    title: "College Seminar: The Natural Law Revival and Its Critics (Maritain, Grisez, Finnis, George, Budziszewski, Feser; Hume and Hart)"
    type: course
    level: college
    stage: formal
    ageStart: 17.5
    ageEnd: 18
    order: 13.5
    prerequisites: [philosophy-15, philosophy-13]
    related: [civics-law-18, civics-law-19, civics-law-20, theology-20, theology-22]
    summary: >-
      After the totalitarian regimes of the 20th century, philosophers and jurists revived
      natural law. The seminar reads Maritain's Man and the State on natural law and human
      rights, and Grisez's 1965 commentary on ST I-II q.94 a.2, which launched the "new natural
      law theory". It then reads that theory's full statement in Finnis's Natural Law and Natural
      Rights (basic goods and practical reasonableness) and its public application in Robert
      George's In Defense of Natural Law. Budziszewski's What We Can't Not Know explains conscience
      and our evasions of it. Feser's Aquinas answers from the older Aristotelian-Thomist side.
      The critics get a full hearing: Hume's is-ought problem and H.L.A. Hart's legal positivism,
      including his "minimum content of natural law".
    objectives:
      - State Hume's is-ought objection and reconstruct both the new-natural-law reply (Grisez, Finnis) and the Aristotelian-Thomist reply (Feser)
      - List Finnis's basic goods and requirements of practical reasonableness and apply them to a legal question
      - Explain Maritain's account of knowledge of natural law "by inclination" and how it grounds human rights
      - Summarize Hart's separation of law and morals and his "minimum content of natural law", and give a natural-law answer
      - Write a seminar paper on a live public controversy that argues from natural law to a reader who rejects it
