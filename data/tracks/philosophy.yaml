      Three 19th-century thinkers attack the bourgeois, rationalist, and nominally Christian world
      from different directions. Marx offers historical materialism and class struggle, Nietzsche
      the death of God, the will to power and the genealogy of morals, and Kierkegaard a
      Christian's protest against "Christendom" and the crowd in the name of the individual before
      God. They are read critically as the sources of 20th-century revolutions and of much
      contemporary thought.
