  - id: philosophy-15
    title: "Natural Law I: From Antigone to Aquinas, the Law of Nations and the Founders"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 12.5
    prerequisites: [philosophy-08, philosophy-10]
    related: [civics-law-09, civics-law-10, civics-law-13, civics-law-19, greek-14, literature-16, theology-18, latin-18]
    summary: >-
      The natural-law tradition is read as one argument running from the Greeks to the
      Declaration. Antigone appeals to the unwritten laws of the gods against Creon's decree.
      Aristotle distinguishes natural from legal justice (Ethics V.7) and cites Antigone for a
      "common law" of nature (Rhetoric I.13). Cicero defines true law as right reason in agreement
      with nature (Republic III, Laws I). Aquinas's Treatise on Law (Summa I-II qq. 90–97) gives the
      classic synthesis. The early moderns (Suárez, Hooker, Grotius, Pufendorf and Burlamaqui)
      turn it into a science of rights and of the law of nations, and the founders took it from
      them into the Declaration and James Wilson's law lectures. Budziszewski's Written on the
      Heart is the guide, and Lewis's Abolition of Man shows the same moral law across cultures.
    objectives:
      - Explain Antigone's appeal to the unwritten laws and Aristotle's use of it in Rhetoric I.13
      - Distinguish natural from legal justice (Ethics V.7) and state Cicero's definition of true law
      - State Aquinas's four kinds of law and the first precept of practical reason (ST I-II q.94 a.2)
      - Explain how human law derives from natural law by conclusion and by determination (q.95 a.2), and why an unjust law does not bind in conscience (q.96 a.4)
      - Trace the move from natural law to natural rights through Suárez, Grotius's Prolegomena, Pufendorf and Burlamaqui
      - Show how the Declaration's "Laws of Nature and of Nature's God" and Wilson's lecture "Of the Law of Nature" draw on this tradition
      - Match the precepts in Lewis's appendix ("Illustrations of the Tao") to the Decalogue and to Aquinas q.94
    coreTexts:
      - title: "Antigone (in Plays of Sophocles, trans. F. Storr)"
