      - title: An Enquiry Concerning Human Understanding
        reader: student
        pages: 176
        author: David Hume
        date: "1748"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/9662" }
      - title: Fundamental Principles of the Metaphysic of Morals (Groundwork)
        reader: student
        pages: 80
        author: Immanuel Kant (trans. T.K. Abbott)
        date: "1785"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/5682" }
    curriculumOptions:
