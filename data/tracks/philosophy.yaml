  - id: philosophy-13
    title: "College Seminar: 20th-Century Christian Philosophy (Pieper, Maritain, Gilson, MacIntyre, Fides et Ratio)"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 17.5
    order: 13
    prerequisites: [philosophy-11, philosophy-12]
    related: [theology-22]
    summary: >-
      This seminar reads the 20th-century recovery of classical and Thomist philosophy in answer to
      modernity. Pieper defends leisure and contemplation as the basis of culture; Maritain gives a
      Thomist introduction to philosophy; Gilson argues that there is a "Christian philosophy"; and
      MacIntyre diagnoses the collapse of moral discourse after the Enlightenment and argues for a
      return to the virtues. John Paul II's Fides et Ratio (1998) states the Church's charter for
      the partnership of faith and reason.
    objectives:
      - Explain Pieper's distinction between leisure and idleness and its meaning for education
      - Summarize MacIntyre's account of the failure of the Enlightenment project and his concept of a practice
      - Discuss Gilson's thesis on Christian philosophy and its critics
      - Outline Fides et Ratio's account of the relation of philosophy to theology
      - Write a seminar paper applying MacIntyre or Pieper to the design of this program
