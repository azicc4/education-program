    notes: >-
      Pieper, Maritain, Gilson and MacIntyre were all Catholic, MacIntyre having entered the Church in the
      early 1980s. Protestant counterparts worth adding are C.S. Lewis's The Abolition of Man (see
      theology-18) and, for advanced students, Alvin Plantinga's work on faith and reason. John Senior,
      founder of the Integrated Humanities Program at the University of Kansas, is the classic Catholic
      case for the kind of education this program attempts: nursery rhymes, fairy tales and "gymnastic"
      (music and the body) before the great books, then a list of a "thousand good books" as the soil in
      which the Great Books can grow. The student reads him as the philosophy of his own schooling and
      tests it against Pieper and MacIntyre. Senior's two books, and Postman's The End of Education, are
      also recommended reading for parents, ideally before the child starts school. Postman writes as a
      secular humanist; his "end" means both purpose and death, and his claim that schools need a unifying
      "narrative" (a god to serve) is read as an elective, set beside Senior's answer that the narrative
      is the Christian one.

  - id: philosophy-14
