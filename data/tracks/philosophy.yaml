        url: "https://online.hillsdale.edu/courses/promo/introduction-to-western-philosophy"
        notes: Video lectures to accompany the reading. Choose the Socrates and Plato lectures here.

  - id: philosophy-04
    title: "How to Read a Book & Aristotle for Everybody"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 13
    order: 4
    prerequisites: [philosophy-03]
    related: [logic-04]
    summary: >-
      Mortimer Adler, architect of the Great Books movement, teaches two things. How to Read a
      Book covers the levels of reading (elementary, inspectional, analytical, syntopical) that the
      rest of this program assumes. Aristotle for Everybody introduces Aristotle's common-sense
      philosophy of nature, action, happiness and knowledge in plain English.
    objectives:
      - Apply Adler's rules of analytical reading (classify, outline, find terms and propositions, criticize)
      - Write a structural outline and a one-paragraph summary of a philosophical work
      - Explain Aristotle's four causes, his view of happiness, and his distinction between wants and needs
      - Begin a commonplace book of key passages from the great books
    coreTexts:
      - title: How to Read a Book
        reader: student
        pages: 398
        author: Mortimer J. Adler & Charles Van Doren
        date: "1940; rev. 1972"
        publicDomain: false
        links:
          - { label: Simon & Schuster, url: "https://www.simonandschuster.com/books/How-to-Read-a-Book/Mortimer-J-Adler/9781476790152" }
      - title: "Aristotle for Everybody: Difficult Thought Made Easy"
        reader: student
        pages: 206
        author: Mortimer J. Adler
        date: "1978"
        publicDomain: false
        links:
          - { label: Simon & Schuster, url: "https://www.simonandschuster.com/books/Aristotle-for-Everybody/Mortimer-J-Adler/9780684838236" }
    notes: >-
      Adler was raised Jewish, became an Aristotelian and a friend of the Thomist revival, and
      late in life was received first as an Episcopalian and then into the Catholic Church. He is
      a fitting guide for a program that joins the Great Books to the Catholic intellectual
      tradition.

  - id: philosophy-05
    title: "Plato's Republic & Meno"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13
    ageEnd: 14
    order: 5
    prerequisites: [philosophy-04]
    related: [theology-14, literature-31]
    summary: >-
      The Meno asks whether virtue can be taught and introduces recollection and the difference
      between knowledge and true opinion. The Republic asks what justice is and whether the just
      life is happier. Its answer includes the tripartite soul, the city in speech, the education
      of guardians, the philosopher-king, the divided line, the cave, and the decline of regimes.
      It is the founding text of Western political philosophy and of the theory of education
      itself.
    objectives:
      - Reconstruct the slave-boy demonstration and the Meno's paradox of inquiry
      - Summarize the definitions of justice in Book I and Socrates' refutations
      - Explain the tripartite soul and its parallel in the city
      - Interpret the sun, line and cave, and apply them to the program's own aims
      - Evaluate Plato's account of the decline from aristocracy to tyranny against American history
    coreTexts:
      - title: Meno
        reader: student
        pages: 56
        author: Plato (trans. Jowett)
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/1643" }
      - title: The Republic
        reader: student
        pages: 400
        author: Plato (trans. Jowett)
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/1497" }
    curriculumOptions:
      - name: The Republic and The Laws Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/classical-studies/the-republic-and-the-laws-set/"
        notes: Student and teacher guides for a full-year high-school reading.
      - name: "Great Books 101: Ancient to Medieval (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/great-books-101"
        notes: Hillsdale's Great Books lectures, including Plato.
    historicalPrecedent: >-
      J.S. Mill read several Platonic dialogues in Greek before age 8. Jefferson, by contrast,
      disliked the Republic, and the tension between the founders' Lockean politics and classical
      political philosophy is itself a seminar topic.

  - id: philosophy-06
    title: "The Stoics: Epictetus, Marcus Aurelius & Seneca"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 13
    ageEnd: 14
    order: 6
    prerequisites: [philosophy-03]
    related: [rhetoric-10]
    summary: >-
      Roman Stoicism covers what is and is not in our power, virtue as the only true good, duty,
      self-command and providence. It shaped Roman statesmen, early Christian moralists, and the
      founders, who read Cicero and Seneca as moral philosophy. Students read Epictetus's
      Enchiridion and selected Discourses, Marcus Aurelius's Meditations, and Seneca's Letters,
      with attention to where Stoicism anticipates Christian ethics and where it diverges.
    objectives:
      - Explain the dichotomy of control and apply it in a personal journal
      - Compare Marcus Aurelius's private notes on duty with his public role as emperor
      - Read ten of Seneca's letters and summarize their teaching on time, death, friendship and wealth
      - Contrast Stoic apatheia with Christian charity and the theological virtues
    coreTexts:
      - title: A Selection from the Discourses of Epictetus, with the Encheiridion
        reader: student
        pages: 132
        author: Epictetus (trans. George Long)
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/10661" }
      - title: Meditations
        reader: student
        pages: 203
        author: Marcus Aurelius (trans. Meric Casaubon)
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/2680" }
      - title: Moral Letters to Lucilius
        reader: student
        pages: 546
        author: Seneca (trans. R.M. Gummere)
        publicDomain: true
        links:
          - { label: Wikisource, url: "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius" }
      - title: "Tusculan Disputations (Books I, II and V at least)"
        reader: student
        pages: 250
        author: Cicero (trans. C. D. Yonge)
        date: "45 BC"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14988" }
    historicalPrecedent: >-
      Jefferson's 1771 reading list for Robert Skipwith put Epictetus, Seneca, Cicero's moral
      works and Marcus Aurelius under moral philosophy, and Washington loved Addison's Cato, a
      Stoic hero play. Cicero's Tusculan Disputations, his Roman digest of Stoic and Platonic
      teaching on death, pain, the passions and whether virtue suffices for happiness, was a
      colonial-college text: King's College (Columbia) set it in the fourth year, and Yale's
      Berkeley Scholar examinations of 1780 tested candidates on it with Horace and Homer.

  - id: philosophy-07
    title: "Aristotle: Nicomachean Ethics & Politics"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 7
    prerequisites: [philosophy-04, philosophy-05]
    related: [logic-05, rhetoric-07, character-virtue-12, civics-law-09]
    summary: >-
      This is the foundation of the ethics of virtue and of political science. The Ethics covers
      happiness as activity of soul in accordance with virtue, the mean, habituation, voluntary
      action, justice, prudence, friendship and contemplation. The Politics covers man as the
      political animal, the household, the classification of regimes, citizenship, the mixed regime
      (polity), and education for leisure. Together they are the natural-law and statesmanship
      core of a founder's formation.
    objectives:
      - Define happiness, virtue and the mean, with examples from one's own life
      - Explain how virtue is acquired by habituation and why character is formed young
      - Summarize Aristotle's six regimes and his case for the mixed regime
      - Compare Aristotle's polity with the constitutional design of the Federalist
      - Write a seminar paper on friendship (Ethics VIII–IX) or on education (Politics VII–VIII)
    coreTexts:
      - title: The Nicomachean Ethics
        reader: student
        pages: 300
        author: Aristotle
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/8438" }
          - { label: MIT Internet Classics Archive, url: "https://classics.mit.edu/Aristotle/nicomachaen.html" }
      - title: "Politics: A Treatise on Government"
        reader: student
        pages: 229
        author: Aristotle (trans. William Ellis)
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/6762" }
    curriculumOptions:
      - name: The Nicomachean Ethics (guided study)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/mcp/the-nicomachean-ethics/"
        notes: Memoria Press's high-school edition and support materials.
      - name: "Introduction to Aristotle's Ethics: How to Lead a Good Life (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/aristotles-ethics"
        notes: Lectures by Hillsdale faculty that pair with a close reading.
    historicalPrecedent: >-
      Jefferson named Aristotle among the sources of "the harmonizing sentiments of the day" behind
      the Declaration, together with Cicero, Locke and Sidney (letter to Henry Lee, 1825). The
      Ethics and Politics were core texts at the colonial colleges and Oxford.

  - id: philosophy-08
    title: "The Christian Synthesis: Augustine, Boethius & Aquinas"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 15.5
    order: 8
    prerequisites: [philosophy-06, philosophy-07]
    related: [theology-16, theology-22]
    summary: >-
      The course traces how Christian thinkers took up Greek and Roman philosophy. Readings are
      Augustine's City of God (the two cities, providence and history, the critique of Roman
      virtue); Boethius's Consolation of Philosophy (fortune, happiness, evil, providence and free
      will, among the most-read books of the Middle Ages); and Aquinas on faith and
      reason, the existence of God, the soul, and natural law.
    objectives:
      - Summarize Augustine's two loves and two cities and apply them to the fall of Rome
      - Explain Lady Philosophy's arguments on fortune, the highest good, and divine foreknowledge
      - State Aquinas's distinction between truths of reason and truths of revelation (ST I q.1)
      - Outline the five ways (ST I q.2 a.3) and one objection and reply for each
    coreTexts:
      - title: The City of God (selections, Books I, XI–XIV, XIX)
        reader: student
        pages: 1100
        author: Augustine of Hippo
        publicDomain: true
        links:
          - { label: New Advent, url: "https://www.newadvent.org/fathers/1201.htm" }
          - { label: "Project Gutenberg (vol. 1)", url: "https://www.gutenberg.org/ebooks/45304" }
      - title: The Consolation of Philosophy
        reader: student
        pages: 116
        author: Boethius
        date: "c. 524"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14328" }
      - title: "Summa Theologiae, I q.1–2 (sacred doctrine; the existence of God)"
        reader: student
        pages: 15
        author: Thomas Aquinas
        publicDomain: true
        links:
          - { label: "New Advent (I q.2)", url: "https://www.newadvent.org/summa/1002.htm" }
    curriculumOptions:
      - name: The Consolation of Philosophy (guided study)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/classical-studies/the-consolation-of-philosophy/"
        notes: Study guide for high-school reading.
      - name: City of God Set
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/christian-studies/city-god/"
        notes: Abridged reading with a guide.
      - name: A Summa of the Summa
        publisher: Ignatius Press (Kreeft)
        tradition: catholic
        url: "https://ignatius.com/summa-of-the-summa-sosp/"
        notes: Kreeft's annotated selections, used again in theology-22.
    historicalPrecedent: >-
      King Alfred translated Boethius into Old English, and Chaucer and Queen Elizabeth I also
      translated him, so a founder-in-training is in good company. See the old-english track.

  - id: philosophy-09
    title: "Early Modern Philosophy: Descartes, Locke, Hume & Kant"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 9
    prerequisites: [philosophy-08]
    related: [logic-07]
    summary: >-
      This is the modern "turn to the subject" in theory of knowledge: Descartes' methodical doubt
      and cogito; Locke's empiricism (Essay, Book II), the mind that more than any other shaped the
      founders; Hume's skepticism about causation, the self and miracles; and Kant's attempted
      synthesis and his ethics of duty and autonomy. Kreeft's Socrates Meets… dialogues give a
      realist critique of each.
    objectives:
      - Reconstruct Descartes' path from doubt to the cogito to God in Meditations I–III
      - Explain Locke's ideas of sensation and reflection and his critique of innate ideas
      - State Hume's problem of induction and his argument against miracles, and answer them
      - Explain Kant's categorical imperative in its first two formulations
      - Evaluate each thinker from the standpoint of Aristotelian-Thomist realism
    coreTexts:
      - title: Discourse on Method; Meditations on First Philosophy
        reader: student
        pages: 120
        author: René Descartes (trans. John Veitch)
        date: "1637; 1641"
        publicDomain: true
        links:
          - { label: "Project Gutenberg (Discourse)", url: "https://www.gutenberg.org/ebooks/59" }
          - { label: "Archive.org (Everyman ed. with Meditations, 1912)", url: "https://archive.org/details/discourseonmetho1912desc" }
      - title: An Essay Concerning Human Understanding (Books I–II selections)
