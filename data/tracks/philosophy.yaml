        url: "https://ignatius.com/socrates-meets-descartes-digital-soc05e/"
        notes: >-
          Dialogues set in Purgatory in which Socrates cross-examines each thinker on his major
          book. Read each alongside the primary text. The Kant volume is at
          https://ignatius.com/socrates-meets-kant-digital-soc07e/.
      - name: "Great Books 102: Renaissance to Modern (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/great-books-102"
        notes: Lectures on modern authors.
    historicalPrecedent: >-
      Locke's Essay entered the Yale and Harvard curricula in the 18th century and was standard
      reading for the founding generation. Jefferson counted Locke, Bacon and Newton as his "trinity
      of the three greatest men".

  - id: philosophy-10
    title: "Political Philosophy of the Founding and Its Critics: Machiavelli, Hobbes, Locke, Rousseau, Burke, Tocqueville"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 10
    prerequisites: [philosophy-07]
    related: [rhetoric-09, theology-20, civics-law-10]
    summary: >-
      The modern political tradition is read against the classical and Christian one: Machiavelli's
      break with the ethics of rule, Hobbes's state of nature and Leviathan, Locke's Second Treatise
      (natural rights, consent, property, revolution), which is the philosophical vocabulary of the
      Declaration, Rousseau's general will, Burke's Reflections on prudence, prescription and
      tradition, and Tocqueville's diagnosis of democracy in America (voluntary associations,
      religion, soft despotism).
    objectives:
      - Compare the state of nature in Hobbes, Locke and Rousseau
      - Trace Locke's language in the Declaration of Independence
      - Explain Burke's critique of abstract rights and his defense of prudence and prescription
      - Summarize Tocqueville on religion, associations, and the danger of soft despotism
      - Write a seminar paper judging one modern theory by Aristotle's Politics or by natural law
    coreTexts:
