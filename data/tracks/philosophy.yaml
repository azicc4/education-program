        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/introduction-to-western-philosophy"
        notes: Survey lectures for context.
    notes: >-
      This row overlaps with civics-law. Tocqueville is treated here as a thinker, and his
      institutional history belongs there. Catholic readers note Locke's and Hobbes's departure
      from Thomist natural law; Protestant readers often stress Locke's roots in Reformed
      resistance theory. Both lines of interpretation are worth presenting.

  - id: philosophy-11
    title: "J.S. Mill: Liberty, Utility & an Extraordinary Education"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 11
    prerequisites: [philosophy-09, philosophy-10]
    related: [logic-08]
    summary: >-
      John Stuart Mill is both a model and a warning for this program. His Autobiography describes
      the most famous accelerated education in history (Greek at three, Latin at eight, logic and
      political economy before his teens) and the mental crisis at twenty that showed him what his
      father's purely analytic schooling had left out: feeling, poetry and faith. On Liberty and
      Utilitarianism are read closely and critically as the charter of modern liberalism.
    objectives:
      - Summarize Mill's education and his account of his crisis and recovery through Wordsworth
      - State the harm principle and test it against hard cases (speech, drugs, family, religion)
      - Explain Mill's "higher and lower pleasures" and the standard objections to utilitarianism
      - Compare Mill's liberty with Aristotle's and Aquinas's view of law as a teacher of virtue
      - Write an essay on what this program should learn and avoid from Mill's upbringing
    coreTexts:
      - title: Autobiography
        reader: student
        pages: 240
        author: John Stuart Mill
        date: "1873"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/10378" }
      - title: On Liberty
        reader: student
        pages: 176
        author: John Stuart Mill
        date: "1859"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/34901" }
      - title: Utilitarianism
        reader: student
        pages: 112
        author: John Stuart Mill
        date: "1863"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/11224" }
    historicalPrecedent: >-
      James Mill educated his son at home on a deliberately accelerated classical and analytic
      plan, which is the model this program adapts. The younger Mill judged that it formed his
      intellect but starved his affections, and this program's poetry, music, faith and friendship
      tracks answer that defect.
    notes: >-
      Mill was not a Protestant theologian. He was raised by his father without any religion,
      called himself one who had never had religious belief, and late in life allowed only a
      limited "religion of humanity" or theism (see Three Essays on Religion). Read him as a
      brilliant secular liberal to be understood before he is criticized.

  - id: philosophy-12
    title: "Critics of Modernity: Marx, Nietzsche & Kierkegaard"
