      - { label: "NIMH: Anxiety Disorders", url: "https://www.nimh.nih.gov/health/topics/anxiety-disorders" }
      - { label: "988 Suicide and Crisis Lifeline", url: "https://988lifeline.org/" }
      - { label: "International Personality Item Pool (public-domain Big Five scales)", url: "https://ipip.ori.org/" }
    notes: >-
      Content caution: this unit is not training in diagnosis, and students should be warned against
      self-diagnosis from checklists or social media. If a student recognizes himself or a friend in the
      material, the right step is a parent, a physician or a qualified counselor. Frankl describes the
      camps plainly; it is suitable for 16-year-olds, but some passages are harrowing. On the Christian
      perspective, Catholic integrationists (Vitz, the Divine Mercy University school, Baars) accept sound
      clinical science within a Thomist anthropology. Some Protestants take the same integrationist view,
      while the "biblical counseling" movement (after Jay Adams) is more skeptical of secular psychology.
      Present both fairly. Baars, a Buchenwald survivor like Frankl, worked from Aquinas's account of the
      emotions (social-science-01).

  - id: social-science-09
    title: "Media, Technology and the Mind: Postman, Haidt and the Attention Economy"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 9
    prerequisites: [social-science-03]
    related: [early-development-07, early-development-15, literature-25, rhetoric-07]
    summary: >-
      Every medium shapes the mind that uses it. Postman's Amusing Ourselves to Death (1985) argues that
      television turned public discourse into entertainment and weakened the "typographic mind" on which
      the founders' republic was built. Carr's The Shallows extends the argument to the internet and the
      research on attention and distraction. Haidt's The Anxious Generation (2024) argues that the move to
      smartphone- and social-media-based childhood after about 2012 caused a rise in adolescent anxiety and
      depression, and his critics argue that the data show only small correlations. The student weighs
      the evidence using the methods of social-science-03. Pieper's short essay on propaganda closes the
      unit, and the student then writes his own "rule of life" for technology.
    objectives:
      - Summarize Postman's argument about the "typographic mind" and apply it to a current medium
      - Summarize Haidt's four foundational reforms and the evidence he offers for them
      - Weigh Haidt's causal claims against his critics (Odgers; Orben and Przybylski) using the distinction between correlation and causation and the concept of effect size
      - Explain attention research on multitasking, notifications and deep reading
      - Explain Pieper's claim that the abuse of language for power is the root of propaganda
      - Write and keep for one term a personal technology rule, and report on it
    workload:
      readingHours: 30
      readingBasis: "1,127 pp: Postman, Haidt, Carr and Crouch (1,073 pp) at ~38 pp/h (28 h), Pieper (54 pp) at ~20 pp/h (3 h)"
      work:
        - { kind: writing, hours: 6, note: "weighing Haidt's causal claims against his critics" }
        - { kind: project, hours: 6, note: "a personal technology rule kept for a term, with a report" }
        - { kind: discussion, hours: 8, note: "discussion of the arguments, 16 x 30 min" }
    coreTexts:
      - title: "Amusing Ourselves to Death: Public Discourse in the Age of Show Business"
        kind: primary
        reader: student
        pages: 195
        author: Neil Postman
        date: "1985"
        publicDomain: false
        order: 1
        links:
          - { label: Penguin Random House, url: "https://www.penguinrandomhouse.com/books/297276/amusing-ourselves-to-death-by-neil-postman/" }
      - title: "The Anxious Generation: How the Great Rewiring of Childhood Is Causing an Epidemic of Mental Illness"
        kind: primary
        reader: student
        pages: 395
        author: Jonathan Haidt
        date: "2024"
        publicDomain: false
        order: 1
        links:
          - { label: Penguin Random House, url: "https://www.penguinrandomhouse.com/books/729231/the-anxious-generation-by-jonathan-haidt/" }
