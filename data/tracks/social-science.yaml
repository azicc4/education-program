      psychology is a science and teaching an art, and that "sciences never generate arts directly out of
      themselves." His chapters on habit, attention and memory are still a sound guide to the classroom.
    notes: >-
      This row ties the track to the program itself, and a good capstone is to have the student tutor a
      younger sibling using what he has learned. Piaget's stage theory is taught everywhere but is now
      considered too rigid. Children can often do more, earlier, than Piaget allowed, which suits an
      accelerated program. Theologically, the research on habit and practice fits the Aristotelian-Thomist
      account of virtue as a habit acquired by repeated acts.

  - id: social-science-06
    title: "Moral and Social Psychology: Haidt, Obedience, Conformity and Persuasion"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16
    order: 6
    prerequisites: [social-science-03, social-science-04]
    related: [rhetoric-07, character-virtue-12, history-26, philosophy-07]
    summary: >-
      Social psychology studies how situations and groups shape what people do. The unit reads the classic
      experiments in the original papers: Asch on conformity (1956) and Milgram on obedience (1963). It then
      takes the Stanford Prison Experiment (1971) as a case study in how a famous study can fail: Le
      Texier's archival work (2019) shows that the guards were coached. Haidt's The Righteous Mind
      offers moral foundations theory and the "rider and elephant" model of intuition and reasoning.
      Cialdini's Influence catalogs the six (now seven) principles of persuasion, and the student learns
      to recognize them in advertising and politics. Throughout, the findings are set beside the classical
      account of virtue, which holds that character can resist situational pressure.
    objectives:
      - Describe the design and results of Asch's and Milgram's experiments and their later replications and critiques
      - Explain the methodological and ethical problems of the Stanford Prison Experiment, citing Le Texier (2019)
      - Summarize Haidt's six moral foundations and his claim that intuition comes first and strategic reasoning second
      - Identify Cialdini's principles of influence in five real advertisements or political appeals
      - Write an essay on the question "Does situationism refute virtue ethics?" drawing on Aristotle, Milgram and Haidt
    workload:
      readingHours: 35
      readingBasis: "1,178 pp: Haidt (493 pp) and Cialdini (590 pp) at ~38 pp/h (29 h), Asch, Milgram and Le Texier (95 pp) at ~18 pp/h (5 h)"
      work:
        - { kind: exercises, hours: 3, note: "identifying principles of influence in five real appeals" }
        - { kind: writing, hours: 8, note: "essay on whether situationism refutes virtue ethics" }
        - { kind: discussion, hours: 6, note: "weekly discussion, 12 x 30 min" }
    coreTexts:
      - title: "Studies of Independence and Conformity: I. A Minority of One Against a Unanimous Majority"
        kind: primary
