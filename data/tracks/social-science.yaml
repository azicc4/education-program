        author: Jonathan Haidt
        date: "2012"
        publicDomain: false
        links:
          - { label: Penguin Random House, url: "https://www.penguinrandomhouse.com/books/73535/the-righteous-mind-by-jonathan-haidt/" }
      - title: "Influence: The Psychology of Persuasion (new and expanded ed.)"
        kind: primary
        reader: student
        pages: 590
        author: Robert B. Cialdini
        date: "1984; 2021"
        publicDomain: false
        links:
          - { label: HarperCollins, url: "https://www.harpercollins.com/products/influence-new-and-expanded-robert-b-cialdini" }
    curriculumOptions:
      - name: "Social Psychology (Scott Plous)"
        publisher: Coursera / Wesleyan University
        tradition: secular
        url: "https://www.coursera.org/learn/social-psychology"
        notes: Free to audit; a well-produced survey including conformity, obedience, persuasion and prejudice.
      - name: "Understanding the Mysteries of Human Behavior (Mark Leary)"
        publisher: The Great Courses
        tradition: secular
        url: "https://shop.thegreatcourses.com/understanding-the-mysteries-of-human-behavior"
        notes: Lectures by a Duke social psychologist on self-control, emotion, stress, morality and group behavior.
      - name: Moral Foundations Theory (free questionnaires and readings)
        publisher: moralfoundations.org
        tradition: secular
        url: "https://moralfoundations.org/"
        notes: The student can take the Moral Foundations Questionnaire and compare results with a parent's.
    notes: >-
      Haidt writes as a secular evolutionary psychologist but treats religion as a real social good; his
      account of religion as a "hive switch" is functionalist and should be discussed. Christian readers
      will notice that his foundations of sanctity, loyalty and authority match themes of the older moral
      tradition. Milgram's and Zimbardo's films are distressing for some students. The honest lesson of the
      unit is double: situations are powerful, and the minority who resisted in Asch's and Milgram's
      experiments (and the rescuers and dissidents of the twentieth century; see history-26) show that character still matters.
      Cialdini should be read with Aristotle's Rhetoric (rhetoric-07) as the ethics of persuasion.

  - id: social-science-07
    title: "Sociology and the Social Order: Tocqueville, Durkheim, Weber, Nisbet and Putnam"
    type: course
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 7
    prerequisites: [social-science-03]
    related: [civics-law-12, civics-law-15, economics-07, philosophy-10, civics-law-01]
    summary: >-
      Sociology studies the institutions between the individual and the state: family, church, town,
      association and class. The course reads its founders and its best American heirs. Tocqueville is read
      as a sociologist of mores and associations (Democracy in America, Volume 2). Durkheim's Suicide
      (1897) is the first great statistical study of society; it links suicide rates to social integration
      and religious community. Weber's The Protestant Ethic and the Spirit of Capitalism (1905) argues that
      ideas and religion shape economic life. Nisbet's The Quest for Community (1953) argues that
      totalitarianism grows where the intermediate associations collapse. Putnam's Bowling Alone (2000) and
      Coleman's 1988 paper on social capital measure that collapse and show how family and community
      shape children's success. Berger's Invitation to Sociology serves as a humane introduction.
    objectives:
      - Master the content of an introductory sociology text and optionally sit the CLEP Introductory Sociology exam
      - Summarize Tocqueville on associations, individualism and "self-interest rightly understood" as sociological claims
      - Explain Durkheim's types of suicide and his finding on religion and social integration, and evaluate his use of statistics
      - State Weber's thesis and at least two major criticisms of it (including Catholic ones)
      - Explain Nisbet's argument about community, the state and the intermediate associations
      - Define social capital (Coleman, Putnam) and assess the evidence for its decline since 1960
      - Write a research paper on the state of one mediating institution (parish, family, lodge, local club) in your own town
    workload:
      readingHours: 70
      readingBasis: "1,849 pp: Berger and Putnam (735 pp) at ~40 pp/h (18 h), Durkheim, Weber and Tocqueville (785 pp) at ~20 pp/h (39 h), Nisbet (303 pp) at ~25 pp/h (12 h), Coleman (26 pp) (1 h)"
      work:
        - { kind: exercises, hours: 25, note: "an introductory sociology text (optionally for CLEP), about 18 weeks x 2 x 45 min" }
        - { kind: writing, hours: 20, note: "research paper on a mediating institution in the home town" }
        - { kind: discussion, hours: 10, note: "weekly discussion, 18 x 35 min" }
