    notes: >-
      Content caution: Durkheim's Suicide is a statistical study, not a sensational one, but the topic
      calls for parental awareness; the 988 Suicide and Crisis Lifeline (see social-science-08) should be
      known. Weber's thesis is disputed. Catholic historians and economists (for example, those who stress
      the commercial economies of medieval Italy and Flanders) argue that capitalism long predates
      Calvinism, while Protestant readers often find in Weber a real insight about vocation. Read both
      sides. Catholic social teaching on subsidiarity (civics-law-15, economics-07) states in normative
      terms what Nisbet, Coleman and Putnam describe empirically; this course is the cross-reference, not
      the place to teach it.

  - id: social-science-08
    title: "Personality, Mental Health and Meaning: The Big Five, Anxiety and Depression, Frankl and Christian Psychology"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 8
    prerequisites: [social-science-02, social-science-03]
    related: [theology-17, character-virtue-09, history-26]
    summary: >-
      This unit covers what an educated adult, future parent and leader should know about personality and
      mental health. The Big Five model (openness, conscientiousness, extraversion, agreeableness,
      neuroticism) is the best-supported account of personality and predicts real outcomes. The student
      learns the signs, prevalence and evidence-based treatments of anxiety and depression, the research on
      resilience, and when and how to get help for oneself or a friend. Viktor Frankl's Man's Search for
      Meaning, written by a psychiatrist who survived Auschwitz, argues that the will to meaning is basic
      to man. Christian psychologists then show how the field can be integrated with a Christian
      anthropology: Paul Vitz's critique of "selfism," the Catholic Christian Meta-Model of the Person
      from Divine Mercy University, and Conrad Baars's work on affirmation.
    objectives:
      - Describe the Big Five traits, how they are measured, and what they predict; take an IPIP-based inventory and interpret it
      - Recognize the common signs of anxiety disorders and depression, and know the first steps to getting help, including 988
      - Summarize the evidence for cognitive behavioral therapy and for exercise, sleep and social connection in mental health
      - Explain Frankl's logotherapy and his three sources of meaning (work, love, and the attitude taken to unavoidable suffering)
      - Summarize Vitz's argument that popular psychology became a "religion of the self," and assess it
      - Explain the eleven dimensions of the person in the Catholic Christian Meta-Model and how it relates to secular therapy
    workload:
      readingHours: 25
      readingBasis: "682 pp: Frankl, Vitz and Baars (449 pp) at ~35 pp/h (13 h), the Meta-Model (~233 pp) at ~20 pp/h (12 h)"
      work:
        - { kind: exercises, hours: 8, note: "Big Five inventory, signs of anxiety and depression, and the evidence on treatment" }
        - { kind: writing, hours: 5, note: "summaries of Frankl, Vitz and the Meta-Model" }
        - { kind: discussion, hours: 6, note: "weekly discussion, 12 x 30 min" }
