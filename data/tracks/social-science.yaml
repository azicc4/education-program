  - id: social-science-10
    title: "Culture and Anthropology: Dawson, Evans-Pritchard and a Critical Introduction (optional)"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 16
    ageEnd: 16.5
    order: 10
    prerequisites: [social-science-07]
    related: [history-19, history-28, theology-23]
    summary: >-
      An optional unit on culture as the anthropologist sees it. The student surveys cultural anthropology
      (kinship, ritual, exchange, fieldwork and ethnography) from a standard text, then reads three
      thinkers who studied culture from a Christian standpoint. Christopher Dawson argues that religion is
      the dynamic center of every culture. E. E. Evans-Pritchard, the Oxford anthropologist and Catholic
      convert, criticizes the Victorian theories that explained religion away. Mary Douglas, also
      Catholic, shows in Purity and Danger how the rules of clean and unclean express a whole social order,
      including a celebrated reading of Leviticus. The unit teaches the anthropologist's real virtue,
      which is to understand a people from the inside, while rejecting cultural relativism about truth
      and the good.
    objectives:
      - Define culture, ethnography, participant observation, kinship and ritual, and summarize one classic ethnography
      - Summarize Dawson's thesis that religion is the key to culture and test it against one non-Western case
      - Explain Evans-Pritchard's critique of intellectualist, emotionalist and sociological theories of religion
      - Explain Douglas's account of purity rules and her reading of the dietary laws of Leviticus
      - Distinguish methodological relativism (suspending judgment in order to understand) from moral relativism
    workload:
      readingHours: 25
      readingBasis: "567 pp: Dawson and Evans-Pritchard (374 pp) at ~25 pp/h (15 h), Douglas (193 pp) at ~20 pp/h (10 h)"
      work:
        - { kind: exercises, hours: 10, note: "cultural-anthropology chapters of the survey text and one classic ethnography" }
        - { kind: writing, hours: 4, note: "short test of Dawson's thesis on a non-Western case" }
        - { kind: discussion, hours: 5, note: "relativism and understanding from the inside, 10 x 30 min" }
    coreTexts:
      - title: Religion and the Rise of Western Culture
        kind: secondary
        reader: student
        pages: 242
        author: Christopher Dawson
        date: "1950"
        publicDomain: false
        links:
          - { label: Penguin Random House (Image), url: "https://www.penguinrandomhouse.com/books/37979/religion-and-the-rise-of-western-culture-by-christopher-dawson/" }
      - title: Theories of Primitive Religion
        kind: secondary
        reader: student
        pages: 132
        author: E. E. Evans-Pritchard
        date: "1965"
        publicDomain: false
        links:
          - { label: Oxford University Press, url: "https://global.oup.com/academic/product/theories-of-primitive-religion-9780198231318" }
      - title: "Purity and Danger: An Analysis of Concepts of Pollution and Taboo"
        kind: primary
        reader: student
        pages: 193
        author: Mary Douglas
        date: "1966"
        publicDomain: false
        links:
          - { label: Routledge, url: "https://www.routledge.com/Purity-and-Danger-An-Analysis-of-Concept-of-Pollution-and-Taboo/Douglas/p/book/9780415289955" }
    curriculumOptions:
      - name: Introduction to Anthropology (free textbook)
        publisher: OpenStax
        tradition: secular
        url: "https://openstax.org/details/books/introduction-anthropology"
        notes: A free survey of all four fields; use the cultural-anthropology chapters. Its framing is contemporary-academic, so read it critically.
      - name: "Understanding Peoples and Cultures of the World (Edward Fischer)"
        publisher: The Great Courses
        tradition: secular
        url: "https://shop.thegreatcourses.com/peoples-and-cultures-of-the-world"
        notes: Lecture survey of cultural anthropology by a Vanderbilt anthropologist, with applied examples.
    notes: >-
      This unit is optional. It suits a student headed toward diplomacy, missions, business abroad or the
      Spanish- and Chinese-language tracks. Dawson's The Making of Europe is read in history-19. This unit
      uses his more general Religion and the Rise of Western Culture (the 1948–49 Gifford Lectures). Content
      caution: ethnographies and anthropology texts describe sexual customs and initiation rites frankly,
      so preview the assigned chapters. Evans-Pritchard, Douglas and Victor Turner (another convert) are a
      notable Catholic presence in twentieth-century British anthropology and make good models for a
      Christian student.

  - id: social-science-11
    title: "College Seminar: What Can Social Science Know? (Hayek, MacIntyre, Smith and the Person)"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 11
    prerequisites: [social-science-03, social-science-07, social-science-08]
    related: [philosophy-13, natural-science-18, economics-09, character-virtue-14, logic-08]
    summary: >-
      A capstone seminar on the philosophy of the social sciences. Hayek's The Counter-Revolution of Science
      (1952) traces "scientism," the imitation of physics in the study of society, from Saint-Simon and
      Comte, and his Nobel lecture "The Pretence of Knowledge" (1974) states its practical danger. Chapter
      8 of MacIntyre's After Virtue ("The Character of Generalizations in Social Science and Their
      Lack of Predictive Power") argues that systematic unpredictability is built into human affairs and
      that social science cannot supply the expertise that modern managers claim. Christian Smith's What Is
      a Person? proposes a critical-realist, personalist foundation for sociology. Gaudium et Spes (Part I,
      chapter 1) gives the Church's account of the human person, a text Karol Wojtyła helped draft and later
      cited constantly as John Paul II. The student ends by writing his own account of what the social
      sciences can and cannot know about a free, rational and embodied person.
    objectives:
      - Explain Hayek's distinction between the methods of the natural and the social sciences, and his critique of scientism
      - Summarize MacIntyre's four sources of systematic unpredictability and his critique of managerial expertise
      - Explain Smith's personalist and critical-realist alternative to both positivism and social constructionism
      - Summarize Gaudium et Spes 12–22 on the person as image of God, conscience, freedom and death
      - Evaluate one major finding from this track in the light of these readings, naming its assumptions about human nature
      - Write a 4,000-word seminar paper, "The Uses and Limits of Social Science for a Statesman"
    workload:
      readingHours: 40
      readingBasis: "813 pp: Hayek (265 pp) at ~20 pp/h (13 h), Smith (520 pp) at ~22 pp/h (24 h), MacIntyre and Gaudium et Spes (28 pp) at ~20 pp/h (1 h)"
      work:
        - { kind: discussion, hours: 55, note: "Socratic seminar on the primary texts, 36 x 90 min" }
        - { kind: writing, hours: 30, note: "4,000-word seminar paper, from outline to final draft" }
    coreTexts:
      - title: "The Counter-Revolution of Science: Studies on the Abuse of Reason"
        kind: primary
        reader: student
        pages: 255
        author: F. A. Hayek
        date: "1952"
        publicDomain: false
        links:
          - { label: Mises Institute (free), url: "https://mises.org/library/book/counter-revolution-science" }
      - title: The Pretence of Knowledge (Nobel Prize lecture)
        kind: primary
        reader: student
        pages: 10
        author: F. A. Hayek
        date: "1974"
        publicDomain: false
        links:
          - { label: NobelPrize.org (free), url: "https://www.nobelprize.org/prizes/economic-sciences/1974/hayek/lecture/" }
      - title: "After Virtue, ch. 8: The Character of Generalizations in Social Science and Their Lack of Predictive Power"
        kind: primary
        reader: student
        pages: 20
        author: Alasdair MacIntyre
        date: "1981; 3rd ed. 2007"
        publicDomain: false
        links:
          - { label: University of Notre Dame Press, url: "https://undpress.nd.edu/9780268035044/after-virtue/" }
      - title: "What Is a Person? Rethinking Humanity, Social Life, and the Moral Good from the Person Up"
        kind: primary
        reader: student
        pages: 520
        author: Christian Smith
        date: "2010"
        publicDomain: false
        pace: long
        links:
          - { label: University of Chicago Press, url: "https://press.uchicago.edu/ucp/books/book/chicago/W/bo8697279.html" }
      - title: Gaudium et Spes, Part I, ch. 1 (The Dignity of the Human Person)
        kind: primary
        reader: student
        pages: 8
        author: Second Vatican Council
        date: "1965"
        publicDomain: false
        links:
          - { label: Vatican.va (free), url: "https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19651207_gaudium-et-spes_en.html" }
    historicalPrecedent: >-
      Hayek's essays first appeared in Economica in 1941–1944, while the planned economies of the war years
      seemed to vindicate social engineering. MacIntyre wrote chapter 8 as a former Marxist sociologist,
      against the claims to "managerial expertise" of the 1960s and 1970s.
    notes: >-
      This seminar should be run as a Socratic discussion on primary texts, as at St. John's or Thomas
      Aquinas College. No standard course exists. It overlaps philosophy-13 (MacIntyre) and economics-09
      (Hayek's "The Use of Knowledge in Society"). Read only chapter 8 of After Virtue here and leave the
      rest to those rows. Christian Smith is a Catholic sociologist at Notre Dame. A Protestant counterpart
      is C. S. Lewis's The Abolition of Man (theology-18), which makes the same argument about the
      "conditioners" who would manage human nature. Natural-science-18 covers the philosophy of the
      natural sciences; this seminar is its social-science counterpart.
