track: social-science
title: Psychology & Social Science
trackGroup: Founder Skills
description: >-
  A founder must read modern social science without being either credulous or dismissive of it. The
  track begins, before any textbook, with the classical account of human nature: Aristotle on the
  soul, Aquinas on the passions and habits, and Augustine on memory. It then follows the field as it
  actually grew, from the "mental philosophy" of the Scottish and American colleges to James and Wundt,
  and works through a standard introductory psychology course at AP and CLEP level. Research methods
  and the replication crisis come early, so that every later finding is read with its evidence in view.
  Units on judgment and bias (Kahneman and Gigerenzer), on learning and development (Piaget, Vygotsky,
  and the research behind retrieval practice and spacing), on moral and social psychology (Haidt,
  Milgram, Asch, and the Stanford Prison Experiment and its debunking), on sociology (Tocqueville,
  Durkheim, Weber, Nisbet, Putnam and Coleman), on personality and mental health (the Big Five, Frankl,
  and Catholic and Christian psychology), on media and the mind (Postman and Haidt), and on culture
  (Dawson and cultural anthropology) follow. A college seminar asks what the social sciences can and
  cannot know. The end state is a young adult who knows the real findings and methods of psychology and
  sociology, can read a study and judge its strength, and can name the philosophical assumptions of a
  theory and weigh them against a classical and Christian understanding of the person.
rows:
  - id: social-science-01
    title: "Human Nature Before Psychology: The Soul, the Passions, Habit and Memory"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 13
    ageEnd: 14
    order: 1
    prerequisites: []
    related: [philosophy-04, philosophy-08, character-virtue-09, early-development-12]
    summary: >-
      Psychology means "the account of the soul," and it had a long history before it had a laboratory.
      This unit reads short selections as a working anthropology for the rest of the track: Aristotle's
      On the Soul (the soul as the form of a living body, and its nutritive, sensitive and rational
      powers) and On Memory; Aquinas on the powers of the soul, the eleven passions, and habit as a
      "second nature"; and Augustine's meditation on the "fields and roomy chambers of memory" in
      Confessions X. The aim is a vocabulary (intellect, will, the passions, habit, memory, the
      imagination) against which each modern theory can later be tested. The philosophy track covers
      Aristotle and Aquinas as philosophers. This unit reads them as the first psychologists.
    objectives:
      - Explain Aristotle's definition of the soul and the hierarchy of vegetative, sensitive and rational powers
      - List Aquinas's eleven passions (concupiscible and irascible) and give an everyday example of each
      - Explain how habits are formed and lost according to ST I-II q.49–53, and compare with a modern account of habit
      - Summarize Augustine's account of memory and why he finds God "in" memory
      - Keep a two-week log of one's own passions and habits, classified in Thomist terms
    workload:
      readingHours: 20
      readingBasis: "292 pp: Aristotle (72 pp) at ~12 pp/h (6 h), Aquinas (175 pp) at ~15 pp/h (12 h), Augustine (45 pp) at ~20 pp/h (2 h)"
      work:
        - { kind: discussion, hours: 12, note: "narration and discussion of the readings, 24 x 30 min" }
        - { kind: writing, hours: 6, note: "short written explanations of the soul, passions and habit" }
        - { kind: project, hours: 3, note: "two-week log of passions and habits in Thomist terms" }
    coreTexts:
      - title: On the Soul (De Anima), Books II–III
        kind: primary
        reader: student
        pages: 60
        author: Aristotle
        date: "c. 350 BC"
        publicDomain: true
        links:
          - { label: Internet Classics Archive (MIT), url: "https://classics.mit.edu/Aristotle/soul.html" }
      - title: On Memory and Reminiscence
        kind: primary
        reader: student
        pages: 12
        author: Aristotle
        date: "c. 350 BC"
        publicDomain: true
        links:
          - { label: Internet Classics Archive (MIT), url: "https://classics.mit.edu/Aristotle/memory.html" }
      - title: "Summa Theologiae I q.75 and q.78 (the soul and its powers)"
        kind: primary
        reader: student
        pages: 25
        author: Thomas Aquinas
        date: "1265–1268"
        publicDomain: true
        links:
          - { label: "New Advent (I q.75)", url: "https://www.newadvent.org/summa/1075.htm" }
          - { label: "New Advent (I q.78)", url: "https://www.newadvent.org/summa/1078.htm" }
      - title: "Summa Theologiae I-II q.22ff. (the passions) and q.49ff. (habits)"
        kind: primary
        reader: student
        pages: 150
        author: Thomas Aquinas
        date: "1271"
        publicDomain: true
        links:
          - { label: "New Advent (I-II q.22)", url: "https://www.newadvent.org/summa/2022.htm" }
          - { label: "New Advent (I-II q.49)", url: "https://www.newadvent.org/summa/2049.htm" }
      - title: Confessions, Book X (memory)
        kind: primary
        reader: student
        pages: 45
        author: Augustine of Hippo
        date: "c. 400"
        publicDomain: true
        links:
          - { label: New Advent, url: "https://www.newadvent.org/fathers/110110.htm" }
          - { label: Project Gutenberg (Pusey trans.), url: "https://www.gutenberg.org/ebooks/3296" }
      - title: Thomistic Psychology
        kind: instructional
        reader: student
        pages: 401
        author: Robert E. Brennan, O.P.
        date: "1941"
        publicDomain: false
        role: reference
        links:
          - { label: Archive.org (lending library), url: "https://archive.org/details/thomisticpsychol0000robe" }
    curriculumOptions:
      - name: "Aquinas 101: The Passions of the Soul (free video lessons)"
        publisher: The Thomistic Institute
        tradition: catholic
        url: "https://aquinas101.thomisticinstitute.org/videos/the-passions-in-general"
        notes: Short lectures by Dominican friars on the passions and the powers of the soul; free with registration.
      - name: Consciousness and Its Implications (Daniel N. Robinson)
        publisher: The Great Courses
        tradition: secular
        url: "https://shop.thegreatcourses.com/consciousness-and-its-implications"
        notes: A philosopher-psychologist's history of the mind-body problem from the Greeks to neuroscience; sympathetic to Aristotle and Reid.
    historicalPrecedent: >-
      In the medieval universities Aristotle's De Anima was a set text of the arts course (it is named in
      the Paris arts-faculty statute of 1255). Every master of arts had therefore studied the powers of
      the soul before going on to theology, law or medicine.
    notes: >-
      Brennan's Thomistic Psychology (1941) is the classic attempt to set Aquinas's account beside the
      experimental psychology of its day, and is a useful teacher's reference. Protestant readers will
      find a parallel treatment of the "heart" and "affections" in Jonathan Edwards's Religious Affections.
      Keep the reading short. The full treatise on the passions belongs to theology-22 and philosophy-08.

  - id: social-science-02
    title: "Introduction to Psychology: The Science of Mind and Behavior, from James and Wundt to AP"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 2
    prerequisites: [social-science-01]
    related: [natural-science-11, biology-01, philosophy-09, rhetoric-11]
    summary: >-
      A full, college-level introductory psychology course in one year, taken at AP or CLEP level. It
      covers the biological bases of behavior, sensation and perception, learning (classical and operant
      conditioning), memory, cognition, motivation and emotion, development, personality, psychological
      disorders and treatment, and social psychology. The course is paired with the history of the field:
      the Scottish "mental philosophy" taught in American colleges, Wundt's laboratory at Leipzig (1879),
      and William James's Principles of Psychology (1890). James's chapters on habit, attention, memory
      and will are still among the best writing in psychology.
    objectives:
      - Master the content of a standard introductory text and sit the AP Psychology or CLEP Introductory Psychology exam
      - Explain classical and operant conditioning and the multi-store model of memory with experiments as evidence
      - Trace the history of psychology from Reid and the college "mental philosophy" through Wundt, James, behaviorism and the cognitive revolution
      - Read James's chapter "Habit" and compare it with Aquinas on habit (social-science-01)
      - Identify the view of the person assumed by each major school (behaviorist, psychoanalytic, humanistic, cognitive, evolutionary)
    workload:
      readingHours: 50
      readingBasis: "951 pp: James's Principles chapters (175 pp) at ~20 pp/h (9 h), Briefer Course (478 pp) at ~25 pp/h (19 h), Wundt (198 pp) at ~15 pp/h (13 h), Reid (~100 pp) at ~15 pp/h (7 h)"
      work:
        - { kind: exercises, hours: 90, note: "Psychology 2e or Myers (a 750-pp textbook, counted as lessons), 36 weeks x 3 x 50 min" }
        - { kind: writing, hours: 5, note: "James on habit compared with Aquinas" }
        - { kind: discussion, hours: 10, note: "the schools and their view of the person, 20 x 30 min" }
        - { kind: exam-prep, hours: 20, note: "AP Psychology or CLEP Introductory Psychology review and practice exams" }
    coreTexts:
      - title: "The Principles of Psychology, Vol. 1 (ch. IV Habit, IX The Stream of Thought, XI Attention, XVI Memory)"
        kind: primary
        reader: student
        pages: 175
        author: William James
        date: "1890"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/57628" }
          - { label: Classics in the History of Psychology (York Univ.), url: "https://psychclassics.yorku.ca/James/Principles/" }
      - title: "Psychology: Briefer Course"
        kind: primary
        reader: student
        pages: 478
        author: William James
        date: "1892"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/55262" }
      - title: An Introduction to Psychology
        kind: primary
        reader: student
        pages: 198
        author: Wilhelm Wundt
        date: "1911; Eng. 1912"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/46677" }
      - title: An Inquiry into the Human Mind, on the Principles of Common Sense
        kind: primary
        reader: student
        pages: 300
        author: Thomas Reid
        date: "1764"
        publicDomain: true
        role: selections
        links:
          - { label: Archive.org, url: "https://archive.org/details/b30503462" }
      - title: Psychology 2e
        kind: instructional
        reader: student
        pages: 750
        lessons: 16
        lessonLabel: chapter
        lessonsNote: "OpenStax online table of contents: 16 chapters, Introduction to Psychology to Therapy and Treatment"
        author: Rose M. Spielman et al.
        date: "2020"
        publicDomain: false
        pace: long
        links:
          - { label: OpenStax (free), url: "https://openstax.org/details/books/psychology-2e" }
    curriculumOptions:
      - name: Psychology 2e (free textbook)
        publisher: OpenStax
        tradition: secular
        url: "https://openstax.org/details/books/psychology-2e"
        notes: Free, complete introductory text that follows the standard course sequence; enough for CLEP.
      - name: "Myers' Psychology for the AP Course, 4th ed."
        publisher: BFW / Macmillan Learning
        tradition: secular
        url: "https://www.bfwpub.com/high-school/us/product/Myers-Psychology-for-the-AP-Course/p/1319281168"
        notes: The most widely used AP text, aligned to the current AP framework. Myers, a professing Christian, has also written on faith and psychology.
      - name: "Introduction to Psychology, PSYC 110 (Paul Bloom)"
        publisher: Open Yale Courses
        tradition: secular
        url: "https://oyc.yale.edu/introduction-psychology/psyc-110"
        notes: Free recorded Yale lecture course; lively and clear. Some lectures (on Freud, sex and evolution) need parental preview.
      - name: AP Psychology
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/courses/ap-psychology"
        notes: Course and exam description; five units from biological bases through mental and physical health.
      - name: CLEP Introductory Psychology
        publisher: College Board
        tradition: secular
        url: "https://clep.collegeboard.org/clep-exams/introductory-psychology"
        notes: A 90-minute exam for 3 semester hours of credit at many colleges; follows DSM-5 terminology.
      - name: Psychology classes for Catholic homeschoolers (live and recorded)
        publisher: Homeschool Connections
        tradition: catholic
        url: "https://homeschoolconnections.com/5-reasons-to-study-psychology-in-high-school/"
        notes: Online psychology classes taught from a Catholic perspective; check the current catalog for level and schedule.
    historicalPrecedent: >-
      Before "psychology" was a separate science, American colleges taught "mental" or "intellectual
      philosophy" in the senior year, in the tradition of Thomas Reid and the Scottish common-sense school
      that Witherspoon brought to Princeton. Thomas Upham's Elements of Mental Philosophy (1831) was
      abridged "for academies and high schools"; Noah Porter taught The Elements of Intellectual Science at
      Yale; and James McCosh's Psychology: The Cognitive Powers (1886) was the Princeton text. William James,
      trained in this tradition and in German physiology, turned it into an experimental science.
    sources:
      - { label: "SEP: Scottish Philosophy in the 18th Century", url: "https://plato.stanford.edu/entries/scottish-18th/" }
      - { label: "SEP: Thomas Reid", url: "https://plato.stanford.edu/entries/reid/" }
      - { label: "Upham, Elements of Mental Philosophy, abridged for academies and high schools (Archive.org)", url: "https://archive.org/details/elementsofmental00uph" }
      - { label: "Porter, The Elements of Intellectual Science (Archive.org)", url: "https://archive.org/details/elementsofintell00portuoft" }
      - { label: "McCosh, Psychology: The Cognitive Powers (Archive.org)", url: "https://archive.org/details/psychologycognit00mccorich" }
    notes: >-
      Content cautions: standard texts treat sexuality, sexual orientation and gender under development
      and motivation, and treat human origins in evolutionary terms. Parents should preview those chapters
      and discuss them from Catholic teaching (Catechism 2331–2400) or their own tradition. Freud should be
      read critically; Paul Vitz's Sigmund Freud's Christian Unconscious and Psychology as Religion (see
      social-science-08) give a Christian critique. The textbooks' methodological naturalism is a working
      method, not a proof that there is no soul. Say so explicitly, and return to it in social-science-11.

  - id: social-science-03
    title: "How to Read a Study: Research Methods, Statistics and the Replication Crisis"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 14.5
    ageEnd: 15.5
    order: 3
    prerequisites: [social-science-02]
    related: [mathematics-16, logic-02, natural-science-18, logic-08]
    summary: >-
      Before reading any more findings, the student learns how findings are made and how they fail. The
      unit covers experimental and correlational designs, random assignment and sampling, operational
      definitions, validity and reliability, confounds, effect sizes, p-values and confidence intervals,
      meta-analysis, and preregistration. It then reads the replication crisis in its primary sources:
      Ioannidis's "Why Most Published Research Findings Are False" (2005); "False-Positive Psychology"
      (2011) on "researcher degrees of freedom"; and the Open Science Collaboration's 2015 attempt to
      replicate 100 psychology studies, which reproduced significant results in only about a third to
      a half, depending on the criterion. The student ends by dissecting real studies and press reports
      of them.
    objectives:
      - Distinguish experiment, quasi-experiment, correlational study and case study, and what each can show
      - Explain why correlation does not establish causation, with confounding, reverse causation and selection effects
      - State correctly what a p-value is and is not, following the ASA's 2016 statement
      - Explain p-hacking, publication bias, small samples and low statistical power, and how preregistration addresses them
      - Summarize the main findings of Open Science Collaboration (2015) and Ioannidis (2005)
      - Write a one-page critical appraisal of a published study and of a news article that reports it
    workload:
      readingHours: 16
      readingBasis: "533 pp: four papers (30 pp) at ~15 pp/h (2 h), Huff (142 pp) at ~35 pp/h (4 h), Ritchie (361 pp) at ~35 pp/h (10 h)"
      work:
        - { kind: exercises, hours: 25, note: "research-methods lessons from an open text (about 20 h) and dissecting real studies (5 h)" }
        - { kind: writing, hours: 6, note: "critical appraisal of a study and of the news article on it" }
        - { kind: discussion, hours: 6, note: "weekly discussion, 12 x 30 min" }
    coreTexts:
      - title: Why Most Published Research Findings Are False
        kind: primary
        reader: student
        pages: 6
        author: John P. A. Ioannidis
        date: "2005"
        publicDomain: false
        links:
          - { label: PLOS Medicine (open access), url: "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0020124" }
      - title: Estimating the Reproducibility of Psychological Science
        kind: primary
        reader: student
        pages: 8
        author: Open Science Collaboration
        date: "2015"
        publicDomain: false
        links:
          - { label: Science (DOI), url: "https://doi.org/10.1126/science.aac4716" }
          - { label: OSF project (data and materials), url: "https://osf.io/ezcuj/" }
      - title: "False-Positive Psychology: Undisclosed Flexibility in Data Collection and Analysis Allows Presenting Anything as Significant"
        kind: primary
        reader: student
        pages: 11
        author: Joseph P. Simmons, Leif D. Nelson and Uri Simonsohn
        date: "2011"
        publicDomain: false
        links:
          - { label: Psychological Science (DOI), url: "https://doi.org/10.1177/0956797611417632" }
      - title: "The ASA Statement on p-Values: Context, Process, and Purpose"
        kind: primary
        reader: student
        pages: 5
        author: Ronald L. Wasserstein and Nicole A. Lazar
        date: "2016"
        publicDomain: false
        links:
          - { label: The American Statistician (DOI), url: "https://doi.org/10.1080/00031305.2016.1154108" }
      - title: How to Lie with Statistics
        kind: primary
        reader: student
        pages: 142
        author: Darrell Huff
        date: "1954"
        publicDomain: false
        links:
          - { label: W. W. Norton, url: "https://wwnorton.com/books/How-to-Lie-with-Statistics" }
      - title: "Science Fictions: How Fraud, Bias, Negligence, and Hype Undermine the Search for Truth"
        kind: primary
        reader: student
        pages: 361
        author: Stuart Ritchie
        date: "2020"
        publicDomain: false
        links:
          - { label: Macmillan, url: "https://us.macmillan.com/books/9781250222695/sciencefictions" }
    curriculumOptions:
      - name: Research Methods in Psychology, 4th ed. (free open textbook)
        publisher: Kwantlen Polytechnic University (Pressbooks)
        tradition: secular
        url: "https://kpu.pressbooks.pub/psychmethods4e/"
        notes: A clear, free first course in psychological research design, including the replication crisis.
      - name: "Improving Your Statistical Inferences (Daniël Lakens)"
        publisher: Coursera / Eindhoven University of Technology
        tradition: secular
        url: "https://www.coursera.org/learn/statistical-inferences"
        notes: Free to audit; the best short course on p-values, effect sizes, power and open science. For strong 15–16-year-olds after mathematics-16.
      - name: "Meaning from Data: Statistics Made Clear (Michael Starbird)"
        publisher: The Great Courses
        tradition: secular
        url: "https://shop.thegreatcourses.com/meaning-from-data-statistics-made-clear"
        notes: A gentler lecture review of the statistics needed to read studies.
    notes: >-
      This unit depends on mathematics-16 (probability and statistics). It sets the habit for the rest of
      the track: for every finding, ask how large the effect is, how it was measured, whether it has
      replicated, and what else could explain it. Knowing the limits of a science is part of taking it
      seriously. This is not skepticism about science in general, and the student should also learn which
      findings have held up well (for example, the testing effect in social-science-05).

  - id: social-science-04
    title: "Judgment and Decision: Heuristics, Biases and Their Critics (Kahneman and Gigerenzer)"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 15.5
    order: 4
    prerequisites: [social-science-02, social-science-03]
    related: [logic-02, mathematics-16, economics-10, rhetoric-07]
    summary: >-
      Cognitive psychology's most influential program for a statesman or businessman is the study of
      judgment under uncertainty. The student reads Tversky and Kahneman's 1974 paper in Science and large
      parts of Kahneman's Thinking, Fast and Slow: the two "systems," anchoring, availability,
      representativeness, base-rate neglect, overconfidence, loss aversion and framing. He then reads
      Gigerenzer's reply: simple heuristics are often "ecologically rational" and beat complex models in
      real environments, and many "biases" disappear when risks are stated as natural frequencies. The
      unit also reads Kahneman's own admission that the priming studies in his chapter 4 had not
      replicated.
    objectives:
      - Define and illustrate anchoring, availability, representativeness, base-rate neglect, framing and loss aversion
      - Solve base-rate problems (e.g. a medical screening test) in both probability and natural-frequency formats
      - State Gigerenzer's critique of the heuristics-and-biases program and assess where each side is strongest
      - Identify which findings in Thinking, Fast and Slow have replicated well and which have not
      - Compare the modern account of bias with the classical account of prudence, and of how passion clouds judgment
      - Keep a decision journal with predictions and confidence levels, and score it after three months
    workload:
      readingHours: 16
      readingBasis: "506 pp: Tversky and Kahneman (8 pp) at ~15 pp/h, Thinking, Fast and Slow (~176 pp) at ~30 pp/h (6 h), Gigerenzer (322 pp) at ~35 pp/h (9 h)"
      work:
        - { kind: exercises, hours: 6, note: "base-rate problems in probability and natural-frequency formats" }
        - { kind: project, hours: 5, note: "decision journal for three months, scored at the end" }
        - { kind: discussion, hours: 6, note: "Kahneman against Gigerenzer, and bias and prudence, 12 x 30 min" }
    coreTexts:
      - title: "Judgment under Uncertainty: Heuristics and Biases"
        kind: primary
        reader: student
        pages: 8
        author: Amos Tversky and Daniel Kahneman
        date: "1974"
        publicDomain: false
        order: 1
        links:
          - { label: Science (DOI), url: "https://doi.org/10.1126/science.185.4157.1124" }
      - title: Thinking, Fast and Slow
        kind: primary
        reader: student
        pages: 528
        author: Daniel Kahneman
        date: "2011"
        publicDomain: false
        order: 1
        role: selections
        portion: "Parts I–III and V in full; skim Part IV"
        links:
          - { label: Farrar, Straus and Giroux (Macmillan), url: "https://us.macmillan.com/books/9780374533557/thinkingfastandslow" }
      - title: "Risk Savvy: How to Make Good Decisions"
        kind: primary
        reader: student
        pages: 322
        author: Gerd Gigerenzer
        date: "2014"
        publicDomain: false
        order: 2
        links:
          - { label: Penguin Random House, url: "https://www.penguinrandomhouse.com/books/309675/risk-savvy-by-gerd-gigerenzer/" }
    curriculumOptions:
      - name: "Mindware: Critical Thinking for the Information Age (Richard Nisbett)"
        publisher: Coursera / University of Michigan
        tradition: secular
        url: "https://www.coursera.org/learn/mindware"
        notes: Free to audit; statistical, causal and cost-benefit reasoning from a leading social psychologist.
      - name: "Your Deceptive Mind: A Scientific Guide to Critical Thinking Skills (Steven Novella)"
        publisher: The Great Courses
        tradition: secular
        url: "https://shop.thegreatcourses.com/your-deceptive-mind-a-scientific-guide-to-critical-thinking-skills"
        notes: Lectures on perception, memory, bias and fallacies. Novella is a prominent scientific skeptic, and his asides on religion reflect that stance.
      - name: Harding Center for Risk Literacy (free fact boxes and tools)
        publisher: Harding Center, University of Potsdam
        tradition: secular
        url: "https://www.hardingcenter.de/en"
        notes: Gigerenzer's center; free "fact boxes" that show medical risks in natural frequencies, ideal for practice.
    sources:
      - { label: "Nature (2012): Nobel laureate challenges psychologists to clean up their act", url: "https://www.nature.com/articles/nature.2012.11535" }
    notes: >-
      Thinking, Fast and Slow is long, so assign Parts I–III and V in full and skim Part IV. Chapter 4
      ("The Associative Machine") relies on behavioral-priming studies that have largely failed to
      replicate. Read it as a case study for social-science-03. Kahneman acknowledged the problem in his 2012
      open letter and in later public comments. The unit pairs naturally with logic-02 on fallacies, since
      the fallacies catalog errors of argument and the bias literature catalogs errors of intuition.

  - id: social-science-05
    title: "How Children Learn: Developmental and Educational Psychology"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 5
    prerequisites: [social-science-02, social-science-03]
    related: [early-development-12, early-development-20, grammar-composition-07, philosophy-11]
    summary: >-
      The student studies the science behind his own education. First come the classic theories of
      development: Piaget's stages and Vygotsky's "zone of proximal development" and scaffolding, with
      their later critics, together with Erikson and attachment research. Then comes the best-supported
      research in learning: retrieval practice (the testing effect), spacing, interleaving, worked
      examples, and the role of background knowledge, from Make It Stick, Willingham and the 2013 review
      by Dunlosky and colleagues. Ericsson's research on deliberate practice follows, with the
      meta-analysis that qualifies it. The student sees why recitation, memory work, narration and the
      commonplace book work, and designs his own study system.
    objectives:
      - Summarize Piaget's four stages and Vygotsky's zone of proximal development, and state one major criticism of each
      - Rank common study techniques by strength of evidence, following Dunlosky et al. (2013)
      - Explain retrieval practice, spacing and interleaving, and why re-reading and highlighting feel effective but are weak
      - Explain deliberate practice and assess how much of expert performance it accounts for (Macnamara et al., 2014)
      - Relate the research to classical methods (recitation, memoria, narration, copywork) and to William James's Talks to Teachers
      - Design, run and evaluate a spaced-retrieval study plan for one subject for a whole term
    workload:
      readingHours: 60
