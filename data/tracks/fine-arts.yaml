track: fine-arts
title: Fine Arts
trackGroup: Arts & Body
description: >-
  Training the eye and the hand, and learning to love the beautiful. Franklin's 1749 plan for an American
  academy joined "a fair Hand" to "Drawing, by Imitation of Prints, and some of the first Principles of
  Perspective," and Locke recommended drawing as "a thing very useful to a gentleman." The track runs on
  two strands. The practical strand moves from picture study and free drawing to nature journaling,
  penmanship and calligraphy, observational drawing, watercolor, perspective, modeling and sculpture, and
  the academic rigor of the Bargue plates and cast drawing (6–16). Saturday studio and field units carry
  it further: sketching from life, the formal book hands, botanical and natural-history illustration, the
  measured drawing of real buildings, and manuscript illumination and gilding (12–17.5). The historical
  strand studies art and architecture through primary works and writers: Vasari, Ruskin, Vitruvius and
  Palladio, the classical orders, and a college survey of Western art, architecture and sacred art
  (12–18). The end state is a graduate who draws accurately from life and in perspective, writes a
  beautiful hand and a formal book hand, paints competently in watercolor, can gild and illuminate a page,
  can measure and draw a building, can identify and explain the major works, styles and orders, and can
  argue, with Vitruvius and Ruskin, what makes a building or painting good.
rows:
  - id: fine-arts-01
    title: "Picture Study and First Drawing"
    type: course
    level: early-5
    stage: formal
    ageStart: 6
    ageEnd: 8
    order: 1
    prerequisites: []
    related: [early-development-13]
    summary: >-
      This is Charlotte Mason's "picture study": look at one great painting at a time, closely and in silence,
      then describe it from memory. Six works by one artist each term, so the child comes to know
      Giotto, Fra Angelico, Raphael, Rembrandt, Millet and others as friends. Alongside this, daily free
      drawing and a first structured method for seeing basic shapes.
    objectives:
      - Study 18 or more masterworks a year (six per artist per term) and narrate each from memory
      - Recognize the works studied by title and artist
      - Draw daily from observation and imagination, using the five basic "elements of shape" (dot, circle, straight, curved and angle lines)
      - Handle crayons, colored pencils and watercolor crayons with control
    workload:
      readingHours: 0
      work:
        - { kind: discussion, hours: 18, note: "picture study: silent looking and narration from memory, 18+ works a year, 72 wk x 15 min" }
        - { kind: practice, hours: 60, note: "free and shape-based drawing (Monart), ~4 sessions x 12–15 min a week x 72 wk" }
    curriculumOptions:
      - name: Art Cards and Posters (by grade)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/art-cards-posters/"
        notes: Graded sets of masterwork prints for picture study.
      - name: "Drawing with Children (Mona Brookes)"
        publisher: TarcherPerigee
        tradition: secular
        url: "https://www.barnesandnoble.com/w/drawing-with-children-mona-brookes/1102804393?ean=9780874778274"
        notes: "The Monart method: shape-based observational drawing for 4-year-olds up to adults."
      - name: ARTistic Pursuits
        publisher: ARTistic Pursuits
        url: "https://www.artisticpursuits.com/"
        notes: Christian homeschool art program combining art history, technique and picture study by grade.
    historicalPrecedent: >-
      Charlotte Mason's PNEU schools (from 1891) made picture study a weekly subject from age six. Comenius's
      Orbis Pictus (1658) had already made pictures the child's first textbook.
    sources:
      - { label: "Mason, Home Education (Project Gutenberg)", url: "https://www.gutenberg.org/ebooks/71087" }

  - id: fine-arts-02
    title: "Nature Journaling"
    type: course
    level: early-5
    stage: formal
    day: saturday
    ageStart: 7
    ageEnd: 12
    order: 2
    prerequisites: [fine-arts-01]
    related: [natural-science-04, natural-science-06, early-development-19]
    summary: >-
      The nature journal joins art and science. The student looks closely, draws what is actually there, labels
      it, and records date, place and weather. Weekly outings (Charlotte Mason's "nature walk") give
      subjects: leaves, birds, insects, clouds, seasonal change. The journal becomes a record of observation
      over years and trains the patience and accuracy needed for the drawing courses later in this track.
    objectives:
      - Make a dated nature-journal entry at least weekly, with drawing, labels and notes (what I see, what I wonder, what it reminds me of)
      - Draw 100 or more local species over five years, with growing accuracy of proportion and detail
      - Use colored pencil and then watercolor for field sketches
      - Use the Handbook of Nature-Study to research each specimen
    workload:
      readingHours: 0
      work:
        - { kind: practice, hours: 90, note: "weekly nature-journal entry with drawing, labels and notes, 180 wk x 30 min" }
        - { kind: exercises, hours: 35, note: "technique lessons from Leslie and Laws, colored pencil then field watercolor (~27 x 45 min), plus researching ~100 species in the Handbook of Nature-Study (100 x 10 min)" }
    coreTexts:
      - title: Handbook of Nature-Study
        kind: instructional
        reader: teacher
        pages: 938
        role: reference
        author: Anna Botsford Comstock
        date: "1911"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/78142" }
    curriculumOptions:
      - name: "Keeping a Nature Journal (3rd ed.), Clare Walker Leslie"
        publisher: Storey Publishing
        tradition: secular
        url: "https://www.barnesandnoble.com/w/keeping-a-nature-journal-3rd-edition-clare-walker-leslie/1137253912?ean=9781635862287"
        notes: The classic month-by-month guide for families.
      - name: "The Laws Guide to Nature Drawing and Journaling (John Muir Laws)"
        publisher: Heyday Books
        tradition: secular
        url: "https://heydaybooks.com/catalog/the-laws-guide-to-nature-drawing-and-journaling/"
        notes: Excellent technique book on birds, plants, landscapes and field watercolor. Suited to 10 and up. Free videos at johnmuirlaws.com.
    historicalPrecedent: >-
      Comstock's Handbook (1911) grew from the Cornell nature-study movement, which put field observation and
      drawing into American schools. Jefferson's weather and garden books, and the Lewis and Clark journals,
      are founding-era models.

  - id: fine-arts-03
    title: "Penmanship to Calligraphy"
    type: course
    level: early-5
    stage: formal
    day: saturday
    ageStart: 7
    ageEnd: 13
    order: 3
    prerequisites: [fine-arts-01]
    related: [grammar-composition-01, character-virtue-04, practical-arts-07]
    summary: >-
      Handwriting is the most used fine art. After print and cursive are secure in the grammar track, the
      student develops a beautiful and fast hand. That means a practical italic or cursive for daily use, and
      then the historical scripts as calligraphy: Roman capitals, uncial, Carolingian minuscule, blackletter,
      the English round hand of Bickham's Universal Penman, and American Spencerian. Copywork from
      Scripture, poetry and the Rules of Civility joins this row to the character and literature tracks.
    objectives:
      - Write a fluent, legible cursive or italic hand at speed for everyday use by 10
      - Learn broad-edge calligraphy with 3 or more historical hands (Roman capitals, Carolingian, italic)
      - Learn pointed-pen copperplate or Spencerian from the historical copybooks
      - Letter and illuminate a finished piece (a psalm, poem or the Declaration's preamble)
    workload:
      readingHours: 0
      work:
        - { kind: practice, hours: 140, note: "copywork and calligraphy, 6 yr x 36 wk x ~2 x 20 min: an everyday italic or cursive, then broad-edge hands and pointed-pen copperplate or Spencerian from the Bickham and Spencer copybooks" }
        - { kind: project, hours: 10, note: "a lettered and illuminated finished piece (psalm, poem or the Declaration's preamble)" }
    coreTexts:
      - title: The Universal Penman
        kind: instructional
        reader: student
        pages: 212
        author: George Bickham
        date: "1743"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/bim_eighteenth-century_the-universal-penman-en_bickham-george_1743" }
      - title: Theory of Spencerian Penmanship
        kind: instructional
        reader: teacher
        pages: 60
        lessons: 8
        lessonLabel: section
        lessonsNote: "Archive.org scan contents: 8 sections, Introductory Remarks, Signals, Position, Movements, Forms, Capitals, Spacing, Shading"
        author: Spencerian authors (H. C. Spencer)
        date: "1874"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/TheoryOfSpencerianPenmanship" }
    curriculumOptions:
      - name: Aesop Cursive Copybook Set (and other MP copybooks)
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/penmanship/aesop-cursive-copybook-set/"
        notes: Copybook practice with classic texts, the bridge from cursive to a finished hand.
    historicalPrecedent: >-
      Franklin, Proposals Relating to the Education of Youth in Pensilvania (1749): "All should be taught to
      write a fair Hand, and swift, as that is useful to All." Washington copied his Rules of Civility as
      penmanship practice. Spencerian script was the standard American hand from about 1850 to 1925.
    sources:
      - { label: "Franklin, Proposals Relating to the Education of Youth in Pensilvania (1749), Penn Archives", url: "https://archives.upenn.edu/digitized-resources/docs-pubs/franklin-proposals/" }
    notes: >-
      The Getty-Dubay italic course (Portland State) is a widely used italic option, but no purchase
      link has been verified.

  - id: fine-arts-04
    title: "Drawing Fundamentals: Seeing, Line, Proportion and Value"
    type: course
    level: early-5
    stage: formal
    ageStart: 9
    ageEnd: 12
    order: 4
    prerequisites: [fine-arts-01]
    related: []
    summary: >-
      This is systematic observational drawing: contour and blind-contour, negative space, sighting and
      measuring proportion, light and shadow (value), and texture. Betty Edwards's exercises teach students
      to draw what they see rather than what they "know," and Ruskin's Elements of Drawing (written as
      letters to beginners) trains patient, faithful looking.
    objectives:
      - Complete the core exercises of Drawing on the Right Side of the Brain (contour, negative space, sighting, value, self-portrait)
      - Work through Ruskin's first letter exercises (graded tones, shading a stone, drawing leaves and branches)
      - Draw still life, interiors and portraits from life with correct proportion and a full value range
      - Keep a sketchbook with daily drawing
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 30, note: "the core Edwards exercises (~20 x 1 h) and Ruskin's first-letter exercises (~10 x 1 h); the 397 pp of Edwards and Ruskin are teacher instruction, not counted as reading" }
        - { kind: practice, hours: 110, note: "daily sketchbook, ~4 x 10 min a week x 108 wk (72 h), and ~50 sessions x 45 min of still life, interiors and portraits from life (38 h)" }
    coreTexts:
      - title: The Elements of Drawing, in Three Letters to Beginners
        kind: instructional
        reader: teacher
        pages: 230
        role: selections
        portion: "the first letter's exercises (graded tones, shading a stone, drawing leaves and branches)"
        author: John Ruskin
        date: "1857"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/30325" }
      - title: Drawing on the Right Side of the Brain (4th ed.)
        kind: instructional
        reader: teacher
        pages: 320
        lessons: 12
        lessonLabel: chapter
        lessonsNote: "Library catalog contents, 4th ed.: 12 chapters, Drawing and the Art of Bicycle Riding to Drawing on the Artist in You"
        pace: long
        author: Betty Edwards
        date: "1979 (4th ed. 2012)"
        publicDomain: false
        links:
          - { label: Barnes & Noble, url: "https://www.barnesandnoble.com/w/drawing-on-the-right-side-of-the-brain-betty-edwards/1110791142?ean=9781585429202" }
    curriculumOptions:
      - name: Drawing on the Right Side of the Brain (Edwards)
        publisher: TarcherPerigee
        tradition: secular
        url: "https://www.barnesandnoble.com/w/drawing-on-the-right-side-of-the-brain-betty-edwards/1110791142?ean=9781585429202"
        notes: Best-selling observational drawing course. Its brain-hemisphere theory is dated, but the exercises work.
      - name: Creating Art
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/art-and-music/creating-art/"
        notes: Color theory, basic technique and early art history, with quizzes.
    historicalPrecedent: >-
      Locke (Thoughts §161): once a boy writes well, he should "improve the use of it farther in drawing; a
      thing very useful to a gentleman in several occasions, but especially if he travel."
    sources:
      - { label: "Locke, Some Thoughts Concerning Education §161 (Archive.org)", url: "https://archive.org/details/somethoughtsconc00lockuoft" }

  - id: fine-arts-05
    title: "Watercolor and Color"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 13
    order: 5
    prerequisites: [fine-arts-04]
    related: []
    summary: >-
      Watercolor is portable, cheap and demanding, the traditional medium of travelers, naturalists and
      architects. The student learns washes, wet-in-wet, glazing, color mixing from a limited palette, and
      the color wheel, then paints landscapes and botanical studies from life. Ruskin's third letter, on color
      and composition, and Cennini's medieval handbook give the historical grounding.
    objectives:
      - Lay flat and graded washes and use wet-in-wet and glazing deliberately
      - Mix any observed color from a limited palette of three primaries plus earth colors
      - Complete 20 or more finished studies from life (landscape, botanical, architectural)
      - Read Ruskin's Letter III and selections of Cennini on pigments and procedure
    workload:
      readingHours: 13
      readingBasis: "200 pp read together (Ruskin's Letter III and Cennini on pigments and procedure) at ~15 pp/h"
      work:
        - { kind: exercises, hours: 17, note: "washes, wet-in-wet, glazing, the color wheel and limited-palette mixing, ~25 x 40 min" }
        - { kind: practice, hours: 30, note: "20 or more finished studies from life x ~1.5 h" }
      electiveHours: 32
      electiveBasis: "~27 further practice sessions x 45 min (~20 h), longer finished studies (~10 h) and longer technique exercises (~2 h)"
    coreTexts:
      - title: The Elements of Drawing (Letter III, On Colour and Composition)
        kind: instructional
        reader: teacher
        pages: 90
        role: selections
        portion: "Letter III, On Colour and Composition"
        readPages: 90
        author: John Ruskin
        date: "1857"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/30325" }
      - title: "The Book of the Art of Cennino Cennini (trans. Christiana Herringham)"
        kind: primary
        reader: teacher
        pages: 330
        role: selections
        portion: "on pigments and procedure"
        author: Cennino Cennini
        date: "c. 1400 (trans. 1899)"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/bookofartofcenni00cennuoft" }
    curriculumOptions:
