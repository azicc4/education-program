  - id: fine-arts-10
    title: "Classical Drawing: The Bargue Plates and Cast Drawing"
    type: course
    level: 9-12
    stage: formal
    elective: true
    electiveNote: >-
      For serious draftsmen; drawing fundamentals remain core.
    ageStart: 13
    ageEnd: 16
    order: 10
    prerequisites: [fine-arts-04, fine-arts-07]
    related: []
    summary: >-
      This is the academic method of the 19th-century ateliers. The student copies the Bargue lithographs
      (1866–1871) from outline to fully modeled value, then draws plaster casts of classical sculpture under
      controlled light, and finally the figure from life. This is the most rigorous training in accuracy and
      value available, and it is the foundation of today's atelier revival. Van Gogh taught himself from these plates.
    objectives:
      - Complete 10 or more Bargue plate copies at sight-size, from block-in to finished value
      - Complete 2 or more long cast drawings (for example a classical head or foot) in graphite or charcoal
      - Draw the figure from life in short and long poses if a supervised studio is available
      - Understand sight-size and comparative measurement methods
    workload:
      readingHours: 0
      work:
        - { kind: practice, hours: 200, note: "10 Bargue plate copies at sight-size x ~12 h (120 h), 2 long cast drawings x ~30 h (60 h), and figure drawing if a supervised studio is available (~20 h)" }
        - { kind: exercises, hours: 10, note: "sight-size and comparative measurement from Aristides (144 pp, an instruction book, not counted as reading)" }
    coreTexts:
      - title: "Exercices au fusain (Cours de dessin), 60 plates"
        kind: instructional
        reader: student
        pace: long
        author: Charles Bargue
        date: "1871"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/exercices-au-fusain-pour-preparer-a-letude-de-lacademie-dapres-nature-60-planches" }
      - title: Classical Drawing Atelier
        kind: instructional
        reader: student
        pages: 144
        author: Juliette Aristides
        date: "2006"
        publicDomain: false
        links:
          - { label: Barnes & Noble, url: "https://www.barnesandnoble.com/w/classical-drawing-atelier-juliette-aristides/1111612296?ean=9780823006571" }
    curriculumOptions:
      - name: "Charles Bargue Drawing Course (ed. Gerald Ackerman)"
        publisher: ACR Édition
        tradition: classical
        url: "https://www.acr-edition.com/"
        notes: The standard modern reproduction of all 197 plates with commentary. The link is the publisher's home page, because the product page has not been verified.
      - name: Classical Drawing Atelier (Aristides)
        publisher: Watson-Guptill
        tradition: secular
        url: "https://www.barnesandnoble.com/w/classical-drawing-atelier-juliette-aristides/1111612296?ean=9780823006571"
        notes: Atelier-method book with Bargue-style exercises and master drawings.
    historicalPrecedent: >-
      Bargue's Cours de dessin, produced with Jean-Léon Gérôme for Goupil & Cie (1866–1871), was used in French
      academies and ateliers. Van Gogh copied the whole set in 1880–1881 while teaching himself to draw.

  - id: fine-arts-11
    title: "College: History of Art, Architecture and Sacred Art"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 11
    prerequisites: [fine-arts-08, fine-arts-06]
    related: [philosophy-14, theology-20]
    summary: >-
      A college survey and seminar on the Western tradition of art and architecture from the Parthenon to
      the 20th century, read through its own theorists and critics: Vitruvius, Vasari, Ruskin's Stones of
      Venice and The Two Paths, Cennini, and the Church's teaching on beauty and sacred art (John Paul II's
      Letter to Artists and Benedict XVI's address to artists in the Sistine Chapel). Museum study in person
      and a research paper complete it.
    objectives:
      - Trace architecture from the Greek temple through Roman, Romanesque, Gothic, Renaissance, Baroque and Neoclassical to modernism, and argue its merits and losses
      - Read "The Nature of Gothic" (Stones of Venice II.6) and The Two Paths, and assess Ruskin's claim that art expresses a society's moral life
      - Read John Paul II's Letter to Artists and Benedict XVI's 2009 address on the "way of beauty"
      - Write a 3,000-word research paper on a building or artwork studied in person
    workload:
      readingHours: 16
      readingBasis: "345 pp: Stones of Venice I selections 100 pp at ~20 pp/h (5 h), The Two Paths 217 pp at ~22 pp/h (10 h), John Paul II and Benedict XVI 28 pp (1 h)"
      work:
        - { kind: discussion, hours: 22, note: "survey lectures and seminar from the Parthenon to modernism, 30 wk x 45 min" }
        - { kind: project, hours: 8, note: "museum study in person, ~3 visits x 2.5 h" }
        - { kind: writing, hours: 15, note: "a 3,000-word research paper on a building or artwork studied in person: research, draft and one revision" }
      electiveHours: 69
      electiveBasis: "the rest of The Stones of Venice, Vol. 1 (~300 pp, ~14 h), a longer weekly seminar (~38 h), two further museum visits (~7 h) and a fuller research-and-revision cycle for the paper (~10 h)"
    coreTexts:
