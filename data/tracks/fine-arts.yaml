      - name: ARTistic Pursuits (upper-grade books)
        publisher: ARTistic Pursuits
        url: "https://www.artisticpursuits.com/"
        notes: Christian publisher. Graded media instruction including watercolor.

  - id: fine-arts-06
    title: "Perspective and the Geometry of Seeing"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 13
    order: 6
    prerequisites: [fine-arts-04]
    related: [mathematics-10]
    summary: >-
      Linear perspective, rediscovered by Brunelleschi and codified by Alberti and Leonardo, is geometry
      applied to seeing. The student learns one-, two- and three-point perspective, the horizon line and
      vanishing points, ellipses and cylinders, cast shadows and reflections, and then draws buildings and
      interiors from life. Read Leonardo's notes on perspective and light.
    objectives:
      - Construct one-, two- and three-point perspective drawings of boxes, rooms and streets
      - Draw circles in perspective (ellipses), arches and stairs correctly
      - Project cast shadows from sun and point light sources
      - Draw a building from life in accurate two-point perspective
    workload:
      readingHours: 7
      readingBasis: "100 pp of Leonardo's notebooks on perspective, light and shade at ~15 pp/h; Norling is a workbook counted as exercises"
      work:
        - { kind: exercises, hours: 15, note: "Norling's constructions: one-, two- and three-point perspective, ellipses, arches, stairs and cast shadows, 20 steps x ~45 min" }
        - { kind: practice, hours: 8, note: "drawing buildings and interiors from life in perspective, ~8 x 1 h" }
      electiveHours: 14
      electiveBasis: "~12 further construction sessions (~10 h) and ~4 further drawings from life (~4 h)"
    coreTexts:
      - title: Perspective Made Easy
        kind: instructional
        reader: student
        pages: 210
        lessons: 20
        lessonLabel: lesson
        lessonsNote: "Archive.org scan table of contents: Step One to Step Twenty, each with problems"
        author: Ernest R. Norling
        date: "1939"
        publicDomain: false
        links:
          - { label: Dover Publications, url: "https://store.doverpublications.com/products/9780486404738" }
      - title: The Notebooks of Leonardo da Vinci (Part II, Linear Perspective; Part III, Light and Shade)
        kind: primary
        reader: student
        pages: 100
        role: selections
        portion: "Part II, Linear Perspective; Part III, Light and Shade"
        readPages: 100
        author: Leonardo da Vinci (trans. J. P. Richter)
        date: "c. 1490–1519 (trans. 1888)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/5000" }
    historicalPrecedent: >-
      Franklin's 1749 Proposals called for "some of the first Principles of Perspective" alongside drawing
      "by Imitation of Prints."
    sources:
      - { label: "Franklin, Proposals Relating to the Education of Youth in Pensilvania (1749)", url: "https://archives.upenn.edu/digitized-resources/docs-pubs/franklin-proposals/" }

  - id: fine-arts-07
    title: "Sculpture and Modeling"
    type: course
    level: 6-8
    stage: formal
    day: saturday
    ageStart: 12
    ageEnd: 16
    order: 7
    prerequisites: [fine-arts-04]
    related: []
    summary: >-
      Drawing is two-dimensional. Sculpture teaches the student to think in form and volume. Model in clay
      from life (reliefs, then heads and figures, following the academic method of Édouard Lanteri, who taught
      modeling in London), try carving in soap, wood or soft stone, and read Cellini's lively
      Autobiography for a Renaissance sculptor's world. Cast drawing later in the track builds on this work.
    objectives:
      - Model a relief (a leaf or rosette, then a copy of a classical relief) in clay
      - Model a portrait head from life at about half scale using Lanteri's measured method
      - Complete a small carving in wood or stone
      - Read Cellini's Autobiography (selections) and describe the lost-wax casting of the Perseus
    workload:
      readingHours: 8
      readingBasis: "~153 pp of Cellini's Autobiography (Symonds) at ~20 pp/h; Lanteri is the teacher's manual and has no page count"
      work:
        - { kind: practice, hours: 30, note: "clay modeling sessions from life, ~30 x 1 h" }
        - { kind: project, hours: 45, note: "a leaf or rosette relief and a classical relief copy (~10 h), a half-scale portrait head by Lanteri's measured method (~25 h), and a small wood or stone carving (~10 h)" }
    coreTexts:
      - title: "Modelling: A Guide for Teachers and Students, Vol. I"
        kind: instructional
        reader: teacher
        author: Édouard Lanteri
        date: "1902"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/modellingguidefo01lantuoft" }
      - title: The Autobiography of Benvenuto Cellini (trans. J. A. Symonds)
        kind: primary
        reader: student
        pages: 460
        role: selections
        portion: "including the lost-wax casting of the Perseus"
        author: Benvenuto Cellini
        date: "c. 1558–1563"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/4028" }
    notes: >-
      Cellini's Autobiography contains violence and immoral episodes. Assign selections or read it at 14 or older.

  - id: fine-arts-08
    title: "Art History I: Primary Sources, from Vasari to Ruskin"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 15
    order: 8
    prerequisites: [fine-arts-01]
    related: []
    summary: >-
      Study art history as the history track does history, from primary sources. Read Vasari's Lives (Giotto,
      Brunelleschi, Masaccio, Leonardo, Raphael, Michelangelo) as the founding text of the discipline, and
      Ruskin's Modern Painters and Stones of Venice as its great Victorian criticism. A good survey (Gombrich)
      supplies the chronology, and picture study continues at a more analytical level.
    objectives:
      - Read 10 or more of Vasari's Lives, including the prefaces, and explain Vasari's idea of the "rebirth" of the arts
      - Read selections of Ruskin (Modern Painters I on truth to nature, "The Nature of Gothic")
      - Place 100 or more major works in period, style and context, from ancient Greece to the 19th century
      - Write formal analyses of works seen in person at a museum
    workload:
      readingHours: 40
      readingBasis: "~1,080 pp: Vasari's prefaces and 10 Lives (no page count listed; ~250 pp in de Vere) at ~20 pp/h (12 h), Ruskin ~140 pp at ~15 pp/h (9 h), Gombrich 688 pp (heavily illustrated) at ~35 pp/h (20 h)"
      work:
        - { kind: discussion, hours: 35, note: "analytical picture study and discussion of the readings, 108 wk x 20 min" }
        - { kind: exercises, hours: 25, note: "survey lessons and art-card drill placing 100+ works in period and style, ~50 x 30 min" }
        - { kind: writing, hours: 18, note: "~6 museum visits, each with a written formal analysis, 6 x 3 h" }
    coreTexts:
      - title: "Lives of the Most Eminent Painters, Sculptors and Architects, Vol. 1 (trans. de Vere)"
        kind: primary
        reader: student
        role: selections
        portion: "the prefaces and 10 or more Lives (Giotto, Brunelleschi, Masaccio, Leonardo, Raphael, Michelangelo)"
        author: Giorgio Vasari
        date: "1550/1568 (trans. 1912)"
        publicDomain: true
        links:
          - { label: Project Gutenberg (Vol. 1), url: "https://www.gutenberg.org/ebooks/25326" }
          - { label: Project Gutenberg (Vol. 2), url: "https://www.gutenberg.org/ebooks/25759" }
      - title: Modern Painters, Vol. 1
        kind: primary
        reader: student
        pages: 420
        role: selections
        portion: "on truth to nature"
        author: John Ruskin
        date: "1843"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/29907" }
      - title: The Story of Art
        kind: secondary
        reader: student
        pages: 688
        pace: long
        author: E. H. Gombrich
        date: "1950 (16th ed.)"
        publicDomain: false
        links:
          - { label: Phaidon, url: "https://www.phaidon.com/store/art/the-story-of-art-9780714832470/" }
