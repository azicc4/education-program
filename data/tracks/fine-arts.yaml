  - id: fine-arts-13
    title: "Botanical and Natural-History Illustration"
    type: course
    level: 9-12
    stage: formal
    day: saturday
    ageStart: 14.75
    ageEnd: 16.75
    order: 13
    prerequisites: [fine-arts-02, fine-arts-05]
    related: [natural-science-06, natural-science-09, biology-01]
    summary: >-
      The nature journal records what was seen. The scientific plate shows what a species is, so that
      another person can identify it. The student draws plants from life at measured scale, dissects
      flowers and fruits with a hand lens, and renders form in graphite tone. He then paints in watercolor
      by layered washes, matching each color to the living specimen. Insects and birds follow, drawn from
      specimens, museum skins and the feeder. The models are the great illustrated natural histories:
      Merian's insects of Surinam, Catesby's Carolina, and Audubon's Birds of America.
    objectives:
      - Measure a specimen with dividers and draw it at life size, with correct proportion, venation and leaf arrangement
      - Dissect and draw a flower and a fruit with a hand lens, labeling the parts in botanical Latin
      - Render form in graphite with a full value range, then in layered watercolor matched to the specimen
      - Draw an insect and a bird from specimens or life with correct anatomy and proportion
      - Complete four finished plates in the manner of a scientific illustration
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 25, note: "the course in the Eden Project book: pencil tone, shapes in nature, dissection and bisection, perspective of leaves and flowers, color mixing and watercolor application, ~25 x 1 h (an instruction book, not counted as reading)" }
        - { kind: practice, hours: 40, note: "studies from life of plants, insects and birds (garden, field, museum skins and specimens), ~40 x 1 h" }
        - { kind: project, hours: 20, note: "four finished plates x ~5 h: a flowering plant with dissections, a fruit or seed, an insect with its food plant after Merian, and a bird" }
