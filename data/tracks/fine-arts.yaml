        publisher: Heyday Books
        tradition: secular
        url: "https://heydaybooks.com/catalog/the-laws-guide-to-nature-drawing-and-journaling/"
        notes: Field watercolor technique, continuing the nature-journal strand.
      - name: ARTistic Pursuits (upper-grade books)
        publisher: ARTistic Pursuits
        url: "https://www.artisticpursuits.com/"
        notes: Christian publisher. Graded media instruction including watercolor.

  - id: fine-arts-06
    title: "Perspective and the Geometry of Seeing"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 12
    ageEnd: 12.25
    order: 6
    prerequisites: [fine-arts-04]
    related: [mathematics-10]
    summary: >-
      Linear perspective, rediscovered by Brunelleschi and codified by Alberti and Leonardo, is geometry
      applied to seeing. The student learns one-, two- and three-point perspective, the horizon line and
      vanishing points, ellipses and cylinders, cast shadows and reflections, and then draws buildings and
      interiors from life. Read Leonardo's notes on perspective and light.
    objectives:
      - Construct one-, two- and three-point perspective drawings of boxes, rooms and streets
      - Draw circles in perspective (ellipses), arches and stairs correctly
      - Project cast shadows from sun and point light sources
      - Draw a building from life in accurate two-point perspective
    workload:
      readingHours: 7
      readingBasis: "100 pp of Leonardo's notebooks on perspective, light and shade at ~15 pp/h; Norling is a workbook counted as exercises"
      work:
        - { kind: exercises, hours: 15, note: "Norling's constructions: one-, two- and three-point perspective, ellipses, arches, stairs and cast shadows, 20 steps x ~45 min" }
        - { kind: practice, hours: 8, note: "drawing buildings and interiors from life in perspective, ~8 x 1 h" }
      electiveHours: 14
      electiveBasis: "~12 further construction sessions (~10 h) and ~4 further drawings from life (~4 h)"
    coreTexts:
      - title: Perspective Made Easy
        kind: instructional
        reader: student
        pages: 210
        lessons: 20
        lessonLabel: lesson
        lessonsNote: "Archive.org scan table of contents: Step One to Step Twenty, each with problems"
        author: Ernest R. Norling
        date: "1939"
        publicDomain: false
        links:
          - { label: Dover Publications, url: "https://store.doverpublications.com/products/9780486404738" }
      - title: The Notebooks of Leonardo da Vinci (Part II, Linear Perspective; Part III, Light and Shade)
        kind: primary
        reader: student
        pages: 100
        role: selections
        portion: "Part II, Linear Perspective; Part III, Light and Shade"
        readPages: 100
        author: Leonardo da Vinci (trans. J. P. Richter)
        date: "c. 1490–1519 (trans. 1888)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/5000" }
    historicalPrecedent: >-
      Franklin's 1749 Proposals called for "some of the first Principles of Perspective" alongside drawing
      "by Imitation of Prints."
    sources:
      - { label: "Franklin, Proposals Relating to the Education of Youth in Pensilvania (1749)", url: "https://archives.upenn.edu/digitized-resources/docs-pubs/franklin-proposals/" }

  - id: fine-arts-12
    title: "Sketching from Life: Field and Town"
    type: course
    level: 6-8
    stage: formal
    day: saturday
    ageStart: 12
    ageEnd: 15
    order: 7
    prerequisites: [fine-arts-04, fine-arts-05]
    related: [practical-arts-09]
    summary: >-
      The studio teaches accuracy. The sketch teaches speed, choice and the habit of drawing whatever is in
      front of the eye. On Saturday outings the student draws in the field and in town: landscapes, trees
      and skies, streets, market squares, churches and people at work. He uses pencil, then pen and ink,
      then pen and wash. Ruskin's second letter, "Sketching from Nature," teaches him to seize the leading
      lines when the whole cannot be drawn. A pocket sketchbook goes everywhere, and by fifteen it is a
      habit.
    objectives:
      - Fill a pocket sketchbook from life each term, with dated and placed entries
      - Make quick figure studies (gesture drawings of 1 to 5 minutes) of people walking, working and at rest
      - Draw a landscape and a street scene on location in pencil, pen and ink, and pen and wash
      - Use thumbnails and a three-value plan to choose and compose a view before drawing it
      - Read Ruskin's Letter II and apply its rule of the leading lines to trees, hills and clouds
    workload:
      readingHours: 3
      readingBasis: "Ruskin's Letter II, 41 pp at ~15 pp/h"
      work:
        - { kind: exercises, hours: 10, note: "technique lessons: gesture drawing, thumbnails and value plans, pen hatching from Guptill, and laying a wash over ink, ~15 x 40 min" }
        - { kind: practice, hours: 60, note: "Saturday sketching outings in the field and in town, ~40 outings x 1.5 h over three years" }
        - { kind: project, hours: 8, note: "a finished sketchbook of one place (a town, a farm or a park) through the seasons: ~12 pen-and-wash views and figure studies, with notes" }
    coreTexts:
      - title: "The Elements of Drawing (Letter II, Sketching from Nature)"
        kind: instructional
        reader: student
        pages: 230
        role: selections
        portion: "Letter II, Sketching from Nature"
        readPages: 41
        author: John Ruskin
        date: "1857"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/30325" }
      - title: Rendering in Pen and Ink (60th anniversary ed.)
        kind: instructional
        reader: teacher
        pages: 256
        role: reference
        author: Arthur L. Guptill
        date: "1997 (60th anniversary ed.)"
        publicDomain: false
        links:
          - { label: Barnes & Noble, url: "https://www.barnesandnoble.com/w/rendering-in-pen-and-ink-arthur-l-guptill/1111619432?ean=9780823045297" }
    curriculumOptions:
      - name: "The Art of Urban Sketching (Gabriel Campanario)"
        publisher: Quarry Books
        tradition: secular
        url: "https://www.quarto.com/books/9781592537259/Art-of-Urban-Sketching"
        notes: Location drawings from more than 50 cities, with each artist's tools and methods. A source of models and ideas, not a graded course.
      - name: Urban Sketchers (local chapters and sketchwalks)
        publisher: Urban Sketchers
        tradition: secular
        url: "https://urbansketchers.org/"
        notes: Free group sketchwalks in many cities. Suitable for a parent and student together.
      - name: The Laws Guide to Nature Drawing and Journaling (landscape chapters)
        publisher: Heyday Books
        tradition: secular
        url: "https://heydaybooks.com/catalog/the-laws-guide-to-nature-drawing-and-journaling/"
        notes: Continues the nature-journal strand into landscape and field sketching.
    historicalPrecedent: >-
      Turner left 309 sketchbooks, from about 1789 to 1845, many of them filled on tour. West Point
      trained its cadets in topographical drawing and sketching. Seth Eastman, a graduate, taught drawing
      there from 1833 and in 1837 published a Treatise on Topographical Drawing. Ruskin wrote The Elements
      of Drawing (1857) for beginners who wanted to sketch from nature.
    sources:
      - { label: "Tate: Cataloguing the Turner Bequest", url: "https://www.tate.org.uk/visit/tate-britain/display/jmw-turner/cataloguing-turner-bequest" }
      - { label: "MNopedia: Eastman, Seth (1808–1875)", url: "https://www.mnhs.org/mnopedia/search/index/person/eastman-seth-1808-1875" }
      - { label: "Eastman, Treatise on Topographical Drawing (1837), Archive.org", url: "https://archive.org/details/treatiseontopog01eastgoog" }
    notes: >-
      Figure studies are of clothed people in public places. Sketching on private property needs the
      owner's permission.

  - id: fine-arts-07
    title: "Sculpture and Modeling"
    type: course
    level: 6-8
    stage: formal
    day: saturday
    ageStart: 12
    ageEnd: 16
    order: 8
    prerequisites: [fine-arts-04]
    related: []
    summary: >-
      Drawing is two-dimensional. Sculpture teaches the student to think in form and volume. Model in clay
      from life (reliefs, then heads and figures, following the academic method of Édouard Lanteri, who taught
      modeling in London), try carving in soap, wood or soft stone, and read Cellini's lively
      Autobiography for a Renaissance sculptor's world. Cast drawing later in the track builds on this work.
    objectives:
      - Model a relief (a leaf or rosette, then a copy of a classical relief) in clay
      - Model a portrait head from life at about half scale using Lanteri's measured method
      - Complete a small carving in wood or stone
      - Read Cellini's Autobiography (selections) and describe the lost-wax casting of the Perseus
    workload:
      readingHours: 8
      readingBasis: "~153 pp of Cellini's Autobiography (Symonds) at ~20 pp/h; Lanteri is the teacher's manual and has no page count"
      work:
        - { kind: practice, hours: 30, note: "clay modeling sessions from life, ~30 x 1 h" }
        - { kind: project, hours: 45, note: "a leaf or rosette relief and a classical relief copy (~10 h), a half-scale portrait head by Lanteri's measured method (~25 h), and a small wood or stone carving (~10 h)" }
    coreTexts:
      - title: "Modelling: A Guide for Teachers and Students, Vol. I"
        kind: instructional
        reader: teacher
        author: Édouard Lanteri
        date: "1902"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/modellingguidefo01lantuoft" }
      - title: The Autobiography of Benvenuto Cellini (trans. J. A. Symonds)
        kind: primary
        reader: student
        pages: 460
        role: selections
        portion: "including the lost-wax casting of the Perseus"
        author: Benvenuto Cellini
        date: "c. 1558–1563"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/4028" }
    notes: >-
      Cellini's Autobiography contains violence and immoral episodes. Assign selections or read it at 14 or older.

  - id: fine-arts-08
    title: "Art History I: Primary Sources, from Vasari to Ruskin"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 15
    order: 9
    prerequisites: [fine-arts-01]
    related: []
    summary: >-
      Study art history as the history track does history, from primary sources. Read Vasari's Lives (Giotto,
      Brunelleschi, Masaccio, Leonardo, Raphael, Michelangelo) as the founding text of the discipline, and
      Ruskin's Modern Painters and Stones of Venice as its great Victorian criticism. A good survey (Gombrich)
      supplies the chronology, and picture study continues at a more analytical level.
    objectives:
