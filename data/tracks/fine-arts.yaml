        url: "https://www.memoriapress.com/curriculum/art-and-music/a-classical-history-of-art-set/"
        notes: For review or if the high-school survey was skipped.
    notes: >-
      Catholic and Protestant note: Catholic teaching treats sacred images and beauty as a path to God (the
      via pulchritudinis), following the Second Council of Nicaea (787). The Reformed tradition was more
      cautious about images in worship, which is one reason Protestant architecture and painting took
      different forms, for example the Dutch Golden Age turn to landscape and genre painting. Both deserve study.
