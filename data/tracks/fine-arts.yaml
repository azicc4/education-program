  - id: fine-arts-14
    title: "Formal Book Hands: Foundational, Uncial, Italic and Gothic"
    type: course
    level: 9-12
    stage: formal
    day: saturday
    ageStart: 13
    ageEnd: 15.5
    order: 10
    prerequisites: [fine-arts-03]
    related: [practical-arts-07, history-11, history-19]
    summary: >-
      Penmanship to Calligraphy gave a first taste of the historical scripts. This course takes four of
      them to a finished standard with the broad-edged pen: Edward Johnston's Foundational hand, the
      Uncial of the early Gospel books, the Renaissance Italic, and Gothic textura (blackletter). The
      student learns each hand from its pen angle, letter height in nib-widths, ductus (the order and
      direction of strokes) and spacing, then copies a page of a real manuscript. He rules and plans
      pages as a medieval scribe did, and ends by writing and sewing a small manuscript book.
    objectives:
      - Cut a quill or reed pen and set up a sloped writing board, as Johnston teaches
      - Write the Foundational, Uncial, Italic and Gothic textura hands, capitals and minuscules, at a consistent pen angle and x-height
      - Copy a page of a historical model in each hand and explain how the script developed
      - Plan, rule and write a sheet of prose and a sheet of poetry, with margins and line spacing set by rule
      - Write and sew a small manuscript book (a psalm, a canticle or a short cycle of poems)
    workload:
      readingHours: 12
      readingBasis: "Johnston's Chapters I–VI and XIV–XV, ~180 pp at ~15 pp/h; Waters is a workbook counted as exercises"
      work:
        - { kind: exercises, hours: 30, note: "pen ladders, letter families and alphabet sheets in four hands from Waters and Johnston, ~45 x 40 min" }
        - { kind: practice, hours: 30, note: "copying a page of a historical model in each hand and writing text pages, ~30 x 1 h" }
        - { kind: project, hours: 15, note: "a small manuscript book: planning and ruling (~3 h), writing ~12 pages (~9 h), rubrics and sewing (~3 h)" }
