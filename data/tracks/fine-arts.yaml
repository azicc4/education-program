    historicalPrecedent: >-
      Medieval book hands were taught in monastic scriptoria. The Lindisfarne Gospels (c. 700) were
      probably written by Eadfrith, bishop of Lindisfarne, who is named as scribe in a tenth-century
      colophon. Edward Johnston revived the broad-edged pen by studying manuscripts in the British Museum.
      He taught lettering at the Central School of Arts and Crafts from 1899 to 1912 and at the Royal
      College of Art from 1901, and his Writing & Illuminating, & Lettering (1906) became the
      textbook of the modern revival.
    sources:
