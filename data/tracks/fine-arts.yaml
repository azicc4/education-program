  - id: fine-arts-09
    title: "Architecture and the Classical Orders: Vitruvius and Palladio"
    type: course
    level: 9-12
    stage: formal
    elective: true
    electiveNote: >-
      Architecture is core in practical-arts-15 (Jefferson's Palladio).
    ageStart: 13
    ageEnd: 16
    order: 9
    prerequisites: [fine-arts-06]
    related: [mathematics-10, civics-law-04, practical-arts-15]
    summary: >-
      Vitruvius's three requirements of good building (firmitas, utilitas, venustas: soundness, usefulness,
      beauty) and his account of the orders are the grammar of Western architecture. Learn to draw
      the Tuscan, Doric, Ionic, Corinthian and Composite orders from their modules. Read Palladio's Four
      Books, which Jefferson used to design Monticello and the University of Virginia, and study the
      classical buildings of the American founding (the Virginia Capitol, the U.S. Capitol, the White House).
    objectives:
      - Read Vitruvius Books I, III and IV and explain the orders, proportion and symmetry
      - Measure and draw the five orders in correct proportion from Palladio's plates
      - Analyze a Palladian villa and Jefferson's Monticello or Rotunda
      - Design and draw (plan, elevation, section) a small classical building
    workload:
      readingHours: 14
      readingBasis: "~220 pp: Vitruvius Books I, III and IV ~110 pp at ~15 pp/h (7 h), Palladio's Four Books (no page count listed; ~110 pp of Ware's text besides the plates) at ~15 pp/h (7 h)"
      work:
        - { kind: exercises, hours: 20, note: "measuring and drawing the five orders from Palladio's modules, 5 x 3 h, plus proportion exercises (~5 h)" }
        - { kind: project, hours: 25, note: "plan, elevation and section of a small classical building" }
