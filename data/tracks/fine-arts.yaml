  - id: fine-arts-16
    title: "Measured Drawing: Surveying and Drawing Real Buildings"
    type: course
    level: 9-12
    stage: formal
    day: saturday
    ageStart: 15
    ageEnd: 17
    order: 14
    prerequisites: [fine-arts-09, fine-arts-06]
    related: [practical-arts-15, practical-arts-09, mathematics-15]
    summary: >-
      Palladio learned architecture by measuring the ruins of Rome, and every classical architect since has
      learned it the same way. The student first constructs the five orders with compass and rule from
      Ware's American Vignola: the module, the moldings, entasis and the Ionic volute. Then he goes out to
      a real building, such as a church, a courthouse, a farmhouse or a colonial house. He sketches it,
      measures it with tape, rod and level, and records every dimension in field notes. At the board he
      draws the plan, elevations, a section and full-size profiles of the moldings, to scale and in ink,
      following the conventions of the Historic American Buildings Survey.
    objectives:
      - Construct the Tuscan, Doric, Ionic, Corinthian and Composite orders from the module with compass and rule, including the Ionic volute
      - Take running and overall dimensions with tape and rod, and triangulate to check that a plan closes
      - Record molding profiles with a contour gauge and draw them full size
      - Draw a measured plan, two elevations and a section of a real building to scale, inked and lettered with a title block
      - Compare the building's proportions with the orders and with Palladio's and Vitruvius's rules
    workload:
      readingHours: 0
      work:
        - { kind: exercises, hours: 25, note: "the five orders constructed from Ware's plates, 5 x 3 h, and moldings, entasis and the Ionic volute, ~10 x 1 h (Ware is a plate book, not counted as reading)" }
        - { kind: practice, hours: 20, note: "measuring and drawing details in the field (doorways, cornices, windows, molding profiles), ~10 sessions x 2 h" }
        - { kind: project, hours: 50, note: "a measured survey of one building: field sketches and dimensions, ~4 days x 5 h, then plan, two elevations and a section inked to scale, ~30 h" }
    coreTexts:
      - title: "The American Vignola, Part I: The Five Orders"
        kind: instructional
        reader: student
        pace: long
        author: William R. Ware
        date: "1903"
        publicDomain: true
        links:
          - { label: Archive.org, url: "https://archive.org/details/americanvignola01wareuoft" }
      - title: "Measured Drawings of Some Colonial and Georgian Houses, Vols. 1–2"
        kind: primary
        reader: student
        role: reference
        author: Donald Millar
        date: "1916"
        publicDomain: true
        links:
          - { label: "Archive.org (Vol. 1)", url: "https://archive.org/details/measureddrawings01mill" }
          - { label: "Archive.org (Vol. 2)", url: "https://archive.org/details/measureddrawings02mill" }
      - title: The Classical Orders of Architecture (2nd ed.)
        kind: instructional
        reader: teacher
        pages: 228
        role: reference
        author: Robert Chitham
        date: "1985 (2nd ed. 2005)"
        publicDomain: false
        links:
          - { label: Routledge, url: "https://www.routledge.com/The-Classical-Orders-of-Architecture/Chitham/p/book/9780750661249" }
    curriculumOptions:
      - name: "The Classical Orders of Architecture (Robert Chitham)"
        publisher: Routledge
        tradition: classical
        url: "https://www.routledge.com/The-Classical-Orders-of-Architecture/Chitham/p/book/9780750661249"
        notes: Modern drawings of the orders with proportions in both 100-part and 96-part systems, and in metric and imperial units.
      - name: Institute of Classical Architecture & Art (drawing courses)
        publisher: ICAA
        tradition: classical
        url: "https://www.classicist.org/"
        notes: Courses in drawing the orders, architectural rendering and classical design, online and in person.
    historicalPrecedent: >-
      Palladio's Book IV (1570) publishes his own measured drawings of the temples of ancient Rome.
      Antoine Desgodetz, sent to Rome by Colbert, measured its ancient buildings (Les édifices antiques de
      Rome, 1682), and Stuart and Revett measured Athens (The Antiquities of Athens, 1762). In America, the
      Historic American Buildings Survey, begun in 1933, sent architects to measure and draw the nation's
      buildings. Its drawings, now at the Library of Congress, remain the model for student work.
    sources:
      - { label: "NPS: About the Historic American Buildings Survey", url: "https://www.nps.gov/subjects/heritagedocumentation/habs.htm" }
      - { label: "Desgodetz, Les édifices antiques de Rome (1779 ed.), Archive.org", url: "https://archive.org/details/lesedificesantiq0000desg" }
      - { label: "Stuart and Revett, The Antiquities of Athens (1858 ed.), Archive.org", url: "https://archive.org/details/antiquitiesofath00stua" }
    notes: >-
      Jefferson's Palladio (practical-arts-15) makes a measured drawing of one room. This course surveys
      a whole building. Ask the
      owner's permission before measuring, and work in pairs on ladders and roofs. A local historical
      society can suggest a building that has never been recorded.

  - id: fine-arts-15
    title: "Manuscript Illumination and Gilding"
    type: course
    level: 9-12
    stage: formal
    day: saturday
    ageStart: 15.5
    ageEnd: 17.5
    order: 15
    prerequisites: [fine-arts-14, fine-arts-05]
    related: [history-19, theology-16, theology-20]
    summary: >-
      Illumination is the art of lighting a written page with gold and color. The student learns it from
      the medieval recipe books and from Johnston, who revived it. He prepares raised gesso and lays and
      burnishes gold leaf. He mixes egg tempera and gouache from pigments and paints in flat layers with
      fine outlines. He copies decorated initials and borders from three traditions: the interlace and
      knotwork of the Book of Kells and the Lindisfarne Gospels, and the ivy-leaf borders and miniatures of
      the French Books of Hours. The course ends with an illuminated page of the student's own design.
    objectives:
      - Lay raised gesso and flat gold, burnish gold leaf, and correct faults in the gilding
      - Mix egg tempera and gouache, and paint flat color, modeled color and white-line highlights with a fine brush
      - Copy an interlace initial from the Book of Kells or the Lindisfarne Gospels and a border from a Book of Hours
      - Explain Johnston's three kinds of illumination (colour-work, pen-work and limner's) and identify them in the facsimiles
      - Design and complete an illuminated page with a written text, a raised-gold initial and a painted border
    workload:
      readingHours: 16
      readingBasis: "~245 pp at ~15 pp/h: Johnston's Chapters VII–XIII (125 pp), Thompson on pigments and metals (~80 pp) and Cennini on gesso and gilding (~40 pp)"
      work:
        - { kind: exercises, hours: 20, note: "materials and methods: gesso, gold leaf and burnishing, egg tempera and gouache, ~20 x 1 h" }
        - { kind: practice, hours: 30, note: "copies of decorated initials and border sections from Kells, Lindisfarne and a Book of Hours, ~15 studies x 2 h" }
        - { kind: project, hours: 25, note: "an illuminated page: design (~4 h), writing the text in a book hand (~6 h), gilding (~5 h) and painting the initial and border (~10 h)" }
