    historicalPrecedent: >-
      The Lindisfarne Gospels (c. 700) and the Book of Kells (c. 800) were written and painted in
      monastic scriptoria. The twelfth-century monk Theophilus and the painter Cennino Cennini (c. 1400)
      wrote down the recipes for gesso, gold and pigments that illuminators used. Johnston's 1906 book,
      with Graily Hewitt's appendix on gilding, revived raised gilding in the modern Arts and Crafts movement.
    sources:
