    summary: >-
      These are the great manuals of the interior life. The Imitation of Christ, perhaps the most
      widely read Christian devotional book after the Bible, teaches detachment and love of Christ. Francis de
      Sales's Introduction to the Devout Life shows holiness in lay life. Teresa of Ávila's
      Interior Castle maps the ascent of prayer. Thérèse of
      Lisieux's Story of a Soul teaches the "little way".
    objectives:
      - Read the Imitation Books I–II and keep a notebook of maxims
      - Follow de Sales's method of meditation for a month and write a reflection
      - Describe Teresa's seven mansions of the Interior Castle
      - Explain Thérèse's "little way" and why she was made a Doctor of the Church
