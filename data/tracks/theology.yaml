  - id: theology-16
    title: "The Church Fathers & Monastic Classics"
    type: course
    level: 9-12
    stage: formal
    ageStart: 13.5
    ageEnd: 14.5
    order: 16
    prerequisites: [theology-14]
    related: [philosophy-08, chinese-10]
    summary: >-
      The student reads the early Church in its own words. The Apostolic Fathers (Clement,
      Ignatius of Antioch, Polycarp, the Didache) show the faith of the generation after the
      apostles. Augustine's Confessions, the first great autobiography, tells of a restless heart
      finding rest in God. The Rule of St. Benedict shows the ordered life of prayer and work that
      preserved Western civilization.
    objectives:
      - Identify in the Apostolic Fathers early witness to the Eucharist, the episcopate and Roman primacy
      - Read Confessions I–IX in full, and X–XIII in selection
      - Explain Augustine's account of evil as privation and of the restless heart
      - Summarize the Rule of St. Benedict on obedience, humility, prayer and work, and design a personal rule of life
