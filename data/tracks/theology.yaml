        date: "2006"
        publicDomain: false
        links:
          - { label: HarperCollins, url: "https://www.harpercollins.ca/9780618680009/the-god-delusion/" }
      - title: "The Last Superstition: A Refutation of the New Atheism (elective, response)"
        author: Edward Feser
        date: "2008"
        publicDomain: false
        links:
          - { label: "St. Augustine's Press", url: "https://www.staugustine.net/our-books/books/the-last-superstition/" }
      - title: "Atheist Delusions: The Christian Revolution and Its Fashionable Enemies (elective, response)"
        author: David Bentley Hart
        date: "2009"
        publicDomain: false
        links:
          - { label: Yale University Press, url: "https://yalebooks.yale.edu/book/9780300164299/atheist-delusions/" }
