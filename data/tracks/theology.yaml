  - id: theology-19
    title: "Comparative Theology: The Protestant Classics Read with Charity"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 19
    prerequisites: [theology-13, theology-15]
    related: [philosophy-12]
    summary: >-
      The founders' America was overwhelmingly Protestant, and a statesman must understand its
      theology from the inside. The student reads the Westminster Shorter Catechism (1647)
      alongside the Baltimore Catechism, selections from Calvin's Institutes (Book I on the
      knowledge of God, Book III on faith and justification), several of John Wesley's standard
      sermons, and Bonhoeffer's Cost of Discipleship on "cheap" and "costly" grace. He also reads
      Pascal's Pensées, the work of a Catholic layman close to the Jansenist movement.
    objectives:
      - Compare the Westminster Shorter and Baltimore Catechisms answer by answer on God, man, sin, grace, sacraments and the Church
      - Summarize Calvin on the knowledge of God and self, and on justification by faith
      - Explain Wesley's teaching on assurance and Christian perfection
      - Explain Bonhoeffer's distinction between cheap and costly grace and relate it to his martyrdom
      - State Pascal's wager and his "reasons of the heart", and note where Jansenism diverged from Catholic teaching
      - Write a comparative essay that states each side in terms its own adherents would accept
    coreTexts:
      - title: The Westminster Shorter Catechism
