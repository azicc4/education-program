        publisher: Memoria Press (distributor)
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/logic-and-rhetoric/handbook-christian-apologetics/"
        notes: The earlier "mere Christian" edition, without the Catholic chapters. Used in Memoria's apologetics course.
      - name: "C.S. Lewis on Christianity (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/c-s-lewis-on-christianity"
        notes: A seven-lecture course tracing Lewis's path from skeptic to believer and his major apologetic works.
    notes: >-
      Lewis was an Anglican who deliberately avoided disputed questions ("mere" Christianity).
      Karl Adam's reputation is complicated by his early accommodation with National Socialism
      in 1933, which he later abandoned. Read his book for its theology and note the history
      honestly. The God Delusion is read critically, at the end of the course or up to 15, as the
      strongest popular statement of the opponent's case: the student summarizes Dawkins fairly
      (especially his "Ultimate Boeing 747" argument), then answers him from Kreeft and Tacelli,
      Feser's The Last Superstition (Aristotelian-Thomist philosophy: the Five Ways are not a
      "God of the gaps") and Hart's Atheist Delusions (the history the New Atheists get wrong).
      Feser writes polemically and with some sharp language; a parent should preview it.

  - id: theology-15
    title: "Scripture III: The Whole Canon, Covenant by Covenant"
