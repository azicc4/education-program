      Three great converts and men of letters defend the faith against modern unbelief. Newman's
      Apologia Pro Vita Sua is the history of his religious opinions from Anglicanism to Rome.
      Chesterton's Orthodoxy and The Everlasting Man argue with paradox and history. Lewis's
      Screwtape Letters and The Great Divorce are imaginative works on temptation and on heaven and
      hell, and The Abolition of Man defends objective value and natural law in education.
    objectives:
