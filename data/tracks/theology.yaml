    curriculumOptions:
      - name: "Calvin's Institutes (Books I–IV) and A Study Guide to Calvin's Institutes"
        publisher: Canon Press
        tradition: protestant
        url: "https://canonpress.com/products/a-study-guide-to-calvins-institutes"
        notes: A Reformed publisher's guide, useful for hearing Calvin read sympathetically by his heirs.
      - name: "Theology 101: The Western Theological Tradition (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/theology-101"
        notes: A survey of the Western theological tradition from a Protestant-founded, nondenominational college.
    historicalPrecedent: >-
      Colonial New England children memorized the Westminster Shorter Catechism, printed in the
      New England Primer. The colonial colleges (Harvard, Yale, Princeton) were founded largely to
      train Reformed ministers, and Witherspoon, a Presbyterian minister, signed the Declaration.
    notes: >-
      The aim is understanding, not controversy. Read each author as his own tradition reads him.
      Neutral notes: Calvin's doctrine of predestination and of the Eucharist differs from both
      Catholic and Lutheran teaching; Wesley was an Anglican priest whose followers became the
      Methodists; Bonhoeffer was a Lutheran pastor executed by the Nazis in 1945. Pascal remained
      a Catholic, and his Pensées are admired by Catholics and Protestants alike, though several
      Jansenist propositions associated with his Port-Royal friends were condemned by Rome.

  - id: theology-20
    title: "Liturgy, Moral Theology & Catholic Social Teaching"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15
    ageEnd: 16
    order: 20
    prerequisites: [theology-13]
    related: [philosophy-10, civics-law-15, economics-07]
    summary: >-
      The course has three parts. Liturgy: Guardini's and Ratzinger's Spirit of the Liturgy and
      Vatican II's Sacrosanctum Concilium on worship as the Church's summit and source. Moral
      theology: the virtues, natural law, conscience and the moral act, from Aquinas through
      Veritatis Splendor. Catholic social teaching: the encyclical tradition from Rerum Novarum
      (1891) on labor and property, through Quadragesimo Anno (subsidiarity), to Centesimus Annus
      (the free economy within a moral and juridical framework). The statesman needs all three.
    objectives:
      - Explain the Mass as sacrifice and as the "source and summit" of Christian life
      - Define natural law and the principle of double effect, and apply them to cases
      - State the principles of CST (human dignity, common good, subsidiarity, solidarity, private property)
      - Compare Catholic social teaching with the American founding's view of property and limited government
      - Write a policy memo on a current issue using the Compendium of the Social Doctrine
