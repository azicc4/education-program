track: theology
title: Theology & Scripture
trackGroup: Faith & Philosophy
description: >-
  This track is the spine of the program's formation of the whole person. It is Catholic at its
  core and reads the great Protestant classics with charity. From birth to about 6 the family
  forms faith by practice: daily prayer, the liturgical year, Bible and saints' stories, and the
  Catechesis of the Good Shepherd. Formal study begins with a catechism sequence (St. Joseph First
  Communion Catechism; Baltimore Nos. 1–3; Faith and Life; Fr. Laux's high-school Course in
  Religion) and ends with the Catechism of the Catholic Church and the Roman Catechism of Trent.
  Scripture runs alongside, from narrative Bible history to a study-Bible survey of the whole
  canon. From about 13 the student reads the Church Fathers, the spiritual masters, the modern
  apologists (Newman, Chesterton, Sheed, Kreeft, Lewis), and the Protestant classics (Bunyan,
  Wesley, the Westminster Shorter Catechism, Calvin, Bonhoeffer), with short neutral notes where
  the traditions differ. The track closes with liturgy, moral theology and Catholic social
  teaching, then a college Aquinas seminar and a Church-history and doctrine seminar. By 18 the
  student can give a reasoned account of the faith (1 Peter 3:15), knows the Bible's storyline and
  key texts, has read the major spiritual classics, can state Catholic and Protestant positions
  fairly, and can read the Summa with a tutor.
rows:
  # ---------------- Early development (practice) ----------------
  - id: theology-01
    title: Family Prayer & a Sacred Daily Rhythm
    type: practice
    level: early-5
    stage: early-development
    ageStart: 0
    ageEnd: 6.5
    order: 1
    prerequisites: []
    related: [rhetoric-01, early-development-06]
    summary: >-
      From infancy the child is prayed over and with: blessings at bedtime, grace at meals, the
      Sign of the Cross, short morning and night prayers, and Sunday Mass or worship as a
      fixed family habit. Toddlers memorize the Our Father, Hail Mary and Glory Be (or a
      Protestant equivalent such as the Lord's Prayer and the Doxology) by daily repetition. A home
      prayer corner with an icon, crucifix or Bible gives prayer a place.
    objectives:
      - Make the Sign of the Cross and fold hands for grace by age 2–3
      - Know the Our Father, Hail Mary and Glory Be (or equivalent) by heart by about 5
      - Attend weekly worship with the family and behave reverently for its length by about 6
      - Offer simple spontaneous prayers of thanks and petition
    sources:
      - { label: "Harvard T.H. Chan: Religious upbringing linked to better health and well-being (2018)", url: "https://hsph.harvard.edu/news/religious-upbringing-adult-health/" }
      - { label: "Chen & VanderWeele, American Journal of Epidemiology 187:11 (2018)", url: "https://academic.oup.com/aje/article/187/11/2355/5094534" }
    notes: >-
      In a Harvard cohort study of more than 5,000 youth, those who attended services weekly or
      prayed daily as children and adolescents reported greater happiness and life satisfaction in
      their twenties and less depression and substance use. This is observational evidence, but it
      is large and carefully controlled. Children learn prayer chiefly by watching parents pray.

  - id: theology-02
    title: Living the Liturgical Year at Home
    type: practice
    level: early-5
    stage: early-development
    ageStart: 1
    ageEnd: 6.5
    order: 2
    prerequisites: []
    related: [early-development-16]
    summary: >-
      The Church's calendar (Advent, Christmas, Lent, Easter, Pentecost, saints' feast days, name
      days and baptism anniversaries) gives young children a sensory, story-shaped experience of
      the faith. Families keep an Advent wreath and a Jesse tree, bless the home at Epiphany, keep
      Lenten sacrifices, and hold feast-day meals and celebrations.
    objectives:
      - Name the liturgical seasons and their colors
      - Take part in family customs for Advent, Christmas, Lent and Easter
      - Celebrate their baptism day and patron saint's feast
      - Connect each season with a Bible story (Annunciation, Nativity, Passion, Resurrection, Pentecost)
    coreTexts:
      - title: "Around the Year with the von Trapp Family"
        author: Maria Augusta von Trapp
        date: "1955 (Sophia ed. 2018)"
        publicDomain: false
        links:
          - { label: Sophia Institute Press, url: "https://sophiainstitute.com/product/around-the-year-with-the-vontrapp-family/" }
    curriculumOptions:
      - name: "Saints & Seasons of the Liturgical Year: A Hands-On Religion Resource"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/saints-seasons-of-the-liturgical-year-a-hands-on-religion-resource/"
        notes: Crafts, activities and stories keyed to the Church year for young children.
    notes: >-
      Liturgical Protestants (Anglican, Lutheran) keep much of the same calendar. Many
      evangelical churches keep only Christmas and Easter; the Advent wreath and Lenten customs are
      now widely shared.

  - id: theology-03
    title: Bible Stories Read Aloud
    type: practice
    level: early-5
    stage: early-development
    ageStart: 2
    ageEnd: 6.5
    order: 3
    prerequisites: []
    related: [philosophy-01]
    summary: >-
      Daily read-alouds from a good illustrated children's Bible give the child the whole
      storyline (Creation, Fall, Noah, Abraham, Moses, David, the prophets, the life of Jesus, the
      early Church) and the images and names of Scripture that later literature and art assume.
      Children retell the stories and act them out.
    objectives:
      - Retell 30–50 major Bible stories in order
      - Name the main figures of the Old and New Testaments
      - Recite short memory verses (e.g. Psalm 23, John 3:16, the Beatitudes)
      - Connect Bible stories to the liturgical seasons
    coreTexts:
      - title: The Golden Children's Bible
        author: Golden Books (editorial board)
        date: "1965"
        publicDomain: false
        links:
          - { label: Memoria Press, url: "https://www.memoriapress.com/curriculum/christian-studies/golden-childrens-bible/" }
          - { label: Amazon, url: "https://www.amazon.com/Childrens-Bible-Golden-Books/dp/0307165205" }
      - title: New Catholic Picture Bible
        author: Rev. Lawrence G. Lovasik, S.V.D.
        publicDomain: false
        links:
          - { label: Catholic Book Publishing, url: "https://catholicbookpublishing.com/products/new-catholic-picture-bible-illustrated" }
    notes: >-
      The Golden Children's Bible was approved by an interfaith (Protestant, Catholic and Jewish)
      board and is the Bible text of Memoria Press's Christian Studies. Lovasik's Catholic Picture
      Bible includes Catholic emphases (e.g. Mary, the Eucharist at the Last Supper).

  - id: theology-04
    title: Saints' Stories & Heroes of the Faith
    type: practice
    level: early-5
    stage: early-development
    ageStart: 3
    ageEnd: 6.5
    order: 4
    prerequisites: []
    related: []
    summary: >-
      Short illustrated lives of the saints read on their feast days give young children heroes of
      courage, charity and purity: St. Francis, St. Nicholas, St. Patrick, St. Joan of Arc, St.
      Thérèse, St. George, and the child's own patron. Stories are told as true adventures and
      connected to virtues.
    objectives:
      - Know the story of their patron saint and 10–20 other saints
      - Name a virtue each saint shows
      - Ask a saint's intercession in prayer (Catholic practice)
    coreTexts:
      - title: Picture Book of Saints
        author: Rev. Lawrence G. Lovasik, S.V.D.
        publicDomain: false
        links:
          - { label: Catholic Book Publishing, url: "https://catholicbookpublishing.com/products/picture-book-of-saints-illustrated" }
    notes: >-
      Protestant families will omit intercession and emphasize the saints as "a great cloud of
      witnesses" (Hebrews 12:1). Missionary and Reformation-era biographies (Patrick, Augustine,
      Bunyan, Hudson Taylor) fill the same role.

  - id: theology-05
    title: Catechesis of the Good Shepherd (Level I Atrium)
    type: practice
    level: early-5
    stage: early-development
    ageStart: 3
    ageEnd: 6.5
    order: 5
    prerequisites: []
    related: [early-development-16]
    summary: >-
      The Catechesis of the Good Shepherd was developed in Rome from 1954 by Scripture scholar
      Sofia Cavalletti and Montessori educator Gianna Gobbi. It offers children aged 3–6 a
      prepared "atrium" with hands-on materials for the parables (especially the Good Shepherd),
      the infancy narratives, and the gestures and objects of the Mass and Baptism. It emphasizes
      the child's own relationship with God, contemplation and wonder over instruction.
    objectives:
      - Work independently and reverently with atrium materials (Good Shepherd, altar, baptism)
      - Know the Good Shepherd parable and that "the sheep know his voice"
      - Name the articles and gestures of the Mass
      - Pray in silence and song for short periods
    coreTexts:
      - title: "The Religious Potential of the Child: Experiencing Scripture and Liturgy with Young Children"
        author: Sofia Cavalletti
        publicDomain: false
        links:
          - { label: LTP, url: "https://www.ltp.org/products/details/CHILDK3/religious-potential-of-the-child" }
    curriculumOptions:
      - name: Catechesis of the Good Shepherd (find an atrium or train as a catechist)
        publisher: CGSUSA
        tradition: catholic
        url: "https://cgsusa.org/discover/"
        notes: >-
          Parish- and school-based atria. Parents can take Level I formation to set up a home
          atrium. Episcopal and some other Protestant churches also use CGS.
    sources:
      - { label: "CGSUSA: Discover the Catechesis", url: "https://cgsusa.org/discover/" }

  # ---------------- Catechism sequence & Scripture (formal) ----------------
  - id: theology-06
    title: "First Catechism & First Communion Preparation"
    type: course
    level: early-5
    stage: formal
    ageStart: 6.5
    ageEnd: 8
    order: 6
    prerequisites: [theology-01, theology-03]
    related: [rhetoric-02]
    summary: >-
      This is formal catechesis for the age of reason (about 7). The child memorizes the basic
      questions and answers of the faith (God, creation, the Trinity, the Incarnation, sin, the
      commandments, the sacraments) and prepares for first Confession and first Holy Communion. The
      Baltimore Catechism's question-and-answer form suits the grammar stage's appetite for
      memorization.
    objectives:
      - Memorize the answers to the core catechism questions (Who made me? Why did God make me?)
      - Know the Ten Commandments, the Apostles' Creed and an Act of Contrition
      - Explain simply what happens in Baptism, Confession and the Eucharist
      - Prepare for and receive first Penance and first Holy Communion
    coreTexts:
      - title: "St. Joseph First Communion Catechism (No. 0)"
        author: Confraternity of Christian Doctrine (rev. Baltimore Catechism)
        publicDomain: false
        links:
          - { label: Catholic Book Publishing, url: "https://catholicbookpublishing.com/products/st-joseph-first-communion-catechism-no-0-illustrated" }
      - title: "A Catechism of Christian Doctrine, No. 1 (Baltimore Catechism)"
        author: Third Plenary Council of Baltimore
        date: "1885 (1891 ed.)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14551" }
    curriculumOptions:
      - name: "Faith and Life, Grades 1–2 (Our Heavenly Father; Jesus Our Life)"
        publisher: Ignatius Press
        tradition: catholic
        url: "https://ignatius.com/faith-and-life-grade-1-student-book-31s3p/"
        notes: >-
          A doctrinal text with fine classical art, with activity books and teacher guides. See
          the scope and sequence at https://loc.ignatius.com/faithandlife/scope.htm.
      - name: "Preparing to Receive Jesus: A Hands-On Religion Resource"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/preparing-to-receive-jesus-a-hands-on-religion-resource/"
        notes: A gentle, hands-on companion for first-sacraments preparation at home.
    historicalPrecedent: >-
      The Baltimore Catechism (1885) was the standard text of American Catholic schools until the
      late 1960s. Children memorized it question by question, much as colonial Protestant children
      memorized the New England Primer and the Westminster Shorter Catechism.
    notes: >-
      Protestant families would instead use a children's catechism (e.g. the Westminster Shorter
      Catechism or a Lutheran Small Catechism) and prepare for the Lord's Supper according to
      their church's practice. Many Protestant churches admit children to communion later, after
      profession of faith.

  - id: theology-07
    title: "Bible History I: Salvation History as Real History"
    type: course
    level: early-5
    stage: formal
    ageStart: 7
    ageEnd: 9.5
    order: 7
    prerequisites: [theology-03]
    related: []
    summary: >-
      This is a narrative survey of the Old and New Testaments taught as history: Creation to the
      Patriarchs, the Exodus and Conquest, Judges and Kings, Exile and Return, and the life of
      Christ and the early Church. The student memorizes a timeline, key places on a Bible map, and
      core passages, and learns to see the covenants as the Bible's unifying thread.
    objectives:
      - Place 40–60 Bible events and figures on a timeline and a map
      - Trace the covenants with Adam, Noah, Abraham, Moses, David and the New Covenant in Christ
      - Memorize Psalm 23, the Ten Commandments (Exodus 20), and the Beatitudes
      - Narrate a Bible story orally and in writing
    coreTexts:
      - title: The Holy Bible, Douay-Rheims Version
        author: (Challoner revision)
        date: "1582–1610; rev. 1749–52"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/8300" }
    curriculumOptions:
      - name: "Christian Studies I–III (with The Golden Children's Bible)"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/christian-studies/christian-studies-ii-student-book/"
        notes: >-
          A three-year reading course that teaches salvation history as real history, with
          timelines, maps and memory work. It is ecumenical and used by Catholic and Protestant
          families.
      - name: "God's Great Covenant (Old Testament 1–2, New Testament 1–2)"
        publisher: Classical Academic Press
        tradition: classical
        url: "https://classicalacademicpress.com/products/gods-great-covenant-old-testament-1"
        notes: Bible-history curriculum organized around the covenants, for grades 3–6.
      - name: "Faith and Life, Grade 3 onward"
        publisher: Ignatius Press / Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/faith-and-life-grade-1-our-heavenly-father/"
        notes: The Catholic catechism series integrates Bible history. It can be paired with either option above.
    notes: >-
      Catholic and Orthodox Bibles include the deuterocanonical books (Tobit, Judith, 1–2
      Maccabees, Wisdom, Sirach, Baruch, and parts of Esther and Daniel). Protestant Bibles omit
      them or print them as "Apocrypha". This row uses the Catholic canon and notes the difference
      without polemic.

  - id: theology-08
    title: "Baltimore Catechism No. 2 & Faith and Life (Grades 3–5 level)"
    type: course
    level: early-5
    stage: formal
    ageStart: 8
    ageEnd: 10
    order: 8
    prerequisites: [theology-06]
    related: []
    summary: >-
      This is the full intermediate catechism, taught in the Confirmation-class tradition: the
      Creed, the sacraments, the commandments and prayer, with definitions memorized precisely
      (grace, sin, virtue, sacrament) and explained with Scripture. It is paired with Faith and Life
      Grades 3–5, which present the same doctrine through narrative and art.
    objectives:
      - Memorize and explain the Baltimore No. 2 answers on the Creed, sacraments and commandments
      - Define sanctifying and actual grace, mortal and venial sin, and the theological and cardinal virtues
      - Know the seven sacraments, their matter, form and minister
      - Pray the Rosary and know its mysteries
    coreTexts:
      - title: "A Catechism of Christian Doctrine, No. 2 (Baltimore Catechism)"
        author: Third Plenary Council of Baltimore
        date: "1885"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14552" }
    curriculumOptions:
      - name: "Faith and Life, Grades 3–5 (Our Life with Jesus; Jesus Our Guide; Credo—I Believe)"
        publisher: Ignatius Press (via Catholic Heritage Curricula)
        tradition: catholic
        url: "https://chcweb.com/product/faith-and-life-grade-5-credo-i-believe/"
        notes: The grade 5 volume walks through the Creed.
      - name: Our Lady of Victory School (traditional Catholic homeschool)
        publisher: Our Lady of Victory School
        tradition: catholic
        url: "https://olvs.org/"
        notes: A pre-Vatican II–style curriculum that relies heavily on the Baltimore series.

  - id: theology-09
    title: "Lives of the Saints & the Early Church for Young Readers"
    type: unit
    level: early-5
    stage: formal
    ageStart: 8.5
    ageEnd: 10.5
    order: 9
    prerequisites: [theology-04]
    related: []
    summary: >-
      Chapter-book biographies of saints and heroes of Church history, from the martyrs of the
      catacombs to modern saints, read independently and narrated. Historical novels such as
      Wiseman's Fabiola (the Diocletian persecution) bring the early Church alive, and Butler's
      Lives is used for daily feast-day readings.
    objectives:
      - Read 8–12 saint biographies a year and narrate or write a report on each
      - Place the saints on the history timeline
      - Explain what martyrdom, sanctity and canonization mean
      - Read the feast-day entry from Butler's Lives on major feasts
    coreTexts:
      - title: "The Lives of the Fathers, Martyrs, and Other Principal Saints"
        author: Alban Butler
        date: "1756–1759"
        publicDomain: true
        links:
          - { label: "Project Gutenberg (Jan–Mar)", url: "https://www.gutenberg.org/ebooks/20450" }
          - { label: "Archive.org (1842 ed., vol. 1)", url: "https://archive.org/details/livesoffathersma01butl" }
      - title: "Fabiola; or, The Church of the Catacombs"
        author: Cardinal Nicholas Wiseman
        date: "1854"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/62254" }
    curriculumOptions:
      - name: Vision Books (saints' biographies for ages 9–15)
        publisher: Ignatius Press
        tradition: catholic
        url: "https://ignatius.com/kids/series/the-vision-series/"
        notes: Classic 1950s–60s biographies, reprinted. Well written and historically careful.
      - name: "Light to the Nations, Part 1: The History of Christian Civilization"
        publisher: Catholic Heritage Curricula
        tradition: catholic
        url: "https://chcweb.com/product/light-to-the-nations-part-1-the-history-of-christian-civilization/"
        notes: A Catholic-perspective history text for middle grades that pairs well with the biographies.

  - id: theology-10
    title: "The Pilgrim's Progress & Christian Allegory"
    type: unit
    level: 6-8
    stage: formal
    ageStart: 9.5
    ageEnd: 11
    order: 10
    prerequisites: [theology-07]
    related: []
    summary: >-
      Bunyan's Pilgrim's Progress (1678), which for two centuries stood beside the Bible in
      English-speaking households, is read in full as a classic of Christian imagination. The
      student follows Christian's journey from the City of Destruction to the Celestial City and
      learns to read allegory.
    objectives:
      - Read the complete Part I and narrate its main episodes
      - Identify the allegorical meaning of key places and characters (Slough of Despond, Vanity Fair, Giant Despair)
      - Memorize a passage (e.g. "Who would true valour see")
      - Compare Christian's journey with a saint's life read in theology-09
    coreTexts:
      - title: The Pilgrim's Progress from This World to That Which Is to Come
        author: John Bunyan
        date: "1678"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/131" }
    curriculumOptions:
      - name: "Dangerous Journey: The Story of Pilgrim's Progress (for younger readers)"
        publisher: Memoria Press (distributor)
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/literature-and-poetry/dangerous-journey-the-story-of-pilgrims-progress/"
        notes: A richly illustrated abridgment. It can be read aloud at 7–9, before the full text.
      - name: "Pilgrim's Progress (Worldview Edition)"
        publisher: Canon Press
        tradition: protestant
        url: "https://canonpress.com/products/pilgrims-progress-worldview-edition"
        notes: The full text with a Reformed worldview guide.
    historicalPrecedent: >-
      Pilgrim's Progress stood beside the Bible in colonial and 19th-century American homes.
      Franklin records that it was among the first books he owned and loved as a boy.
    notes: >-
      Bunyan was a Puritan Baptist. Catholic readers will notice the book's Reformed account of
      conversion and assurance and its "Giant Pope"; both are worth discussing calmly. Its account
      of perseverance, temptation and grace is shared ground.

  - id: theology-11
    title: "Baltimore Catechism No. 3 & Faith and Life (Grades 6–8 level)"
    type: course
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 12
    order: 11
    prerequisites: [theology-08]
    related: [logic-02]
    summary: >-
      The advanced Baltimore Catechism, with fuller explanations and Scripture proofs, is paired
      with Faith and Life 6–8 (Following Christ; The Life of Grace; Our Life in the Church). It
      prepares the student for Confirmation and for apologetics: he learns not only what the Church
      teaches but where it is found in Scripture and Tradition.
    objectives:
      - Master the Baltimore No. 3 answers, including the scriptural references
      - Explain the four marks of the Church and apostolic succession
      - Explain grace, justification and merit in Catholic terms
      - Prepare for and receive Confirmation, choosing a saint's name with a written reason
    coreTexts:
      - title: "A Catechism of Christian Doctrine, No. 3 (Baltimore Catechism)"
        author: Third Plenary Council of Baltimore
        date: "1885 (1891 ed.)"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14553" }
      - title: An Explanation of the Baltimore Catechism (Baltimore No. 4, teacher's reference)
        author: Rev. Thomas L. Kinkead
        date: "1891"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/14554" }
    curriculumOptions:
      - name: "Faith and Life, Grades 6–8"
        publisher: Ignatius Press (via Catholic Heritage Curricula)
        tradition: catholic
        url: "https://chcweb.com/product/faith-and-life-grade-8-our-life-in-the-church/"
        notes: Grade 8 covers the Church, and grade 7 covers grace and the sacraments.
      - name: Kolbe Academy religion courses
        publisher: Kolbe Academy
        tradition: catholic
        url: "https://www.kolbe.org/"
        notes: A Jesuit Ratio-inspired Catholic homeschool program with Baltimore-based middle-school religion.
    notes: >-
      This is a natural place for a first comparative note. Catholics hold that justification
      infuses grace and makes one inwardly righteous, cooperating with faith and works done in
      grace. Lutheran and Reformed Protestants hold that justification is a forensic declaration
      received by faith alone, with good works following as fruit. The 1999 Joint Declaration on
      the Doctrine of Justification (Catholic–Lutheran) records significant convergence.

  - id: theology-12
    title: "Scripture II: The Gospels & Acts with a Study Bible"
    type: course
    level: 6-8
    stage: formal
    ageStart: 11
    ageEnd: 12.5
    order: 12
    prerequisites: [theology-07]
    related: [rhetoric-06]
    summary: >-
      A close reading of Matthew, Mark, Luke, John and Acts in a modern Catholic translation, using
      the notes, essays and word studies of the Ignatius Catholic Study Bible (Hahn & Mitch). The
      student learns to read Scripture in context, use cross-references and commentary, and see
      how the Old Testament is fulfilled in the New.
    objectives:
      - Read all four Gospels and Acts in full
      - Compare the Synoptic Gospels in parallel passages and explain John's distinct purpose
      - Trace Old Testament fulfillment (Passover, manna, temple, David's kingdom) in the Gospels
      - Memorize the Sermon on the Mount (Matthew 5–7), in sections
    coreTexts:
      - title: "Ignatius Catholic Study Bible: New Testament (RSV-2CE)"
        author: Scott Hahn & Curtis Mitch
        publicDomain: false
        links:
          - { label: Ignatius Press, url: "https://ignatius.com/ignatius-catholic-study-bible-2h/" }
    curriculumOptions:
      - name: "Ignatius Catholic Study Bible (Old and New Testaments)"
        publisher: St. Paul Center for Biblical Theology
        tradition: catholic
        url: "https://stpaulcenter.com/store/ignatius-catholic-study-bible-old-and-new-testaments"
        notes: >-
          Scott Hahn's St. Paul Center also offers free and paid Bible studies and courses that
          can supplement this row.
      - name: "Christian Studies (upper levels) / Gospel studies"
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/christian-studies/christian-studies-ii-student-book/"
        notes: Memoria's sequence continues into New Testament study. It is ecumenical.

  # ---------------- High school ----------------
  - id: theology-13
    title: "Fr. Laux's Course in Religion (Doctrine, Sacraments, Morality, Apologetics)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12
    ageEnd: 14
    order: 13
    prerequisites: [theology-11]
    related: [philosophy-04]
    summary: >-
      Fr. John Laux's four-part high-school course (first published from 1928 and reprinted by
      TAN) is the pre-conciliar standard. It covers Chief Truths of the Faith, Mass and the
      Sacraments, Catholic Morality, and Catholic Apologetics, and has companion volumes on the
      Bible and Church History. It is clear, systematic and thorough, and it moves the student from
      catechism answers to reasoned theology.
    objectives:
      - Outline the proofs for God's existence and the credibility of revelation as Laux presents them
      - Explain the Mass as sacrifice and the theology of each sacrament
      - Apply the principles of Catholic morality (object, intention, circumstances; conscience)
