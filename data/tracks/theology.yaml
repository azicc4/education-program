      of at least two other traditions respectfully.

  - id: theology-21
    title: "The Catechism of the Catholic Church & the Roman Catechism"
    type: course
    level: 9-12
    stage: formal
    ageStart: 15.5
    ageEnd: 16.5
    order: 21
    prerequisites: [theology-13, theology-14]
    related: [philosophy-09]
    summary: >-
      The capstone of high-school catechesis is a complete reading of the Catechism of the Catholic
      Church (1992/1997), in its four pillars (Creed, Sacraments, Life in Christ, Prayer), set
      beside its model, the Roman Catechism of the Council of Trent (1566). Frank Sheed's Theology
      and Sanity serves as a companion that turns doctrine into a way of seeing reality.
    objectives:
      - Read the entire Catechism of the Catholic Church over a year, with a written summary of each part
      - Compare the CCC and the Roman Catechism on the Creed and sacraments
      - Use the CCC's footnotes to trace a doctrine to Scripture, the Fathers and councils
      - Explain Sheed's claim that theology is necessary for sanity, that is, for seeing what is there
    coreTexts:
      - title: Catechism of the Catholic Church (2nd ed.)
        author: Catholic Church
        date: "1992; 2nd ed. 1997"
        publicDomain: false
        links:
          - { label: Vatican.va (free), url: "https://www.vatican.va/archive/ENG0015/_INDEX.HTM" }
          - { label: Compendium (Vatican.va), url: "https://www.vatican.va/archive/compendium_ccc/documents/archive_2005_compendium-ccc_en.html" }
      - title: The Catechism of the Council of Trent (Roman Catechism)
        author: Council of Trent (trans. McHugh & Callan)
        date: "1566; trans. 1923"
        publicDomain: false
        links:
          - { label: TAN Books, url: "https://tanbooks.com/products/books/catechism-of-the-council-of-trent/" }
          - { label: "Archive.org (Donovan trans., 1829, public domain)", url: "https://archive.org/details/thecatechismofth00donouoft" }
      - title: Theology and Sanity
        author: Frank Sheed
        date: "1946"
        publicDomain: false
        links:
          - { label: Ignatius Press, url: "https://ignatius.com/theology-and-sanity-thasp/" }
    historicalPrecedent: >-
      The Roman Catechism, compiled under St. Charles Borromeo, was the reference for parish
      preaching from the 16th to the 20th century. Leo XIII recommended it, with the Summa, to all
      seminarians.

  # ---------------- College ----------------
  - id: theology-22
    title: "College Seminar: St. Thomas Aquinas (Summa Theologiae)"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 22
    prerequisites: [theology-21]
    related: [philosophy-13, philosophy-14, logic-08, character-virtue-14]
    summary: >-
      This is a Thomas Aquinas College–style tutorial in the Summa Theologiae, read article by
      article (objections, sed contra, respondeo, replies). It covers sacred doctrine (I q.1), the
      existence and nature of God and the five ways (I qq.2–13), the Trinity (I qq.27–43), man and
      happiness (I-II qq.1–5), the treatise on law (I-II qq.90–97, including natural law), and
      Christ and the sacraments (III, selections). Kreeft's Summa of the Summa supplies notes for
      self-study.
    objectives:
      - Read and present a Summa article in its full scholastic structure
      - Defend and respond to objections to the five ways
      - Explain eternal, natural, human and divine law and their relation (I-II q.91)
      - Apply natural-law reasoning to a constitutional or legislative question
      - Explain the doctrine of the Trinity using Aquinas's terms (procession, relation, person)
    coreTexts:
      - title: Summa Theologiae
        author: Thomas Aquinas (trans. Fathers of the English Dominican Province)
        date: "1265–1274"
        publicDomain: true
        links:
          - { label: New Advent (full text), url: "https://www.newadvent.org/summa/" }
          - { label: "New Advent: the five ways (I q.2)", url: "https://www.newadvent.org/summa/1002.htm" }
          - { label: "New Advent: the essence of law (I-II q.90)", url: "https://www.newadvent.org/summa/2090.htm" }
          - { label: "New Advent: the natural law (I-II q.94)", url: "https://www.newadvent.org/summa/2094.htm" }
          - { label: "Project Gutenberg (Prima Pars)", url: "https://www.gutenberg.org/ebooks/17611" }
      - title: "A Summa of the Summa"
        author: Peter Kreeft (ed.)
        date: "1990"
        publicDomain: false
        links:
          - { label: Ignatius Press, url: "https://ignatius.com/summa-of-the-summa-sosp/" }
    curriculumOptions:
      - name: Thomas Aquinas College senior theology tutorial
        publisher: Thomas Aquinas College
        tradition: catholic
        url: "https://www.thomasaquinas.edu/a-liberating-education/senior-year-4-courses"
        notes: >-
          The model for this seminar, covering the Summa on sacred doctrine, God, the Trinity, law,
          the sacraments and Christ's Passion. See the full syllabus at
          https://www.thomasaquinas.edu/a-liberating-education/syllabus.
      - name: "Theology 101: The Western Theological Tradition (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/theology-101"
        notes: A broader survey that places Aquinas in the tradition.
    historicalPrecedent: >-
      Leo XIII's Aeterni Patris (1879) restored Aquinas as the Church's common doctor for
      philosophy and theology. The Jesuit Ratio Studiorum (1599) had already made him the standard
      in theology.
    notes: >-
      Protestant readers note that Aquinas's natural-law teaching was widely received by
      Reformed and Anglican scholastics (e.g. Richard Hooker), and through them it reached the
      founding-era idea of natural law.

  - id: theology-23
    title: "College Seminar: Church History & the Development of Doctrine"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 23
    prerequisites: [theology-16, theology-21]
    related: [rhetoric-12, history-32]
    summary: >-
      This seminar covers the history of the Church from Pentecost to the present through primary
      sources and the question of doctrinal development. It reads Eusebius's Church History (the
      first), the ecumenical councils and creeds, the Reformation and Counter-Reformation in their
      own words, and Newman's Essay on the Development of Christian Doctrine, whose tests for a
      true development are the key to reading the whole story. Warren Carroll's History of
      Christendom supplies the narrative.
    objectives:
      - Read Eusebius Books I–III and VIII–X and assess him as a historian
      - Summarize the first seven ecumenical councils and the Nicene-Constantinopolitan Creed
      - Read Luther's 95 Theses and Trent's Decree on Justification side by side
      - State and apply Newman's seven notes of genuine development
      - Write a research paper on one council or reform movement from primary sources
    coreTexts:
      - title: Church History
        author: Eusebius of Caesarea
        date: "c. 324"
        publicDomain: true
        links:
          - { label: New Advent, url: "https://www.newadvent.org/fathers/2501.htm" }
      - title: An Essay on the Development of Christian Doctrine
        author: John Henry Newman
        date: "1845; rev. 1878"
        publicDomain: true
        links:
          - { label: Newman Reader, url: "https://www.newmanreader.org/works/development/" }
      - title: "The Founding of Christendom (A History of Christendom, vol. 1)"
        author: Warren H. Carroll
        publicDomain: false
        links:
          - { label: Sophia Institute Press, url: "https://sophiainstitute.com/product/the-founding-of-christendom/" }
    curriculumOptions:
      - name: The History of the Church (Eusebius) with guide
        publisher: Memoria Press
        tradition: classical
        url: "https://www.memoriapress.com/curriculum/christian-studies/the-history-of-the-church/"
        notes: Eusebius in the Penguin translation with a study guide.
      - name: "Ancient Christianity (free online course)"
        publisher: Hillsdale College
        tradition: classical
        url: "https://online.hillsdale.edu/courses/promo/ancient-christianity"
        notes: Lectures on the early Church in the Roman world.
      - name: "Fr. Laux's Church History"
        publisher: TAN Books
        tradition: catholic
        url: "https://tanbooks.com/a-course-in-religion/"
        notes: The companion volume to Laux's Course in Religion. A clear one-volume Catholic narrative.
    notes: >-
      Where the traditions differ (the papacy, the Reformation, the councils after 1054), the
      seminar presents the Catholic, Orthodox and Protestant accounts in their own words. The
      Reformers saw themselves as recovering the early Church; Newman's development thesis is the
      Catholic answer. Protestant historians such as Philip Schaff (History of the Christian Church)
      and Jaroslav Pelikan (a Lutheran who later became Orthodox) are valuable counterweights.

  - id: theology-24
    title: "College Seminar: Mystical Theology of St. John of the Cross"
    type: course
    level: college
    stage: formal
    ageStart: 17
    ageEnd: 18
    order: 24
    prerequisites: [theology-17]
    related: [spanish-09, theology-22]
    summary: >-
      This is a slow, guided reading of the Carmelite Doctor of the Church. The Ascent of Mount Carmel and
      the Dark Night of the Soul give his account of the active and passive purifications of sense and
      spirit, and the poems ("Noche oscura", "Cántico espiritual", "Llama de amor viva") are the summit
      of Spanish mystical verse. It is read after the Aquinas seminar so that the student can connect
      mystical theology with Thomist teaching on grace, the virtues and the gifts of the Holy Spirit.
    objectives:
      - Read the Ascent of Mount Carmel Book I and the Dark Night Books I–II in full
      - Explain the active and passive nights of sense and spirit, and why John counsels detachment
      - Relate John's teaching to Aquinas on the theological virtues and the gifts of the Holy Spirit
      - Write a seminar paper on the relation of the poem "Noche oscura" to its prose commentary
    coreTexts:
      - title: Ascent of Mount Carmel
        author: St. John of the Cross
        date: "c. 1578–1585"
        publicDomain: true
        links:
          - { label: "Archive.org (English, 1922)", url: "https://archive.org/details/ascentofmountcar00johnuoft" }
      - title: Dark Night of the Soul
        author: St. John of the Cross
        date: "c. 1578–1585"
        publicDomain: true
        links:
          - { label: CCEL, url: "https://ccel.org/ccel/john_cross/dark_night" }
    notes: >-
      Moved here from the age-14 spiritual classics unit by family decision, because John's mystical
      theology assumes spiritual maturity. The Spanish track reads his poems as literature at 13–14
      (spanish-09). Read with a spiritual director or mentor. Protestant readers have also valued John
      (e.g. in the Anglican and Wesleyan traditions of spiritual reading), though his Carmelite and
      sacramental framework is distinctly Catholic.

  - id: theology-25
    title: "Daily Spiritual Reading: O'Sullivan, St. Alphonsus & Lectio with a Parent"
    type: practice
    level: 6-8
    stage: formal
    ageStart: 10
    ageEnd: 16
    order: 11.5
    prerequisites: [theology-08]
    related: [theology-17, character-virtue-05, character-virtue-09]
    summary: >-
      Spiritual reading is a daily habit, not a course. For 10–15 minutes a day, ideally with a
      parent, the student reads a few pages of a devotional book slowly, in the manner of lectio
      divina: read, pause on a phrase, turn it into a short prayer, and carry one resolution into
      the day. The first books are short, warm and practical: Fr. Paul O'Sullivan on prayer, the
      Mass and the Holy Spirit, and St. Alphonsus Liguori on accepting God's will in every event.
      The habit leads into the great spiritual classics at 14 (theology-17).
    objectives:
      - Keep 10–15 minutes of spiritual reading five or more days a week, most days with a parent
      - Keep a small notebook of one sentence or resolution per reading
      - Explain in his own words the meaning of the Our Father, the Hail Mary and the Mass from O'Sullivan
      - Explain St. Alphonsus's teaching that uniformity with God's will is the summit of holiness, with an example from his own life
    coreTexts:
      - title: How to Be Happy, How to Be Holy
        author: Fr. Paul O'Sullivan, O.P.
        publicDomain: false
        links:
          - { label: TAN Books, url: "https://tanbooks.com/products/books/how-to-be-happy-how-to-be-holy/" }
      - title: Uniformity with God's Will
        author: St. Alphonsus Liguori
        date: "c. 1755"
        publicDomain: true
        links:
          - { label: EWTN (free), url: "https://www.ewtn.com/catholicism/library/uniformity-with-gods-will-12644" }
          - { label: CCEL (free), url: "https://ccel.org/ccel/alphonsus/uniformity" }
          - { label: TAN Books, url: "https://tanbooks.com/products/books/uniformity-with-gods-will/" }
      - title: "The Holy Ghost, Our Greatest Friend: He Who Loves Us Best"
        author: Fr. Paul O'Sullivan, O.P.
        publicDomain: false
        links:
          - { label: TAN Books, url: "https://tanbooks.com/products/books/the-holy-ghost-our-greatest-friend-he-who-loves-us-best/" }
      - title: "Chicken Soup for the Soul (elective)"
        author: Jack Canfield and Mark Victor Hansen (eds.)
        date: "1993"
        publicDomain: false
        links:
          - { label: Amazon, url: "https://www.amazon.com/Chicken-Soup-Soul-Jack-Canfield/dp/1558749209" }
      - title: "Chicken Soup for the Christian Soul (elective)"
        author: Jack Canfield, Mark Victor Hansen, Patty Aubery and Nancy Mitchell (eds.)
        date: "1997"
        publicDomain: false
        links:
          - { label: Simon & Schuster, url: "https://www.simonandschuster.com/books/Chicken-Soup-for-the-Christian-Soul/Jack-Canfield/9781623610470" }
    notes: >-
      This is a standing daily practice that runs alongside the catechism and Scripture courses,
      not a separate subject. The three TAN books are core. The Chicken Soup books are light
      inspirational reading, not spiritual reading in the traditional sense: short true stories of
      kindness, courage and hope, good for a tired evening, a sick day or reading aloud as a family.
      Chicken Soup for the Christian Soul is ecumenical rather than Catholic in its stories. The
      TAN books are old-fashioned in tone ("Holy Ghost" is the older name for the Holy Spirit)
      and full of anecdotes from the saints, which children tend to love. From 14 the same daily slot moves on to the Imitation of Christ
      and de Sales (theology-17).
