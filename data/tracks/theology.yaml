  - id: theology-14
    title: "Apologetics I: Sheed, Kreeft, Karl Adam & Mere Christianity"
    type: course
    level: 9-12
    stage: formal
    ageStart: 12.5
    ageEnd: 14
    order: 14
    prerequisites: [theology-11]
    related: [philosophy-05, logic-04, biology-01]
    summary: >-
      This is the reasoned defense of the faith. Frank Sheed's Theology for Beginners gives the
      intellect a map of doctrine (God, Trinity, creation, fall, redemption, Church, sacraments, last
      things). Kreeft and Tacelli summarize the arguments for God, the soul, the resurrection and
      the Church. Karl Adam's Spirit of Catholicism explains the Church as a living whole. C.S.
      Lewis's Mere Christianity, the most widely read modern apologetic, gives the shared
      Christian ground of all traditions.
    objectives:
      - Explain the Trinity and the Incarnation accurately and without heresy
      - Present and defend three arguments for God's existence and the argument for the resurrection
      - Summarize Lewis's moral argument and his "liar, lunatic or Lord" trilemma, and evaluate them
      - Answer five common objections to Christianity in short essays
    coreTexts:
      - title: Theology for Beginners
        author: Frank Sheed
        date: "1957"
        publicDomain: false
        links:
          - { label: Cenacle Press, url: "https://cenaclepress.com/en-us/products/theology-for-beginners-sheed" }
      - title: "Handbook of Catholic Apologetics: Reasoned Answers to Questions of Faith"
