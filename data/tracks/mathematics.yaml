      - { label: "AP Statistics Course and Exam Description (effective fall 2026)", url: "https://apcentral.collegeboard.org/media/pdf/ap-statistics-course-and-exam-description.pdf" }
      - { label: "AP Students: AP Statistics", url: "https://apstudents.collegeboard.org/courses/ap-statistics" }
