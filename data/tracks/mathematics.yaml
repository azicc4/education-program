  - id: mathematics-18
    title: "AP Calculus BC (with Thompson & Newton)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 16.5
    prerequisites: [mathematics-13]
    related: [physics-02, physics-05]
    exams: [ap-calculus-bc]
    summary: >-
      A full AP Calculus BC course following the College Board course and exam description (all ten
      units), finished with the AP exam in May at about 15. It covers limits, derivatives, integrals and
      the fundamental theorem, differential equations, parametric, polar and vector functions, and
      infinite series. Begin with Thompson's Calculus Made Easy ("What one fool can do, another can"),
      then work through a standard AP text. Read Newton's own lemmas on first and last ratios from the
      Principia to see where the ideas came from. The course is the mathematical engine of AP Physics C,
      which follows at 15.
    objectives:
      - "Big ideas of the CED: Change (CHA), Limits (LIM), Analysis of Functions (FUN)"
      - "Units 1–4: Limits and Continuity; Differentiation: Definition and Fundamental Properties; Differentiation: Composite, Implicit, and Inverse Functions; Contextual Applications of Differentiation"
      - "Units 5–8: Analytical Applications of Differentiation; Integration and Accumulation of Change; Differential Equations; Applications of Integration"
      - "BC-only Units 9–10: Parametric Equations, Polar Coordinates, and Vector-Valued Functions; Infinite Sequences and Series (Taylor and Maclaurin series)"
      - "The four mathematical practices: Implementing Mathematical Processes, Connecting Representations, Justification, Communication and Notation"
      - State the fundamental theorem of calculus and justify free-response answers with theorems (MVT, IVT, EVT)
      - Read Newton's Principia Book I, Section 1 (first and last ratios) with understanding
      - Sit the AP Calculus BC exam in May at about 15
    coreTexts:
      - title: Calculus Made Easy
        reader: student
        pages: 265
        author: Silvanus P. Thompson
        date: "1910"
        publicDomain: true
        links:
          - { label: Project Gutenberg, url: "https://www.gutenberg.org/ebooks/33283" }
      - title: "The Mathematical Principles of Natural Philosophy (Principia), Book I §1"
        reader: together
        pages: 12
        author: Isaac Newton, trans. Andrew Motte
        date: "1687 (trans. 1729)"
        publicDomain: true
        links:
