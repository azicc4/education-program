      A St. John's College–style mathematics tutorial. Students read the originals and demonstrate them
      at the board: Ptolemy's Almagest (chord tables and planetary models), Apollonius's Conics, Descartes's
      Geometry (the birth of analytic geometry), Newton's Principia, Lobachevsky's non-Euclidean
