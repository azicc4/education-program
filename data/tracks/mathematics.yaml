  - id: mathematics-15
    title: "Practical Mathematics: Surveying, Navigation & Measurement"
    type: unit
    level: 9-12
    stage: formal
    ageStart: 13.5
    ageEnd: 14.5
    order: 15
    prerequisites: [mathematics-13]
    related: [practical-arts-09, practical-arts-14]
    summary: >-
      The founders' applied mathematics. Students survey a field with chain (or tape), compass and a
      homemade theodolite, compute areas by triangulation, plot the plat, and learn celestial
      navigation basics (latitude from the sun or Polaris). This is trigonometry made concrete, as
      Washington learned it at 16.
    objectives:
      - Measure distances and angles and compute unknown sides by trigonometry
      - Survey and plat a real parcel of land, computing its area
      - Determine latitude by sun or Polaris sighting
    historicalPrecedent: >-
      George Washington taught himself surveying from geometry and trigonometry texts and was commissioned
      county surveyor of Culpeper in 1749 at 17. Jefferson and Franklin both prized practical
      mathematics for surveying, astronomy and invention.
    sources:
      - { label: "Mount Vernon: Surveying (Washington's career)", url: "https://www.mountvernon.org/library/digitalhistory/digital-encyclopedia/article/surveying/" }
    notes: Pairs naturally with practical-arts and natural-science astronomy units.

  - id: mathematics-16
    title: "AP Statistics (with Counting & Probability)"
    type: course
    level: 9-12
    stage: formal
    ageStart: 14
    ageEnd: 15
    order: 16
    prerequisites: [mathematics-11]
    related: [social-science-03, social-science-04, economics-10]
    exams: [ap-statistics]
    summary: >-
      A full AP Statistics course following the College Board's revised course and exam description
      (effective fall 2026), taken alongside AP Calculus BC and finished with the AP exam in May at
      about 15. The course runs through the five CED units, from exploring and collecting data to
      inference and regression, and every investigation is written up in the question, collect,
      analyze, interpret cycle. AoPS counting and probability supplies the combinatorics the AP course
      treats lightly. The civic aim is to read polls, studies and economic data critically.
    objectives:
      - "Unit 1, Exploring One-Variable Data and Collecting Data: describe and compare distributions, random sampling, experimental design"
      - "Unit 2, Probability, Random Variables, and Probability Distributions: two-way tables, simulation, probability rules, binomial and normal distributions, the central limit theorem"
      - "Unit 3, Inference for Categorical Data (Proportions): confidence intervals and tests for one and two proportions, errors, chi-square tests for homogeneity and independence"
      - "Unit 4, Inference for Quantitative Data (Means): t-procedures for one and two samples and paired data"
      - "Unit 5, Regression Analysis: scatterplots, correlation, least-squares lines and residuals"
      - "The four CED practices (the revised course's organizing ideas): Formulate Questions, Collect Data, Analyze Data, Interpret Results"
      - Count arrangements and selections and compute probabilities beyond the AP scope (AoPS)
      - Write complete free-response answers in context to AP scoring standards, then sit the AP Statistics exam in May at about 15
      - Critique misleading statistics in news and policy debates
    curriculumOptions:
      - name: "The Practice of Statistics for the AP Course, 7th ed. (Starnes & Tabor)"
        publisher: BFW / Macmillan Learning
        tradition: secular
        url: "https://www.bfwpub.com/high-school/us/product/The-Practice-of-Statistics-for-the-AP-Course/p/1319409342"
        notes: >-
          The most widely used AP text (TPS). The 7th edition (2024) follows the previous nine-unit CED,
          so map its chapters onto the five revised units. Kolbe Academy's Catholic bookstore also
          carries TPS (https://books.kolbe.org/products/the-practice-of-statistics).
      - name: "Stats: Modeling the World, AP Edition (Bock, Velleman, De Veaux, Bullard)"
        publisher: Savvas
        tradition: secular
        url: "https://www.savvas.com/index.cfm?locator=PS38Yg&PMDbSiteId=2781&PMDbSolutionId=6724&PMDbCategoryId=806&PMDbSubCategoryId=24788&PMDbProgramId=154969"
        notes: Readable alternative with the Think, Show, Tell method for writing solutions.
      - name: AP Statistics (online, live)
        publisher: Kolbe Academy
        tradition: catholic
        url: "https://www.kolbe.org/academics/honors-ap-and-dual-credit/online-honors-ap-courses-1"
        notes: Catholic online AP course with a live teacher. Kolbe does not arrange exam sites; the family books the exam.
      - name: AP/College Statistics
        publisher: Khan Academy
        tradition: secular
        url: "https://www.khanacademy.org/math/ap-statistics"
        notes: Free videos and practice aligned to the CED. Good for self-study and review.
      - name: Advanced High School Statistics (OpenIntro)
        publisher: OpenIntro
        tradition: secular
        url: "https://www.openintro.org/book/ahss/"
        notes: Free text written for AP Statistics. OpenIntro Statistics (https://www.openintro.org/book/os/) is its college sibling.
      - name: Introduction to Counting & Probability
        publisher: Art of Problem Solving
        tradition: secular
        url: "https://artofproblemsolving.com/store/book/intro-counting"
        notes: Rigorous combinatorics and probability. Shared with the AMC seminar (mathematics-14).
      - name: AP Classroom and released free-response questions
        publisher: College Board
        tradition: secular
        url: "https://apcentral.collegeboard.org/courses/ap-statistics/exam/past-exam-questions"
        notes: >-
          Official FRQs with scoring guidelines (past three years). AP Classroom
          (https://apclassroom.collegeboard.org/) has the unit Progress Checks; access comes through a
